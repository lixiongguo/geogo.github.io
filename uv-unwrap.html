<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV展开 - SCP / ABF++ / linABF / LSCM / Tutte / ARAP / …</title>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>
  
  <script src="assets/wasm/unified_solver.js"></script>
  <script src="assets/wasm/tutte_arap_solver.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      background: #070b14;
      color: #d8def7;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .timing-display {
      display: none;
      padding: 10px 18px;
      background: linear-gradient(90deg, rgba(16, 30, 61, 0.95), rgba(26, 46, 91, 0.95));
      border-bottom: 2px solid rgba(106, 132, 255, 0.35);
      text-align: center;
    }
    .timing-display.visible {
      display: block;
    }
    .timing-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .timing-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .timing-sep {
      width: 1px;
      height: 40px;
      background: rgba(106, 132, 255, 0.25);
    }
    .timing-display .timing-label {
      font-size: 11px;
      color: #8a9dd4;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .timing-display .timing-value {
      font-size: 28px;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 16px rgba(255, 215, 0, 0.45), 0 0 32px rgba(255, 215, 0, 0.2);
      font-family: "SF Mono", "Consolas", monospace;
    }
    .timing-display .timing-unit {
      font-size: 14px;
      font-weight: 400;
      color: #c9a227;
      margin-left: 3px;
    }
    .timing-display .timing-details {
      font-size: 11px;
      color: #6a7db5;
      margin-top: 6px;
    }
    /* 翻转面数警示样式 */
    #flip-value {
      color: #52d681;
      text-shadow: 0 0 16px rgba(82, 214, 129, 0.4), 0 0 32px rgba(82, 214, 129, 0.2);
    }
    #flip-value.has-flip {
      color: #ff5252;
      text-shadow: 0 0 18px rgba(255, 82, 82, 0.55), 0 0 36px rgba(255, 82, 82, 0.3);
      animation: flipPulse 1.2s ease-in-out infinite;
    }
    @keyframes flipPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(9, 15, 28, 0.96);
      border-bottom: 1px solid rgba(106, 132, 255, 0.18);
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="radio"] { accent-color: #6a84ff; }
    select, button {
      border: 1px solid rgba(106, 132, 255, 0.25);
      background: #121b31;
      color: #eef2ff;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #172546;
    }
    .hidden-input {
      display: none;
    }
    .status {
      min-width: 240px;
      color: #8cc4ff;
      font-size: 13px;
      text-align: right;
    }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: #11192b;
      min-height: 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #0b1220;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(106, 132, 255, 0.16);
      color: #c6d1f4;
      font-size: 14px;
    }
    .panel-header span:last-child {
      color: #8292bd;
      font-size: 12px;
    }
    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .footer-note {
      padding: 10px 16px;
      border-top: 1px solid rgba(106, 132, 255, 0.16);
      color: #7e8db5;
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .status {
        text-align: left;
      }
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }
      #reload-btn {
        padding: 9px 22px;
        background: linear-gradient(135deg, #ff6b35 0%, #ff8f5e 100%);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 3px 10px rgba(255, 107, 53, 0.4);
        letter-spacing: 1px;
      }
      #reload-btn .btn-text {
        display: inline-block;
      }
      #reload-btn .btn-excl {
        color: #ffd700;
        margin-left: 3px;
        font-size: 17px;
        filter: drop-shadow(0 0 2px rgba(255,215,0,0.6));
      }
      #reload-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
        transform: none !important;
      }
      #reload-btn:not(:disabled):hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 6px 18px rgba(255, 107, 53, 0.6);
      }
      #reload-btn:not(:disabled):active {
        transform: translateY(0) scale(0.97);
        box-shadow: 0 2px 6px rgba(255, 107, 53, 0.4);
      }
      #clear-btn {
        padding: 9px 18px;
        background: linear-gradient(135deg, #2a3a5a 0%, #3a4a6a 100%);
        color: #c6d1f4;
        border: 1px solid rgba(106,132,255,0.25);
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #clear-btn:not(:disabled):hover {
        background: linear-gradient(135deg, #3a4a6a 0%, #4a5a7a 100%);
        color: #fff;
        border-color: rgba(106,132,255,0.5);
      }
      #clear-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #change-pin-btn {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid rgba(106, 132, 255, 0.3);
        background: #111b31;
        color: #c6d1f4;
        transition: background 0.2s ease;
      }
      #change-pin-btn:hover {
        background: #1a2a4a;
        border-color: rgba(106, 132, 255, 0.55);
      }
      #change-pin-btn:active {
        background: #0f1a30;
      }
  </style>
</head>
<body>
  <div class="app">
    <div class="timing-display" id="timing-display">
      <div class="timing-row">
        <div class="timing-block">
          <div class="timing-label">计算耗时</div>
          <div class="timing-value"><span id="timing-ms">0</span><span class="timing-unit">ms</span></div>
        </div>
        <div class="timing-sep"></div>
        <div class="timing-block" id="flip-block">
          <div class="timing-label">翻转三角面</div>
          <div class="timing-value" id="flip-value"><span id="flip-count">0</span><span class="timing-unit" id="flip-unit">个</span></div>
        </div>
      </div>
      <div class="timing-details" id="timing-details"></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-right">
        <select id="model-select" title="Models" style="width:180px;font-size:15px;padding:10px 14px;"></select>
        <fieldset id="method-radios" style="border:1px solid rgba(106,132,255,0.22);border-radius:10px;padding:8px 12px;margin:0;">
          <legend style="color:#8a9dd4;font-size:11px;padding:0 6px;">展开算法</legend>
          <div style="display:flex;flex-wrap:wrap;gap:6px 14px;">
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="tutte" checked> Tutte</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap" title="Discrete Conformal Parameterization: cot-Laplace 调和映射 + 固定边界"><input type="radio" name="method" value="dcp"> DCP</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="lscm"> LSCM</label>
            <label id="lscm-bd-chk" style="color:#8a9dd4;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-right:8px;"><input type="checkbox" id="bd-chk-lscm" onchange="onParamChange()"><span style="line-height:1">BD</span></label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="arap"> ARAP</label>
            <label id="arap-bd-chk" style="color:#8a9dd4;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-right:8px;"><input type="checkbox" id="bd-chk-arap" onchange="onParamChange()"><span style="line-height:1">BD</span></label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap" title="Spectral Conformal Parameterization (Mullen et al.)"><input type="radio" name="method" value="scp"> SCP</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap" title="ABF++ 角度变量 + Gauss–Newton（参考 Geogram mesh_ABF）"><input type="radio" name="method" value="abfpp"> ABF++</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap" title="线性化正弦积约束的迭代 ABF（Zayer et al.）"><input type="radio" name="method" value="linabf"> linABF</label>
          </div>
        </fieldset>

        <!-- 固定算法参数区（始终可见） -->
        <fieldset id="param-panel" style="border:1px solid rgba(255,180,70,0.35);border-radius:10px;padding:8px 12px;margin:0;background:rgba(20,25,45,0.7);">
          <legend style="color:#ffb446;font-size:11px;padding:0 6px;">算法参数</legend>
          <div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;">
            <span id="param-none" style="font-size:12px;color:#5a6791;">无参数</span>
            <!-- LSCM 改pin点 -->
            <span id="param-lscm-pin" style="display:none;font-size:12px;color:#c6d1f4;">
              <button id="change-pin-btn" type="button">改pin点</button>
            </span>
            <!-- Tutte / DCP 边界选择 -->
            <span id="param-tutte-boundary" style="display:none;font-size:12px;color:#c6d1f4;">
              边界:
              <label style="cursor:pointer;margin:0 4px;" title="映射到圆形边界"><input type="radio" name="tutte-boundary" value="circle" checked> 圆</label>
              <label style="cursor:pointer;margin:0 4px;" title="映射到正方形边界"><input type="radio" name="tutte-boundary" value="square"> 方</label>
            </span>
            <!-- Tutte Laplace 权重（uniform 图 Laplace / cot-Laplace） -->
            <span id="param-tutte-weight" style="display:none;font-size:12px;color:#c6d1f4;">
              权重:
              <label style="cursor:pointer;margin:0 4px;" title="均匀权重：Δf(v_i)=1/|N_i| Σ(f_j−f_i)，见 Tutte 参数化"><input type="radio" name="tutte-weight" value="uniform" checked> uniform</label>
              <label style="cursor:pointer;margin:0 4px;" title="余切权重：离散 cot-Laplace 调和映射"><input type="radio" name="tutte-weight" value="cot"> cot-Laplace</label>
            </span>
            <!-- BD C 值 -->
            <span id="param-bd-c" style="display:none;font-size:12px;color:#ffb446;">
              共形上界c:<input id="bd-c-input" type="number" value="10" min="1.1" max="100" step="1"
                style="width:50px;padding:3px 5px;border-radius:6px;text-align:center;font-size:12px;border:1px solid rgba(255,180,70,0.4);background:#0d1528;color:#ffd700;margin-left:4px;"
                title="共形扭曲上限 σ₁/σ₂ ≤ c（越小越保角，1=共形）">
            </span>
            <!-- ARAP 迭代 -->
            <span id="param-arap-iter" style="display:none;font-size:12px;color:#c6d1f4;">
              迭代:<input id="arap-iter-input" type="number" value="30" min="5" max="200" step="5"
                style="width:44px;padding:3px 5px;border-radius:6px;text-align:center;font-size:12px;border:1px solid rgba(106,132,255,0.3);background:#0d1528;color:#eef2ff;margin-left:4px;"
                title="ARAP Local/Global 迭代次数">
            </span>
            <!-- 优化方法选择 -->
            <span id="param-opt-scheme" style="display:none;font-size:12px;color:#c6d1f4;">
              优化:<select id="opt-scheme-select" style="width:75px;padding:3px 5px;border-radius:6px;font-size:11px;border:1px solid rgba(106,132,255,0.3);background:#0d1528;color:#eef2ff;margin-left:4px;">
                <option value="1" selected>牛顿法</option>
                <option value="0">梯度下降</option>
                <option value="3">LBFGS</option>
              </select>
            </span>
          </div>
        </fieldset>
        <button id="reload-btn"><span class="btn-text">展开</span><span class="btn-excl">!</span></button>
        <button id="clear-btn">清除</button>
        <fieldset id="texture-radios" style="border:1px solid rgba(106,132,255,0.22);border-radius:10px;padding:6px 10px;margin:0;display:flex;gap:12px;align-items:center;">
          <legend style="color:#8a9dd4;font-size:11px;padding:0 4px;">纹理显示</legend>
          <label style="color:#d8def7;font-size:13px;cursor:pointer;">
            <input type="radio" name="texture-display" value="checkerboard" id="radio-checkerboard" disabled> 棋盘格
          </label>
          <label style="color:#d8def7;font-size:13px;cursor:pointer;">
            <input type="radio" name="texture-display" value="dots" id="radio-dots" disabled> 圆点贴图
          </label>
          <label style="color:#d8def7;font-size:13px;cursor:pointer;">
            <input type="radio" name="texture-display" value="distortion" id="radio-distortion" disabled> 共形扭曲
          </label>
        </fieldset>
        <div class="status" id="status-text">正在加载模型...</div>
      </div>
    </div>

    <div class="main">
      <section class="panel">
        <div class="panel-header">
          <span>3D 模型</span>
          <span>拖拽旋转 / 滚轮缩放</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="model-canvas"></canvas>
        </div>
        <div class="footer-note">左侧显示原始三角网格与自动选择的约束点。</div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <span id="uv-panel-label">UV 网格</span>
          <span>边界归一化到 0..1</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="uv-canvas"></canvas>
        </div>
        <div class="footer-note">右侧展示展开后的线框 UV 结果。</div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const MODELS1 = {
        cathead: { label: "Cat Head (248)", file: "cathead_F248.obj" },
        beetle: { label: "Beetle (2.1K)", file: "beetle_F2052.obj" },
        bunnyhead: { label: "Bunny Head (3K)", file: "bunnyhead_F3000.obj" },
        max: { label: "Max (3.6K)", file: "max_F3599.obj" },
        hand: { label: "Hand (3.8K)", file: "hand_F3769.obj" },
        hand1i: { label: "Hand 1i (5K)", file: "hand_1_i_F4999.obj" },
        spot_cowhead: { label: "Spot Cow Head (9K)", file: "spot_cowhead_F9024.obj" },
        hencky: { label: "Hencky (20K)", file: "hencky_F20000.obj" },
        camelhead: { label: "Camel Head (22.7K)", file: "camelhead_F22704.obj" },
        maxplanck: { label: "Max Planck (100K)", file: "max-planck_F99990.obj" }
      };


      const modelCanvas = document.getElementById("model-canvas");
      const uvCanvas = document.getElementById("uv-canvas");
      const modelSelect = document.getElementById("model-select");
      const reloadBtn = document.getElementById("reload-btn");
      const clearBtn = document.getElementById("clear-btn");
      const textureBtn = null;
      const radioCheckerboard = document.getElementById("radio-checkerboard");
      const radioDots = document.getElementById("radio-dots");
      const radioDistortion = document.getElementById("radio-distortion");
      const statusText = document.getElementById("status-text");
      const objLoader = new THREE.OBJLoader();

      const modelRenderer = new THREE.WebGLRenderer({ canvas: modelCanvas, antialias: true, alpha: true });
      const uvRenderer = new THREE.WebGLRenderer({ canvas: uvCanvas, antialias: true, alpha: true });
      modelRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      uvRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const modelScene = new THREE.Scene();
      const uvScene = new THREE.Scene();
      modelScene.background = new THREE.Color(0x08101d);
      uvScene.background = new THREE.Color(0x091120);

      const modelCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
      modelCamera.position.set(1.8, 1.5, 1.8);
      const uvCamera = new THREE.OrthographicCamera(-1.15, 1.15, 1.15, -1.15, 0.1, 10);
      uvCamera.position.set(0, 0, 2);

      const controls = new THREE.OrbitControls(modelCamera, modelCanvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(2, 3, 4);
      modelScene.add(ambient);
      modelScene.add(dirLight);

      let currentModelGroup = null;
      let currentPins = null;
      let currentUvLines = null;
      let currentUvPins = null;
      let busy = false;
      let currentMeshData = null;
      let currentSourcePath = "";
      let currentUnwrapUv = null;
      let textureEnabled = false;
      let currentTexturedMesh = null;
      let checkerTexture = null;
      let dotTexture = null;
      let currentTextureMode = "checkerboard";
      let lastElapsedMs = 0;
      let distortionEnabled = false;
      let currentDistortionMesh = null;
      let currentCustomAnchors = null;  // 用户手动选择的 pin 点

      function setStatus(message, color) {
        statusText.textContent = message;
        statusText.style.color = color || "#8cc4ff";
      }

      function showTiming(ms, details, flippedCount) {
        const display = document.getElementById("timing-display");
        const msSpan = document.getElementById("timing-ms");
        const detailsSpan = document.getElementById("timing-details");
        const flipCountSpan = document.getElementById("flip-count");
        const flipValue = document.getElementById("flip-value");
        display.classList.add("visible");
        msSpan.textContent = ms.toFixed(1);
        detailsSpan.textContent = details || "";
        lastElapsedMs = ms;
        // 更新翻转面数显示
        const fc = typeof flippedCount === 'number' ? flippedCount : 0;
        if (flipCountSpan) flipCountSpan.textContent = fc;
        if (flipValue) {
          flipValue.classList.toggle("has-flip", fc > 0);
        }
      }

      function hideTiming() {
        document.getElementById("timing-display").classList.remove("visible");
        const flipCountSpan = document.getElementById("flip-count");
        const flipValue = document.getElementById("flip-value");
        if (flipCountSpan) flipCountSpan.textContent = "0";
        if (flipValue) flipValue.classList.remove("has-flip");
      }

      function updateTimingProgress(current, total) {
        const msSpan = document.getElementById("timing-ms");
        msSpan.textContent = "计算中 " + current + "/" + total;
      }

      function setBusy(nextBusy) {
        busy = nextBusy;
        reloadBtn.disabled = nextBusy;
        clearBtn.disabled = nextBusy;
        modelSelect.disabled = nextBusy;
        // 单选框在展开完成前保持禁用
        if (!nextBusy && currentUnwrapUv) {
          radioCheckerboard.disabled = false;
          radioDistortion.disabled = false;
        } else if (nextBusy) {
          radioCheckerboard.disabled = true;
          radioDistortion.disabled = true;
        }
      }

      function populateSelect(sel, models) {
        const keys = Object.keys(models);
        sel.innerHTML = "";
        for (let i = 0; i < keys.length; i++) {
          const opt = document.createElement("option");
          opt.value = keys[i];
          opt.textContent = models[keys[i]].label;
          sel.appendChild(opt);
        }
        if (keys.length > 0) sel.value = keys[0];
      }
      function initModelOptions() {
        populateSelect(modelSelect, MODELS1);
      }

      function resize() {
        const modelRect = modelCanvas.parentElement.getBoundingClientRect();
        const uvRect = uvCanvas.parentElement.getBoundingClientRect();

        modelRenderer.setSize(modelRect.width, modelRect.height, false);
        uvRenderer.setSize(uvRect.width, uvRect.height, false);

        modelCamera.aspect = modelRect.width / Math.max(modelRect.height, 1);
        modelCamera.updateProjectionMatrix();

        const aspect = uvRect.width / Math.max(uvRect.height, 1);
        const scale = 1.15;
        uvCamera.left = -scale * aspect;
        uvCamera.right = scale * aspect;
        uvCamera.top = scale;
        uvCamera.bottom = -scale;
        uvCamera.updateProjectionMatrix();
      }

      function normalizeObject(root) {
        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        root.position.sub(center);
        root.scale.setScalar(1 / maxDim);
        root.updateMatrixWorld(true);
      }

      function loadOBJ(url) {
        return new Promise(function (resolve, reject) {
          objLoader.load(url, resolve, undefined, reject);
        });
      }

      /**
       * 从 OBJ 文本中解析原始面数据（保留四边形等多边形，不三角化）
       */
      function parseRawFaces(objText) {
        const faces = [];
        const lines = objText.split(/\r?\n/);
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line.startsWith('f ') && !line.startsWith('f\t')) continue;
          const indices = [];
          // 处理换行续行
          let full = line;
          while (i + 1 < lines.length && lines[i + 1].trim() && !lines[i + 1].trim().match(/^[vf#]/)) {
            i++;
            full += ' ' + lines[i].trim();
          }
          const parts = full.slice(1).trim().split(/\s+/);
          for (let j = 0; j < parts.length; j++) {
            const idx = parseInt(parts[j].split('/')[0], 10);
            if (!isNaN(idx)) indices.push(idx - 1); // 转为 0-based
          }
          if (indices.length >= 3) faces.push(indices);
        }
        return faces;
      }

      /**
       * 尝试多个路径加载原始 OBJ 文本
       */
      async function fetchObjText(urls) {
        let lastError = null;
        for (let i = 0; i < urls.length; i++) {
          try {
            const resp = await fetch(urls[i]);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return await resp.text();
          } catch (e) { lastError = e; }
        }
        throw lastError || new Error('无法加载 OBJ 文本');
      }

      function getModelCandidateUrls(modelKey) {
        const model = MODELS1[modelKey];
        if (!model) return [];
        return ["assets/Models/" + model.file, "./assets/Models/" + model.file, "../assets/Models/" + model.file];
      }

      async function loadBuiltinModel(modelKey) {
        const candidateUrls = getModelCandidateUrls(modelKey);
        let lastError = null;

        // 先加载 Three.js 几何（和之前一样）
        let root = null, loadedUrl = null;
        for (let i = 0; i < candidateUrls.length; i++) {
          try {
            root = await loadOBJ(candidateUrls[i]);
            loadedUrl = candidateUrls[i];
            break;
          } catch (error) { lastError = error; }
        }
        if (!root) {
          const detail = lastError && lastError.message ? lastError.message : String(lastError || "unknown");
          throw new Error("内置模型加载失败，尝试路径: " + candidateUrls.join(" | ") + "；最后错误: " + detail);
        }

        // 模型加载成功后，再获取原始 OBJ 文本解析四边形数据
        let rawFaces = null;
        try { rawFaces = parseRawFaces(await fetchObjText(candidateUrls)); }
        catch (e) { /* 文本加载失败不影响渲染 */ }

        return { root: root, sourcePath: loadedUrl, rawFaces: rawFaces };
      }

      let currentRawFaces = null; // 原始 OBJ 面数据（可能含 quad）
      let isQuadMesh = false;     // 是否为四边形网格

      function collectMeshData(root) {
        root.updateMatrixWorld(true);
        const positions = [];
        const faces = [];
        const vertexMap = new Map();
        const temp = new THREE.Vector3();

        function getVertexIndex(x, y, z) {
          const key = [
            Math.round(x * 100000),
            Math.round(y * 100000),
            Math.round(z * 100000)
          ].join("_");
          if (!vertexMap.has(key)) {
            vertexMap.set(key, positions.length);
            positions.push([x, y, z]);
          }
          return vertexMap.get(key);
        }

        root.traverse(function (child) {
          if (!child.isMesh || !child.geometry || !child.geometry.attributes.position) {
            return;
          }

          const geometry = child.geometry.clone();
          const positionAttr = geometry.attributes.position;
          const localToGlobal = new Array(positionAttr.count);

          for (let i = 0; i < positionAttr.count; i++) {
            temp.fromBufferAttribute(positionAttr, i).applyMatrix4(child.matrixWorld);
            localToGlobal[i] = getVertexIndex(temp.x, temp.y, temp.z);
          }

          if (geometry.index) {
            const index = geometry.index.array;
            for (let i = 0; i < index.length; i += 3) {
              faces.push([
                localToGlobal[index[i]],
                localToGlobal[index[i + 1]],
                localToGlobal[index[i + 2]]
              ]);
            }
          } else {
            for (let i = 0; i < positionAttr.count; i += 3) {
              faces.push([
                localToGlobal[i],
                localToGlobal[i + 1],
                localToGlobal[i + 2]
              ]);
            }
          }
        });

        return { positions: positions, faces: faces };
      }

      function repairMeshForSolver(meshData) {
        const data = {
          positions: meshData.positions.map(function(p) { return [p[0], p[1], p[2]]; }),
          faces: []
        };
        for (let i = 0; i < meshData.faces.length; i++) {
          const f = meshData.faces[i];
          if (f.length < 3) continue;
          if (f[0] === f[1] || f[1] === f[2] || f[2] === f[0]) continue;
          if (f[0] < 0 || f[1] < 0 || f[2] < 0) continue;
          if (f[0] >= data.positions.length || f[1] >= data.positions.length || f[2] >= data.positions.length) continue;
          data.faces.push([f[0], f[1], f[2]]);
        }

        let edgeSplits = 0, vertexSplits = 0;
        function edgeKey(a, b) { return a < b ? a + "_" + b : b + "_" + a; }
        function buildEdgeFaces() {
          const edges = new Map();
          for (let fi = 0; fi < data.faces.length; fi++) {
            const f = data.faces[fi];
            for (const e of [[f[0], f[1]], [f[1], f[2]], [f[2], f[0]]]) {
              const k = edgeKey(e[0], e[1]);
              if (!edges.has(k)) edges.set(k, { a: Math.min(e[0], e[1]), b: Math.max(e[0], e[1]), faces: [] });
              edges.get(k).faces.push(fi);
            }
          }
          return edges;
        }
        function splitNonManifoldEdges() {
          let changed = false;
          buildEdgeFaces().forEach(function(info) {
            if (info.faces.length <= 2) return;
            for (let i = 2; i < info.faces.length; i++) {
              const fi = info.faces[i], f = data.faces[fi];
              const na = data.positions.length;
              data.positions.push(data.positions[info.a].slice());
              const nb = data.positions.length;
              data.positions.push(data.positions[info.b].slice());
              data.faces[fi] = f.map(function(v) {
                if (v === info.a) return na;
                if (v === info.b) return nb;
                return v;
              });
              edgeSplits++;
              changed = true;
            }
          });
          return changed;
        }
        function findNonManifoldVertex() {
          for (let v = 0; v < data.positions.length; v++) {
            const incident = [];
            for (let fi = 0; fi < data.faces.length; fi++) {
              const f = data.faces[fi];
              if (f[0] === v || f[1] === v || f[2] === v) incident.push(fi);
            }
            if (incident.length <= 1) continue;
            const adj = new Map();
            for (const fi of incident) adj.set(fi, new Set());
            for (let i = 0; i < incident.length; i++) {
              const fi = incident[i], f = data.faces[fi], others = f.filter(function(x) { return x !== v; });
              for (let j = i + 1; j < incident.length; j++) {
                const fj = incident[j], f2 = data.faces[fj], shared = f2.filter(function(x) { return x !== v; });
                if (others.some(function(u) { return shared.indexOf(u) >= 0; })) {
                  adj.get(fi).add(fj); adj.get(fj).add(fi);
                }
              }
            }
            const seen = new Set([incident[0]]), stack = [incident[0]];
            while (stack.length) {
              const cur = stack.pop();
              for (const nb of adj.get(cur)) {
                if (!seen.has(nb)) { seen.add(nb); stack.push(nb); }
              }
            }
            if (seen.size !== incident.length) return v;
          }
          return -1;
        }
        function splitNonManifoldVertex(v) {
          const incident = [];
          for (let fi = 0; fi < data.faces.length; fi++) {
            const f = data.faces[fi];
            if (f[0] === v || f[1] === v || f[2] === v) incident.push(fi);
          }
          const adj = new Map();
          for (const fi of incident) adj.set(fi, new Set());
          for (let i = 0; i < incident.length; i++) {
            const fi = incident[i], f = data.faces[fi], others = f.filter(function(x) { return x !== v; });
            for (let j = i + 1; j < incident.length; j++) {
              const fj = incident[j], f2 = data.faces[fj], shared = f2.filter(function(x) { return x !== v; });
              if (others.some(function(u) { return shared.indexOf(u) >= 0; })) {
                adj.get(fi).add(fj); adj.get(fj).add(fi);
              }
            }
          }
          const components = [], visited = new Set();
          for (const start of incident) {
            if (visited.has(start)) continue;
            const comp = [], stack = [start];
            visited.add(start);
            while (stack.length) {
              const cur = stack.pop();
              comp.push(cur);
              for (const nb of adj.get(cur)) {
                if (!visited.has(nb)) { visited.add(nb); stack.push(nb); }
              }
            }
            components.push(comp);
          }
          if (components.length <= 1) return false;
          for (let c = 1; c < components.length; c++) {
            const nv = data.positions.length;
            data.positions.push(data.positions[v].slice());
            for (const fi of components[c]) {
              data.faces[fi] = data.faces[fi].map(function(x) { return x === v ? nv : x; });
            }
            vertexSplits++;
          }
          return true;
        }

        for (let iter = 0; iter < 32; iter++) {
          const changedEdges = splitNonManifoldEdges();
          const v = findNonManifoldVertex();
          const changedVertex = v >= 0 ? splitNonManifoldVertex(v) : false;
          if (!changedEdges && !changedVertex) break;
        }
        return { meshData: data, edgeSplits: edgeSplits, vertexSplits: vertexSplits };
      }

      function getValidatedAnchors(vertices) {
        const autoAnchors = chooseAnchorPair(vertices);
        const anchors = currentCustomAnchors || autoAnchors;
        if (!anchors || anchors.length < 2) return autoAnchors;
        if (anchors[0] === anchors[1]) return autoAnchors;
        if (anchors[0] < 0 || anchors[1] < 0 || anchors[0] >= vertices.length || anchors[1] >= vertices.length) {
          currentCustomAnchors = null;
          return autoAnchors;
        }
        return anchors;
      }

      function chooseAnchorPair(vertices) {
        let bestA = 0;
        let bestB = 1;
        let bestDist2 = -1;
        for (let i = 0; i < vertices.length; i++) {
          for (let j = i + 1; j < vertices.length; j++) {
            const dx = vertices[i][0] - vertices[j][0];
            const dy = vertices[i][1] - vertices[j][1];
            const dz = vertices[i][2] - vertices[j][2];
            const dist2 = dx * dx + dy * dy + dz * dz;
            if (dist2 > bestDist2) {
              bestDist2 = dist2;
              bestA = i;
              bestB = j;
            }
          }
        }
        return [bestA, bestB];
      }

      function vertexDist2(vertices, a, b) {
        const dx = vertices[a][0] - vertices[b][0];
        const dy = vertices[a][1] - vertices[b][1];
        const dz = vertices[a][2] - vertices[b][2];
        return dx * dx + dy * dy + dz * dz;
      }

      function meshDiag2(vertices) {
        let minX = Infinity, minY = Infinity, minZ = Infinity;
        let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
        for (let i = 0; i < vertices.length; i++) {
          const p = vertices[i];
          if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
          if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
          if (p[2] < minZ) minZ = p[2]; if (p[2] > maxZ) maxZ = p[2];
        }
        const dx = maxX - minX, dy = maxY - minY, dz = maxZ - minZ;
        return dx * dx + dy * dy + dz * dz;
      }

      /**
       * 选取一对与 excludePair 空间位置明显不同、且彼此尽量远的 pin 点。
       * 只排除同一无序对会经常选到原 pin 附近的顶点，因此这里要求新顶点
       * 到旧两个 pin 都有足够距离；若模型太小或候选不足则逐步放宽阈值。
       * @param {number[][]} vertices 顶点坐标数组
       * @param {number[]} excludePair 要避开的顶点对 [a, b]
       * @returns {number[]} 新的顶点对索引
       */
      function chooseAlternativeAnchorPair(vertices, excludePair) {
        const exA = excludePair[0], exB = excludePair[1];
        const diag2 = meshDiag2(vertices) || 1;
        const thresholds = [0.25, 0.18, 0.12, 0.06, 0];
        let candidates = [];
        for (let ti = 0; ti < thresholds.length; ti++) {
          const minSep2 = diag2 * thresholds[ti] * thresholds[ti];
          candidates = [];
          for (let i = 0; i < vertices.length; i++) {
            if (i === exA || i === exB) continue;
            const sep2 = Math.min(vertexDist2(vertices, i, exA), vertexDist2(vertices, i, exB));
            if (sep2 >= minSep2) candidates.push({ index: i, sep2: sep2 });
          }
          if (candidates.length >= 2) break;
        }

        candidates.sort(function (a, b) { return b.sep2 - a.sep2; });
        candidates = candidates.slice(0, Math.min(candidates.length, 512));

        let bestA = candidates[0] ? candidates[0].index : (exA === 0 ? 1 : 0);
        let bestB = candidates[1] ? candidates[1].index : (exB === 0 ? 1 : 0);
        let bestScore = -Infinity;
        for (let i = 0; i < candidates.length; i++) {
          for (let j = i + 1; j < candidates.length; j++) {
            const a = candidates[i], b = candidates[j];
            const pairDist2 = vertexDist2(vertices, a.index, b.index);
            const score = pairDist2 + 0.35 * (a.sep2 + b.sep2);
            if (score > bestScore) {
              bestScore = score;
              bestA = a.index;
              bestB = b.index;
            }
          }
        }
        return [bestA, bestB];
      }

      // ==================== WASM 求解器初始化 ====================
      let wasmInstance = null;         // Unified WASM 模块实例（包含所有算法）
      let wasmReady = false;           // WASM 是否已就绪
      let wasmLoadFailed = false;
      let tutteArapInstance = null;
      let tutteArapReady = false;
      let tutteArapLoadFailed = false;

      /**
       * 异步加载 Unified WASM 求解器（包含全部 11 个算法）
       */
      async function initUnifiedSolver() {
        if (wasmReady) return true;
        if (wasmLoadFailed) return false;
        
        try {
          if (typeof UnifiedSolver === 'undefined') {
            throw new Error('WASM 胶水代码未加载，请确保 assets/wasm/unified_solver.js 已部署');
          }
          wasmInstance = await UnifiedSolver();
          wasmReady = true;
          console.log('WASM Unified Solver (11 algorithms) 加载成功');
          return true;
        } catch (err) {
          console.error('Unified WASM 加载失败:', err);
          wasmLoadFailed = true;
          return false;
        }
      }

      async function initTutteARAPSolver() {
        if (tutteArapReady) return true;
        if (tutteArapLoadFailed) return false;

        try {
          if (typeof TutteARAPSolver === 'undefined') {
            throw new Error('Tutte/ARAP WASM 胶水代码未加载，请确保 assets/wasm/tutte_arap_solver.js 已部署');
          }
          tutteArapInstance = await TutteARAPSolver();
          tutteArapReady = true;
          console.log('Tutte/ARAP WASM 加载成功');
          return true;
        } catch (err) {
          console.error('Tutte/ARAP WASM 加载失败:', err);
          tutteArapLoadFailed = true;
          return false;
        }
      }

      function getCurrentModelKey() { return modelSelect.value; }
      function getCurrentModelObj() { return MODELS1[getCurrentModelKey()]; }

      /** 当前选中的算法 */
      function getCurrentMethod() {
        const checked = document.querySelector('input[name="method"]:checked');
        return checked ? checked.value : 'lscm';
      }

      function shouldShowPinPoints() {
        return getCurrentMethod() === 'lscm';
      }

      /** BD 是否启用（LSCM 或 ARAP 的 BD 复选框选中） */
      function isBDEnabled() {
        const m = getCurrentMethod();
        if (m === 'lscm') return document.getElementById('bd-chk-lscm').checked;
        if (m === 'arap') return document.getElementById('bd-chk-arap').checked;
        return false;
      }

      /** 获取 Tutte 边界类型 */
      function getTutteBoundary() {
        const r = document.querySelector('input[name="tutte-boundary"]:checked');
        return r ? r.value : 'circle';
      }

      /** 获取 Tutte Laplace 权重类型：uniform | cot */
      function getTutteWeight() {
        const r = document.querySelector('input[name="tutte-weight"]:checked');
        return r ? r.value : 'uniform';
      }

      function getTutteWeightLabel() {
        return getTutteWeight() === 'cot' ? 'cot-Laplace' : 'uniform';
      }

      /** 获取 BD C 参数值 */
      function getBDCParam() {
        const v = parseFloat(document.getElementById('bd-c-input').value);
        return (isNaN(v) || v < 1.01) ? 10.0 : v;
      }

      /** 获取 ARAP 迭代次数 */
      function getARAPIter() {
        const v = parseInt(document.getElementById('arap-iter-input').value);
        return (isNaN(v) || v < 5) ? 30 : v;
      }

      /** 获取优化方法 */
      function getOptScheme() {
        const v = parseInt(document.getElementById('opt-scheme-select').value);
        return (v === 0 || v === 1 || v === 3) ? v : 1;
      }

      /** 算法切换 + BD复选框切换 + Tutte边界切换 → 统一更新参数面板 */
      function onParamChange() {
        const m = getCurrentMethod();
        const panel = document.getElementById('param-panel');
        const bdLscm = document.getElementById('bd-chk-lscm').checked && m === 'lscm';
        const bdArap = document.getElementById('bd-chk-arap').checked && m === 'arap';
        const showBD = bdLscm || bdArap;

        // 显隐参数面板
        const hasParams = (m === 'tutte' || m === 'dcp' || showBD || m === 'arap' || m === 'cetm' || m === 'ricci' || m === 'cp');
        document.getElementById('param-none').style.display = hasParams ? 'none' : '';

        // Tutte / DCP 边界
        document.getElementById('param-tutte-boundary').style.display = (m === 'tutte' || m === 'dcp') ? '' : 'none';
        document.getElementById('param-tutte-weight').style.display = (m === 'tutte') ? '' : 'none';
        // BD C 值
        document.getElementById('param-bd-c').style.display = showBD ? '' : 'none';
        // ARAP 迭代（ARAP 时始终显示）
        document.getElementById('param-arap-iter').style.display = (m === 'arap') ? '' : 'none';
        // 优化方法
        const showOpt = (m === 'cetm' || m === 'ricci' || m === 'cp');
        document.getElementById('param-opt-scheme').style.display = showOpt ? '' : 'none';
        if (showOpt) {
          const sel = document.getElementById('opt-scheme-select');
          sel.value = '1';  // 默认牛顿法
        }
        // BD 复选框只在 LSCM/ARAP 时可见
        document.getElementById('lscm-bd-chk').style.display = (m === 'lscm') ? '' : 'none';
        document.getElementById('arap-bd-chk').style.display = (m === 'arap') ? '' : 'none';

        // 改pin点按钮仅在 LSCM 时显示
        document.getElementById('param-lscm-pin').style.display = (m === 'lscm') ? '' : 'none';
        // 切换出 LSCM 时重置自定义 pin 点
        if (m !== 'lscm') {
          currentCustomAnchors = null;
        }
        if (currentMeshData) {
          updateModelPinPoints(currentCustomAnchors || chooseAnchorPair(currentMeshData.positions));
        }
        if (!shouldShowPinPoints() && currentUvPins) {
          clearGroup(uvScene, currentUvPins);
          currentUvPins = null;
        }

        updateStartButtonState();
      }

      window.onParamChange = onParamChange;  // 暴露到全局以便 HTML onchange 调用

      /**
       * 更新按钮状态，显示 WASM 引擎加载状态
       */
      function updateStartButtonState() {
        const btn = document.getElementById('reload-btn');
        if (!btn) return;

        if (wasmLoadFailed) {
          btn.textContent = '引擎加载失败';
          btn.disabled = true;
        } else if (!wasmReady) {
          btn.textContent = '引擎加载中...';
          btn.disabled = true;
        } else {
          btn.textContent = '展开!';
          btn.disabled = false;
        }
      }

      // 方法切换 + BD/Tutte 参数变化时更新 UI
      document.querySelectorAll('input[name="method"]').forEach(function(radio) {
        radio.addEventListener('change', onParamChange);
      });
      document.querySelectorAll('input[name="tutte-boundary"], input[name="tutte-weight"]').forEach(function(radio) {
        radio.addEventListener('change', onParamChange);
      });
      document.getElementById('change-pin-btn').addEventListener('click', onChangePinClick);
      onParamChange();  // 初始显示"无参数"

      // ==================== WASM 驱动的 LSCM 求解 ====================

      async function solveLSCMFallbackAsync(meshData, onProgress, cause, anchors, usingCustomAnchors) {
        if (usingCustomAnchors) {
          const msg = cause && cause.message ? cause.message : String(cause || "");
          throw new Error("LSCM 使用自定义 pin 点 " + anchors[0] + " & " + anchors[1] + " 求解失败: " + msg + "。为避免忽略新 pin 点，已取消 ARAP 兜底。");
        }
        console.warn("LSCM WASM 失败，改用 ARAP/Tutte 引擎兜底:", cause);
        setStatus("LSCM WASM 失败，正在改用 ARAP 兜底求解...", "#ffd38a");
        const result = await solveARAPAsync(meshData, onProgress);
        result.method = 'lscm_fallback';
        result.fallbackCause = cause && cause.message ? cause.message : String(cause || "");
        return result;
      }

      async function solveLSCMAsync(meshData, onProgress) {
        const repair = repairMeshForSolver(meshData);
        if (repair.edgeSplits > 0 || repair.vertexSplits > 0) {
          meshData = repair.meshData;
          currentMeshData = meshData;
          currentCustomAnchors = null;
          setStatus("已修复非流形结构，继续执行 LSCM...", "#ffd38a");
        }
        const vertices = meshData.positions;
        const faces = meshData.faces;
        if (vertices.length < 3 || faces.length < 1) {
          throw new Error("模型顶点或三角形数量不足");
        }

        const anchors = getValidatedAnchors(vertices);
        const usingCustomAnchors = !!(currentCustomAnchors &&
          currentCustomAnchors.length >= 2 &&
          currentCustomAnchors[0] === anchors[0] &&
          currentCustomAnchors[1] === anchors[1]);

        if (!wasmReady) {
          const loaded = await initUnifiedSolver();
          if (!loaded) throw new Error("WASM 统一求解器初始化失败");
        }

        if (onProgress) onProgress(0, faces.length);

        const flatPositions = new Float64Array(vertices.length * 3);
        for (let i = 0; i < vertices.length; i++) {
          flatPositions[i * 3] = vertices[i][0];
          flatPositions[i * 3 + 1] = vertices[i][1];
          flatPositions[i * 3 + 2] = vertices[i][2];
        }

        const flatFaces = new Int32Array(faces.length * 3);
        for (let i = 0; i < faces.length; i++) {
