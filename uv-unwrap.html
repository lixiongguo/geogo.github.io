      function countFlippedFaces(uv, faces) {
        let count = 0;
        const eps = 1e-12;
        for (let i = 0; i < faces.length; i++) {
          const t = faces[i];
          const a = uv[t[0]], b = uv[t[1]], c = uv[t[2]];
          if ((b[0]-a[0])*(c[1]-a[1]) - (c[0]-a[0])*(b[1]-a[1]) < -eps) count++;
        }
        return count;
      }

      // ---------- SCP / ABF / linABF（纯 JS；SCP 矩阵与 libigl vector_area_matrix + Mullen et al. 逆幂迭代一致；角度法参考 Geogram ABF++ 流程）----------

      function _dot(a, b) {
        let s = 0;
        for (let i = 0; i < a.length; i++) s += a[i] * b[i];
        return s;
      }
      function _axpy(a, x, y) {
        for (let i = 0; i < x.length; i++) y[i] += a * x[i];
      }
      function _copy(a) {
        const o = new Float64Array(a.length);
        o.set(a);
        return o;
      }
      function _norm2(a) {
        return Math.sqrt(_dot(a, a));
      }

      /** 稠密线性方程组 A x = b（行主元），A 为 n×n 的 Float64Array 数组 */
      function _denseSolvePivot(Ain, bin) {
        const n = Ain.length;
        const A = new Array(n);
        for (let i = 0; i < n; i++) A[i] = new Float64Array(Ain[i]);
        const b = _copy(bin);
        const x = new Float64Array(n);
        for (let k = 0; k < n; k++) {
          let piv = k, best = Math.abs(A[k][k]);
          for (let r = k + 1; r < n; r++) {
            const v = Math.abs(A[r][k]);
            if (v > best) { best = v; piv = r; }
          }
          if (best < 1e-18) throw new Error("SCP 稠密求解奇异");
          if (piv !== k) {
            const tA = A[k]; A[k] = A[piv]; A[piv] = tA;
            const tb = b[k]; b[k] = b[piv]; b[piv] = tb;
          }
          const akk = A[k][k];
          for (let r = k + 1; r < n; r++) {
            const f = A[r][k] / akk;
            A[r][k] = 0;
            for (let c = k + 1; c < n; c++) A[r][c] -= f * A[k][c];
            b[r] -= f * b[k];
          }
        }
        for (let r = n - 1; r >= 0; r--) {
          let s = b[r];
          for (let c = r + 1; c < n; c++) s -= A[r][c] * x[c];
          x[r] = s / A[r][r];
        }
        return x;
      }

      /** GMRES 解 A x = b，A 为对称线性算子 applyA(v,out)=A*v */
      function _gmresSolve(applyA, b, tol, maxIter, restart) {
        const n = b.length;
        const x = new Float64Array(n);
        const r0 = new Float64Array(n);
        const Av = new Float64Array(n);
        const tmp = new Float64Array(n);
        let bn = _norm2(b);
        if (bn < 1e-30) return x;
        const rel = Math.max(tol * bn, 1e-14);
        applyA(x, Av);
        for (let i = 0; i < n; i++) r0[i] = b[i] - Av[i];
        let beta = _norm2(r0);
        if (beta < rel) return x;

        const m = Math.min(restart, n);
        const V = new Array(m + 1);
        for (let i = 0; i <= m; i++) V[i] = new Float64Array(n);
        const H = [];
        for (let i = 0; i <= m; i++) H[i] = new Float64Array(m);

        let total = 0;
        while (total < maxIter) {
          for (let i = 0; i < n; i++) V[0][i] = r0[i] / beta;
          const cs = [], sn = [], e1 = new Float64Array(m + 1);
          e1[0] = beta;
          let j = 0;
          for (; j < m && total + j < maxIter; j++) {
            applyA(V[j], Av);
            for (let i = 0; i <= j; i++) H[i][j] = _dot(Av, V[i]);
            for (let i = 0; i < n; i++) tmp[i] = Av[i];
            for (let i = 0; i <= j; i++) _axpy(-H[i][j], V[i], tmp);
            const hNext = _norm2(tmp);
            H[j + 1][j] = hNext;
            if (hNext < 1e-15) { j++; break; }
            for (let i = 0; i < n; i++) V[j + 1][i] = tmp[i] / hNext;
            for (let i = 0; i < j; i++) {
              const h1 = H[i][j], h2 = H[i + 1][j];
              const c = cs[i], s = sn[i];
              H[i][j] = c * h1 + s * h2;
              H[i + 1][j] = -s * h1 + c * h2;
            }
            const hjj = H[j][j], hj1 = H[j + 1][j];
            const den = Math.hypot(hjj, hj1);
            const c = hjj / den, s = hj1 / den;
            cs[j] = c; sn[j] = s;
            H[j][j] = c * hjj + s * hj1;
            H[j + 1][j] = 0;
            const ej = e1[j], ej1 = e1[j + 1];
            e1[j] = c * ej + s * ej1;
            e1[j + 1] = -s * ej + c * ej1;
            if (Math.abs(e1[j + 1]) < rel) { j++; break; }
          }
          const jr = j;
          const Rmat = [];
          for (let r = 0; r < jr; r++) {
            Rmat[r] = new Float64Array(jr);
            for (let c = r; c < jr; c++) Rmat[r][c] = H[r][c];
          }
          const rhs = new Float64Array(jr);
          for (let r = 0; r < jr; r++) rhs[r] = e1[r];
          const y = _denseSolvePivot(Rmat, rhs);
          const dx = new Float64Array(n);
          for (let r = 0; r < jr; r++) _axpy(y[r], V[r], dx);
          for (let i = 0; i < n; i++) x[i] += dx[i];
          applyA(x, Av);
          for (let i = 0; i < n; i++) r0[i] = b[i] - Av[i];
          beta = _norm2(r0);
          total += jr;
          if (beta < rel) break;
        }
        return x;
      }

      function _normalizeUvBox(uv) {
        let minU = Infinity, minV = Infinity, maxU = -Infinity, maxV = -Infinity;
        for (let i = 0; i < uv.length; i++) {
          const u = uv[i][0], v = uv[i][1];
          if (u < minU) minU = u; if (u > maxU) maxU = u;
          if (v < minV) minV = v; if (v > maxV) maxV = v;
        }
        const du = maxU - minU || 1, dv = maxV - minV || 1, s = 1 / Math.max(du, dv);
        for (let i = 0; i < uv.length; i++) {
          uv[i][0] = (uv[i][0] - minU) * s;
          uv[i][1] = (uv[i][1] - minV) * s;
        }
        return uv;
      }

      function _cotanLaplacianTriplets(vertices, faces) {
        const n = vertices.length;
        const tri = [];
        function add(i, j, v) {
          if (i === j) return;
          tri.push({ i: i, j: j, v: v });
        }
        for (let fi = 0; fi < faces.length; fi++) {
          const f = faces[fi];
          const i0 = f[0], i1 = f[1], i2 = f[2];
          const p0 = vertices[i0], p1 = vertices[i1], p2 = vertices[i2];
          const ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2];
          const bx = p2[0] - p0[0], by = p2[1] - p0[1], bz = p2[2] - p0[2];
          const cx = p2[0] - p1[0], cy = p2[1] - p1[1], cz = p2[2] - p1[2];
          const cr = ay * bz - az * by, cy2 = az * bx - ax * bz, cz2 = ax * by - ay * bx;
          const area2 = Math.sqrt(cr * cr + cy2 * cy2 + cz2 * cz2) + 1e-30;
          const cot0 = _dot3(ax, ay, az, bx, by, bz) / area2;
          const cot1 = _dot3(-ax, -ay, -az, cx, cy, cz) / area2;
          const cot2 = _dot3(bx, by, bz, -cx, -cy, -cz) / area2;
          add(i0, i1, cot2); add(i1, i0, cot2);
          add(i1, i2, cot0); add(i2, i1, cot0);
          add(i2, i0, cot1); add(i0, i2, cot1);
        }
        const acc = new Map();
        function accAdd(i, j, v) {
          const k = i + '_' + j;
          acc.set(k, (acc.get(k) || 0) + v);
        }
        for (let t = 0; t < tri.length; t++) accAdd(tri[t].i, tri[t].j, tri[t].v);
        const rows = new Array(n).fill(0).map(function () { return []; });
        let diag = new Float64Array(n);
        acc.forEach(function (v, k) {
          const p = k.split('_');
          const i = +p[0], j = +p[1];
          if (i === j) return;
          rows[i].push({ j: j, v: v });
          diag[i] -= v;
        });
        for (let i = 0; i < n; i++) rows[i].push({ j: i, v: diag[i] });
        return rows;
      }

      /** Uniform 图 Laplace（Tutte 均匀权重，每边权 1） */
      function _uniformLaplacianTriplets(vertices, faces) {
        const n = vertices.length;
        const tri = [];
        function add(i, j, v) {
          if (i === j) return;
          tri.push({ i: i, j: j, v: v });
        }
        for (let fi = 0; fi < faces.length; fi++) {
          const f = faces[fi];
          const i0 = f[0], i1 = f[1], i2 = f[2];
          add(i0, i1, 1); add(i1, i0, 1);
          add(i1, i2, 1); add(i2, i1, 1);
          add(i2, i0, 1); add(i0, i2, 1);
        }
        const acc = new Map();
        function accAdd(i, j, v) {
          const k = i + '_' + j;
          acc.set(k, (acc.get(k) || 0) + v);
        }
        for (let t = 0; t < tri.length; t++) accAdd(tri[t].i, tri[t].j, tri[t].v);
        const rows = new Array(n).fill(0).map(function () { return []; });
        let diag = new Float64Array(n);
        acc.forEach(function (v, k) {
          const p = k.split('_');
          const i = +p[0], j = +p[1];
          if (i === j) return;
          rows[i].push({ j: j, v: v });
          diag[i] -= v;
        });
        for (let i = 0; i < n; i++) rows[i].push({ j: i, v: diag[i] });
        return rows;
      }

      function _dot3(ax, ay, az, bx, by, bz) {
        return ax * bx + ay * by + az * bz;
      }

      /** 由稀疏行列表构造稠密矩阵（仅小规模 SCP 用） */
      function _sparseRowsToDense(rows) {
        const n = rows.length;
        const A = new Array(n);
        for (let i = 0; i < n; i++) {
          A[i] = new Float64Array(n);
          const ri = rows[i];
          for (let k = 0; k < ri.length; k++) A[i][ri[k].j] += ri[k].v;
        }
        return A;
      }

      function _buildBoundaryData(faces, nv) {
        const edgeMap = new Map();
        function ekey(a, b) { return a < b ? a + '_' + b : b + '_' + a; }
        for (let fi = 0; fi < faces.length; fi++) {
          const f = faces[fi];
          for (let k = 0; k < 3; k++) {
            const a = f[k], b = f[(k + 1) % 3];
            const ek = ekey(a, b);
            if (!edgeMap.has(ek)) edgeMap.set(ek, []);
            edgeMap.get(ek).push(fi);
          }
        }
        const boundaryEdges = [];
        edgeMap.forEach(function (fl, ek) {
          if (fl.length === 1) {
            const p = ek.split('_');
            boundaryEdges.push([+p[0], +p[1]]);
          }
        });
        const isBnd = new Array(nv).fill(false);
        for (let e = 0; e < boundaryEdges.length; e++) {
          isBnd[boundaryEdges[e][0]] = true;
          isBnd[boundaryEdges[e][1]] = true;
        }
        return { boundaryEdges: boundaryEdges, isBnd: isBnd };
      }

      function _buildBoundaryLoops(boundaryEdges) {
        const adj = new Map();
        function add(a, b) {
          if (!adj.has(a)) adj.set(a, []);
          adj.get(a).push(b);
        }
        for (let e = 0; e < boundaryEdges.length; e++) {
          const a = boundaryEdges[e][0], b = boundaryEdges[e][1];
          add(a, b); add(b, a);
        }
        const usedEdges = new Set();
        function ekey(a, b) { return a < b ? a + '_' + b : b + '_' + a; }
        const loops = [];
        adj.forEach(function(nei, start) {
          for (let s = 0; s < nei.length; s++) {
            const firstNext = nei[s];
            if (usedEdges.has(ekey(start, firstNext))) continue;
            const loop = [start];
            let prev = start, cur = firstNext;
            usedEdges.add(ekey(prev, cur));
            while (cur !== start) {
              loop.push(cur);
              const ns = adj.get(cur) || [];
              let next = -1;
              for (let i = 0; i < ns.length; i++) {
                if (ns[i] !== prev && !usedEdges.has(ekey(cur, ns[i]))) { next = ns[i]; break; }
              }
              if (next < 0) {
                for (let i = 0; i < ns.length; i++) {
                  if (ns[i] !== prev) { next = ns[i]; break; }
                }
              }
              if (next < 0 || usedEdges.has(ekey(cur, next))) break;
              prev = cur;
              cur = next;
              usedEdges.add(ekey(prev, cur));
            }
            if (loop.length >= 3 && cur === start) loops.push(loop);
          }
        });
        loops.sort(function(a, b) { return b.length - a.length; });
        return loops;
      }

      function _mapBoundaryLoop(vertices, loop, boundaryType) {
        const nb = loop.length;
        const lens = new Float64Array(nb);
        let total = 0;
        for (let i = 0; i < nb; i++) {
          const a = vertices[loop[i]], b = vertices[loop[(i + 1) % nb]];
          const len = edgeLen(a, b);
          lens[i] = len; total += len;
        }
        total = total || 1;
        const uv = new Map();
        let acc = 0;
        for (let i = 0; i < nb; i++) {
          const t = acc / total;
          let u, v;
          if (boundaryType === 'square') {
            const q = t * 4;
            if (q < 1) { u = q; v = 0; }
            else if (q < 2) { u = 1; v = q - 1; }
            else if (q < 3) { u = 3 - q; v = 1; }
            else { u = 0; v = 4 - q; }
          } else {
            const a = 2 * Math.PI * t;
            u = 0.5 + 0.5 * Math.cos(a);
            v = 0.5 + 0.5 * Math.sin(a);
          }
          uv.set(loop[i], [u, v]);
          acc += lens[i];
        }
        return uv;
      }

      /** 固定凸边界的调和映射：L f = 0（内部），f|∂ = g（Dirichlet） */
      function _harmonicParameterizationJs(vertices, faces, boundaryType, laplacianFn) {
        const n = vertices.length;
        const bd = _buildBoundaryData(faces, n);
        if (bd.boundaryEdges.length === 0) {
          throw new Error("需要带边界的网格；封闭曲面请先切开。");
        }
        const loops = _buildBoundaryLoops(bd.boundaryEdges);
        if (loops.length !== 1) {
          throw new Error("当前实现需要单一边界环，检测到 " + loops.length + " 个边界环。");
        }
        const boundaryUv = _mapBoundaryLoop(vertices, loops[0], boundaryType);
        const rowsL = laplacianFn(vertices, faces);
        const A = new Array(n);
        const bu = new Float64Array(n), bv = new Float64Array(n);
        for (let i = 0; i < n; i++) {
          if (boundaryUv.has(i)) {
            A[i] = [{ j: i, v: 1 }];
            bu[i] = boundaryUv.get(i)[0];
            bv[i] = boundaryUv.get(i)[1];
          } else {
            A[i] = rowsL[i].slice();
          }
        }
        function applyA(x, out) {
          for (let i = 0; i < n; i++) {
            let s = 0;
            const ri = A[i];
            for (let k = 0; k < ri.length; k++) s += ri[k].v * x[ri[k].j];
            out[i] = s;
          }
        }
        const maxIter = Math.min(1800, Math.max(250, n));
        const restart = Math.min(80, n);
        const u = _gmresSolve(applyA, bu, 1e-9, maxIter, restart);
        const v = _gmresSolve(applyA, bv, 1e-9, maxIter, restart);
        const uv = new Array(n);
        for (let i = 0; i < n; i++) uv[i] = [u[i], v[i]];
        return _normalizeUvBox(uv);
      }

      function tutteParameterizationJs(vertices, faces, boundaryType, weightType) {
        const lapFn = weightType === 'cot' ? _cotanLaplacianTriplets : _uniformLaplacianTriplets;
        return _harmonicParameterizationJs(vertices, faces, boundaryType, lapFn);
      }

      function discreteConformalParameterizationJs(vertices, faces, boundaryType) {
        return _harmonicParameterizationJs(vertices, faces, boundaryType, _cotanLaplacianTriplets);
      }

      /** libigl::vector_area_matrix：仅边界边贡献 */
      function _vectorAreaTriplets(boundaryEdges, n) {
        const tri = [];
        for (let e = 0; e < boundaryEdges.length; e++) {
          const i = boundaryEdges[e][0], j = boundaryEdges[e][1];
          tri.push({ i: i + n, j: j, v: -0.25 });
          tri.push({ i: j, j: i + n, v: -0.25 });
          tri.push({ i: i, j: j + n, v: 0.25 });
          tri.push({ i: j + n, j: i, v: 0.25 });
        }
        const rows = new Array(2 * n).fill(0).map(function () { return []; });
        for (let t = 0; t < tri.length; t++) {
          const tr = tri[t];
          rows[tr.i].push({ j: tr.j, v: tr.v });
        }
        return rows;
      }

      /** LC = -blockDiag(L,L) + 2*A，返回 2n×2n 稀疏行 */
      function _buildLC(rowsL, rowsA, n) {
        const N = 2 * n;
        const rows = new Array(N).fill(0).map(function () { return []; });
        function addBlock(src, roff, coff, scale) {
          for (let i = 0; i < src.length; i++) {
            const ri = src[i];
            for (let k = 0; k < ri.length; k++) {
              const t = ri[k];
              rows[i + roff].push({ j: t.j + coff, v: scale * t.v });
            }
          }
        }
        addBlock(rowsL, 0, 0, -1);
        addBlock(rowsL, n, n, -1);
        addBlock(rowsA, 0, 0, 2);
        const acc = new Array(N).fill(0).map(function () { return new Map(); });
        for (let i = 0; i < N; i++) {
          const ri = rows[i];
          for (let k = 0; k < ri.length; k++) {
            const t = ri[k];
            const m = acc[i];
            m.set(t.j, (m.get(t.j) || 0) + t.v);
          }
        }
        const out = new Array(N);
        for (let i = 0; i < N; i++) {
          const m = acc[i];
          const arr = [];
          m.forEach(function (v, j) { arr.push({ j: j, v: v }); });
          arr.sort(function (a, b) { return a.j - b.j; });
          out[i] = arr;
        }
        return out;
      }

      /** 边界投影 P = B - E E^T（单连通边界环，与 Euclid/libigl 用法一致） */
      function _makeBoundaryProjector(isBnd, n) {
        const bverts = [];
        for (let i = 0; i < n; i++) if (isBnd[i]) bverts.push(i);
        const nb = bverts.length;
        return function applyP(x) {
          const y = new Float64Array(x.length);
          if (nb === 0) {
            for (let i = 0; i < x.length; i++) y[i] = x[i];
            return y;
          }
          let su = 0, sv = 0;
          for (let k = 0; k < nb; k++) {
            const i = bverts[k];
            su += x[i];
            sv += x[i + n];
          }
          const mu = su / nb, mv = sv / nb;
          for (let i = 0; i < n; i++) {
            if (isBnd[i]) {
              y[i] = x[i] - mu;
              y[i + n] = x[i + n] - mv;
            } else {
              y[i] = x[i];
              y[i + n] = x[i + n];
            }
          }
          return y;
        };
      }

      function spectralConformalParameterizationJs(vertices, faces) {
        const n = vertices.length;
        const bd = _buildBoundaryData(faces, n);
        if (bd.boundaryEdges.length === 0) {
          throw new Error("SCP 需要带边界的网格（与 LSCM 不同，无 pin 但需开放边界）；封闭曲面请先切开。");
        }
        const rowsL = _cotanLaplacianTriplets(vertices, faces);
        const rowsA = _vectorAreaTriplets(bd.boundaryEdges, n);
        const rowsLC = _buildLC(rowsL, rowsA, n);
        const applyP = _makeBoundaryProjector(bd.isBnd, n);
        const dim = 2 * n;
        function applyLC(x, out) {
          for (let i = 0; i < dim; i++) {
            let s = 0;
            const ri = rowsLC[i];
            for (let k = 0; k < ri.length; k++) s += ri[k].v * x[ri[k].j];
            out[i] = s;
          }
        }
        let x = new Float64Array(dim);
        for (let i = 0; i < dim; i++) x[i] = Math.random() - 0.5;
        const powIters = 28;
        for (let it = 0; it < powIters; it++) {
          x = applyP(x);
          const rhs = _copy(x);
          if (dim <= 900) {
            const dense = _sparseRowsToDense(rowsLC);
            x = _denseSolvePivot(dense, rhs);
          } else {
            x = _gmresSolve(applyLC, rhs, 1e-9, Math.min(800, dim * 2), Math.min(80, dim));
          }
          const nx = _norm2(x);
          for (let i = 0; i < dim; i++) x[i] /= nx + 1e-30;
        }
        const uv = new Array(n);
        for (let i = 0; i < n; i++) uv[i] = [x[i], x[i + n]];
        return _normalizeUvBox(uv);
      }

      function _faceAnglesFromPositions(vertices, faces) {
        const nf = faces.length;
        const alpha = new Float64Array(nf * 3);
        for (let fi = 0; fi < nf; fi++) {
          const f = faces[fi];
          const p0 = vertices[f[0]], p1 = vertices[f[1]], p2 = vertices[f[2]];
          const la = edgeLen(p1, p2), lb = edgeLen(p0, p2), lc = edgeLen(p0, p1);
          alpha[fi * 3 + 0] = angleFromSides(lb, lc, la);
          alpha[fi * 3 + 1] = angleFromSides(lc, la, lb);
          alpha[fi * 3 + 2] = angleFromSides(la, lb, lc);
        }
        return alpha;
      }
      function edgeLen(a, b) {
        const dx = a[0] - b[0], dy = a[1] - b[1], dz = a[2] - b[2];
        return Math.sqrt(dx * dx + dy * dy + dz * dz) + 1e-30;
      }
      function angleFromSides(a, b, c) {
        const t = (a * a + b * b - c * c) / (2 * a * b);
        return Math.acos(Math.min(1, Math.max(-1, t)));
      }

      /** 内部顶点的 CCW 一环：每条记录为 { betaIdx, gammaIdx }（全局角下标），对应正弦积中一对对角 */
      function _buildAngleFan(vertices, faces, isBnd) {
        const nv = vertices.length;
        const inc = new Array(nv).fill(0).map(function () { return []; });
        for (let fi = 0; fi < faces.length; fi++) {
          const f = faces[fi];
          for (let s = 0; s < 3; s++) inc[f[s]].push({ fi: fi, s: s });
        }
        const fans = [];
        const interiorVerts = [];
        for (let v = 0; v < nv; v++) {
          if (isBnd[v]) continue;
          interiorVerts.push(v);
          fans[v] = _sortNeighborsCCW(v, inc[v], vertices, faces);
        }
        return { interiorVerts: interiorVerts, fans: fans, inc: inc };
      }

      function _oppositeCornerGlobal(f, va, vb, fi) {
        for (let s = 0; s < 3; s++) {
          if (f[s] !== va && f[s] !== vb) return fi * 3 + s;
        }
        return -1;
      }

      function _otherSharedVertexNonV(v, fi, fj, faces) {
        const a = faces[fi], b = faces[fj];
        for (let ia = 0; ia < 3; ia++) {
          if (a[ia] === v) continue;
          for (let ib = 0; ib < 3; ib++) {
            if (a[ia] === b[ib]) return a[ia];
          }
        }
        return -1;
      }

      function _sortNeighborsCCW(v, list, vertices, faces) {
        const pV = vertices[v];
        let nx = 0, ny = 0, nz = 0;
        for (let k = 0; k < list.length; k++) {
          const t = list[k];
          const f = faces[t.fi];
          const p0 = vertices[f[0]], p1 = vertices[f[1]], p2 = vertices[f[2]];
          const ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2];
          const bx = p2[0] - p0[0], by = p2[1] - p0[1], bz = p2[2] - p0[2];
          nx += ay * bz - az * by; ny += az * bx - ax * bz; nz += ax * by - ay * bx;
        }
        const nn = Math.hypot(nx, ny, nz) + 1e-30;
        nx /= nn; ny /= nn; nz /= nn;
        const dirs = [];
        for (let k = 0; k < list.length; k++) {
          const t = list[k];
          const f = faces[t.fi];
          const s = t.s;
          const u = f[(s + 1) % 3];
          const pu = vertices[u];
          dirs.push({ fi: t.fi, u: u, dx: pu[0] - pV[0], dy: pu[1] - pV[1], dz: pu[2] - pV[2] });
        }
        const r0 = dirs[0];
        let e1x = r0.dx, e1y = r0.dy, e1z = r0.dz;
        let le1 = Math.hypot(e1x, e1y, e1z) + 1e-30;
        e1x /= le1; e1y /= le1; e1z /= le1;
        let e2x = ny * e1z - nz * e1y, e2y = nz * e1x - nx * e1z, e2z = nx * e1y - ny * e1x;
        let le2 = Math.hypot(e2x, e2y, e2z) + 1e-30;
        e2x /= le2; e2y /= le2; e2z /= le2;
        e1x = e2y * nz - e2z * ny;
        e1y = e2z * nx - e2x * nz;
        e1z = e2x * ny - e2y * nx;
        le1 = Math.hypot(e1x, e1y, e1z) + 1e-30;
        e1x /= le1; e1y /= le1; e1z /= le1;
        for (let k = 0; k < dirs.length; k++) {
          const d = dirs[k];
          d.ang = Math.atan2(d.dx * e2x + d.dy * e2y + d.dz * e2z, d.dx * e1x + d.dy * e1y + d.dz * e1z);
        }
        dirs.sort(function (a, b) { return a.ang - b.ang; });
        const d = dirs.length;
        const pairs = [];
        for (let i = 0; i < d; i++) {
          const fPrev = dirs[(i + d - 1) % d].fi;
          const fCur = dirs[i].fi;
          const wi = _otherSharedVertexNonV(v, fPrev, fCur, faces);
          if (wi < 0) continue;
          const betaIdx = _oppositeCornerGlobal(faces[fPrev], v, wi, fPrev);
          const gammaIdx = _oppositeCornerGlobal(faces[fCur], v, wi, fCur);
          pairs.push({ betaIdx: betaIdx, gammaIdx: gammaIdx });
        }
        return pairs;
      }

      function _multJtSparse(Jrows, x, outNAlpha) {
        outNAlpha.fill(0);
        for (let r = 0; r < Jrows.length; r++) {
          const row = Jrows[r];
          const xr = x[r];
          for (let k = 0; k < row.length; k++) {
            const t = row[k];
            outNAlpha[t.j] += t.v * xr;
          }
        }
      }

      function _multJSparse(Jrows, a, outM) {
        for (let r = 0; r < Jrows.length; r++) {
          let s = 0;
          const row = Jrows[r];
          for (let k = 0; k < row.length; k++) {
            const t = row[k];
            s += t.v * a[t.j];
          }
          outM[r] = s;
        }
      }

      function _cgJJt(Jrows, rhs, nAlpha, maxIt, tol) {
        const m = rhs.length;
        const x = new Float64Array(m);
        const r = new Float64Array(m);
        const p = new Float64Array(m);
        const Ap = new Float64Array(m);
        const Jtp = new Float64Array(nAlpha);
        for (let i = 0; i < m; i++) r[i] = rhs[i];
        let rr = _dot(r, r);
        const rhsN = Math.sqrt(rr) + 1e-30;
        for (let i = 0; i < m; i++) p[i] = r[i];
        let iter = 0;
        while (iter < maxIt) {
          _multJtSparse(Jrows, p, Jtp);
          _multJSparse(Jrows, Jtp, Ap);
          const denom = _dot(p, Ap) + 1e-30;
          const alpha = rr / denom;
          for (let i = 0; i < m; i++) x[i] += alpha * p[i];
          for (let i = 0; i < m; i++) r[i] -= alpha * Ap[i];
          const rrNew = _dot(r, r);
          if (Math.sqrt(rrNew) < tol * rhsN) break;
          const beta = rrNew / (rr + 1e-30);
          for (let i = 0; i < m; i++) p[i] = r[i] + beta * p[i];
          rr = rrNew;
          iter++;
        }
        return x;
      }

      function _clampAngle(t) {
        return Math.min(Math.PI - 1e-3, Math.max(1e-3, t));
      }

      function _buildJrowsAndRhsLin(alpha, faces, fanData, nAlpha) {
        const nf = faces.length;
        const interiorVerts = fanData.interiorVerts;
        const fans = fanData.fans;
        const rows = [];
        const rhs = [];
        for (let fi = 0; fi < nf; fi++) {
          rows.push([
            { j: fi * 3 + 0, v: 1 },
            { j: fi * 3 + 1, v: 1 },
            { j: fi * 3 + 2, v: 1 }
          ]);
          rhs.push(Math.PI);
        }
        for (let iv = 0; iv < interiorVerts.length; iv++) {
          const v = interiorVerts[iv];
          const list = fanData.inc[v];
          const row = [];
          for (let k = 0; k < list.length; k++) {
            row.push({ j: list[k].fi * 3 + list[k].s, v: 1 });
          }
          rows.push(row);
          rhs.push(2 * Math.PI);
        }
        for (let iv = 0; iv < interiorVerts.length; iv++) {
          const v = interiorVerts[iv];
          const pairs = fans[v];
          const row = [];
          let linRhs = 0;
          let fLog = 0;
          for (let k = 0; k < pairs.length; k++) {
            const bi = pairs[k].betaIdx, gi = pairs[k].gammaIdx;
            const bet = _clampAngle(alpha[bi]);
            const gam = _clampAngle(alpha[gi]);
            const cb = 1 / Math.tan(bet);
            const cg = 1 / Math.tan(gam);
            row.push({ j: bi, v: cb });
            row.push({ j: gi, v: -cg });
            fLog += Math.log(Math.sin(bet)) - Math.log(Math.sin(gam));
            linRhs += cb * bet - cg * gam;
          }
          rhs.push(linRhs - fLog);
          rows.push(row);
        }
        return { Jrows: rows, rhs: rhs };
      }

      function _solveConstrainedLeastSquares(alpha0, Jrows, c, nAlpha) {
        const m = Jrows.length;
        const Ja0 = new Float64Array(m);
        _multJSparse(Jrows, alpha0, Ja0);
        const rhsLam = new Float64Array(m);
        for (let i = 0; i < m; i++) rhsLam[i] = Ja0[i] - c[i];
        const lam = _cgJJt(Jrows, rhsLam, nAlpha, Math.min(800, m * 3 + 50), 1e-10);
        const JtLam = new Float64Array(nAlpha);
        _multJtSparse(Jrows, lam, JtLam);
        const alpha = new Float64Array(nAlpha);
        for (let i = 0; i < nAlpha; i++) alpha[i] = alpha0[i] - JtLam[i];
        return alpha;
      }

      function _nonlinearResidual(alpha, faces, fanData, nAlpha) {
        const nf = faces.length;
        const interiorVerts = fanData.interiorVerts;
        const fans = fanData.fans;
        const R = [];
        for (let fi = 0; fi < nf; fi++) {
          R.push(alpha[fi * 3] + alpha[fi * 3 + 1] + alpha[fi * 3 + 2] - Math.PI);
        }
        for (let iv = 0; iv < interiorVerts.length; iv++) {
          const v = interiorVerts[iv];
          const list = fanData.inc[v];
          let s = 0;
          for (let k = 0; k < list.length; k++) s += alpha[list[k].fi * 3 + list[k].s];
          R.push(s - 2 * Math.PI);
        }
        for (let iv = 0; iv < interiorVerts.length; iv++) {
          const v = interiorVerts[iv];
          const pairs = fans[v];
          let fLog = 0;
          for (let k = 0; k < pairs.length; k++) {
            const bi = pairs[k].betaIdx, gi = pairs[k].gammaIdx;
            fLog += Math.log(Math.sin(_clampAngle(alpha[bi]))) - Math.log(Math.sin(_clampAngle(alpha[gi])));
          }
          R.push(fLog);
        }
        return R;
      }

      function _buildJNewton(alpha, faces, fanData, nAlpha) {
        const base = _buildJrowsAndRhsLin(alpha, faces, fanData, nAlpha);
        return base.Jrows;
      }

      function _solveNewtonStep(alpha, alpha0, lam, Jrows, Rvec, nAlpha) {
        const m = Jrows.length;
        const ra = new Float64Array(nAlpha);
        for (let i = 0; i < nAlpha; i++) ra[i] = -2 * (alpha[i] - alpha0[i]);
        const JtL = new Float64Array(nAlpha);
        _multJtSparse(Jrows, lam, JtL);
        for (let i = 0; i < nAlpha; i++) ra[i] -= JtL[i];
        const Jra = new Float64Array(m);
        _multJSparse(Jrows, ra, Jra);
        const rhsLam = new Float64Array(m);
        for (let i = 0; i < m; i++) rhsLam[i] = Jra[i] + 2 * Rvec[i];
        const dlam = _cgJJt(Jrows, rhsLam, nAlpha, Math.min(900, m * 3 + 80), 1e-9);
        const Jtd = new Float64Array(nAlpha);
        _multJtSparse(Jrows, dlam, Jtd);
        const dalpha = new Float64Array(nAlpha);
        for (let i = 0; i < nAlpha; i++) dalpha[i] = (ra[i] - Jtd[i]) * 0.5;
        return { dalpha: dalpha, dlam: dlam };
      }

      function _angleFlattenLinABF(vertices, faces, maxIter) {
        const nAlpha = faces.length * 3;
        const bd = _buildBoundaryData(faces, vertices.length);
        if (bd.boundaryEdges.length === 0) {
          throw new Error("ABF 类算法需要带边界网格。");
        }
        const fanData = _buildAngleFan(vertices, faces, bd.isBnd);
        let alpha = _faceAnglesFromPositions(vertices, faces);
        const alpha0 = alpha.slice();
        for (let it = 0; it < maxIter; it++) {
          const built = _buildJrowsAndRhsLin(alpha, faces, fanData, nAlpha);
          const c = new Float64Array(built.rhs.length);
          for (let i = 0; i < built.rhs.length; i++) c[i] = built.rhs[i];
          const alphaNew = _solveConstrainedLeastSquares(alpha0, built.Jrows, c, nAlpha);
          let diff = 0;
          for (let i = 0; i < nAlpha; i++) {
            diff += (alphaNew[i] - alpha[i]) * (alphaNew[i] - alpha[i]);
          }
          alpha = alphaNew;
          if (Math.sqrt(diff) < 1e-5) break;
        }
        for (let i = 0; i < nAlpha; i++) alpha[i] = _clampAngle(alpha[i]);
        return alpha;
      }

      function _angleFlattenABFpp(vertices, faces, maxNewton) {
        const nAlpha = faces.length * 3;
        const bd = _buildBoundaryData(faces, vertices.length);
        if (bd.boundaryEdges.length === 0) throw new Error("ABF 类算法需要带边界网格。");
        const fanData = _buildAngleFan(vertices, faces, bd.isBnd);
        let alpha = _faceAnglesFromPositions(vertices, faces);
        const alpha0 = alpha.slice();
        const m = faces.length + 2 * fanData.interiorVerts.length;
        let lam = new Float64Array(m);
        const Rbuf = [];
        for (let k = 0; k < maxNewton; k++) {
          const Jrows = _buildJNewton(alpha, faces, fanData, nAlpha);
          const Rvec = _nonlinearResidual(alpha, faces, fanData, nAlpha);
          let nr = 0;
          for (let i = 0; i < Rvec.length; i++) nr += Rvec[i] * Rvec[i];
          nr = Math.sqrt(nr);
          if (nr < 1e-4) break;
          const step = _solveNewtonStep(alpha, alpha0, lam, Jrows, Rvec, nAlpha);
          let s = 1;
          for (let trial = 0; trial < 8; trial++) {
            const trialA = new Float64Array(nAlpha);
            for (let i = 0; i < nAlpha; i++) {
              trialA[i] = _clampAngle(alpha[i] + s * step.dalpha[i]);
            }
            const Rt = _nonlinearResidual(trialA, faces, fanData, nAlpha);
            let nrt = 0;
            for (let i = 0; i < Rt.length; i++) nrt += Rt[i] * Rt[i];
            nrt = Math.sqrt(nrt);
            if (nrt < nr * 1.05) {
              alpha = trialA;
              for (let i = 0; i < m; i++) lam[i] += s * step.dlam[i];
              break;
            }
            s *= 0.5;
          }
        }
        return alpha;
      }

      function _twoCircleIntersection(a, ra, b, rb, signSide) {
        const dx = b[0] - a[0], dy = b[1] - a[1];
        const d = Math.hypot(dx, dy) + 1e-30;
        const nx = dx / d, ny = dy / d;
        const t = (ra * ra - rb * rb + d * d) / (2 * d);
        const h2 = ra * ra - t * t;
        const h = Math.sqrt(Math.max(0, h2));
        const px = a[0] + t * nx, py = a[1] + t * ny;
        const ox = -ny * h * signSide, oy = nx * h * signSide;
        return [px + ox, py + oy];
      }

      function _triSignedArea2d(a, b, c) {
        return (b[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (b[1] - a[1]);
      }

      function _triSign3d(p0, p1, p2) {
        const ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2];
        const bx = p2[0] - p0[0], by = p2[1] - p0[1], bz = p2[2] - p0[2];
        const cx = ay * bz - az * by, cy = az * bx - ax * bz, cz = ax * by - ay * bx;
        if (Math.abs(cx) >= Math.abs(cy) && Math.abs(cx) >= Math.abs(cz)) return cx >= 0 ? 1 : -1;
        if (Math.abs(cy) >= Math.abs(cz)) return cy >= 0 ? 1 : -1;
        return cz >= 0 ? 1 : -1;
      }

      function _anglesToUv(vertices, faces, alpha) {
        const nv = vertices.length;
        const uv = new Array(nv);
        for (let i = 0; i < nv; i++) uv[i] = null;
        const f0 = faces[0];
        const p0 = vertices[f0[0]], p1 = vertices[f0[1]], p2 = vertices[f0[2]];
        const l01 = edgeLen(p0, p1), l12 = edgeLen(p1, p2), l20 = edgeLen(p2, p0);
        uv[f0[0]] = [0, 0];
        uv[f0[1]] = [l01, 0];
        const want0 = _triSign3d(p0, p1, p2);
        let sgn = 1;
        uv[f0[2]] = _twoCircleIntersection(uv[f0[0]], l20, uv[f0[1]], l12, sgn);
        if (_triSignedArea2d(uv[f0[0]], uv[f0[1]], uv[f0[2]]) * want0 < 0) {
          sgn = -1;
          uv[f0[2]] = _twoCircleIntersection(uv[f0[0]], l20, uv[f0[1]], l12, sgn);
        }
        const faceDone = new Array(faces.length).fill(false);
        faceDone[0] = true;
        const queue = [0];
        while (queue.length) {
          const fi = queue.shift();
          const f = faces[fi];
          for (let e = 0; e < 3; e++) {
            const v0 = f[e], v1 = f[(e + 1) % 3], v2 = f[(e + 2) % 3];
            if (uv[v0] === null || uv[v1] === null) continue;
            const adj = _findOtherFaceOnEdge(faces, fi, v0, v1);
            if (adj < 0 || faceDone[adj]) continue;
            const g = faces[adj];
            let a = -1, b = -1, c = -1;
            for (let s = 0; s < 3; s++) {
              const i0 = g[s], i1 = g[(s + 1) % 3], i2 = g[(s + 2) % 3];
              if (uv[i0] !== null && uv[i1] !== null && uv[i2] === null) {
                a = i0; b = i1; c = i2;
                break;
              }
            }
            if (c < 0) continue;
            const lac = edgeLen(vertices[a], vertices[c]);
            const lbc = edgeLen(vertices[b], vertices[c]);
            const want = _triSign3d(vertices[g[0]], vertices[g[1]], vertices[g[2]]);
            let cand = _twoCircleIntersection(uv[a], lac, uv[b], lbc, 1);
            if (_triSignedArea2d(uv[a], uv[b], cand) * want < 0) {
              cand = _twoCircleIntersection(uv[a], lac, uv[b], lbc, -1);
            }
            uv[c] = cand;
            faceDone[adj] = true;
            queue.push(adj);
          }
        }
        for (let i = 0; i < nv; i++) {
          if (uv[i] === null) uv[i] = [0, 0];
        }
        return _normalizeUvBox(uv);
      }

      function _findOtherFaceOnEdge(faces, skipFi, v0, v1) {
        for (let fi = 0; fi < faces.length; fi++) {
          if (fi === skipFi) continue;
          const f = faces[fi];
          const h0 = f[0] === v0 || f[1] === v0 || f[2] === v0;
          const h1 = f[0] === v1 || f[1] === v1 || f[2] === v1;
          if (h0 && h1) return fi;
        }
        return -1;
      }

      async function solveSCPAsync(meshData, onProgress) {
        const vertices = meshData.positions, faces = meshData.faces;
        if (onProgress) onProgress(0, 1);
        const t0 = performance.now();
        const uv = spectralConformalParameterizationJs(vertices, faces);
        const timeMs = performance.now() - t0;
        if (onProgress) onProgress(1, 1);
        return {
          uv: uv,
          anchors: chooseAnchorPair(vertices),
          flippedFaceCount: countFlippedFaces(uv, faces),
          timeMs: timeMs,
          method: 'scp'
        };
      }

      async function solveDCPAsync(meshData, onProgress) {
        const vertices = meshData.positions, faces = meshData.faces;
        if (onProgress) onProgress(0, 1);
        const t0 = performance.now();
        const boundaryType = getTutteBoundary();
        const uv = discreteConformalParameterizationJs(vertices, faces, boundaryType);
        const timeMs = performance.now() - t0;
        if (onProgress) onProgress(1, 1);
        return {
          uv: uv,
          anchors: chooseAnchorPair(vertices),
          flippedFaceCount: countFlippedFaces(uv, faces),
          timeMs: timeMs,
          method: 'dcp',
          boundary: boundaryType === 'square' ? '方形边界' : '圆形边界'
        };
      }

      async function solveLinABFAsync(meshData, onProgress) {
        const vertices = meshData.positions, faces = meshData.faces;
        if (onProgress) onProgress(0, 2);
        const t0 = performance.now();
        const alpha = _angleFlattenLinABF(vertices, faces, 40);
        if (onProgress) onProgress(1, 2);
        const uv = _anglesToUv(vertices, faces, alpha);
        if (onProgress) onProgress(2, 2);
        return {
          uv: uv,
          anchors: chooseAnchorPair(vertices),
          flippedFaceCount: countFlippedFaces(uv, faces),
          timeMs: performance.now() - t0,
          method: 'linabf'
        };
      }

      async function solveABFppAsync(meshData, onProgress) {
        const vertices = meshData.positions, faces = meshData.faces;
        if (onProgress) onProgress(0, 2);
        const t0 = performance.now();
        const alpha = _angleFlattenABFpp(vertices, faces, 12);
        if (onProgress) onProgress(1, 2);
        const uv = _anglesToUv(vertices, faces, alpha);
        if (onProgress) onProgress(2, 2);
        return {
          uv: uv,
          anchors: chooseAnchorPair(vertices),
          flippedFaceCount: countFlippedFaces(uv, faces),
          timeMs: performance.now() - t0,
          method: 'abfpp'
        };
      }

      function buildModelGroup(root, anchors, positions, showPins) {
        const group = new THREE.Group();
        const meshMaterial = new THREE.MeshStandardMaterial({
          color: 0x7fa7ff,
          roughness: 0.55,
          metalness: 0.05,
          flatShading: false,
          side: THREE.DoubleSide
        });

        root.traverse(function (child) {
          if (!child.isMesh || !child.geometry) return;
          const geom = child.geometry;
          const mesh = new THREE.Mesh(geom, meshMaterial);
          mesh.matrixAutoUpdate = false;
          mesh.matrix.copy(child.matrixWorld);
          group.add(mesh);

          // 四边形网格：用四边形边界渲染，不显示三角形对角线
          if (isQuadMesh && currentRawFaces && currentRawFaces.length > 0) {
            const posArr = geom.attributes.position;
            const lineSegs = [];
            const added = new Set();
            function addEdge(a, b) {
              const key = a < b ? a + '_' + b : b + '_' + a;
              if (added.has(key)) return;
              added.add(key);
              lineSegs.push(posArr.getX(a), posArr.getY(a), posArr.getZ(a),
                           posArr.getX(b), posArr.getY(b), posArr.getZ(b));
            }
            for (let i = 0; i < currentRawFaces.length; i++) {
              const f = currentRawFaces[i];
              // 画多边形的外部环（不画对角线）
              for (let k = 0; k < f.length; k++) {
                addEdge(f[k], f[(k + 1) % f.length]);
              }
            }
            const lineGeom = new THREE.BufferGeometry();
            lineGeom.setAttribute('position', new THREE.Float32BufferAttribute(lineSegs, 3));
            const wire = new THREE.LineSegments(lineGeom,
              new THREE.LineBasicMaterial({ color: 0x1f2f55, transparent: true, opacity: 0.65 }));
            wire.matrixAutoUpdate = false;
            wire.matrix.copy(child.matrixWorld);
            group.add(wire);
          } else {
            // 三角网格：用三角线框
            const wire = new THREE.LineSegments(
              new THREE.WireframeGeometry(geom),
              new THREE.LineBasicMaterial({ color: 0x1f2f55, transparent: true, opacity: 0.65 })
            );
            wire.matrixAutoUpdate = false;
            wire.matrix.copy(child.matrixWorld);
            group.add(wire);
          }
        });

        let points = null;
        if (showPins) {
          const pinPositions = [];
          for (let i = 0; i < anchors.length; i++) {
            const p = positions[anchors[i]];
            pinPositions.push(p[0], p[1], p[2]);
          }

          points = new THREE.Points(
            new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(pinPositions, 3)),
            new THREE.PointsMaterial({ color: 0xffb74d, size: 0.05, sizeAttenuation: true })
          );
          group.add(points);
        }

        return { group: group, pinPoints: points };
      }

      /**
       * 更新 3D 模型视图中的 pin 点，不重建整个模型组
       * @param {number[]} anchors 新的 pin 点顶点索引
       */
      function updateModelPinPoints(anchors) {
        if (!currentModelGroup || !currentMeshData) return;

        // 移除旧的 pin 点
        if (currentPins && currentPins.parent) {
          currentPins.parent.remove(currentPins);
        }
        currentPins = null;

        if (!shouldShowPinPoints()) return;

        const positions = currentMeshData.positions;
        const pinPositions = [];
        for (let i = 0; i < anchors.length; i++) {
          const p = positions[anchors[i]];
          pinPositions.push(p[0], p[1], p[2]);
        }

        const points = new THREE.Points(
          new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(pinPositions, 3)),
          new THREE.PointsMaterial({ color: 0xffb74d, size: 0.05, sizeAttenuation: true })
        );
        currentModelGroup.add(points);
        currentPins = points;
      }

      /**
       * "改pin点"按钮点击处理：选择不同于当前 pin 点的另一对最远顶点
       */
      function onChangePinClick() {
        if (!shouldShowPinPoints()) return;
        if (!currentMeshData || !currentMeshData.positions || currentMeshData.positions.length < 2) return;

        const vertices = currentMeshData.positions;
        const currentAnchors = currentCustomAnchors || chooseAnchorPair(vertices);
        const newAnchors = chooseAlternativeAnchorPair(vertices, currentAnchors);
        const bdCheckbox = document.getElementById('bd-chk-lscm');
        const disabledBD = !!(bdCheckbox && bdCheckbox.checked);
        if (disabledBD) bdCheckbox.checked = false;

        currentCustomAnchors = newAnchors;
        updateModelPinPoints(newAnchors);

        const srcLabel = getCurrentSourceLabel();
        setStatus(
          "已更换 pin 点: " + newAnchors[0] + " & " + newAnchors[1] +
          "（原: " + currentAnchors[0] + " & " + currentAnchors[1] + "），点击展开!" +
          (disabledBD ? "（已关闭 BD，以使用新的 pin 约束）" : "") +
          " / " + srcLabel,
          "#89f0b6"
        );
      }

      function buildUvMesh(uv, faces, anchors, showPins) {
        const edgeSet = new Set();
        const segments = [];

        function toPlane(p) {
          return [(p[0] - 0.5) * 1.8, (p[1] - 0.5) * 1.8, 0];
        }

        function addEdge(a, b) {
          const key = a < b ? a + "_" + b : b + "_" + a;
          if (edgeSet.has(key)) {
            return;
          }
          edgeSet.add(key);
          const pa = toPlane(uv[a]);
          const pb = toPlane(uv[b]);
          segments.push(pa[0], pa[1], pa[2], pb[0], pb[1], pb[2]);
        }

        // 四边形网格用四边形边界，三角网格用三角边界
        if (isQuadMesh && currentRawFaces && currentRawFaces.length > 0) {
          for (let i = 0; i < currentRawFaces.length; i++) {
            const f = currentRawFaces[i];
            for (let k = 0; k < f.length; k++) {
              addEdge(f[k], f[(k + 1) % f.length]);
            }
          }
        } else {
          for (let i = 0; i < faces.length; i++) {
            addEdge(faces[i][0], faces[i][1]);
            addEdge(faces[i][1], faces[i][2]);
            addEdge(faces[i][2], faces[i][0]);
          }
        }

        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute("position", new THREE.Float32BufferAttribute(segments, 3));
        const lines = new THREE.LineSegments(
          lineGeom,
          new THREE.LineBasicMaterial({ color: 0x86b2ff, transparent: true, opacity: 0.95 })
        );

        let pins = null;
        if (showPins) {
          const pinPositions = [];
          for (let i = 0; i < anchors.length; i++) {
            const p = toPlane(uv[anchors[i]]);
            pinPositions.push(p[0], p[1], 0.01);
          }
          pins = new THREE.Points(
            new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(pinPositions, 3)),
            new THREE.PointsMaterial({ color: 0xffa94d, size: 8, sizeAttenuation: false })
          );
        }

        return { lines: lines, pins: pins };
      }


      function createCheckerTexture() {
        const texSize = 512;
        const cells = 16;
        const cellSize = texSize / cells;
        const canvas = document.createElement("canvas");
        canvas.width = texSize;
        canvas.height = texSize;
        const ctx = canvas.getContext("2d");

        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            const dark = ((x + y) & 1) === 0;
            ctx.fillStyle = dark ? "#1f2f54" : "#e9f0ff";
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }

        ctx.strokeStyle = "rgba(120,150,210,0.4)";
        for (let i = 0; i <= cells; i++) {
          const p = i * cellSize;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, texSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(texSize, p);
          ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 1);
        texture.needsUpdate = true;
        return texture;
      }

      function createDotTexture() {
        const texSize = 512;
        const cells = 16;
        const cellSize = texSize / cells;
        const canvas = document.createElement("canvas");
        canvas.width = texSize;
        canvas.height = texSize;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#f4f8ff";
        ctx.fillRect(0, 0, texSize, texSize);

        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            const cx = (x + 0.5) * cellSize;
            const cy = (y + 0.5) * cellSize;
            const radius = cellSize * 0.27;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#3f7cff";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(17,39,84,0.45)";
            ctx.stroke();
          }
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 1);
        texture.needsUpdate = true;
        return texture;
      }

      function getUvTexture(textureMode) {
        if (textureMode === "dots") {
          if (!dotTexture) {
            dotTexture = createDotTexture();
          }
          return dotTexture;
        }
        if (!checkerTexture) {
          checkerTexture = createCheckerTexture();
        }
        return checkerTexture;
      }

      function buildTexturedMesh(meshData, uv, textureMode) {
        const positions = [];
        for (let i = 0; i < meshData.positions.length; i++) {
          positions.push(meshData.positions[i][0], meshData.positions[i][1], meshData.positions[i][2]);
        }
        const indices = [];
        for (let i = 0; i < meshData.faces.length; i++) {
          indices.push(meshData.faces[i][0], meshData.faces[i][1], meshData.faces[i][2]);
        }
        const uvFlat = [];
        for (let i = 0; i < uv.length; i++) {
          uvFlat.push(uv[i][0], uv[i][1]);
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute("uv", new THREE.Float32BufferAttribute(uvFlat, 2));
        geom.setIndex(indices);
        geom.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({
          map: getUvTexture(textureMode),
          metalness: 0.05,
          roughness: 0.75,
          side: THREE.DoubleSide
        });

        return new THREE.Mesh(geom, material);
      }

      function clearTexturedMesh() {
        if (currentTexturedMesh && currentTexturedMesh.parent) {
          currentTexturedMesh.parent.remove(currentTexturedMesh);
        }
        currentTexturedMesh = null;
      }

      /**
       * 切换模型组的实心面显隐，线框始终可见
       */
      function setModelSolidVisible(visible) {
        if (!currentModelGroup) return;
        currentModelGroup.children.forEach(function(child) {
          if (child.isMesh) child.visible = visible;
        });
      }

      function setTextureDistortionEnabled(enabled, textureMode) {
        if (enabled && (!currentMeshData || !currentUnwrapUv)) {
          setStatus('请先点击"展开!"生成 UV，再开启纹理扭曲', '#ffd38a');
          if (radioCheckerboard) radioCheckerboard.checked = false;
          if (radioDots) radioDots.checked = false;
          return;
        }

        textureEnabled = enabled;
        if (textureEnabled) {
          currentTextureMode = textureMode || currentTextureMode || "checkerboard";
          clearTexturedMesh();
          currentTexturedMesh = buildTexturedMesh(currentMeshData, currentUnwrapUv, currentTextureMode);
          modelScene.add(currentTexturedMesh);
          setModelSolidVisible(false);
          if (currentDistortionMesh) currentDistortionMesh.visible = false;
          setStatus("已开启纹理扭曲（" + (currentTextureMode === "dots" ? "圆点贴图" : "棋盘格贴图") + "）", "#89f0b6");
        } else {
          clearTexturedMesh();
          setModelSolidVisible(true);
          setStatus("已关闭纹理扭曲", "#8cc4ff");
        }
      }

      function clearDistortionMesh() {
        if (currentDistortionMesh && currentDistortionMesh.parent) {
          currentDistortionMesh.parent.remove(currentDistortionMesh);
        }
        currentDistortionMesh = null;
      }

      let currentUvDistortionMesh = null;  // UV 面板上的扭曲显示 mesh

      function clearUvDistortionMesh() {
        if (currentUvDistortionMesh && currentUvDistortionMesh.parent) {
          currentUvDistortionMesh.parent.remove(currentUvDistortionMesh);
        }
        currentUvDistortionMesh = null;
      }

      async function setDistortionEnabled(enabled) {
        if (!enabled) {
          distortionEnabled = false;
          clearDistortionMesh();
          clearUvDistortionMesh();
          setModelSolidVisible(true);
          if (currentTexturedMesh && textureEnabled) currentTexturedMesh.visible = true;
          return;
        }

        if (!currentMeshData || !currentUnwrapUv) {
          setStatus('请先点击"展开!"生成 UV', '#ffd38a');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true, "checkerboard"); }
          return;
        }

        if (!wasmReady && !wasmLoadFailed) {
          setStatus('正在加载 QC 引擎...', '#ffd38a');
          await initUnifiedSolver();
        }
        if (!wasmReady) {
          setStatus('QC 引擎加载失败', '#ff9d9d');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true, "checkerboard"); }
          return;
        }

        setStatus('共形扭曲计算中...', '#ffd38a');

        try {
          // 1. load mesh + UV into WASM
          const flatPos = new Float64Array(currentMeshData.positions.length * 3);
          for (let i = 0; i < currentMeshData.positions.length; i++) {
            flatPos[i*3]=currentMeshData.positions[i][0]; flatPos[i*3+1]=currentMeshData.positions[i][1]; flatPos[i*3+2]=currentMeshData.positions[i][2];
          }
          const flatFaces = new Int32Array(currentMeshData.faces.length * 3);
          for (let i = 0; i < currentMeshData.faces.length; i++) {
            flatFaces[i*3]=currentMeshData.faces[i][0]; flatFaces[i*3+1]=currentMeshData.faces[i][1]; flatFaces[i*3+2]=currentMeshData.faces[i][2];
          }
          const flatUV = new Float64Array(currentUnwrapUv.length * 2);
          for (let i = 0; i < currentUnwrapUv.length; i++) {
            flatUV[i*2]=currentUnwrapUv[i][0]; flatUV[i*2+1]=currentUnwrapUv[i][1];
          }

          const posPtr = wasmInstance._malloc(flatPos.length * 8);
          for (let i = 0; i < flatPos.length; i++) wasmInstance.setValue(posPtr+i*8, flatPos[i], 'double');
          const facePtr = wasmInstance._malloc(flatFaces.length * 4);
          for (let i = 0; i < flatFaces.length; i++) wasmInstance.setValue(facePtr+i*4, flatFaces[i], 'i32');
          const uvPtr = wasmInstance._malloc(flatUV.length * 8);
          for (let i = 0; i < flatUV.length; i++) wasmInstance.setValue(uvPtr+i*8, flatUV[i], 'double');

          // 2. load + compute QC
          const loadRet = wasmInstance.ccall('load_mesh_with_uv', 'number',
            ['number','number','number','number','number','number'],
            [posPtr, flatPos.length, facePtr, flatFaces.length, uvPtr, flatUV.length]);
          if (loadRet !== 0) throw new Error("load_mesh_with_uv failed");

          const nFaces = wasmInstance.ccall('compute_qc_error', 'number', [], []);
          if (nFaces <= 0) throw new Error("compute_qc_error returned " + nFaces);

          // 3. read errors & colors
          const errSize = wasmInstance.ccall('get_qc_errors_size', 'number', [], []);
          const errPtr  = wasmInstance.ccall('get_qc_errors', 'number', [], []);
          const colSize = wasmInstance.ccall('get_qc_colors_size', 'number', [], []);
          const colPtr  = wasmInstance.ccall('get_qc_colors', 'number', [], []);

          const errors = []; for (let i=0;i<errSize;i++) errors.push(wasmInstance.getValue(errPtr+i*8,'double'));
          const colors = []; for (let i=0;i<colSize;i++) colors.push(wasmInstance.getValue(colPtr+i*8,'double'));

          wasmInstance.ccall('ta_dispose', 'void', [], []);

          // 4. free memory
          wasmInstance._free(posPtr); wasmInstance._free(facePtr); wasmInstance._free(uvPtr);

          // 5. compute stats
          let avgErr = 0, maxErr = 0;
          for (let i=0;i<errors.length;i++) { avgErr += errors[i]; if (errors[i]>maxErr) maxErr=errors[i]; }
          avgErr /= errors.length;

          // 6. build colored mesh for 3D model (per-vertex colors averaged from adjacent faces)
          const nV = currentMeshData.positions.length;
          const vCol = new Float32Array(nV * 3);
          const vCount = new Float32Array(nV);
          let fi = 0;
          for (let i = 0; i < currentMeshData.faces.length; i++) {
            const f = currentMeshData.faces[i];
            const r = colors[fi*3] || 0.5, g = colors[fi*3+1] || 0.5, b = colors[fi*3+2] || 0.5;
            fi++;
            for (let k = 0; k < 3; k++) {
              const vidx = f[k];
              vCol[vidx*3] += r; vCol[vidx*3+1] += g; vCol[vidx*3+2] += b;
              vCount[vidx] += 1;
            }
          }
          for (let i=0;i<nV;i++) {
            if (vCount[i] > 0) { vCol[i*3]/=vCount[i]; vCol[i*3+1]/=vCount[i]; vCol[i*3+2]/=vCount[i]; }
            else { vCol[i*3]=0.5; vCol[i*3+1]=0.5; vCol[i*3+2]=0.5; }
          }

          const positions = [];
          for (let i=0;i<currentMeshData.positions.length;i++) positions.push(currentMeshData.positions[i][0],currentMeshData.positions[i][1],currentMeshData.positions[i][2]);
          const indices = [];
          for (let i=0;i<currentMeshData.faces.length;i++) indices.push(currentMeshData.faces[i][0],currentMeshData.faces[i][1],currentMeshData.faces[i][2]);

          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geom.setAttribute('color', new THREE.Float32BufferAttribute(vCol, 3));
          geom.setIndex(indices);
          geom.computeVertexNormals();

          const mat = new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: false, specular: 0x111111, shininess: 10 });
          clearDistortionMesh();
          currentDistortionMesh = new THREE.Mesh(geom, mat);
          modelScene.add(currentDistortionMesh);

          // 7. build colored mesh for UV panel (flat 2D mesh with same distortion colors)
          const uvPositions = [];
          for (let i = 0; i < currentUnwrapUv.length; i++) {
            uvPositions.push(currentUnwrapUv[i][0], currentUnwrapUv[i][1], 0);
          }
          const uvGeom = new THREE.BufferGeometry();
          uvGeom.setAttribute('position', new THREE.Float32BufferAttribute(uvPositions, 3));
          // share same color array (per-vertex colors already computed above)
          uvGeom.setAttribute('color', new THREE.Float32BufferAttribute(vCol, 3));
          uvGeom.setIndex(indices.slice());  // copy indices
          uvGeom.computeVertexNormals();

          const uvMat = new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: false, specular: 0x111111, shininess: 10 });
          clearUvDistortionMesh();
          currentUvDistortionMesh = new THREE.Mesh(uvGeom, uvMat);
          uvScene.add(currentUvDistortionMesh);

          // hide normal model and checkerboard
          setModelSolidVisible(false);
          if (currentTexturedMesh) currentTexturedMesh.visible = false;

          distortionEnabled = true;
          setStatus('共形扭曲: avg=' + avgErr.toFixed(4) + '  max=' + maxErr.toFixed(4) + '  (绿=1.0无扭曲, 红>1.5)', '#89f0b6');
        } catch (err) {
          console.error('QC error:', err);
          setStatus('扭曲计算失败: ' + err.message, '#ff9d9d');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true, "checkerboard"); }
        }
      }

      function rebuildUvGrid() {
        const grid = new THREE.Group();
        const gridMaterial = new THREE.LineBasicMaterial({ color: 0x1a2947, transparent: true, opacity: 0.85 });
        const coords = [];
        for (let i = -10; i <= 10; i++) {
          const t = i / 10;
          coords.push(-1, t, 0, 1, t, 0);
          coords.push(t, -1, 0, t, 1, 0);
        }
        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(coords, 3));
        grid.add(new THREE.LineSegments(geom, gridMaterial));
        uvScene.add(grid);
      }

      function clearGroup(scene, objectRef) {
        if (objectRef && objectRef.parent) {
          objectRef.parent.remove(objectRef);
        }
      }

      async function resolveSourceObject() {
        return loadBuiltinModel(getCurrentModelKey());
      }

      function getCurrentSourceLabel() {
        const m = getCurrentModelObj();
        return m ? m.label : "未知模型";
      }

      /**
       * 清除当前展开结果并重新加载模型
       */
      async function clearAndReload() {
        if (busy) return;
        // 隐藏耗时信息
        hideTiming();
        // 重新加载模型（内部已完成 UV/纹理/扭曲的清理和 pin 点重置）
        await loadModelPreview();
      }

      async function loadModelPreview() {
        if (busy) {
          return;
        }

        setBusy(true);
        setStatus("正在加载 OBJ 模型: " + getCurrentSourceLabel() + " ...");

        try {
          const resolved = await resolveSourceObject();
          const root = resolved.root;
          normalizeObject(root);

          clearGroup(modelScene, currentModelGroup);
          clearGroup(uvScene, currentUvLines);
          clearGroup(uvScene, currentUvPins);
          clearTexturedMesh();
          clearDistortionMesh();
          distortionEnabled = false;
          currentUvLines = null;
          currentUvPins = null;
          currentUnwrapUv = null;
          textureEnabled = false;
          // 重置纹理显示单选框为未选中
          if (radioCheckerboard) radioCheckerboard.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioDistortion) radioDistortion.checked = false;

          setStatus("正在提取三角网格...");
          let meshData = collectMeshData(root);
          const repair = repairMeshForSolver(meshData);
          meshData = repair.meshData;
          currentCustomAnchors = null;  // 加载新模型时重置自定义 pin 点
          const anchors = chooseAnchorPair(meshData.positions);

          const modelVisual = buildModelGroup(root, anchors, meshData.positions, shouldShowPinPoints());
          currentModelGroup = modelVisual.group;
          currentPins = modelVisual.pinPoints;
          currentModelGroup.visible = true;
          modelScene.add(currentModelGroup);
          controls.target.set(0, 0, 0);
          controls.update();

          currentMeshData = meshData;
          currentSourcePath = resolved.sourcePath;
          currentRawFaces = resolved.rawFaces;  // 原始 OBJ 面数据（含四边形）

          // 检测是否为四边形网格（原始面至少有 3/4 是四边面）
          if (currentRawFaces && currentRawFaces.length > 0) {
            let quadCount = 0;
            for (let i = 0; i < currentRawFaces.length; i++) {
              if (currentRawFaces[i].length === 4) quadCount++;
            }
            isQuadMesh = (quadCount >= currentRawFaces.length * 0.75);
          } else {
            isQuadMesh = false;
          }

          const faceType = isQuadMesh ? "四边面" : "三角形";

          const faceCount = currentRawFaces ? currentRawFaces.length : meshData.faces.length;
          const repairNote = (repair.edgeSplits > 0 || repair.vertexSplits > 0)
            ? " / 已修复非流形结构"
            : "";
          setStatus(
            "3D 预览: " + getCurrentSourceLabel() + " / " + meshData.positions.length + " 顶点 / " +
            faceCount + " " + faceType + repairNote + "，点击「开始展开」执行 UV",
            "#89f0b6"
          );
        } catch (error) {
          console.error(error);
          setStatus("模型加载失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      async function updateModel() {
        if (busy) return;

        if (!currentMeshData) {
          await loadModelPreview();
          if (!currentMeshData) return;
        }

        const method = getCurrentMethod();
        const bd = isBDEnabled();
        const C = getBDCParam();

        // 构建方法标签
        let methodLabel;
        if (bd) methodLabel = 'BD-LSCM (C=' + C.toFixed(1) + ')';
        else if (method === 'lscm') methodLabel = 'LSCM';
        else if (method === 'tutte') {
          methodLabel = 'Tutte (' + getTutteWeightLabel() + ', ' + (getTutteBoundary() === 'circle' ? '圆' : '方') + ')';
        }
        else if (method === 'dcp') methodLabel = 'DCP (' + (getTutteBoundary() === 'circle' ? '圆' : '方') + ')';
        else if (method === 'arap') methodLabel = 'ARAP (iter=' + getARAPIter() + ')';
        else if (method === 'cetm') methodLabel = 'CETM (共形因子)';
        else if (method === 'ricci') methodLabel = 'Ricci 流';
        else if (method === 'cp') methodLabel = 'Circle Pattern';
        else if (method === 'quadcover') methodLabel = 'QuadCover';
        else if (method === 'bff') methodLabel = 'BFF';
        else if (method === 'miq') methodLabel = 'MIQ';
        else if (method === 'holo') methodLabel = '全纯1-形式';
        else if (method === 'scp') methodLabel = 'SCP (谱共形)';
        else if (method === 'abfpp') methodLabel = 'ABF++';
        else if (method === 'linabf') methodLabel = 'linABF';
        else methodLabel = 'LSCM';

        setBusy(true);
        setStatus("正在执行 " + methodLabel + " 求解...");
        hideTiming();

        try {
          const startTime = performance.now();

          let unwrapResult;
          if (bd) {
            // LSCM+BD 或 ARAP+BD → 统一使用 BD-LSCM 求解器
            unwrapResult = await solveBDLSCMAsync(currentMeshData, function(progress, total) {
              updateTimingProgress(progress, total);
            });
          } else if (method === 'lscm') {
            unwrapResult = await solveLSCMAsync(currentMeshData, function(progress, total) {
              updateTimingProgress(progress, total);
            });
          } else if (method === 'tutte') {
            unwrapResult = (getTutteBoundary() === 'circle')
              ? await solveTutteCircleAsync(currentMeshData, function() {})
              : await solveTutteSquareAsync(currentMeshData, function() {});
          } else if (method === 'dcp') {
            unwrapResult = await solveDCPAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'arap') {
            unwrapResult = await solveARAPAsync(currentMeshData, function() {});
          } else if (method === 'cetm') {
            unwrapResult = await solveCETMAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'ricci') {
            unwrapResult = await solveRicciAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'cp') {
            unwrapResult = await solveCPAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'quadcover') {
            unwrapResult = await solveQCAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'bff') {
            unwrapResult = await solveBFFAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'miq') {
            unwrapResult = await solveMIQAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'holo') {
            await initUnifiedSolver();
            const fv = currentMeshData.positions, ff = currentMeshData.faces;
            const fp = new Float64Array(fv.length*3);
            for(let i=0;i<fv.length;i++){fp[i*3]=fv[i][0];fp[i*3+1]=fv[i][1];fp[i*3+2]=fv[i][2];}
            const ffi = new Int32Array(ff.length*3);
            for(let i=0;i<ff.length;i++){ffi[i*3]=ff[i][0];ffi[i*3+1]=ff[i][1];ffi[i*3+2]=ff[i][2];}
            const pp = wasmInstance._malloc(fp.length*8);
            for(let i=0;i<fp.length;i++)wasmInstance.setValue(pp+i*8,fp[i],'double');
            const fpt = wasmInstance._malloc(ffi.length*4);
            for(let i=0;i<ffi.length;i++)wasmInstance.setValue(fpt+i*4,ffi[i],'i32');
            const rc = wasmInstance.ccall('solve_holo','number',['number','number','number','number'],[pp,fp.length,fpt,ffi.length]);
            if(rc!==0)throw new Error("Holo solve failed");
            const sz = wasmInstance.ccall('get_holo_uv_result_size','number',[],[]);
            const up = wasmInstance.ccall('get_holo_uv_result','number',[],[]);
            const us=[];for(let i=0;i<sz;i++)us.push(wasmInstance.getValue(up+i*8,'double'));
            wasmInstance.ccall('holo_dispose','void',[],[]);
            wasmInstance._free(pp);wasmInstance._free(fpt);
            const nv = fv.length, uvs = new Array(nv);
            for(let i=0;i<nv;i++)uvs[i]=[us[i*2],us[i*2+1]];
            unwrapResult = {uv:uvs, anchors:chooseAnchorPair(fv), flippedFaceCount:countFlippedFaces(uvs,ff),
              timeMs:wasmInstance.ccall('get_holo_last_time_ms','number',[],[]), method:'holo'};
          } else if (method === 'scp') {
            unwrapResult = await solveSCPAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'linabf') {
            unwrapResult = await solveLinABFAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'abfpp') {
            unwrapResult = await solveABFppAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else {
            unwrapResult = await solveLSCMAsync(currentMeshData, function(progress, total) {
              updateTimingProgress(progress, total);
            });
          }

          const elapsedMs = unwrapResult.timeMs > 0 ? unwrapResult.timeMs : (performance.now() - startTime);
          currentUnwrapUv = unwrapResult.uv;

          // 清除旧的扭曲显示（UV 变了）
          clearDistortionMesh();
          distortionEnabled = false;
          // 展开完成后启用纹理显示单选框，默认选中"棋盘格"
          if (radioCheckerboard && radioDots && radioDistortion) {
            radioCheckerboard.disabled = false;
            radioDots.disabled = false;
            radioDistortion.disabled = false;
            radioCheckerboard.checked = true;
            radioDots.checked = false;
            radioDistortion.checked = false;
            setTextureDistortionEnabled(true, "checkerboard");
          }

          // 更新 UV 面板标签
          const methodNames = { lscm:'LSCM', lscm_fallback:'LSCM(ARAP兜底)', tutte:'Tutte', dcp:'DCP', arap:'ARAP', cetm:'CETM', ricci:'Ricci', cp:'CirclePat', quadcover:'QuadCover', bff:'BFF', miq:'MIQ', holo:'Holo', scp:'SCP', abfpp:'ABF++', linabf:'linABF' };
          document.getElementById('uv-panel-label').textContent =
            (methodNames[unwrapResult.method] || unwrapResult.method) + ' UV 网格';

          clearGroup(uvScene, currentUvLines);
          clearGroup(uvScene, currentUvPins);
          const uvVisual = buildUvMesh(unwrapResult.uv, currentMeshData.faces, unwrapResult.anchors, shouldShowPinPoints());
          currentUvLines = uvVisual.lines;
          currentUvPins = uvVisual.pins;
          uvScene.add(currentUvLines);
          if (currentUvPins) uvScene.add(currentUvPins);

          let details =
            methodLabel +
            " / " + getCurrentSourceLabel() +
            " / " + currentMeshData.positions.length + " 顶点" +
            " / " + currentMeshData.faces.length + " 三角形";
          if (unwrapResult.C) details += " / C=" + unwrapResult.C.toFixed(1);
          if (unwrapResult.maxIter) details += " / 迭代=" + unwrapResult.maxIter;
          if (unwrapResult.optScheme) details += " / " + unwrapResult.optScheme;
          if (unwrapResult.pinInfo) details += " / pin=" + unwrapResult.pinInfo;
          if (unwrapResult.boundary) details += " / " + unwrapResult.boundary;
          if (unwrapResult.weight) details += " / " + unwrapResult.weight;
          if (unwrapResult.fallbackCause) details += " / ARAP兜底";
          showTiming(elapsedMs, details, unwrapResult.flippedFaceCount);

          const color = unwrapResult.flippedFaceCount === 0 ? "#89f0b6" : "#ffd38a";
          setStatus(
            methodLabel + (unwrapResult.fallbackCause ? " 使用 ARAP 兜底完成，翻转面 " : " 展开完成，翻转面 ") + unwrapResult.flippedFaceCount + " 个",
            color
          );
        } catch (error) {
          console.error('展开失败:', error.message, error.stack);
          hideTiming();
          setStatus("展开失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        modelRenderer.render(modelScene, modelCamera);
        uvRenderer.render(uvScene, uvCamera);
      }

      rebuildUvGrid();
      initModelOptions();
      resize();
      setStatus("正在加载默认模型 3D 预览...", "#8cc4ff");
      window.addEventListener("resize", resize);
      modelSelect.addEventListener("change", loadModelPreview);
      reloadBtn.addEventListener("click", updateModel);
      clearBtn.addEventListener("click", clearAndReload);

      // 纹理显示单选框切换
      if (radioCheckerboard) {
        radioCheckerboard.addEventListener("change", function () {
          if (this.checked) {
            setTextureDistortionEnabled(true, "checkerboard");
            if (radioDots) radioDots.checked = false;
            if (radioDistortion) radioDistortion.checked = false;
          }
        });
      }
      if (radioDots) {
        radioDots.addEventListener("change", function () {
          if (this.checked) {
            setTextureDistortionEnabled(true, "dots");
            if (radioDistortion) radioDistortion.checked = false;
            if (radioCheckerboard) radioCheckerboard.checked = false;
          }
        });
      }
      if (radioDistortion) {
        radioDistortion.addEventListener("change", async function () {
          if (this.checked) {
            setTextureDistortionEnabled(false);
            await setDistortionEnabled(true);
          }
        });
      }
      
      // 页面启动时预加载 WASM 统一求解器
      updateStartButtonState();
      initUnifiedSolver().then((ok) => {
        updateStartButtonState();
        if (!ok) {
          setStatus("WASM 引擎加载失败", "#ff9d9d");
        }
      });
      
      // 启动加载第一个模型
      (function(){ loadModelPreview(); })();
      animate();
    })();
  </script>
</body>
</html>
