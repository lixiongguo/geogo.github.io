<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV展开 - QuadCover / LSCM / Tutte / ARAP / CETM / Ricci / CP</title>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>
  
  <!-- WASM LSCM Solver (Eigen 稀疏 Cholesky) -->
  <script src="assets/wasm/lscm_solver.js"></script>
  <!-- WASM BD-LSCM Solver (Bounded Distortion + LSCM) -->
  <script src="assets/wasm/bd_lscm_solver.js"></script>
  <!-- WASM Tutte + ARAP Solver -->
  <script src="assets/wasm/tutte_arap_solver.js"></script>
  <!-- WASM CETM Solver (共形因子方法) -->
  <script src="assets/wasm/cetm_solver.js"></script>
  <!-- WASM RicciFlow Solver (离散Ricci流) -->
  <script src="assets/wasm/ricci_solver.js"></script>
  <!-- WASM CirclePatterns Solver (圆填充) -->
  <script src="assets/wasm/cp_solver.js"></script>
  <!-- WASM QuadCover Solver -->
  <script src="assets/wasm/quadcover_solver.js"></script>
  <!-- WASM BFF Solver -->
  <script src="assets/wasm/bff_solver.js"></script>
  <!-- WASM MIQ Solver -->
  <script src="assets/wasm/miq_solver.js"></script>
  <!-- WASM Holomorphic 1-Form Solver -->
  <script src="assets/wasm/holo_solver.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      background: #070b14;
      color: #d8def7;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .timing-display {
      display: none;
      padding: 10px 18px;
      background: linear-gradient(90deg, rgba(16, 30, 61, 0.95), rgba(26, 46, 91, 0.95));
      border-bottom: 2px solid rgba(106, 132, 255, 0.35);
      text-align: center;
    }
    .timing-display.visible {
      display: block;
    }
    .timing-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .timing-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .timing-sep {
      width: 1px;
      height: 40px;
      background: rgba(106, 132, 255, 0.25);
    }
    .timing-display .timing-label {
      font-size: 11px;
      color: #8a9dd4;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    .timing-display .timing-value {
      font-size: 28px;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 16px rgba(255, 215, 0, 0.45), 0 0 32px rgba(255, 215, 0, 0.2);
      font-family: "SF Mono", "Consolas", monospace;
    }
    .timing-display .timing-unit {
      font-size: 14px;
      font-weight: 400;
      color: #c9a227;
      margin-left: 3px;
    }
    .timing-display .timing-details {
      font-size: 11px;
      color: #6a7db5;
      margin-top: 6px;
    }
    /* 翻转面数警示样式 */
    #flip-value {
      color: #52d681;
      text-shadow: 0 0 16px rgba(82, 214, 129, 0.4), 0 0 32px rgba(82, 214, 129, 0.2);
    }
    #flip-value.has-flip {
      color: #ff5252;
      text-shadow: 0 0 18px rgba(255, 82, 82, 0.55), 0 0 36px rgba(255, 82, 82, 0.3);
      animation: flipPulse 1.2s ease-in-out infinite;
    }
    @keyframes flipPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(9, 15, 28, 0.96);
      border-bottom: 1px solid rgba(106, 132, 255, 0.18);
    }
    .toolbar-left {
         }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="radio"] { accent-color: #6a84ff; }
    select, button {
      border: 1px solid rgba(106, 132, 255, 0.25);
      background: #121b31;
      color: #eef2ff;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #172546;
    }
    .hidden-input {
      display: none;
    }
    .status {
      min-width: 240px;
      color: #8cc4ff;
      font-size: 13px;
      text-align: right;
    }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: #11192b;
      min-height: 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #0b1220;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(106, 132, 255, 0.16);
      color: #c6d1f4;
      font-size: 14px;
    }
    .panel-header span:last-child {
      color: #8292bd;
      font-size: 12px;
    }
    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .footer-note {
      padding: 10px 16px;
      border-top: 1px solid rgba(106, 132, 255, 0.16);
      color: #7e8db5;
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .status {
        text-align: left;
      }
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }
      #reload-btn {
        padding: 9px 22px;
        background: linear-gradient(135deg, #ff6b35 0%, #ff8f5e 100%);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 3px 10px rgba(255, 107, 53, 0.4);
        letter-spacing: 1px;
      }
      #reload-btn .btn-text {
        display: inline-block;
      }
      #reload-btn .btn-excl {
        color: #ffd700;
        margin-left: 3px;
        font-size: 17px;
        filter: drop-shadow(0 0 2px rgba(255,215,0,0.6));
      }
      #reload-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
        transform: none !important;
      }
      #reload-btn:not(:disabled):hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 6px 18px rgba(255, 107, 53, 0.6);
      }
      #reload-btn:not(:disabled):active {
        transform: translateY(0) scale(0.97);
        box-shadow: 0 2px 6px rgba(255, 107, 53, 0.4);
      }
  </style>
</head>
<body>
  <div class="app">
    <div class="timing-display" id="timing-display">
      <div class="timing-row">
        <div class="timing-block">
          <div class="timing-label">计算耗时</div>
          <div class="timing-value"><span id="timing-ms">0</span><span class="timing-unit">ms</span></div>
        </div>
        <div class="timing-sep"></div>
        <div class="timing-block" id="flip-block">
          <div class="timing-label">翻转三角面</div>
          <div class="timing-value" id="flip-value"><span id="flip-count">0</span><span class="timing-unit" id="flip-unit">个</span></div>
        </div>
      </div>
      <div class="timing-details" id="timing-details"></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-right">
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="radio" name="model-source" value="assets/Models" id="model-radio1" style="accent-color:#6a84ff;cursor:pointer;">
          <select id="model-select1" title="Models" style="width:155px;font-size:15px;padding:10px 14px;"></select>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="radio" name="model-source" value="assets/Models2" id="model-radio2" style="accent-color:#6a84ff;cursor:pointer;">
          <select id="model-select2" title="Models2" style="width:155px;font-size:15px;padding:10px 14px;"></select>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="radio" name="model-source" value="assets/Models3" id="model-radio3" style="accent-color:#6a84ff;cursor:pointer;">
          <select id="model-select3" title="Models3" style="width:155px;font-size:15px;padding:10px 14px;"></select>
        </div>
        <fieldset id="method-radios" style="border:1px solid rgba(106,132,255,0.22);border-radius:10px;padding:8px 12px;margin:0;">
          <legend style="color:#8a9dd4;font-size:11px;padding:0 6px;">展开算法</legend>
          <div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:4px;">
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="lscm" checked> LSCM</label>
            <label id="lscm-bd-chk" style="color:#8a9dd4;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-right:8px;"><input type="checkbox" id="bd-chk-lscm" onchange="onParamChange()"><span style="line-height:1">BD</span></label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="tutte"> Tutte</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="arap"> ARAP</label>
            <label id="arap-bd-chk" style="color:#8a9dd4;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-right:8px;"><input type="checkbox" id="bd-chk-arap" onchange="onParamChange()"><span style="line-height:1">BD</span></label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="cetm"> CETM</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="ricci"> Ricci流</label>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px 14px;">
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="cp"> CirclePat</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="quadcover"> QuadCover</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="bff"> BFF</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="miq"> MIQ</label>
            <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap"><input type="radio" name="method" value="holo"> 全纯1-形式</label>
          </div>
        </fieldset>

        <!-- 固定算法参数区 -->
        <fieldset id="param-panel" style="display:none;border:1px solid rgba(255,180,70,0.35);border-radius:10px;padding:8px 12px;margin:0;background:rgba(20,25,45,0.7);">
          <legend style="color:#ffb446;font-size:11px;padding:0 6px;">算法参数</legend>
          <div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;">
            <!-- Tutte 边界选择 -->
            <span id="param-tutte-boundary" style="display:none;font-size:12px;color:#c6d1f4;">
              边界:
              <label style="cursor:pointer;margin:0 4px;" title="映射到圆形边界"><input type="radio" name="tutte-boundary" value="circle" checked> 圆</label>
              <label style="cursor:pointer;margin:0 4px;" title="映射到正方形边界"><input type="radio" name="tutte-boundary" value="square"> 方</label>
            </span>
            <!-- BD C 值 -->
            <span id="param-bd-c" style="display:none;font-size:12px;color:#ffb446;">
              共形上界c:<input id="bd-c-input" type="number" value="10" min="1.1" max="100" step="1"
                style="width:50px;padding:3px 5px;border-radius:6px;text-align:center;font-size:12px;border:1px solid rgba(255,180,70,0.4);background:#0d1528;color:#ffd700;margin-left:4px;"
                title="共形扭曲上限 σ₁/σ₂ ≤ c（越小越保角，1=共形）">
            </span>
            <!-- ARAP 迭代 -->
            <span id="param-arap-iter" style="display:none;font-size:12px;color:#c6d1f4;">
              迭代:<input id="arap-iter-input" type="number" value="30" min="5" max="200" step="5"
                style="width:44px;padding:3px 5px;border-radius:6px;text-align:center;font-size:12px;border:1px solid rgba(106,132,255,0.3);background:#0d1528;color:#eef2ff;margin-left:4px;"
                title="ARAP Local/Global 迭代次数">
            </span>
            <!-- 优化方法选择 -->
            <span id="param-opt-scheme" style="display:none;font-size:12px;color:#c6d1f4;">
              优化:<select id="opt-scheme-select" style="width:75px;padding:3px 5px;border-radius:6px;font-size:11px;border:1px solid rgba(106,132,255,0.3);background:#0d1528;color:#eef2ff;margin-left:4px;">
                <option value="1" selected>牛顿法</option>
                <option value="0">梯度下降</option>
                <option value="3">LBFGS</option>
              </select>
            </span>
          </div>
        </fieldset>
        <button id="reload-btn"><span class="btn-text">展开</span><span class="btn-excl">!</span></button>
        <fieldset id="texture-radios" style="border:1px solid rgba(106,132,255,0.22);border-radius:10px;padding:6px 10px;margin:0;display:flex;gap:12px;align-items:center;">
          <legend style="color:#8a9dd4;font-size:11px;padding:0 4px;">纹理显示</legend>
          <label style="color:#d8def7;font-size:13px;cursor:pointer;">
            <input type="radio" name="texture-display" value="checkerboard" id="radio-checkerboard" disabled> 棋盘格
          </label>
          <label style="color:#d8def7;font-size:13px;cursor:pointer;">
            <input type="radio" name="texture-display" value="distortion" id="radio-distortion" disabled> 共形扭曲
          </label>
        </fieldset>
        <div class="status" id="status-text">正在加载模型...</div>
      </div>
    </div>

    <div class="main">
      <section class="panel">
        <div class="panel-header">
          <span>3D 模型</span>
          <span>拖拽旋转 / 滚轮缩放</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="model-canvas"></canvas>
        </div>
        <div class="footer-note">左侧显示原始三角网格与自动选择的约束点。</div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <span id="uv-panel-label">UV 网格</span>
          <span>边界归一化到 0..1</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="uv-canvas"></canvas>
        </div>
        <div class="footer-note">右侧展示展开后的线框 UV 结果。</div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const MODELS1 = {
        balls: { label: "Balls", file: "Balls.obj" },
        nefertiti: { label: "Nefertiti Face", file: "Nefertiti_face.obj" },
        beetle: { label: "Beetle", file: "beetle.obj" },
        bunnyhead: { label: "Bunny Head", file: "bunnyhead.obj" },
        camelhead: { label: "Camel Head", file: "camelhead.obj" },
        cathead: { label: "Cat Head", file: "cathead.obj" },
        cow_head: { label: "Cow Head", file: "cow_head.obj" },
        spot_cowhead: { label: "Spot Cow Head", file: "spot_cowhead.obj" },
        hand: { label: "Hand (5K)", file: "hand_1_i_f5000.obj" },
        hencky: { label: "Hencky (20K)", file: "hencky_f20000.obj" },
        maxplanck: { label: "Max Planck", file: "max-planck.obj" }
      };
      const MODELS2 = {
        holes3: { label: "3 Holes", file: "3holes.obj" },
        armadillo: { label: "Armadillo", file: "armadillo.obj" },
        beast: { label: "Beast", file: "beast.obj" },
        botijo: { label: "Botijo", file: "botijo.obj" },
        bunny: { label: "Bunny", file: "bunny.obj" },
        cow: { label: "Cow", file: "cow.obj" },
        doubletorus: { label: "Double Torus", file: "double-torus.obj" },
        fandisk: { label: "Fandisk", file: "fandisk.obj" },
        happy: { label: "Happy Buddha", file: "happy.obj" },
        lucy: { label: "Lucy", file: "lucy.obj" },
        rocker: { label: "Rocker Arm", file: "rocker-arm.obj" },
        torus: { label: "Torus", file: "torus.obj" }
      };
      const MODELS3 = {
        holes3b: { label: "3 Holes", file: "3holes.obj" },
        armadillob: { label: "Armadillo", file: "armadillo.obj" },
        bimba: { label: "Bimba", file: "bimba.obj" },
        camel_b: { label: "Camel B", file: "camel_b.obj" },
        doubletorusb: { label: "Double Torus", file: "double-torus.obj" },
        dragon: { label: "Dragon (87K)", file: "dragon_87k.obj" },
        elephant: { label: "Elephant", file: "elephant.obj" },
        fertility: { label: "Fertility", file: "fertility.obj" },
        gargoyle: { label: "Gargoyle", file: "gargoyle.obj" },
        kitten: { label: "Kitten", file: "kitten.obj" },
        soccerball: { label: "Soccer Ball", file: "soccerball.obj" },
        vaselion: { label: "Vase Lion", file: "vase_lion.obj" }
      };
      const MODEL_BASES = ["assets/Models", "assets/Models2", "assets/Models3"];
      const MIRROR_BASE_PATHS = [
        ["assets/Models", "../assets/Models", "./assets/Models"],
        ["assets/Models2", "../assets/Models2", "./assets/Models2"],
        ["assets/Models3", "../assets/Models3", "./assets/Models3"]
      ];

      const modelCanvas = document.getElementById("model-canvas");
      const uvCanvas = document.getElementById("uv-canvas");
      const modelSelect1 = document.getElementById("model-select1");
      const modelSelect2 = document.getElementById("model-select2");
      const modelSelect3 = document.getElementById("model-select3");
      const modelRadio1 = document.getElementById("model-radio1");
      const modelRadio2 = document.getElementById("model-radio2");
      const modelRadio3 = document.getElementById("model-radio3");
      const reloadBtn = document.getElementById("reload-btn");
      const textureBtn = null;
      const radioCheckerboard = document.getElementById("radio-checkerboard");
      const radioDistortion = document.getElementById("radio-distortion");
      const statusText = document.getElementById("status-text");
      const objLoader = new THREE.OBJLoader();

      const modelRenderer = new THREE.WebGLRenderer({ canvas: modelCanvas, antialias: true, alpha: true });
      const uvRenderer = new THREE.WebGLRenderer({ canvas: uvCanvas, antialias: true, alpha: true });
      modelRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      uvRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const modelScene = new THREE.Scene();
      const uvScene = new THREE.Scene();
      modelScene.background = new THREE.Color(0x08101d);
      uvScene.background = new THREE.Color(0x091120);

      const modelCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
      modelCamera.position.set(1.8, 1.5, 1.8);
      const uvCamera = new THREE.OrthographicCamera(-1.15, 1.15, 1.15, -1.15, 0.1, 10);
      uvCamera.position.set(0, 0, 2);

      const controls = new THREE.OrbitControls(modelCamera, modelCanvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(2, 3, 4);
      modelScene.add(ambient);
      modelScene.add(dirLight);

      let currentModelGroup = null;
      let currentPins = null;
      let currentUvLines = null;
      let currentUvPins = null;
      let busy = false;
      let currentMeshData = null;
      let currentSourcePath = "";
      let currentUnwrapUv = null;
      let textureEnabled = false;
      let currentTexturedMesh = null;
      let checkerTexture = null;
      let lastElapsedMs = 0;
      let distortionEnabled = false;
      let currentDistortionMesh = null;

      function setStatus(message, color) {
        statusText.textContent = message;
        statusText.style.color = color || "#8cc4ff";
      }

      function showTiming(ms, details, flippedCount) {
        const display = document.getElementById("timing-display");
        const msSpan = document.getElementById("timing-ms");
        const detailsSpan = document.getElementById("timing-details");
        const flipCountSpan = document.getElementById("flip-count");
        const flipValue = document.getElementById("flip-value");
        display.classList.add("visible");
        msSpan.textContent = ms.toFixed(1);
        detailsSpan.textContent = details || "";
        lastElapsedMs = ms;
        // 更新翻转面数显示
        const fc = typeof flippedCount === 'number' ? flippedCount : 0;
        if (flipCountSpan) flipCountSpan.textContent = fc;
        if (flipValue) {
          flipValue.classList.toggle("has-flip", fc > 0);
        }
      }

      function hideTiming() {
        document.getElementById("timing-display").classList.remove("visible");
        const flipCountSpan = document.getElementById("flip-count");
        const flipValue = document.getElementById("flip-value");
        if (flipCountSpan) flipCountSpan.textContent = "0";
        if (flipValue) flipValue.classList.remove("has-flip");
      }

      function updateTimingProgress(current, total) {
        const msSpan = document.getElementById("timing-ms");
        msSpan.textContent = "计算中 " + current + "/" + total;
      }

      function setBusy(nextBusy) {
        busy = nextBusy;
        reloadBtn.disabled = nextBusy;
        modelSelect1.disabled = nextBusy;
        modelSelect2.disabled = nextBusy;
        modelSelect3.disabled = nextBusy;
        modelRadio1.disabled = nextBusy;
        modelRadio2.disabled = nextBusy;
        modelRadio3.disabled = nextBusy;
        // 单选框在展开完成前保持禁用
        if (!nextBusy && currentUnwrapUv) {

      function resize() {

      function normalizeObject(root) {
        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        root.position.sub(center);
        root.scale.setScalar(1 / maxDim);
        root.updateMatrixWorld(true);
      }

      function loadOBJ(url) {

      /**
       * 从 OBJ 文本中解析原始面数据（保留四边形等多边形，不三角化）
       */
      function parseRawFaces(objText) {
        const faces = [];
        const lines = objText.split(/\r?\n/);
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line.startsWith('f ') && !line.startsWith('f\t')) continue;
          const indices = [];
          // 处理换行续行
          let full = line;
          while (i + 1 < lines.length && lines[i + 1].trim() && !lines[i + 1].trim().match(/^[vf#]/)) {
            i++;
            full += ' ' + lines[i].trim();
          }
          const parts = full.slice(1).trim().split(/\s+/);
          for (let j = 0; j < parts.length; j++) {
            const idx = parseInt(parts[j].split('/')[0], 10);
            if (!isNaN(idx)) indices.push(idx - 1); // 转为 0-based
          }
          if (indices.length >= 3) faces.push(indices);
        }
        return faces;
      }

      /**
       * 尝试多个路径加载原始 OBJ 文本
       */
      async function fetchObjText(urls) {
        let lastError = null;
        for (let i = 0; i < urls.length; i++) {
          try {
            const resp = await fetch(urls[i]);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return await resp.text();
          } catch (e) { lastError = e; }
        }
        throw lastError || new Error('无法加载 OBJ 文本');
      }

      function getModelCandidateUrls(modelKey) {
        const model = getCurrentModelObj();
        if (!model) return [];
        const srcIdx = currentModelSource === "assets/Models" ? 0 : (currentModelSource === "assets/Models2" ? 1 : 2);
        const paths = MIRROR_BASE_PATHS[srcIdx];
        const urls = [];
        const seen = new Set();
        for (let i = 0; i < paths.length; i++) {
          const url = paths[i] + "/" + model.file;
          if (!seen.has(url)) { seen.add(url); urls.push(url); }
        }
        return urls;
      }

      async function loadBuiltinModel(modelKey) {
        const candidateUrls = getModelCandidateUrls(modelKey);
        let lastError = null;

        // 先加载 Three.js 几何（和之前一样）
        let root = null, loadedUrl = null;
        for (let i = 0; i < candidateUrls.length; i++) {
          try {
            root = await loadOBJ(candidateUrls[i]);
            loadedUrl = candidateUrls[i];
            break;
          } catch (error) { lastError = error; }
        }
        if (!root) {
          const detail = lastError && lastError.message ? lastError.message : String(lastError || "unknown");
          throw new Error("内置模型加载失败，尝试路径: " + candidateUrls.join(" | ") + "；最后错误: " + detail);
        }

        // 模型加载成功后，再获取原始 OBJ 文本解析四边形数据
        let rawFaces = null;
        try { rawFaces = parseRawFaces(await fetchObjText(candidateUrls)); }
        catch (e) { /* 文本加载失败不影响渲染 */ }

        return { root: root, sourcePath: loadedUrl, rawFaces: rawFaces };
      }

      let currentRawFaces = null; // 原始 OBJ 面数据（可能含 quad）
      let isQuadMesh = false;     // 是否为四边形网格

      function collectMeshData(root) {
        root.updateMatrixWorld(true);
        const positions = [];
        const faces = [];
        const vertexMap = new Map();
        const temp = new THREE.Vector3();

        function getVertexIndex(x, y, z) {
          const key = [
            Math.round(x * 100000),
            Math.round(y * 100000),
            Math.round(z * 100000)
          ].join("_");
          if (!vertexMap.has(key)) {
            vertexMap.set(key, positions.length);
            positions.push([x, y, z]);
          }
          return vertexMap.get(key);
        }

        root.traverse(function (child) {
          if (!child.isMesh || !child.geometry || !child.geometry.attributes.position) {
            return;
          }

          const geometry = child.geometry.clone();
          const positionAttr = geometry.attributes.position;
          const localToGlobal = new Array(positionAttr.count);

          for (let i = 0; i < positionAttr.count; i++) {
            temp.fromBufferAttribute(positionAttr, i).applyMatrix4(child.matrixWorld);
            localToGlobal[i] = getVertexIndex(temp.x, temp.y, temp.z);
          }

          if (geometry.index) {
            const index = geometry.index.array;
            for (let i = 0; i < index.length; i += 3) {
              faces.push([
                localToGlobal[index[i]],
                localToGlobal[index[i + 1]],
                localToGlobal[index[i + 2]]
              ]);
            }
          } else {
            for (let i = 0; i < positionAttr.count; i += 3) {
              faces.push([
                localToGlobal[i],
                localToGlobal[i + 1],
                localToGlobal[i + 2]
              ]);
            }
          }
        });

        return { positions: positions, faces: faces };
      }

      function chooseAnchorPair(vertices) {
        let bestA = 0;
        let bestB = 1;
        let bestDist2 = -1;
        for (let i = 0; i < vertices.length; i++) {
          for (let j = i + 1; j < vertices.length; j++) {
            const dx = vertices[i][0] - vertices[j][0];
            const dy = vertices[i][1] - vertices[j][1];
            const dz = vertices[i][2] - vertices[j][2];
            const dist2 = dx * dx + dy * dy + dz * dz;
            if (dist2 > bestDist2) {
              bestDist2 = dist2;
              bestA = i;
              bestB = j;
            }
          }
        }
        return [bestA, bestB];
      }

      // ==================== WASM 驱动的 LSCM 求解 ====================

      async function solveLSCMAsync(meshData, onProgress) {
        const vertices = meshData.positions;
        const faces = meshData.faces;
        if (vertices.length < 3 || faces.length < 1) {
          throw new Error("模型顶点或三角形数量不足");
        }

        const anchors = chooseAnchorPair(vertices);

        if (!wasmReady) {
          const loaded = await initWASMSolver();
          if (!loaded) throw new Error("LSCM WASM 求解器初始化失败");
        }

        if (onProgress) onProgress(0, faces.length);

        const flatPositions = new Float64Array(vertices.length * 3);
        for (let i = 0; i < vertices.length; i++) {
          flatPositions[i * 3] = vertices[i][0];
          flatPositions[i * 3 + 1] = vertices[i][1];
          flatPositions[i * 3 + 2] = vertices[i][2];
        }

        const flatFaces = new Int32Array(faces.length * 3);
        for (let i = 0; i < faces.length; i++) {
          flatFaces[i * 3] = faces[i][0];
          flatFaces[i * 3 + 1] = faces[i][1];
          flatFaces[i * 3 + 2] = faces[i][2];
        }

        if (onProgress) onProgress(faces.length * 0.3, faces.length);

        let result;
        try {
          const posPtr = wasmModule._malloc(flatPositions.length * 8);
          for (let i = 0; i < flatPositions.length; i++) {
            wasmModule.setValue(posPtr + i * 8, flatPositions[i], 'double');
          }

          const facePtr = wasmModule._malloc(flatFaces.length * 4);
          for (let i = 0; i < flatFaces.length; i++) {
            wasmModule.setValue(facePtr + i * 4, flatFaces[i], 'i32');
          }

          try {
            const ret = wasmModule.ccall('solve_lscm', 'number', 
              ['number', 'number', 'number', 'number', 'number', 'number'],
              [posPtr, flatPositions.length, facePtr, flatFaces.length, anchors[0], anchors[1]]
            );

            if (ret !== 0) throw new Error("WASM solve_lscm 返回错误码: " + ret);

            const uvSize = wasmModule.ccall('get_uv_result_size', 'number', [], []);
            const uvPtr = wasmModule.ccall('get_uv_result', 'number', [], []);

            const uvs = [];
            for (let i = 0; i < uvSize; i++) {
              uvs.push(wasmModule.getValue(uvPtr + i * 8, 'double'));
            }

            wasmModule.ccall('dispose', 'void', [], []);

            result = { uv: uvs, time_ms: wasmModule.ccall('get_last_time_ms', 'number', [], []) };
          } finally {
            wasmModule._free(posPtr);
            wasmModule._free(facePtr);
          }

          if (ret !== 0) throw new Error("solve_tutte_circle 返回错误码: " + ret);
          const uvSize = taWasmModule.ccall('get_ta_uv_result_size','number',[],[]);
          const uvPtr = taWasmModule.ccall('get_ta_uv_result','number',[],[]);
          const uvs = []; for (let i=0;i<uvSize;i++) uvs.push(taWasmModule.getValue(uvPtr+i*8,'double'));
          taWasmModule.ccall('ta_dispose','void',[],[]);
          const timeMs = taWasmModule.ccall('get_ta_last_time_ms','number',[],[]);
          if (onProgress) onProgress(1,1);
          const n = meshData.positions.length;
          const uv = []; for (let i=0;i<n;i++) uv.push([uvs[i*2],uvs[i*2+1]]);
          return { uv, anchors: chooseAnchorPair(meshData.positions), flippedFaceCount: countFlippedFaces(uv,meshData.faces), timeMs, method:'tutte_circle' };
        } finally { taWasmModule._free(posPtr); taWasmModule._free(facePtr); }
      }

          taWasmModule.ccall('ta_dispose','void',[],[]);

      function countFlippedFaces(uv, faces) {
        let count = 0;
        const eps = 1e-12;
        for (let i = 0; i < faces.length; i++) {
          const t = faces[i];
          const a = uv[t[0]], b = uv[t[1]], c = uv[t[2]];
          if ((b[0]-a[0])*(c[1]-a[1]) - (c[0]-a[0])*(b[1]-a[1]) < -eps) count++;
        }
        return count;
      }

      function buildModelGroup(root, anchors, positions) {
        const group = new THREE.Group();
        const meshMaterial = new THREE.MeshStandardMaterial({
          color: 0x7fa7ff,
          roughness: 0.55,
          metalness: 0.05,
          flatShading: false,
          side: THREE.DoubleSide
        });

        root.traverse(function (child) {
          if (!child.isMesh || !child.geometry) return;
          const geom = child.geometry;
          const mesh = new THREE.Mesh(geom, meshMaterial);
          mesh.matrixAutoUpdate = false;
          mesh.matrix.copy(child.matrixWorld);
          group.add(mesh);

          // 四边形网格：用四边形边界渲染，不显示三角形对角线
          if (isQuadMesh && currentRawFaces && currentRawFaces.length > 0) {
            const posArr = geom.attributes.position;
            const lineSegs = [];
            const added = new Set();
            function addEdge(a, b) {
              const key = a < b ? a + '_' + b : b + '_' + a;
              if (added.has(key)) return;
              added.add(key);
              lineSegs.push(posArr.getX(a), posArr.getY(a), posArr.getZ(a),
                           posArr.getX(b), posArr.getY(b), posArr.getZ(b));
            }
            for (let i = 0; i < currentRawFaces.length; i++) {
              const f = currentRawFaces[i];
              // 画多边形的外部环（不画对角线）
              for (let k = 0; k < f.length; k++) {
                addEdge(f[k], f[(k + 1) % f.length]);
              }
            }
            const lineGeom = new THREE.BufferGeometry();
            lineGeom.setAttribute('position', new THREE.Float32BufferAttribute(lineSegs, 3));
            const wire = new THREE.LineSegments(lineGeom,
              new THREE.LineBasicMaterial({ color: 0x1f2f55, transparent: true, opacity: 0.65 }));
            wire.matrixAutoUpdate = false;
            wire.matrix.copy(child.matrixWorld);
            group.add(wire);
          } else {
            // 三角网格：用三角线框
            const wire = new THREE.LineSegments(
              new THREE.WireframeGeometry(geom),
              new THREE.LineBasicMaterial({ color: 0x1f2f55, transparent: true, opacity: 0.65 })
            );
            wire.matrixAutoUpdate = false;
            wire.matrix.copy(child.matrixWorld);
            group.add(wire);
          }
        });

        const pinPositions = [];
        for (let i = 0; i < anchors.length; i++) {
          const p = positions[anchors[i]];
          pinPositions.push(p[0], p[1], p[2]);
        }

        const points = new THREE.Points(
          new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(pinPositions, 3)),
          new THREE.PointsMaterial({ color: 0xffb74d, size: 0.05, sizeAttenuation: true })
        );
        group.add(points);

        return { group: group, pinPoints: points };
      }

      function buildUvMesh(uv, faces, anchors) {
        const edgeSet = new Set();
        const segments = [];

        function toPlane(p) {
          return [(p[0] - 0.5) * 1.8, (p[1] - 0.5) * 1.8, 0];
        }

        function addEdge(a, b) {
          const key = a < b ? a + "_" + b : b + "_" + a;
          if (edgeSet.has(key)) {
            return;
          }
          edgeSet.add(key);
          const pa = toPlane(uv[a]);
          const pb = toPlane(uv[b]);
          segments.push(pa[0], pa[1], pa[2], pb[0], pb[1], pb[2]);
        }

        // 四边形网格用四边形边界，三角网格用三角边界
        if (isQuadMesh && currentRawFaces && currentRawFaces.length > 0) {
          for (let i = 0; i < currentRawFaces.length; i++) {
            const f = currentRawFaces[i];
            for (let k = 0; k < f.length; k++) {
              addEdge(f[k], f[(k + 1) % f.length]);
            }
          }
        } else {
          for (let i = 0; i < faces.length; i++) {
            addEdge(faces[i][0], faces[i][1]);
            addEdge(faces[i][1], faces[i][2]);
            addEdge(faces[i][2], faces[i][0]);
          }
        }

        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute("position", new THREE.Float32BufferAttribute(segments, 3));
        const lines = new THREE.LineSegments(
          lineGeom,
          new THREE.LineBasicMaterial({ color: 0x86b2ff, transparent: true, opacity: 0.95 })
        );

        const pinPositions = [];
        for (let i = 0; i < anchors.length; i++) {
          const p = toPlane(uv[anchors[i]]);
          pinPositions.push(p[0], p[1], 0.01);
        }
        const pins = new THREE.Points(
          new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(pinPositions, 3)),
          new THREE.PointsMaterial({ color: 0xffa94d, size: 0.06, sizeAttenuation: false })
        );

        return { lines: lines, pins: pins };
      }

      function createCheckerTexture() {
        const texSize = 512;
        const cells = 16;
        const cellSize = texSize / cells;
        const canvas = document.createElement("canvas");
        canvas.width = texSize;
        canvas.height = texSize;
        const ctx = canvas.getContext("2d");

        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            const dark = ((x + y) & 1) === 0;
            ctx.fillStyle = dark ? "#1f2f54" : "#e9f0ff";
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }

        ctx.strokeStyle = "rgba(120,150,210,0.4)";
        for (let i = 0; i <= cells; i++) {
          const p = i * cellSize;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, texSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(texSize, p);
          ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 1);
        texture.needsUpdate = true;
        return texture;
      }

      function buildTexturedMesh(meshData, uv) {
        const positions = [];
        for (let i = 0; i < meshData.positions.length; i++) {
          positions.push(meshData.positions[i][0], meshData.positions[i][1], meshData.positions[i][2]);
        }
        const indices = [];
        for (let i = 0; i < meshData.faces.length; i++) {
          indices.push(meshData.faces[i][0], meshData.faces[i][1], meshData.faces[i][2]);
        }
        const uvFlat = [];
        for (let i = 0; i < uv.length; i++) {
          uvFlat.push(uv[i][0], uv[i][1]);
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute("uv", new THREE.Float32BufferAttribute(uvFlat, 2));
        geom.setIndex(indices);
        geom.computeVertexNormals();

        if (!checkerTexture) {
          checkerTexture = createCheckerTexture();
        }

        const material = new THREE.MeshStandardMaterial({
          map: checkerTexture,
          metalness: 0.05,
          roughness: 0.75,
          side: THREE.DoubleSide
        });

        return new THREE.Mesh(geom, material);
      }

      function clearTexturedMesh() {
        if (currentTexturedMesh && currentTexturedMesh.parent) {
          currentTexturedMesh.parent.remove(currentTexturedMesh);
        }
        currentTexturedMesh = null;
      }

      function setTextureDistortionEnabled(enabled) {
        if (enabled && (!currentMeshData || !currentUnwrapUv)) {
          setStatus('请先点击"展开!"生成 UV，再开启纹理扭曲', '#ffd38a');
          if (radioCheckerboard) radioCheckerboard.checked = false;
          return;
        }

        textureEnabled = enabled;
        if (textureEnabled) {
          clearTexturedMesh();
          currentTexturedMesh = buildTexturedMesh(currentMeshData, currentUnwrapUv);
          modelScene.add(currentTexturedMesh);
          if (currentModelGroup) {
            currentModelGroup.visible = false;
          }
          if (currentDistortionMesh) currentDistortionMesh.visible = false;
          setStatus("已开启纹理扭曲（棋盘格贴图）", "#89f0b6");
        } else {
          clearTexturedMesh();
          if (currentModelGroup) {
            currentModelGroup.visible = true;
          }
          setStatus("已关闭纹理扭曲", "#8cc4ff");
        }
      }

      function clearDistortionMesh() {
        if (currentDistortionMesh && currentDistortionMesh.parent) {
          currentDistortionMesh.parent.remove(currentDistortionMesh);
        }
        currentDistortionMesh = null;
      }

      async function setDistortionEnabled(enabled) {
        if (!enabled) {
          distortionEnabled = false;
          clearDistortionMesh();
          if (currentModelGroup) currentModelGroup.visible = true;
          if (currentTexturedMesh && textureEnabled) currentTexturedMesh.visible = true;
          return;
        }

        if (!currentMeshData || !currentUnwrapUv) {
          setStatus('请先点击"展开!"生成 UV', '#ffd38a');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true); }
          return;
        }

        if (!taWasmReady && !taWasmLoadFailed) {
          setStatus('正在加载 QC 引擎...', '#ffd38a');
          await initTAWASMSolver();
        }
        if (!taWasmReady) {
          setStatus('QC 引擎加载失败', '#ff9d9d');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true); }
          return;
        }

        setStatus('共形扭曲计算中...', '#ffd38a');

        try {
          // 1. load mesh + UV into WASM
          const flatPos = new Float64Array(currentMeshData.positions.length * 3);
          for (let i = 0; i < currentMeshData.positions.length; i++) {
            flatPos[i*3]=currentMeshData.positions[i][0]; flatPos[i*3+1]=currentMeshData.positions[i][1]; flatPos[i*3+2]=currentMeshData.positions[i][2];
          }
          const flatFaces = new Int32Array(currentMeshData.faces.length * 3);
          for (let i = 0; i < currentMeshData.faces.length; i++) {
            flatFaces[i*3]=currentMeshData.faces[i][0]; flatFaces[i*3+1]=currentMeshData.faces[i][1]; flatFaces[i*3+2]=currentMeshData.faces[i][2];
          }
          const flatUV = new Float64Array(currentUnwrapUv.length * 2);
          for (let i = 0; i < currentUnwrapUv.length; i++) {
            flatUV[i*2]=currentUnwrapUv[i][0]; flatUV[i*2+1]=currentUnwrapUv[i][1];
          }

          const posPtr = taWasmModule._malloc(flatPos.length * 8);
          for (let i = 0; i < flatPos.length; i++) taWasmModule.setValue(posPtr+i*8, flatPos[i], 'double');
          const facePtr = taWasmModule._malloc(flatFaces.length * 4);
          for (let i = 0; i < flatFaces.length; i++) taWasmModule.setValue(facePtr+i*4, flatFaces[i], 'i32');
          const uvPtr = taWasmModule._malloc(flatUV.length * 8);
          for (let i = 0; i < flatUV.length; i++) taWasmModule.setValue(uvPtr+i*8, flatUV[i], 'double');

          // 2. load + compute QC
          const loadRet = taWasmModule.ccall('load_mesh_with_uv', 'number',
            ['number','number','number','number','number','number'],
            [posPtr, flatPos.length, facePtr, flatFaces.length, uvPtr, flatUV.length]);
          if (loadRet !== 0) throw new Error("load_mesh_with_uv failed");

          const nFaces = taWasmModule.ccall('compute_qc_error', 'number', [], []);
          if (nFaces <= 0) throw new Error("compute_qc_error returned " + nFaces);

          // 3. read errors & colors
          const errSize = taWasmModule.ccall('get_qc_errors_size', 'number', [], []);
          const errPtr  = taWasmModule.ccall('get_qc_errors', 'number', [], []);
          const colSize = taWasmModule.ccall('get_qc_colors_size', 'number', [], []);
          const colPtr  = taWasmModule.ccall('get_qc_colors', 'number', [], []);

          const errors = []; for (let i=0;i<errSize;i++) errors.push(taWasmModule.getValue(errPtr+i*8,'double'));
          const colors = []; for (let i=0;i<colSize;i++) colors.push(taWasmModule.getValue(colPtr+i*8,'double'));

          taWasmModule.ccall('ta_dispose', 'void', [], []);

          // 4. free memory
          taWasmModule._free(posPtr); taWasmModule._free(facePtr); taWasmModule._free(uvPtr);

          // 5. compute stats
          let avgErr = 0, maxErr = 0;
          for (let i=0;i<errors.length;i++) { avgErr += errors[i]; if (errors[i]>maxErr) maxErr=errors[i]; }
          avgErr /= errors.length;

          // 6. build colored mesh (per-vertex colors averaged from adjacent faces)
          const nV = currentMeshData.positions.length;
          const vCol = new Float32Array(nV * 3);
          const vCount = new Float32Array(nV);
          const nF = currentMeshData.faces.length;
          let fi = 0;
          for (let i = 0; i < currentMeshData.faces.length; i++) {
            const f = currentMeshData.faces[i];
            const r = colors[fi*3] || 0.5, g = colors[fi*3+1] || 0.5, b = colors[fi*3+2] || 0.5;
            fi++;
            for (let k = 0; k < 3; k++) {
              const vidx = f[k];
              vCol[vidx*3] += r; vCol[vidx*3+1] += g; vCol[vidx*3+2] += b;
              vCount[vidx] += 1;
            }
          }
          for (let i=0;i<nV;i++) {
            if (vCount[i] > 0) { vCol[i*3]/=vCount[i]; vCol[i*3+1]/=vCount[i]; vCol[i*3+2]/=vCount[i]; }
            else { vCol[i*3]=0.5; vCol[i*3+1]=0.5; vCol[i*3+2]=0.5; }
          }

          const positions = [];
          for (let i=0;i<currentMeshData.positions.length;i++) positions.push(currentMeshData.positions[i][0],currentMeshData.positions[i][1],currentMeshData.positions[i][2]);
          const indices = [];
          for (let i=0;i<currentMeshData.faces.length;i++) indices.push(currentMeshData.faces[i][0],currentMeshData.faces[i][1],currentMeshData.faces[i][2]);

          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geom.setAttribute('color', new THREE.Float32BufferAttribute(vCol, 3));
          geom.setIndex(indices);
          geom.computeVertexNormals();

          const mat = new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: false, specular: 0x111111, shininess: 10 });
          currentDistortionMesh = new THREE.Mesh(geom, mat);
          modelScene.add(currentDistortionMesh);

          // hide normal model and checkerboard
          if (currentModelGroup) currentModelGroup.visible = false;
          if (currentTexturedMesh) currentTexturedMesh.visible = false;

          distortionEnabled = true;
          setStatus('QC 扭曲: avg=' + avgErr.toFixed(4) + '  max=' + maxErr.toFixed(4) + '  (绿=1.0无扭曲, 红>1.5)', '#89f0b6');
        } catch (err) {
          console.error('QC error:', err);
          setStatus('扭曲计算失败: ' + err.message, '#ff9d9d');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true); }
        }
      }

      function rebuildUvGrid() {
        const grid = new THREE.Group();
        const gridMaterial = new THREE.LineBasicMaterial({ color: 0x1a2947, transparent: true, opacity: 0.85 });
        const coords = [];
        for (let i = -10; i <= 10; i++) {
          const t = i / 10;
          coords.push(-1, t, 0, 1, t, 0);
          coords.push(t, -1, 0, t, 1, 0);
        }
        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(coords, 3));
        grid.add(new THREE.LineSegments(geom, gridMaterial));
        uvScene.add(grid);
      }

      async function loadModelPreview() {
        if (busy) {
          return;
        }

        setBusy(true);
        setStatus("正在加载 OBJ 模型: " + getCurrentSourceLabel() + " ...");

        try {
          const resolved = await resolveSourceObject();
          const root = resolved.root;
          normalizeObject(root);

          clearGroup(modelScene, currentModelGroup);
          clearGroup(uvScene, currentUvLines);
          clearGroup(uvScene, currentUvPins);
          clearTexturedMesh();
          clearDistortionMesh();
          distortionEnabled = false;
          currentUvLines = null;
          currentUvPins = null;
          currentUnwrapUv = null;
          textureEnabled = false;
          // 重置纹理显示单选框为未选中
          if (radioCheckerboard) radioCheckerboard.checked = false;
          if (radioDistortion) radioDistortion.checked = false;

          setStatus("正在提取三角网格...");
          const meshData = collectMeshData(root);
          const anchors = chooseAnchorPair(meshData.positions);

          const modelVisual = buildModelGroup(root, anchors, meshData.positions);
          currentModelGroup = modelVisual.group;
          currentPins = modelVisual.pinPoints;
          currentModelGroup.visible = true;
          modelScene.add(currentModelGroup);
          controls.target.set(0, 0, 0);
          controls.update();

          currentMeshData = meshData;
          currentSourcePath = resolved.sourcePath;
          currentRawFaces = resolved.rawFaces;  // 原始 OBJ 面数据（含四边形）

          // 检测是否为四边形网格（原始面至少有 3/4 是四边面）
          if (currentRawFaces && currentRawFaces.length > 0) {
            let quadCount = 0;
            for (let i = 0; i < currentRawFaces.length; i++) {
              if (currentRawFaces[i].length === 4) quadCount++;
            }
            isQuadMesh = (quadCount >= currentRawFaces.length * 0.75);
          } else {
            isQuadMesh = false;
          }

          const faceType = isQuadMesh ? "四边面" : "三角形";

          const faceCount = currentRawFaces ? currentRawFaces.length : meshData.faces.length;
          setStatus(
            "3D 预览: " + getCurrentSourceLabel() + " / " + meshData.positions.length + " 顶点 / " +
            faceCount + " " + faceType + "，点击「开始展开」执行 UV",
            "#89f0b6"
          );
        } catch (error) {
          console.error(error);
          setStatus("模型加载失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      async function updateModel() {
        if (busy) return;

        if (!currentMeshData) {
          await loadModelPreview();
          if (!currentMeshData) return;
        }

        const method = getCurrentMethod();
        const bd = isBDEnabled();
        const C = getBDCParam();

        // 构建方法标签
        let methodLabel;
        if (bd) methodLabel = 'BD-LSCM (C=' + C.toFixed(1) + ')';
        else if (method === 'lscm') methodLabel = 'LSCM';
        else if (method === 'tutte') methodLabel = 'Tutte (' + (getTutteBoundary() === 'circle' ? '圆' : '方') + ')';
        else if (method === 'arap') methodLabel = 'ARAP (iter=' + getARAPIter() + ')';
        else if (method === 'cetm') methodLabel = 'CETM (共形因子)';
        else if (method === 'ricci') methodLabel = 'Ricci 流';
        else if (method === 'cp') methodLabel = 'Circle Pattern';
        else if (method === 'quadcover') methodLabel = 'QuadCover';
        else if (method === 'bff') methodLabel = 'BFF';
        else if (method === 'miq') methodLabel = 'MIQ';
        else if (method === 'holo') methodLabel = '全纯1-形式';
        else methodLabel = 'LSCM';

        setBusy(true);
        setStatus("正在执行 " + methodLabel + " 求解...");
        hideTiming();

        try {
          const startTime = performance.now();

          let unwrapResult;
          if (bd) {
            // LSCM+BD 或 ARAP+BD → 统一使用 BD-LSCM 求解器
            unwrapResult = await solveBDLSCMAsync(currentMeshData, function(progress, total) {
              updateTimingProgress(progress, total);
            });
          } else if (method === 'lscm') {
            unwrapResult = await solveLSCMAsync(currentMeshData, function(progress, total) {
              updateTimingProgress(progress, total);
            });
          } else if (method === 'tutte') {
            unwrapResult = (getTutteBoundary() === 'circle')
              ? await solveTutteCircleAsync(currentMeshData, function() {})
              : await solveTutteSquareAsync(currentMeshData, function() {});
          } else if (method === 'arap') {
            unwrapResult = await solveARAPAsync(currentMeshData, function() {});
          } else if (method === 'cetm') {
            unwrapResult = await solveCETMAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'ricci') {
            unwrapResult = await solveRicciAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'cp') {
            unwrapResult = await solveCPAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'quadcover') {
            unwrapResult = await solveQCAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'bff') {
            unwrapResult = await solveBFFAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'miq') {
            unwrapResult = await solveMIQAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'holo') {
            await initHoloWASMSolver();
            const fv = currentMeshData.positions, ff = currentMeshData.faces;
            const fp = new Float64Array(fv.length*3);
            for(let i=0;i<fv.length;i++){fp[i*3]=fv[i][0];fp[i*3+1]=fv[i][1];fp[i*3+2]=fv[i][2];}
            const ffi = new Int32Array(ff.length*3);
            for(let i=0;i<ff.length;i++){ffi[i*3]=ff[i][0];ffi[i*3+1]=ff[i][1];ffi[i*3+2]=ff[i][2];}
            const pp = holoWasmModule._malloc(fp.length*8);
            for(let i=0;i<fp.length;i++)holoWasmModule.setValue(pp+i*8,fp[i],'double');
            const fpt = holoWasmModule._malloc(ffi.length*4);
            for(let i=0;i<ffi.length;i++)holoWasmModule.setValue(fpt+i*4,ffi[i],'i32');
            const rc = holoWasmModule.ccall('solve_holo','number',['number','number','number','number'],[pp,fp.length,fpt,ffi.length]);
            if(rc!==0)throw new Error("Holo solve failed");
            const sz = holoWasmModule.ccall('get_holo_uv_result_size','number',[],[]);
            const up = holoWasmModule.ccall('get_holo_uv_result','number',[],[]);
            const us=[];for(let i=0;i<sz;i++)us.push(holoWasmModule.getValue(up+i*8,'double'));
            holoWasmModule.ccall('holo_dispose','void',[],[]);
            holoWasmModule._free(pp);holoWasmModule._free(fpt);
            const nv = fv.length, uvs = new Array(nv);
            for(let i=0;i<nv;i++)uvs[i]=[us[i*2],us[i*2+1]];
            unwrapResult = {uv:uvs, anchors:chooseAnchorPair(fv), flippedFaceCount:countFlippedFaces(uvs,ff),
              timeMs:holoWasmModule.ccall('get_holo_last_time_ms','number',[],[]), method:'holo'};
          } else {
            unwrapResult = await solveLSCMAsync(currentMeshData, function(progress, total) {
              updateTimingProgress(progress, total);
            });
          }

          const elapsedMs = unwrapResult.timeMs > 0 ? unwrapResult.timeMs : (performance.now() - startTime);
          currentUnwrapUv = unwrapResult.uv;

          // 清除旧的扭曲显示（UV 变了）
          clearDistortionMesh();
          distortionEnabled = false;
          // 展开完成后启用纹理显示单选框，默认选中"棋盘格"
          if (radioCheckerboard && radioDistortion) {
            radioCheckerboard.disabled = false;
            radioDistortion.disabled = false;
            radioCheckerboard.checked = true;
            setTextureDistortionEnabled(true);
          }

          // 更新 UV 面板标签
          const methodNames = { lscm:'LSCM', tutte:'Tutte', arap:'ARAP', cetm:'CETM', ricci:'Ricci', cp:'CirclePat', quadcover:'QuadCover', bff:'BFF', miq:'MIQ', holo:'Holo' };
          document.getElementById('uv-panel-label').textContent =
            (methodNames[unwrapResult.method] || unwrapResult.method) + ' UV 网格';

          clearGroup(uvScene, currentUvLines);
          clearGroup(uvScene, currentUvPins);
          const uvVisual = buildUvMesh(unwrapResult.uv, currentMeshData.faces, unwrapResult.anchors);
          currentUvLines = uvVisual.lines;
          currentUvPins = uvVisual.pins;
          uvScene.add(currentUvLines);
          uvScene.add(currentUvPins);

          let details =
            methodLabel +
            " / " + getCurrentSourceLabel() +
            " / " + currentMeshData.positions.length + " 顶点" +
            " / " + currentMeshData.faces.length + " 三角形";
          if (unwrapResult.C) details += " / C=" + unwrapResult.C.toFixed(1);
          if (unwrapResult.maxIter) details += " / 迭代=" + unwrapResult.maxIter;
          if (unwrapResult.optScheme) details += " / " + unwrapResult.optScheme;
          showTiming(elapsedMs, details, unwrapResult.flippedFaceCount);

          const color = unwrapResult.flippedFaceCount === 0 ? "#89f0b6" : "#ffd38a";
          setStatus(
            methodLabel + " 展开完成，翻转面 " + unwrapResult.flippedFaceCount + " 个",
            color
          );
        } catch (error) {
          console.error('展开失败:', error.message, error.stack);
          hideTiming();
          setStatus("展开失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        modelRenderer.render(modelScene, modelCamera);
        uvRenderer.render(uvScene, uvCamera);
      }

      rebuildUvGrid();
      initModelOptions();
      resize();
      setStatus("正在加载默认模型 3D 预览...", "#8cc4ff");
      window.addEventListener("resize", resize);
      function onModelRadioChange() {
        const src = document.querySelector('input[name="model-source"]:checked');
        if (src) setModelSource(src.value);
      }
      modelSelect1.addEventListener("change", function () { if (modelRadio1.checked) setModelSource("assets/Models"); });
      modelSelect2.addEventListener("change", function () { if (modelRadio2.checked) setModelSource("assets/Models2"); });
      modelSelect3.addEventListener("change", function () { if (modelRadio3.checked) setModelSource("assets/Models3"); });
      modelRadio1.addEventListener("change", onModelRadioChange);
      modelRadio2.addEventListener("change", onModelRadioChange);
      modelRadio3.addEventListener("change", onModelRadioChange);
      reloadBtn.addEventListener("click", updateModel);

      // 纹理显示单选框切换
      if (radioCheckerboard) {
        radioCheckerboard.addEventListener("change", function () {
          if (this.checked) {
            setTextureDistortionEnabled(true);
            if (radioDistortion) radioDistortion.checked = false;
          }
        });
      }
      if (radioDistortion) {
        radioDistortion.addEventListener("change", async function () {
          if (this.checked) {
            setTextureDistortionEnabled(false);
            await setDistortionEnabled(true);
          }
        });
      }
      
      // 页面启动时预加载 WASM 求解器
      updateStartButtonState();
      Promise.all([initWASMSolver(), initBDWASMSolver(), initTAWASMSolver(), initCETMWASMSolver(), initRicciWASMSolver(), initCPWASMSolver(), initQCWASMSolver(), initBFFWASMSolver(), initMIQWASMSolver()]).then(([lscmOk, bdOk, taOk, cetmOk, ricciOk, cpOk, qcOk, bffOk, miqOk]) => {
        updateStartButtonState();
        if (!lscmOk && !bdOk && !taOk && !cetmOk && !ricciOk && !cpOk && !qcOk && !bffOk && !miqOk) {
          setStatus("所有 WASM 引擎加载失败", "#ff9d9d");
        }
      });
      
      // 启动时随机选择一个模型源加载
      (function(){
        const radios = [modelRadio1, modelRadio2, modelRadio3];
        const idx = Math.floor(Math.random() * 3);
        radios[idx].checked = true;
        setModelSource(radios[idx].value);
      })();
      animate();
    })();
  </script>
</body>
</html>
