<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV Animation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a1a; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    .info-panel {
      position: fixed; top: 16px; left: 16px;
      background: rgba(10, 10, 30, 0.8);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      border-radius: 12px;
      color: #e0e0ff;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      border: 1px solid rgba(100, 140, 255, 0.2);
      z-index: 10;
      max-width: 320px;
    }
    .info-panel h2 {
      margin: 0 0 8px;
      font-size: 16px;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .info-panel p { margin: 4px 0; color: #a0a0c0; line-height: 1.5; }
    .controls {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
    }
    .controls button {
      background: rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #c0c0ff;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s;
    }
    .controls button:hover {
      background: rgba(99, 102, 241, 0.5);
      color: #fff;
    }
    .controls button.active {
      background: rgba(99, 102, 241, 0.7);
      color: #fff;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="info-panel">
    <h2>🎨 UV Animation</h2>
    <p>实时 UV 参数化动画效果</p>
    <p id="uv-info">模式: 扭曲波纹</p>
    <p id="fps-info">FPS: --</p>
  </div>

  <div class="controls">
    <button class="active" onclick="switchMode(0)">扭曲波纹</button>
    <button onclick="switchMode(1)">呼吸脉冲</button>
    <button onclick="switchMode(2)">涡旋场</button>
    <button onclick="switchMode(3)">棋盘渐变</button>
  </div>

  <script>
    // ==================== 场景初始化 ====================
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4);

    const controls = new THREE.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // ==================== UV 动画着色器 ====================
    const vertexShader = `
      varying vec2 vUv;
      varying vec3 vPosition;
      varying vec3 vNormal;

      uniform float uTime;
      uniform int uMode;

      void main() {
        vUv = uv;
        vec3 pos = position;

        // 根据模式变形顶点
        if (uMode == 0) {
          // 扭曲波纹
          float wave = sin(pos.x * 3.0 + uTime * 2.0) * 0.15 + 
                       cos(pos.y * 4.0 + uTime * 1.5) * 0.1;
          pos.z += wave;
          pos.xy += 0.05 * sin(pos.y * 6.0 + uTime * 3.0) * vec2(cos(uTime), sin(uTime));
        } else if (uMode == 1) {
          // 呼吸脉冲
          float dist = length(pos.xy);
          float breathe = sin(uTime * 1.5) * 0.3;
          pos.xy *= 1.0 + breathe * (1.0 - smoothstep(0.0, 1.5, dist));
          pos.z += sin(dist * 5.0 - uTime * 3.0) * 0.15 * (1.0 - dist * 0.5);
        } else if (uMode == 2) {
          // 涡旋场
          float angle = atan(pos.y, pos.x);
          float dist = length(pos.xy);
          float twist = sin(angle * 3.0 + uTime * 2.0) * 0.2;
          pos.z += twist;
          pos.xy += 0.08 * vec2(cos(angle + dist * 3.0 - uTime), sin(angle + dist * 3.0 - uTime)) * dist;
        } else {
          // 棋盘渐变 - 轻微起伏
          float checker = step(0.5, fract(pos.x * 3.0)) * step(0.5, fract(pos.y * 3.0));
          pos.z += checker * 0.1 * sin(uTime * 2.0);
        }

        vPosition = pos;
        vNormal = normalMatrix * normal;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `;

    const fragmentShader = `
      varying vec2 vUv;
      varying vec3 vPosition;
      varying vec3 vNormal;

      uniform float uTime;
      uniform int uMode;

      // HSV to RGB 转换
      vec3 hsv2rgb(vec3 c) {
        vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
      }

      void main() {
        vec2 uv = vUv;
        vec3 color = vec3(0.0);

        if (uMode == 0) {
          // 扭曲波纹 - 彩虹波浪
          float wave1 = sin(uv.x * 10.0 + uv.y * 8.0 + uTime * 2.0);
          float wave2 = cos(uv.x * 6.0 - uv.y * 12.0 + uTime * 1.5);
          float pattern = (wave1 + wave2) * 0.5 + 0.5;
          float hue = fract(uv.x * 0.3 + uv.y * 0.2 + uTime * 0.1 + pattern * 0.3);
          color = hsv2rgb(vec3(hue, 0.7, 0.6 + pattern * 0.3));

        } else if (uMode == 1) {
          // 呼吸脉冲 - 同心圆
          float dist = length(uv - 0.5) * 2.0;
          float ring = sin(dist * 15.0 - uTime * 4.0) * 0.5 + 0.5;
          float pulse = smoothstep(0.8, 0.0, dist - fract(uTime * 0.5) * 1.5);
          float hue = fract(dist * 0.4 - uTime * 0.15);
          color = hsv2rgb(vec3(hue, 0.6, ring * 0.5 + pulse * 0.5));

        } else if (uMode == 2) {
          // 涡旋场 - 螺旋色带
          vec2 center = uv - 0.5;
          float angle = atan(center.y, center.x);
          float dist = length(center);
          float spiral = sin(angle * 5.0 + dist * 20.0 - uTime * 3.0) * 0.5 + 0.5;
          float hue = fract(angle / 6.28318 + dist * 0.5 + uTime * 0.1);
          color = hsv2rgb(vec3(hue, 0.8, spiral * 0.7 + 0.15));
          color *= smoothstep(1.2, 0.3, dist);

        } else {
          // 棋盘渐变 - 动态棋盘
          float scale = 4.0 + sin(uTime * 0.5) * 1.0;
          vec2 grid = floor(uv * scale + vec2(uTime * 0.2, uTime * 0.15));
          float checker = mod(grid.x + grid.y, 2.0);
          float hue = fract(checker * 0.5 + uTime * 0.05);
          vec3 c1 = hsv2rgb(vec3(hue, 0.5, 0.8));
          vec3 c2 = hsv2rgb(vec3(fract(hue + 0.5), 0.5, 0.3));
          color = mix(c2, c1, checker);
        }

        // 简单光照
        vec3 lightDir = normalize(vec3(1.0, 1.0, 2.0));
        float diffuse = max(dot(normalize(vNormal), lightDir), 0.0) * 0.3 + 0.7;
        color *= diffuse;

        // 边缘渐隐
        float edge = smoothstep(0.0, 0.05, vUv.x) * smoothstep(1.0, 0.95, vUv.x) *
                     smoothstep(0.0, 0.05, vUv.y) * smoothstep(1.0, 0.95, vUv.y);
        color *= edge;

        gl_FragColor = vec4(color, 0.95);
      }
    `;

    // ==================== 创建网格 ====================
    const planeGeom = new THREE.PlaneGeometry(2.5, 2.5, 128, 128);
    const uniforms = {
      uTime: { value: 0.0 },
      uMode: { value: 0 }
    };
    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      side: THREE.DoubleSide,
      transparent: true
    });
    const mesh = new THREE.Mesh(planeGeom, material);
    scene.add(mesh);

    // ==================== 背景粒子 ====================
    const particleCount = 200;
    const particleGeom = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const particleColors = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 10;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 5 - 2;
      const hue = Math.random();
      particleColors[i * 3] = hue;
      particleColors[i * 3 + 1] = hue;
      particleColors[i * 3 + 2] = hue;
    }
    particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeom.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
    const particleMat = new THREE.PointsMaterial({
      size: 0.02,
      vertexColors: true,
      transparent: true,
      opacity: 0.4
    });
    const particles = new THREE.Points(particleGeom, particleMat);
    scene.add(particles);

    // ==================== 模式切换 ====================
    const modeNames = ['扭曲波纹', '呼吸脉冲', '涡旋场', '棋盘渐变'];
    let currentMode = 0;

    function switchMode(mode) {
      currentMode = mode;
      uniforms.uMode.value = mode;
      document.getElementById('uv-info').textContent = '模式: ' + modeNames[mode];
      document.querySelectorAll('.controls button').forEach((btn, i) => {
        btn.classList.toggle('active', i === mode);
      });
    }
    window.switchMode = switchMode;

    // ==================== 渲染循环 ====================
    const clock = new THREE.Clock();
    let frameCount = 0;
    let lastFpsTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      uniforms.uTime.value = elapsed;

      // 粒子缓慢旋转
      particles.rotation.z = elapsed * 0.05;
      particles.rotation.x = Math.sin(elapsed * 0.1) * 0.1;

      controls.update();
      renderer.render(scene, camera);

      // FPS 计算
      frameCount++;
      if (elapsed - lastFpsTime >= 1.0) {
        document.getElementById('fps-info').textContent = 'FPS: ' + frameCount;
        frameCount = 0;
        lastFpsTime = elapsed;
      }
    }
    animate();

    // ==================== 窗口自适应 ====================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
