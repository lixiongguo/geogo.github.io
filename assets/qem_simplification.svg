<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">QEM 网格简化：二次误差度量</text>
  
  <!-- Stage 1: Dense mesh -->
  <g transform="translate(30,50)">
    <text x="110" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">原始网格</text>
    <text x="110" y="16" text-anchor="middle" font-size="11" fill="#999">(N = 1000 面片)</text>
    
    <!-- Dense triangle mesh -->
    <polygon points="0,30 40,20 30,60" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="40,20 80,25 55,55" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="30,60 55,55 20,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="55,55 80,25 100,60" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="80,25 130,30 100,60" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="130,30 170,20 150,55" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="100,60 150,55 120,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="150,55 190,50 170,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="170,90 120,90 145,130" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="120,90 80,100 100,130" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="80,100 40,110 60,140" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="40,110 0,130 30,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="0,130 40,110 20,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="20,90 60,140 30,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="100,130 145,130 120,170" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="145,130 170,90 190,130" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="190,130 190,50 210,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="210,90 220,60 190,50" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="170,20 220,60 190,50" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="220,60 210,90 190,130" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
    <polygon points="210,90 220,130 190,130" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="0.8"/>
  </g>
  
  <!-- Arrow 1 -->
  <defs>
    <marker id="ah1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>
  <line x1="270" y1="200" x2="330" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#ah1)"/>
  <text x="300" y="190" text-anchor="middle" font-size="11" fill="#16a34a">边折叠</text>
  
  <!-- Stage 2: Medium mesh -->
  <g transform="translate(290,70)">
    <text x="80" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">简化后</text>
    <text x="80" y="16" text-anchor="middle" font-size="11" fill="#999">(N = 200 面片)</text>
    
    <polygon points="0,40 50,30 30,80" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
    <polygon points="50,30 110,35 80,75" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
    <polygon points="110,35 160,40 130,80" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
    <polygon points="30,80 80,75 50,130" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
    <polygon points="80,75 130,80 100,130" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
    <polygon points="130,80 160,40 160,120" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
    <polygon points="50,130 100,130 70,170" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
    <polygon points="100,130 160,120 130,170" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1"/>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="520" y1="200" x2="580" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#ah1)"/>
  <text x="550" y="190" text-anchor="middle" font-size="11" fill="#16a34a">边折叠</text>
  
  <!-- Stage 3: Simplified mesh -->
  <g transform="translate(540,70)">
    <text x="80" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">最终简化</text>
    <text x="80" y="16" text-anchor="middle" font-size="11" fill="#999">(N = 50 面片)</text>
    
    <polygon points="0,50 80,30 50,110" fill="rgba(234,179,8,0.15)" stroke="#eab308" stroke-width="1.2"/>
    <polygon points="80,30 160,50 110,110" fill="rgba(234,179,8,0.15)" stroke="#eab308" stroke-width="1.2"/>
    <polygon points="50,110 110,110 80,170" fill="rgba(234,179,8,0.15)" stroke="#eab308" stroke-width="1.2"/>
  </g>
  
  <!-- Edge collapse detail -->
  <rect x="50" y="310" width="700" height="170" fill="rgba(37,99,235,0.03)" stroke="#2563eb" stroke-width="1" rx="8"/>
  <text x="400" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">边折叠（Edge Collapse）与二次误差度量</text>
  
  <!-- Before collapse -->
  <circle cx="160" cy="390" r="6" fill="#2563eb"/>
  <circle cx="260" cy="390" r="6" fill="#2563eb"/>
  <circle cx="120" cy="440" r="4" fill="#999"/>
  <circle cx="300" cy="440" r="4" fill="#999"/>
  <circle cx="180" cy="450" r="4" fill="#999"/>
  <circle cx="240" cy="450" r="4" fill="#999"/>
  <circle cx="210" cy="350" r="4" fill="#999"/>
  <line x1="160" y1="390" x2="260" y2="390" stroke="#ef4444" stroke-width="3"/>
  <text x="210" y="383" text-anchor="middle" font-size="10" fill="#ef4444">待折叠边</text>
  <polygon points="160,390 120,440 180,450" fill="none" stroke="#999" stroke-width="0.8"/>
  <polygon points="260,390 300,440 240,450" fill="none" stroke="#999" stroke-width="0.8"/>
  <polygon points="160,390 260,390 210,350" fill="none" stroke="#999" stroke-width="0.8"/>
  <text x="210" y="475" text-anchor="middle" font-size="12" fill="#555">折叠前</text>
  
  <!-- Arrow -->
  <text x="370" y="400" text-anchor="middle" font-size="24" fill="#16a34a">→</text>
  <text x="370" y="420" text-anchor="middle" font-size="10" fill="#16a34a">Δ(v̄) 最小</text>
  
  <!-- After collapse -->
  <circle cx="530" cy="390" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <text x="530" y="383" text-anchor="middle" font-size="9" fill="#16a34a">v̄</text>
  <circle cx="450" cy="440" r="4" fill="#999"/>
  <circle cx="610" cy="440" r="4" fill="#999"/>
  <circle cx="470" cy="450" r="4" fill="#999"/>
  <circle cx="580" cy="450" r="4" fill="#999"/>
  <circle cx="530" cy="350" r="4" fill="#999"/>
  <polygon points="530,390 450,440 470,450" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <polygon points="530,390 610,440 580,450" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <polygon points="530,390 530,350 450,440" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <polygon points="530,390 530,350 610,440" fill="none" stroke="#16a34a" stroke-width="1.2"/>
  <text x="530" y="475" text-anchor="middle" font-size="12" fill="#555">折叠后</text>
  
  <!-- QEM formula -->
  <rect x="640" y="340" width="100" height="60" fill="rgba(234,179,8,0.1)" stroke="#eab308" stroke-width="1" rx="5"/>
  <text x="690" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#eab308">QEM 公式</text>
  <text x="690" y="380" text-anchor="middle" font-size="11" fill="#333">Δ(v̄) = v̄ᵀQv̄</text>
  <text x="690" y="395" text-anchor="middle" font-size="9" fill="#888">Q = Σ Kₚ</text>
</svg>
