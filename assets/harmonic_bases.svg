<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">调和基底（Harmonic Bases）与离散 Laplace 方程</text>
  
  <!-- Triangular mesh surface (3D perspective) -->
  <g transform="translate(100,60)">
    <!-- Surface mesh -->
    <polygon points="0,100 80,60 160,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="80,60 200,50 160,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="200,50 280,70 160,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="280,70 360,55 160,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="360,55 440,80 160,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="440,80 520,65 160,90" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Row 2 -->
    <polygon points="0,100 160,90 60,160" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="160,90 280,70 200,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="280,70 360,55 320,140" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="360,55 440,80 420,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="440,80 520,65 500,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="160,90 200,150 60,160" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="160,90 320,140 200,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="320,140 360,55 420,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="420,150 520,65 500,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Row 3 -->
    <polygon points="60,160 200,150 120,240" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="200,150 320,140 260,230" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="320,140 420,150 380,230" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="420,150 500,150 470,230" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="200,150 260,230 120,240" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="260,230 380,230 320,140" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="380,230 470,230 420,150" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Row 4 -->
    <polygon points="120,240 260,230 180,320" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="260,230 380,230 330,310" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="380,230 470,230 430,310" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="260,230 330,310 180,320" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    <polygon points="330,310 430,310 380,230" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Harmonic basis function visualization (heat map on mesh) -->
    <!-- Highlight one vertex and color by basis function value -->
    <!-- Vertex at center top (source vertex) -->
    <circle cx="200" cy="50" r="8" fill="#ef4444" stroke="#fff" stroke-width="2"/>
    <text x="200" y="40" text-anchor="middle" font-size="11" fill="#ef4444" font-weight="bold">源顶点 v₀</text>
    
    <!-- Color gradient overlay showing harmonic basis spread -->
    <circle cx="200" cy="50" r="50" fill="rgba(239,68,68,0.2)"/>
    <circle cx="200" cy="50" r="100" fill="rgba(239,68,68,0.1)"/>
    <circle cx="200" cy="50" r="150" fill="rgba(239,68,68,0.05)"/>
    
    <!-- Boundary condition labels -->
    <text x="-10" y="105" font-size="10" fill="#16a34a">f=0</text>
    <text x="510" y="70" font-size="10" fill="#16a34a">f=0</text>
    <text x="430" y="318" font-size="10" fill="#16a34a">f=0</text>
    <text x="100" y="328" font-size="10" fill="#16a34a">f=0</text>
    <text x="60" y="240" font-size="10" fill="#16a34a">f=0</text>
  </g>
  
  <!-- Laplacian equation -->
  <rect x="530" y="80" width="250" height="140" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="655" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">离散 Laplace 方程</text>
  <text x="655" y="135" text-anchor="middle" font-size="13" fill="#333">Δf(vᵢ) = 0</text>
  <text x="655" y="160" text-anchor="middle" font-size="11" fill="#666">∑ⱼ wᵢⱼ(f(vⱼ) - f(vᵢ)) = 0</text>
  <text x="655" y="185" text-anchor="middle" font-size="11" fill="#666">vⱼ ∈ N(vᵢ)</text>
  <text x="655" y="210" text-anchor="middle" font-size="11" fill="#888">wᵢⱼ = cot αᵢⱼ + cot βᵢⱼ</text>
  
  <!-- Boundary conditions -->
  <rect x="530" y="240" width="250" height="100" fill="rgba(22,163,74,0.05)" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="655" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">边界条件</text>
  <text x="655" y="290" text-anchor="middle" font-size="12" fill="#333">f(v₀) = 1 （源顶点）</text>
  <text x="655" y="315" text-anchor="middle" font-size="12" fill="#333">f(v) = 0 （其他边界顶点）</text>
  <text x="655" y="335" text-anchor="middle" font-size="12" fill="#666">→ 求解线性方程组 (D-W)f = 0</text>
  
  <!-- Application -->
  <rect x="530" y="360" width="250" height="110" fill="rgba(234,179,8,0.05)" stroke="#eab308" stroke-width="1.5" rx="8"/>
  <text x="655" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#eab308">应用</text>
  <text x="655" y="408" text-anchor="middle" font-size="12" fill="#333">• 网格变形与插值</text>
  <text x="655" y="428" text-anchor="middle" font-size="12" fill="#333">• 参数化</text>
  <text x="655" y="448" text-anchor="middle" font-size="12" fill="#333">• 网格信号处理</text>
  <text x="655" y="468" text-anchor="middle" font-size="12" fill="#333">• Coarse-to-fine 编辑</text>
</svg>
