<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Ruppert 算法：Delaunay 细化过程</text>
  
  <!-- Left: Initial coarse mesh -->
  <text x="200" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">初始 CDT（含瘦三角形）</text>
  <rect x="50" y="75" width="300" height="300" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- PSLG boundary -->
  <line x1="50" y1="375" x2="350" y2="375" stroke="#333" stroke-width="2.5"/>
  <line x1="50" y1="75" x2="350" y2="75" stroke="#333" stroke-width="2.5"/>
  <line x1="50" y1="75" x2="50" y2="375" stroke="#333" stroke-width="2.5"/>
  <line x1="350" y1="75" x2="350" y2="375" stroke="#333" stroke-width="2.5"/>
  
  <!-- Interior constraint -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="200" y="195" text-anchor="middle" font-size="10" fill="#e67e22">PSLG 约束边</text>
  
  <!-- Coarse triangles with skinny ones highlighted -->
  <polygon points="50,75 200,75 100,200" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="200,75 350,75 300,200" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="350,75 350,200 300,200" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="50,75 50,200 100,200" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
  <polygon points="100,200 300,200 200,250" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  
  <!-- Skinny triangle highlight -->
  <polygon points="100,200 300,200 200,250" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="2"/>
  <text x="200" y="240" text-anchor="middle" font-size="10" fill="#ef4444">违反角度约束</text>
  <text x="200" y="252" text-anchor="middle" font-size="10" fill="#ef4444">→ 需要细化</text>
  
  <polygon points="50,200 100,200 80,300" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="300,200 350,375 200,375" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"/>
  
  <circle cx="350" cy="75" r="4" fill="#2563eb"/>
  <circle cx="50" cy="75" r="4" fill="#2563eb"/>
  <circle cx="200" cy="75" r="4" fill="#2563eb"/>
  <circle cx="50" cy="200" r="4" fill="#2563eb"/>
  <circle cx="100" cy="200" r="4" fill="#2563eb"/>
  <circle cx="300" cy="200" r="4" fill="#2563eb"/>
  <circle cx="350" cy="200" r="4" fill="#2563eb"/>
  <circle cx="200" cy="250" r="4" fill="#2563eb"/>
  <circle cx="80" cy="300" r="4" fill="#2563eb"/>
  <circle cx="200" cy="375" r="4" fill="#2563eb"/>
  <circle cx="350" cy="375" r="4" fill="#2563eb"/>
  <circle cx="50" cy="375" r="4" fill="#2563eb"/>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>
  <line x1="370" y1="225" x2="430" y2="225" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">细化</text>
  
  <!-- Right: Refined mesh -->
  <text x="600" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">细化后的高质量网格</text>
  <rect x="450" y="75" width="300" height="300" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Refined mesh - more uniform triangles -->
  <!-- Row 1 -->
  <polygon points="450,75 550,75 500,125" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="550,75 650,75 600,125" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="650,75 750,75 700,125" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  
  <!-- Row 2 -->
  <polygon points="450,75 500,125 450,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="500,125 550,75 600,125" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="600,125 650,75 700,125" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="700,125 750,75 750,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="500,125 600,125 550,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="600,125 700,125 650,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="700,125 750,175 700,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  
  <!-- Constraint edge preserved -->
  <line x1="450" y1="225" x2="750" y2="225" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="8,4"/>
  
  <!-- Row 3 -->
  <polygon points="450,175 500,125 550,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="450,175 550,175 500,225" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="550,175 600,125 650,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="550,175 650,175 600,225" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="650,175 700,125 750,175" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="650,175 750,175 700,225" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  
  <!-- Row 4 -->
  <polygon points="450,175 500,225 450,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="500,225 600,225 550,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="600,225 700,225 650,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="700,225 750,225 750,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="500,225 550,275 450,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="550,275 600,225 650,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="650,275 700,225 750,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  
  <!-- Row 5 -->
  <polygon points="450,275 500,225 550,275" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="450,275 550,275 500,325" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="550,275 650,275 600,325" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="650,275 750,275 700,325" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="500,325 600,325 550,375" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="600,325 700,325 650,375" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="700,325 750,375 750,325" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="450,275 500,325 450,375" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="500,325 550,375 450,375" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="550,375 600,325 650,375" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  <polygon points="650,375 700,325 750,375" fill="rgba(34,197,94,0.08)" stroke="#16a34a" stroke-width="1"/>
  
  <!-- Steiner points -->
  <circle cx="500" cy="125" r="4" fill="#ef4444"/>
  <circle cx="600" cy="125" r="4" fill="#ef4444"/>
  <circle cx="700" cy="125" r="4" fill="#ef4444"/>
  <circle cx="550" cy="175" r="4" fill="#ef4444"/>
  <circle cx="650" cy="175" r="4" fill="#ef4444"/>
  <circle cx="500" cy="225" r="4" fill="#ef4444"/>
  <circle cx="600" cy="225" r="4" fill="#ef4444"/>
  <circle cx="700" cy="225" r="4" fill="#ef4444"/>
  <circle cx="550" cy="275" r="4" fill="#ef4444"/>
  <circle cx="650" cy="275" r="4" fill="#ef4444"/>
  <circle cx="500" cy="325" r="4" fill="#ef4444"/>
  <circle cx="600" cy="325" r="4" fill="#ef4444"/>
  <circle cx="700" cy="325" r="4" fill="#ef4444"/>
  <circle cx="550" cy="375" r="4" fill="#ef4444"/>
  <circle cx="650" cy="375" r="4" fill="#ef4444"/>
  
  <!-- Legend -->
  <circle cx="100" cy="450" r="4" fill="#ef4444"/>
  <text x="112" y="454" font-size="12" fill="#555">Steiner 点（新增）</text>
  <line x1="280" y1="448" x2="320" y2="448" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="330" y="454" font-size="12" fill="#555">约束边（保持不变）</text>
  <polygon points="520,444 540,454 520,464" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="550" y="457" font-size="12" fill="#555">违反约束的三角形</text>
</svg>
