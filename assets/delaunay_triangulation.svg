<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Delaunay 三角剖分与空圆性质</text>
  
  <!-- Points -->
  <circle cx="100" cy="120" r="5" fill="#2563eb"/>
  <circle cx="200" cy="80" r="5" fill="#2563eb"/>
  <circle cx="180" cy="200" r="5" fill="#2563eb"/>
  <circle cx="320" cy="100" r="5" fill="#2563eb"/>
  <circle cx="300" cy="220" r="5" fill="#2563eb"/>
  <circle cx="420" cy="60" r="5" fill="#2563eb"/>
  <circle cx="450" cy="180" r="5" fill="#2563eb"/>
  <circle cx="380" cy="280" r="5" fill="#2563eb"/>
  <circle cx="520" cy="120" r="5" fill="#2563eb"/>
  <circle cx="550" cy="250" r="5" fill="#2563eb"/>
  <circle cx="620" cy="80" r="5" fill="#2563eb"/>
  <circle cx="650" cy="200" r="5" fill="#2563eb"/>
  <circle cx="700" cy="150" r="5" fill="#2563eb"/>
  <circle cx="150" cy="320" r="5" fill="#2563eb"/>
  <circle cx="280" cy="350" r="5" fill="#2563eb"/>
  <circle cx="480" cy="320" r="5" fill="#2563eb"/>
  <circle cx="600" cy="330" r="5" fill="#2563eb"/>
  
  <!-- Triangles -->
  <polygon points="100,120 200,80 180,200" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="200,80 320,100 180,200" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="320,100 200,80 420,60" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="320,100 420,60 450,180" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="320,100 300,220 180,200" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="320,100 450,180 300,220" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="300,220 180,200 150,320" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="300,220 150,320 280,350" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="300,220 380,280 280,350" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="450,180 300,220 380,280" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="450,180 520,120 420,60" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="450,180 520,120 380,280" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="520,120 620,80 550,250" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="520,120 450,180 550,250" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="550,250 380,280 480,320" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="550,250 520,120 620,80" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="620,80 650,200 550,250" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="620,80 700,150 650,200" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="550,250 650,200 600,330" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="550,250 600,330 480,320" fill="rgba(37,99,235,0.05)" stroke="#2563eb" stroke-width="1.5"/>
  
  <!-- Circumcircles (highlighting empty circumcircle property) -->
  <circle cx="234" cy="127" r="100" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4"/>
  <circle cx="390" cy="150" r="120" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4"/>
  
  <!-- Legend -->
  <rect x="50" y="420" width="20" height="3" fill="#2563eb"/>
  <text x="80" y="425" font-size="12" fill="#555">Delaunay 三角形边</text>
  <circle cx="260" cy="422" r="8" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="275" y="425" font-size="12" fill="#555">外接圆（内部无其他点）</text>
  <circle cx="500" cy="422" r="4" fill="#2563eb"/>
  <text x="510" y="425" font-size="12" fill="#555">顶点</text>
  
  <text x="234" y="80" text-anchor="middle" font-size="11" fill="#ef4444" font-style="italic">空圆性质 ✓</text>
  <text x="400" y="100" text-anchor="middle" font-size="11" fill="#ef4444" font-style="italic">空圆性质 ✓</text>
</svg>
