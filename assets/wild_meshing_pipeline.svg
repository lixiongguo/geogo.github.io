<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#fff"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">"In the Wild" 网格生成流水线</text>
  <!-- Input -->
  <rect x="20" y="50" width="150" height="140" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="95" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef4444">输入 Triangle Soup</text>
  <polygon points="40,95 80,85 65,120" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="0.8"/>
  <polygon points="80,85 140,90 110,120" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="0.8"/>
  <polygon points="40,95 65,120 35,150" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="0.8"/>
  <polygon points="65,120 110,120 85,160" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="0.8"/>
  <circle cx="80" cy="85" r="8" fill="none" stroke="#f97316" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="120" y="82" font-size="8" fill="#f97316">缺陷</text>
  <text x="95" y="178" text-anchor="middle" font-size="9" fill="#999">非流形 / 自交 / 孔洞</text>
  <!-- Arrow -->
  <line x1="180" y1="120" x2="230" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2563eb"/></marker></defs>
  <!-- Pipeline -->
  <rect x="240" y="50" width="310" height="155" fill="rgba(37,99,235,0.04)" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="395" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">TetWild / fTetWild Pipeline</text>
  <text x="260" y="95" font-size="11" fill="#555">❶ 预处理</text>
  <text x="260" y="110" font-size="9" fill="#888">去重、补洞、法向一致化</text>
  <text x="260" y="130" font-size="11" fill="#555">❷ 增量四面体化</text>
  <text x="260" y="145" font-size="9" fill="#888">BSP空间加速 + 浮点运算</text>
  <text x="260" y="165" font-size="11" fill="#555">❸ 网格优化（AMIPS能量）</text>
  <text x="260" y="180" font-size="9" fill="#888">顶点平滑 / 边翻转 / 面交换</text>
  <rect x="260" y="188" width="270" height="12" fill="rgba(234,179,8,0.15)" rx="3"/>
  <text x="395" y="198" text-anchor="middle" font-size="9" fill="#eab308">ε-Envelope 约束 + 无效元素过滤</text>
  <!-- Arrow -->
  <line x1="560" y1="120" x2="610" y2="120" stroke="#16a34a" stroke-width="2" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#16a34a"/></marker></defs>
  <!-- Output -->
  <rect x="620" y="50" width="160" height="140" fill="rgba(22,163,74,0.06)" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="700" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">输出四面体网格</text>
  <polygon points="645,90 680,80 660,115" fill="rgba(22,163,74,0.2)" stroke="#16a34a" stroke-width="0.8"/>
  <polygon points="680,80 740,85 715,115" fill="rgba(22,163,74,0.2)" stroke="#16a34a" stroke-width="0.8"/>
  <polygon points="645,90 660,115 640,145" fill="rgba(22,163,74,0.2)" stroke="#16a34a" stroke-width="0.8"/>
  <polygon points="660,115 715,115 695,150" fill="rgba(22,163,74,0.2)" stroke="#16a34a" stroke-width="0.8"/>
  <polygon points="715,115 740,85 750,130" fill="rgba(22,163,74,0.2)" stroke="#16a34a" stroke-width="0.8"/>
  <polygon points="695,150 750,130 730,160" fill="rgba(22,163,74,0.2)" stroke="#16a34a" stroke-width="0.8"/>
  <text x="700" y="178" text-anchor="middle" font-size="9" fill="#999">水密 / 流形 / 高质量</text>
  <!-- Comparison table -->
  <rect x="20" y="220" width="760" height="165" fill="rgba(100,150,255,0.03)" stroke="#6496ff" stroke-width="1" rx="8"/>
  <text x="400" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#6496ff">三者对比</text>
  <!-- Headers -->
  <text x="110" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">特性</text>
  <text x="310" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">TetWild (2018)</text>
  <text x="510" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">fTetWild (2020)</text>
  <text x="700" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">TriWild (2019)</text>
  <line x1="30" y1="278" x2="770" y2="278" stroke="#ddd" stroke-width="0.5"/>
  <!-- Rows -->
  <text x="110" y="296" text-anchor="middle" font-size="10" fill="#555">维度</text>
  <text x="310" y="296" text-anchor="middle" font-size="10" fill="#555">3D 四面体</text>
  <text x="510" y="296" text-anchor="middle" font-size="10" fill="#555">3D 四面体</text>
  <text x="700" y="296" text-anchor="middle" font-size="10" fill="#555">2D 三角剖分</text>
  <text x="110" y="316" text-anchor="middle" font-size="10" fill="#555">算术</text>
  <text x="310" y="316" text-anchor="middle" font-size="10" fill="#ef4444">有理数（精确）</text>
  <text x="510" y="316" text-anchor="middle" font-size="10" fill="#16a34a">浮点数（快速）</text>
  <text x="700" y="316" text-anchor="middle" font-size="10" fill="#16a34a">浮点数</text>
  <text x="110" y="336" text-anchor="middle" font-size="10" fill="#555">速度</text>
  <text x="310" y="336" text-anchor="middle" font-size="10" fill="#eab308">较慢</text>
  <text x="510" y="336" text-anchor="middle" font-size="10" fill="#16a34a">快速（~10x）</text>
  <text x="700" y="336" text-anchor="middle" font-size="10" fill="#16a34a">快速</text>
  <text x="110" y="356" text-anchor="middle" font-size="10" fill="#555">特殊约束</text>
  <text x="310" y="356" text-anchor="middle" font-size="10" fill="#555">—</text>
  <text x="510" y="356" text-anchor="middle" font-size="10" fill="#555">布尔运算</text>
  <text x="700" y="356" text-anchor="middle" font-size="10" fill="#555">曲线约束 (Bézier)</text>
  <text x="110" y="376" text-anchor="middle" font-size="10" fill="#555">发表</text>
  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#555">SIGGRAPH 2018</text>
  <text x="510" y="376" text-anchor="middle" font-size="10" fill="#555">SIGGRAPH 2020</text>
  <text x="700" y="376" text-anchor="middle" font-size="10" fill="#555">SIGGRAPH 2019</text>
</svg>
