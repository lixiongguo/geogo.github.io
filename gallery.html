<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shader Gallery</title>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #08081a;
      color: #c0c0e0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      height: 100vh;
    }

    .gallery {
      display: flex;
      height: 100vh;
      gap: 2px;
      background: #12122a;
    }

    .demo-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #0a0a1a;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(10, 10, 30, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(100, 140, 255, 0.15);
      z-index: 5;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .panel-header .meta {
      font-size: 12px;
      color: #707090;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .canvas-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .uv-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 10px;
      background: rgba(10, 10, 30, 0.95);
      border-top: 1px solid rgba(100, 140, 255, 0.15);
      flex-shrink: 0;
      z-index: 5;
    }

    .uv-controls button {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a0a0d0;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.25s;
    }

    .uv-controls button:hover {
      background: rgba(99, 102, 241, 0.4);
      color: #e0e0ff;
    }

    .uv-controls button.active {
      background: rgba(99, 102, 241, 0.6);
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }

    .caustics-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(160, 160, 200, 0.5);
      pointer-events: none;
      z-index: 5;
    }

    @media (max-width: 900px) {
      .gallery {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="gallery">
  <!-- Left panel: Caustics -->
  <div class="demo-panel">
    <div class="panel-header">
      <h2>Water Caustics</h2>
      <span class="meta" id="fps-caustics">FPS: --</span>
    </div>
    <div class="canvas-wrapper" id="caustics-wrapper">
      <canvas id="canvas-caustics"></canvas>
      <div class="caustics-hint">move mouse over water to create ripples</div>
    </div>
  </div>

  <!-- Right panel: UV Animation -->
  <div class="demo-panel">
    <div class="panel-header">
      <h2>UV Animation</h2>
      <span class="meta" id="uv-mode-label">扭曲波纹</span>
    </div>
    <div class="canvas-wrapper" id="uv-wrapper">
      <canvas id="canvas-uv"></canvas>
    </div>
    <div class="uv-controls" id="uv-buttons">
      <button class="active" data-mode="0">扭曲波纹</button>
      <button data-mode="1">呼吸脉冲</button>
      <button data-mode="2">涡旋场</button>
      <button data-mode="3">棋盘渐变</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  Caustics Demo (isolated scope)
// ============================================================
(function () {
  const canvas = document.getElementById('canvas-caustics');
  const wrapper = document.getElementById('caustics-wrapper');
  const fpsEl  = document.getElementById('fps-caustics');

  function sizeCanvas() {
    const r = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width  = Math.floor(r.width  * dpr);
    canvas.height = Math.floor(r.height * dpr);
    return { w: canvas.width, h: canvas.height };
  }

  let { w: width, h: height } = sizeCanvas();

  const black = new THREE.Color('black');
  const white = new THREE.Color('white');

  function loadFile(filename) {
    return new Promise(function (resolve) {
      new THREE.FileLoader().load(filename, resolve);
    });
  }

  const waterPosition = new THREE.Vector3(0, 0, 0.8);
  const near = 0, far = 2;
  const waterSize = 512;

  const light = [0, 0, -1];
  const lightCamera = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, near, far);
  lightCamera.position.set(0, 0, 1.5);
  lightCamera.lookAt(0, 0, 0);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.01, 100);
  camera.position.set(-1.5, -1.5, 1);
  camera.up.set(0, 0, 1);
  scene.add(camera);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setSize(width, height, false);
  renderer.autoClear = false;

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target = waterPosition;
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI / 2 - 0.1;
  controls.minDistance = 1.5;
  controls.maxDistance = 3;

  let temporaryRenderTarget = new THREE.WebGLRenderTarget(width, height);

  const clock = new THREE.Clock();
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const targetgeometry = new THREE.PlaneGeometry(2, 2);
  for (let v of targetgeometry.vertices) v.z = waterPosition.z;
  const targetmesh = new THREE.Mesh(targetgeometry);

  const waterGeometry = new THREE.PlaneBufferGeometry(2, 2, waterSize, waterSize);
  const floorGeometry = new THREE.PlaneBufferGeometry(100, 100, 1, 1);

  const objLoader = new THREE.OBJLoader();
  let shark, rock1, rock2, plant;

  const sharkLoaded = new Promise(function (resolve) {
    objLoader.load('assets/WhiteShark.obj', function (g) {
      g = g.children[0].geometry;
      g.computeVertexNormals();
      g.scale(0.12, 0.12, 0.12);
      g.rotateX(Math.PI / 2);
      g.rotateZ(-Math.PI / 2);
      g.translate(0, 0, 0.4);
      shark = g; resolve();
    });
  });
  const rockLoaded = new Promise(function (resolve) {
    objLoader.load('assets/rock.obj', function (g) {
      g = g.children[0].geometry;
      g.computeVertexNormals();
      rock1 = new THREE.BufferGeometry().copy(g);
      rock1.scale(0.05, 0.05, 0.02);
      rock1.translate(0.2, 0, 0.1);
      rock2 = new THREE.BufferGeometry().copy(g);
      rock2.scale(0.05, 0.05, 0.05);
      rock2.translate(-0.5, 0.5, 0.2);
      rock2.rotateZ(Math.PI / 2);
      resolve();
    });
  });
  const plantLoaded = new Promise(function (resolve) {
    objLoader.load('assets/plant.obj', function (g) {
      g = g.children[0].geometry;
      g.computeVertexNormals();
      plant = g;
      plant.rotateX(Math.PI / 6);
      plant.scale(0.03, 0.03, 0.03);
      plant.translate(-0.5, 0.5, 0);
      resolve();
    });
  });

  const cubetextureloader = new THREE.CubeTextureLoader();
  const skybox = cubetextureloader.load([
    'assets/TropicalSunnyDay_px.jpg', 'assets/TropicalSunnyDay_nx.jpg',
    'assets/TropicalSunnyDay_py.jpg', 'assets/TropicalSunnyDay_ny.jpg',
    'assets/TropicalSunnyDay_pz.jpg', 'assets/TropicalSunnyDay_nz.jpg',
  ]);
  scene.background = skybox;

  // ---------- WaterSimulation ----------
  class WaterSimulation {
    constructor() {
      this._camera = new THREE.OrthographicCamera(0, 1, 1, 0, 0, 2000);
      this._geometry = new THREE.PlaneBufferGeometry(2, 2);
      this._targetA = new THREE.WebGLRenderTarget(waterSize, waterSize, { type: THREE.FloatType });
      this._targetB = new THREE.WebGLRenderTarget(waterSize, waterSize, { type: THREE.FloatType });
      this.target = this._targetA;

      this.loaded = Promise.all([
        loadFile('shaders/simulation/vertex.glsl'),
        loadFile('shaders/simulation/drop_fragment.glsl'),
        loadFile('shaders/simulation/update_fragment.glsl'),
      ]).then(([vs, dropFs, updateFs]) => {
        this._dropMesh = new THREE.Mesh(this._geometry, new THREE.RawShaderMaterial({
          uniforms: { center: { value: [0, 0] }, radius: { value: 0 }, strength: { value: 0 }, texture: { value: null } },
          vertexShader: vs, fragmentShader: dropFs,
        }));
        this._updateMesh = new THREE.Mesh(this._geometry, new THREE.RawShaderMaterial({
          uniforms: { delta: { value: [1 / 216, 1 / 216] }, texture: { value: null } },
          vertexShader: vs, fragmentShader: updateFs,
        }));
      });
    }
    addDrop(r, x, y, radius, strength) {
      this._dropMesh.material.uniforms['center'].value = [x, y];
      this._dropMesh.material.uniforms['radius'].value = radius;
      this._dropMesh.material.uniforms['strength'].value = strength;
      this._render(r, this._dropMesh);
    }
    stepSimulation(r) { this._render(r, this._updateMesh); }
    _render(r, mesh) {
      const old = this.target;
      const next = this.target === this._targetA ? this._targetB : this._targetA;
      const prev = r.getRenderTarget();
      r.setRenderTarget(next);
      mesh.material.uniforms['texture'].value = old.texture;
      r.render(mesh, this._camera);
      r.setRenderTarget(prev);
      this.target = next;
    }
  }

  // ---------- Water ----------
  class Water {
    constructor() {
      this.geometry = waterGeometry;
      this.loaded = Promise.all([
        loadFile('shaders/water/vertex.glsl'),
        loadFile('shaders/water/fragment.glsl'),
      ]).then(([vs, fs]) => {
        this.material = new THREE.ShaderMaterial({
          uniforms: { light: { value: light }, water: { value: null }, envMap: { value: null }, skybox: { value: skybox } },
          vertexShader: vs, fragmentShader: fs,
        });
        this.material.extensions = { derivatives: true };
        this.mesh = new THREE.Mesh(this.geometry, this.material);
        this.mesh.position.copy(waterPosition);
      });
    }
    setHeightTexture(t) { this.material.uniforms['water'].value = t; }
    setEnvMapTexture(t) { this.material.uniforms['envMap'].value = t; }
  }

  // ---------- EnvironmentMap ----------
  class EnvironmentMap {
    constructor() {
      this.size = 1024;
      this.target = new THREE.WebGLRenderTarget(this.size, this.size, { type: THREE.FloatType });
      this._meshes = [];
      this.loaded = Promise.all([
        loadFile('shaders/environment_mapping/vertex.glsl'),
        loadFile('shaders/environment_mapping/fragment.glsl'),
      ]).then(([vs, fs]) => {
        this._material = new THREE.ShaderMaterial({ vertexShader: vs, fragmentShader: fs });
      });
    }
    setGeometries(geometries) {
      this._meshes = geometries.map(g => new THREE.Mesh(g, this._material));
    }
    render(r) {
      const prev = r.getRenderTarget();
      r.setRenderTarget(this.target);
      r.setClearColor(black, 0);
      r.clear();
      for (let m of this._meshes) r.render(m, lightCamera);
      r.setRenderTarget(prev);
    }
  }

  // ---------- CausticsPass ----------
  class CausticsPass {
    constructor() {
      this.target = new THREE.WebGLRenderTarget(waterSize * 3, waterSize * 3, { type: THREE.FloatType });
      this._waterGeometry = new THREE.PlaneBufferGeometry(2, 2, waterSize, waterSize);
      this.loaded = Promise.all([
        loadFile('shaders/caustics/water_vertex.glsl'),
        loadFile('shaders/caustics/water_fragment.glsl'),
      ]).then(([vs, fs]) => {
        const mat = new THREE.ShaderMaterial({
          uniforms: { light: { value: light }, env: { value: null }, water: { value: null }, deltaEnvTexture: { value: null } },
          vertexShader: vs, fragmentShader: fs, transparent: true, side: THREE.DoubleSide,
        });
        mat.blending = THREE.CustomBlending;
        mat.blendEquation = THREE.AddEquation;
        mat.blendSrc = THREE.OneFactor;
        mat.blendDst = THREE.OneFactor;
        mat.blendEquationAlpha = THREE.AddEquation;
        mat.blendSrcAlpha = THREE.OneFactor;
        mat.blendDstAlpha = THREE.ZeroFactor;
        mat.extensions = { derivatives: true };
        this._waterMesh = new THREE.Mesh(this._waterGeometry, mat);
        this._mat = mat;
      });
    }
    setDeltaEnvTexture(v) { this._mat.uniforms['deltaEnvTexture'].value = v; }
    setTextures(waterTex, envTex) {
      this._mat.uniforms['env'].value = envTex;
      this._mat.uniforms['water'].value = waterTex;
    }
    render(r) {
      const prev = r.getRenderTarget();
      r.setRenderTarget(this.target);
      r.setClearColor(black, 0);
      r.clear();
      r.render(this._waterMesh, lightCamera);
      r.setRenderTarget(prev);
    }
  }

  // ---------- Environment ----------
  class EnvironmentScene {
    constructor() {
      this._meshes = [];
      this.loaded = Promise.all([
        loadFile('shaders/environment/vertex.glsl'),
        loadFile('shaders/environment/fragment.glsl'),
      ]).then(([vs, fs]) => {
        this._material = new THREE.ShaderMaterial({
          uniforms: {
            light: { value: light },
            caustics: { value: null },
            lightProjectionMatrix: { value: lightCamera.projectionMatrix },
            lightViewMatrix: { value: lightCamera.matrixWorldInverse },
          },
          vertexShader: vs, fragmentShader: fs,
        });
      });
    }
    setGeometries(geometries) {
      this._meshes = geometries.map(g => new THREE.Mesh(g, this._material));
    }
    updateCaustics(t) { this._material.uniforms['caustics'].value = t; }
    addTo(s) { for (let m of this._meshes) s.add(m); }
  }

  // ---------- Debug ----------
  class Debug {
    constructor() {
      this._camera = new THREE.OrthographicCamera(0, 1, 1, 0, 0, 1);
      this._geometry = new THREE.PlaneBufferGeometry();
      this.loaded = Promise.all([
        loadFile('shaders/debug/vertex.glsl'),
        loadFile('shaders/debug/fragment.glsl'),
      ]).then(([vs, fs]) => {
        this._material = new THREE.RawShaderMaterial({
          uniforms: { texture: { value: null } },
          vertexShader: vs, fragmentShader: fs,
        });
        this._mesh = new THREE.Mesh(this._geometry, this._material);
        this._material.transparent = true;
      });
    }
  }

  const waterSimulation = new WaterSimulation();
  const water = new Water();
  const environmentMap = new EnvironmentMap();
  const environment = new EnvironmentScene();
  const causticsPass = new CausticsPass();
  const debug = new Debug();

  let frameCount = 0, lastFpsTime = performance.now();

  function animate() {
    if (clock.getElapsedTime() > 0.032) {
      waterSimulation.stepSimulation(renderer);
      const wt = waterSimulation.target.texture;
      water.setHeightTexture(wt);
      environmentMap.render(renderer);
      const emt = environmentMap.target.texture;
      causticsPass.setTextures(wt, emt);
      causticsPass.render(renderer);
      environment.updateCaustics(causticsPass.target.texture);
      clock.start();
    }

    renderer.setRenderTarget(temporaryRenderTarget);
    renderer.setClearColor(white, 1);
    renderer.clear();
    water.mesh.visible = false;
    renderer.render(scene, camera);
    water.setEnvMapTexture(temporaryRenderTarget.texture);

    renderer.setRenderTarget(null);
    renderer.setClearColor(white, 1);
    renderer.clear();
    water.mesh.visible = true;
    renderer.render(scene, camera);

    controls.update();

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = 'FPS: ' + frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }

    requestAnimationFrame(animate);
  }

  function onMouseMove(event) {
    const rect = canvas.getBoundingClientRect();
    mouse.x =  (event.clientX - rect.left) * 2 / canvas.width  * window.devicePixelRatio - 1;
    mouse.y = -(event.clientY - rect.top)  * 2 / canvas.height * window.devicePixelRatio + 1;
    raycaster.setFromCamera(mouse, camera);
    for (let hit of raycaster.intersectObject(targetmesh)) {
      waterSimulation.addDrop(renderer, hit.point.x, hit.point.y, 0.03, 0.02);
    }
  }

  window.addEventListener('resize', function () {
    const s = sizeCanvas();
    width = s.w; height = s.h;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height, false);
    temporaryRenderTarget.setSize(width, height);
  });

  Promise.all([
    waterSimulation.loaded, water.loaded, environmentMap.loaded,
    environment.loaded, causticsPass.loaded, debug.loaded,
    sharkLoaded, rockLoaded, plantLoaded,
  ]).then(function () {
    const envGeometries = [floorGeometry, shark, rock1, rock2, plant];
    environmentMap.setGeometries(envGeometries);
    environment.setGeometries(envGeometries);
    environment.addTo(scene);
    scene.add(water.mesh);
    causticsPass.setDeltaEnvTexture(1 / environmentMap.size);
    canvas.addEventListener('mousemove', onMouseMove);
    for (let i = 0; i < 5; i++) {
      waterSimulation.addDrop(renderer,
        Math.random() * 2 - 1, Math.random() * 2 - 1,
        0.03, (i & 1) ? 0.02 : -0.02);
    }
    animate();
  });
})();


// ============================================================
//  UV Animation Demo (isolated scope)
// ============================================================
(function () {
  const canvas  = document.getElementById('canvas-uv');
  const wrapper = document.getElementById('uv-wrapper');
  const modeLabel = document.getElementById('uv-mode-label');

  function sizeCanvas() {
    const r = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width  = Math.floor(r.width  * dpr);
    canvas.height = Math.floor(r.height * dpr);
    return { w: r.width, h: r.height };
  }

  let { w: cw, h: ch } = sizeCanvas();

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setSize(cw, ch);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, cw / ch, 0.1, 100);
  camera.position.set(0, 0, 4);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // ---------- Shaders ----------
  const vertexShader = `
    varying vec2 vUv;
    varying vec3 vPosition;
    varying vec3 vNormal;
    uniform float uTime;
    uniform int uMode;

    void main() {
      vUv = uv;
      vec3 pos = position;
      if (uMode == 0) {
        float wave = sin(pos.x * 3.0 + uTime * 2.0) * 0.15 + cos(pos.y * 4.0 + uTime * 1.5) * 0.1;
        pos.z += wave;
        pos.xy += 0.05 * sin(pos.y * 6.0 + uTime * 3.0) * vec2(cos(uTime), sin(uTime));
      } else if (uMode == 1) {
        float dist = length(pos.xy);
        float breathe = sin(uTime * 1.5) * 0.3;
        pos.xy *= 1.0 + breathe * (1.0 - smoothstep(0.0, 1.5, dist));
        pos.z += sin(dist * 5.0 - uTime * 3.0) * 0.15 * (1.0 - dist * 0.5);
      } else if (uMode == 2) {
        float angle = atan(pos.y, pos.x);
        float dist = length(pos.xy);
        pos.z += sin(angle * 3.0 + uTime * 2.0) * 0.2;
        pos.xy += 0.08 * vec2(cos(angle + dist * 3.0 - uTime), sin(angle + dist * 3.0 - uTime)) * dist;
      } else {
        float checker = step(0.5, fract(pos.x * 3.0)) * step(0.5, fract(pos.y * 3.0));
        pos.z += checker * 0.1 * sin(uTime * 2.0);
      }
      vPosition = pos;
      vNormal = normalMatrix * normal;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;

  const fragmentShader = `
    varying vec2 vUv;
    varying vec3 vPosition;
    varying vec3 vNormal;
    uniform float uTime;
    uniform int uMode;

    vec3 hsv2rgb(vec3 c) {
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }

    void main() {
      vec2 uv = vUv;
      vec3 color = vec3(0.0);
      if (uMode == 0) {
        float wave1 = sin(uv.x * 10.0 + uv.y * 8.0 + uTime * 2.0);
        float wave2 = cos(uv.x * 6.0 - uv.y * 12.0 + uTime * 1.5);
        float pattern = (wave1 + wave2) * 0.5 + 0.5;
        float hue = fract(uv.x * 0.3 + uv.y * 0.2 + uTime * 0.1 + pattern * 0.3);
        color = hsv2rgb(vec3(hue, 0.7, 0.6 + pattern * 0.3));
      } else if (uMode == 1) {
        float dist = length(uv - 0.5) * 2.0;
        float ring = sin(dist * 15.0 - uTime * 4.0) * 0.5 + 0.5;
        float pulse = smoothstep(0.8, 0.0, dist - fract(uTime * 0.5) * 1.5);
        float hue = fract(dist * 0.4 - uTime * 0.15);
        color = hsv2rgb(vec3(hue, 0.6, ring * 0.5 + pulse * 0.5));
      } else if (uMode == 2) {
        vec2 center = uv - 0.5;
        float angle = atan(center.y, center.x);
        float dist = length(center);
        float spiral = sin(angle * 5.0 + dist * 20.0 - uTime * 3.0) * 0.5 + 0.5;
        float hue = fract(angle / 6.28318 + dist * 0.5 + uTime * 0.1);
        color = hsv2rgb(vec3(hue, 0.8, spiral * 0.7 + 0.15));
        color *= smoothstep(1.2, 0.3, dist);
      } else {
        float scale = 4.0 + sin(uTime * 0.5) * 1.0;
        vec2 grid = floor(uv * scale + vec2(uTime * 0.2, uTime * 0.15));
        float checker = mod(grid.x + grid.y, 2.0);
        float hue = fract(checker * 0.5 + uTime * 0.05);
        vec3 c1 = hsv2rgb(vec3(hue, 0.5, 0.8));
        vec3 c2 = hsv2rgb(vec3(fract(hue + 0.5), 0.5, 0.3));
        color = mix(c2, c1, checker);
      }
      vec3 lightDir = normalize(vec3(1.0, 1.0, 2.0));
      float diffuse = max(dot(normalize(vNormal), lightDir), 0.0) * 0.3 + 0.7;
      color *= diffuse;
      float edge = smoothstep(0.0, 0.05, vUv.x) * smoothstep(1.0, 0.95, vUv.x) *
                   smoothstep(0.0, 0.05, vUv.y) * smoothstep(1.0, 0.95, vUv.y);
      color *= edge;
      gl_FragColor = vec4(color, 0.95);
    }
  `;

  const uniforms = { uTime: { value: 0 }, uMode: { value: 0 } };
  const material = new THREE.ShaderMaterial({
    vertexShader, fragmentShader, uniforms,
    side: THREE.DoubleSide, transparent: true,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5, 128, 128), material);
  scene.add(mesh);

  // ---------- Background particles ----------
  const pCount = 200;
  const pGeom = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  const pCol = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount; i++) {
    pPos[i * 3]     = (Math.random() - 0.5) * 10;
    pPos[i * 3 + 1] = (Math.random() - 0.5) * 10;
    pPos[i * 3 + 2] = (Math.random() - 0.5) * 5 - 2;
    const h = Math.random();
    pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = h;
  }
  pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeom.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
  const particles = new THREE.Points(pGeom, new THREE.PointsMaterial({
    size: 0.02, vertexColors: true, transparent: true, opacity: 0.4,
  }));
  scene.add(particles);

  // ---------- Mode switching ----------
  const modeNames = ['扭曲波纹', '呼吸脉冲', '涡旋场', '棋盘渐变'];
  const buttons = document.querySelectorAll('#uv-buttons button');

  function switchMode(mode) {
    uniforms.uMode.value = mode;
    modeLabel.textContent = modeNames[mode];
    buttons.forEach(function (b, i) { b.classList.toggle('active', i === mode); });
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      switchMode(parseInt(btn.dataset.mode));
    });
  });

  // ---------- Animation loop ----------
  const clock = new THREE.Clock();
  let frameCount = 0, lastFpsTime = 0;

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    uniforms.uTime.value = elapsed;
    particles.rotation.z = elapsed * 0.05;
    particles.rotation.x = Math.sin(elapsed * 0.1) * 0.1;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // ---------- Resize ----------
  window.addEventListener('resize', function () {
    const s = sizeCanvas();
    cw = s.w; ch = s.h;
    camera.aspect = cw / ch;
    camera.updateProjectionMatrix();
    renderer.setSize(cw, ch);
  });
})();
</script>

</body>
</html>
