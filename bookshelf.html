---
layout: default
title: 书架
---

<style>
.bookshelf-container {
  padding: 20px;
  min-height: 100vh;
}

.bookshelf-title {
  font-size: 28px;
  font-weight: 600;
  color: #e0e0e0;
  margin-bottom: 30px;
  padding-bottom: 15px;
  border-bottom: 2px solid rgba(100, 140, 255, 0.3);
}

.bookshelf {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 30px 20px;
  padding: 20px 0;
}

.book {
  position: relative;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.book:hover {
  transform: translateY(-8px);
}

.book-cover {
  width: 100%;
  aspect-ratio: 2/3;
  border-radius: 4px 8px 8px 4px;
  box-shadow: 
    0 4px 6px rgba(0, 0, 0, 0.3),
    0 10px 20px rgba(0, 0, 0, 0.2),
    inset 2px 0 4px rgba(255, 255, 255, 0.1),
    inset -1px 0 2px rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

/* 书脊效果 */
.book-cover::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 12px;
  background: linear-gradient(to right, 
    rgba(255, 255, 255, 0.3) 0%,
    rgba(255, 255, 255, 0.1) 30%,
    rgba(0, 0, 0, 0.1) 70%,
    rgba(0, 0, 0, 0.3) 100%
  );
  border-radius: 4px 0 0 4px;
}

/* 封面图案装饰 */
.book-pattern {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  opacity: 0.15;
  pointer-events: none;
}

.book-title {
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  line-height: 1.4;
  z-index: 1;
  max-height: 70%;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}

.book-author {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.8);
  margin-top: 8px;
  text-align: center;
  z-index: 1;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

.book-name {
  margin-top: 12px;
  font-size: 13px;
  color: #c0c0c0;
  text-align: center;
  line-height: 1.4;
  max-height: 36px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* 不同书籍的配色方案 */
.book-color-0 { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
.book-color-1 { background: linear-gradient(135deg, #2d132c 0%, #801336 50%, #c72c41 100%); }
.book-color-2 { background: linear-gradient(135deg, #1b262c 0%, #0f4c75 50%, #3282b8 100%); }
.book-color-3 { background: linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #5d6d7e 100%); }
.book-color-4 { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%); }
.book-color-5 { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }
.book-color-6 { background: linear-gradient(135deg, #232526 0%, #414345 50%, #6b6b6b 100%); }
.book-color-7 { background: linear-gradient(135deg, #2b5876 0%, #4e4376 50%, #6b5b95 100%); }
.book-color-8 { background: linear-gradient(135deg, #141e30 0%, #243b55 50%, #3a6073 100%); }
.book-color-9 { background: linear-gradient(135deg, #3d2c2e 0%, #5d4e52 50%, #8b7d82 100%); }
.book-color-10 { background: linear-gradient(135deg, #16222a 0%, #3a6073 50%, #5c8a9e 100%); }
.book-color-11 { background: linear-gradient(135deg, #1f1c2c 0%, #928dab 50%, #a8a4b8 100%); }

/* 装饰图案 */
.pattern-circles {
  background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 8%),
                    radial-gradient(circle at 70% 60%, rgba(255,255,255,0.08) 0%, transparent 6%),
                    radial-gradient(circle at 40% 80%, rgba(255,255,255,0.06) 0%, transparent 10%);
}

.pattern-lines {
  background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
}

.pattern-dots {
  background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 15px 15px;
}

.pattern-waves {
  background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 15px, rgba(255,255,255,0.03) 16px, rgba(255,255,255,0.03) 30px);
}

.pattern-grid {
  background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* 响应式 */
@media (max-width: 600px) {
  .bookshelf {
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 20px 15px;
  }
  
  .book-title {
    font-size: 12px;
  }
  
  .book-name {
    font-size: 11px;
  }
}
</style>

<div class="bookshelf-container">
  <h1 class="bookshelf-title">📚 我的书架</h1>
  <div class="bookshelf" id="bookshelf"></div>
</div>

<script>
// 书籍数据 - 你可以在这里添加更多书籍
const books = [
  { title: "百年孤独", author: "加西亚·马尔克斯" },
  { title: "1984", author: "乔治·奥威尔" },
  { title: "三体", author: "刘慈欣" },
  { title: "人类简史", author: "尤瓦尔·赫拉利" },
  { title: "小王子", author: "圣埃克苏佩里" },
  { title: "活着", author: "余华" },
  { title: "挪威的森林", author: "村上春树" },
  { title: "围城", author: "钱钟书" },
  { title: "红楼梦", author: "曹雪芹" },
  { title: "追风筝的人", author: "卡勒德·胡赛尼" },
  { title: "白夜行", author: "东野圭吾" },
  { title: "局外人", author: "加缪" },
  { title: "月亮与六便士", author: "毛姆" },
  { title: "霍乱时期的爱情", author: "马尔克斯" },
  { title: "平凡的世界", author: "路遥" },
  { title: "苏菲的世界", author: "乔斯坦·贾德" },
  { title: "瓦尔登湖", author: "梭罗" },
  { title: "老人与海", author: "海明威" },
  { title: "麦田里的守望者", author: "塞林格" },
  { title: "不能承受的生命之轻", author: "米兰·昆德拉" },
  { title: "傲慢与偏见", author: "简·奥斯汀" },
  { title: "简爱", author: "夏洛蒂·勃朗特" },
  { title: "飘", author: "玛格丽特·米切尔" },
  { title: "杀死一只知更鸟", author: "哈珀·李" }
];

const patterns = ['pattern-circles', 'pattern-lines', 'pattern-dots', 'pattern-waves', 'pattern-grid'];

function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffleArray(array) {
  const newArray = [...array];
  for (let i = newArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
  }
  return newArray;
}

function createBookElement(book, index) {
  const colorClass = `book-color-${index % 12}`;
  const patternClass = patterns[index % patterns.length];
  
  const bookDiv = document.createElement('div');
  bookDiv.className = 'book';
  bookDiv.innerHTML = `
    <div class="book-cover ${colorClass} ${patternClass}">
      <div class="book-pattern"></div>
      <div class="book-title">${book.title}</div>
      <div class="book-author">${book.author}</div>
    </div>
    <div class="book-name">${book.title}</div>
  `;
  
  return bookDiv;
}

function initBookshelf() {
  const bookshelf = document.getElementById('bookshelf');
  const shuffledBooks = shuffleArray(books);
  
  shuffledBooks.forEach((book, index) => {
    const bookElement = createBookElement(book, index);
    bookshelf.appendChild(bookElement);
  });
}

// 页面加载完成后初始化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initBookshelf);
} else {
  initBookshelf();
}
</script>
