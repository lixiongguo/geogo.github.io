<script>
// ==================== 题库 ====================

// 0=空, 1=黑, 2=白, 3=标记(星位等)
// answer: [row, col] 黑棋第一手正解
// starPoints: 标记点坐标（用于提示正解位置）

const PROBLEMS = [
  // ===== 第1题：直三做活 =====
  {
    title: "直三做活",
    desc: "黑先，请做活黑棋（做出两只眼）。",
    boardSize: 5,

      [0,2,2,2,0],
      [0,2,1,2,0],

    answer: [2, 2],
    hint: "直三的急所在中心，想一想'1-2-1'。",
    explanation: "黑棋在直三中心（2,2）下一子，形成两只眼，白无法杀。白如点中心则黑已占据要害。"

  // ===== 第2题：直三杀棋 =====

      [0,1,1,1,0],

      [0,1,2,1,0],

    turn: 1,
    answer: [2, 2],

  // ===== 第3题：曲三做活 =====

      [0,2,2,2,0,0],

    turn: 1,

  // ===== 第4题：直四做活 =====

  // ===== 第6题：做眼对杀 =====

    turn: 1,

  // ===== 第7题：接不归 =====

  },
  // ===== 第8题：征子 =====

    title: "征子（枷吃）",

    turn: 1,
    answer: [1, 2],
    hint: "角部二路棋有特殊性，想想怎样做出两只眼。",

  // ===== 第13题：破眼 =====

  // ===== 第16题：扳 =====
  {
    title: "扳的手筋",
    desc: "黑先，请做活黑棋。",
    boardSize: 6,

      [0,0,0,0,0,0],

    hint: "扩大眼位的方法之一是'扳'。",
    explanation: "黑在(2,3)扳，扩大做眼空间，确保能做出两只眼。"
  },
  // ===== 第17题：胀牯牛 =====
  {
    title: "胀牯牛",

    boardSize: 5,
    board: [
      [0,0,0,0,0],
      [0,1,2,1,0],

  // ===== 第18题：挖 =====

      [0,0,0,0,0],

  {

// ==================== 游戏逻辑 ====================
const canvas = document.getElementById('go-board');
const ctx = canvas.getContext('2d');
const BOARD_PX = 420;
const PADDING = 30;
let currentProblem = null;
let currentIndex = 0;
let currentBoard = [];
let playerMoves = [];
let solved = false;
let totalAttempts = 0;
let correctAttempts = 0;

// 每日题目索引
function getDailyIndex() {
  const today = new Date();
  const start = new Date(2026, 0, 1); // 2026年1月1日
  const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
  return diff % PROBLEMS.length;
}

function loadProblem(index) {
  currentIndex = ((index % PROBLEMS.length) + PROBLEMS.length) % PROBLEMS.length;
  currentProblem = PROBLEMS[currentIndex];
  currentBoard = currentProblem.board.map(row => [...row]);
  playerMoves = [];
  solved = false;
  document.getElementById('hint-box').classList.add('hidden');
  document.getElementById('answer-box').classList.add('hidden');
  document.getElementById('problem-title').textContent = currentProblem.title;
  document.getElementById('problem-desc').textContent = currentProblem.desc;
  document.getElementById('status-msg').textContent = '请落子';
  document.getElementById('status-msg').className = 'tsumego-status';
  document.getElementById('stat-number').textContent = `${currentIndex + 1}/${PROBLEMS.length}`;
  drawBoard();
}

function resetProblem() {
  loadProblem(currentIndex);
}

function nextProblem() {
  loadProblem(currentIndex + 1);
}

function prevProblem() {
  loadProblem(currentIndex - 1);
}

function showHint() {
  const hintBox = document.getElementById('hint-box');
  hintBox.textContent = '💡 ' + currentProblem.hint;
  hintBox.classList.remove('hidden');
  document.getElementById('status-msg').textContent = '💡 已显示提示';
  document.getElementById('status-msg').className = 'tsumego-status hint';
}

function showAnswer() {
  const answerBox = document.getElementById('answer-box');
  const [r, c] = currentProblem.answer;
  const colLabels = 'ABCDEFGHJKLMNOPQRST';
  answerBox.textContent = '📖 正解：' + colLabels[c] + (currentProblem.boardSize - r) + '\n' + currentProblem.explanation;
  answerBox.classList.remove('hidden');

  // Highlight answer on board
  currentBoard = currentProblem.board.map(row => [...row]);
  drawBoard();
  drawAnswerMark(r, c);
}

// ==================== 棋盘绘制 ====================
function getCellSize() {
  return (BOARD_PX - 2 * PADDING) / (currentProblem.boardSize - 1);
}

function drawBoard() {
  if (!currentProblem) return;
  const size = currentProblem.boardSize;
  const cellSize = getCellSize();

  // 清空
  ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);

  // 木纹背景
  const gradient = ctx.createLinearGradient(0, 0, BOARD_PX, BOARD_PX);
  gradient.addColorStop(0, '#DEB887');
  gradient.addColorStop(0.3, '#D2A96A');
  gradient.addColorStop(0.6, '#DEB887');
  gradient.addColorStop(1, '#C89B5E');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);

  // 网格线
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 1;
  for (let i = 0; i < size; i++) {
    // 横线
    ctx.beginPath();
    ctx.moveTo(PADDING, PADDING + i * cellSize);
    ctx.lineTo(PADDING + (size - 1) * cellSize, PADDING + i * cellSize);
    ctx.stroke();
    // 竖线
    ctx.beginPath();
    ctx.moveTo(PADDING + i * cellSize, PADDING);
    ctx.lineTo(PADDING + i * cellSize, PADDING + (size - 1) * cellSize);
    ctx.stroke();
  }

  // 星位
  const starPoints = [];
  if (size === 9) {
    starPoints.push([2,2],[2,6],[6,2],[6,6],[4,4]);
  } else if (size === 5) {
    // No star points for 5x5
  } else if (size >= 7) {
    starPoints.push([2,2],[2,size-3],[size-3,2],[size-3,size-3],[Math.floor(size/2),Math.floor(size/2)]);
  }
  starPoints.forEach(([r, c]) => {
    ctx.beginPath();
    ctx.arc(PADDING + c * cellSize, PADDING + r * cellSize, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#3a2a1a';
    ctx.fill();
  });

  // 坐标标注
  const colLabels = 'ABCDEFGHJKLMNOPQRST';
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#5a4a3a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let c = 0; c < size; c++) {
    ctx.fillText(colLabels[c], PADDING + c * cellSize, PADDING + (size - 1) * cellSize + 10);
  }
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let r = 0; r < size; r++) {
    ctx.fillText(String(size - r), PADDING - 10, PADDING + r * cellSize);
  }

  // 棋子
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const stone = currentBoard[r][c];
      if (stone === 1 || stone === 2) {
        drawStone(PADDING + c * cellSize, PADDING + r * cellSize, cellSize * 0.43, stone);
      }
    }
  }

  // 最后落子标记
  if (playerMoves.length > 0) {
    const lastMove = playerMoves[playerMoves.length - 1];
    const x = PADDING + lastMove[1] * cellSize;
    const y = PADDING + lastMove[0] * cellSize;
    const stoneColor = currentBoard[lastMove[0]][lastMove[1]];
    ctx.beginPath();
    ctx.arc(x, y, cellSize * 0.15, 0, Math.PI * 2);
    ctx.strokeStyle = stoneColor === 1 ? '#fff' : '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawStone(x, y, radius, color) {
  // 阴影
  ctx.beginPath();
  ctx.arc(x + 2, y + 2, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fill();

  // 棋子
  const gradient = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
  if (color === 1) {
    gradient.addColorStop(0, '#555');
    gradient.addColorStop(0.5, '#222');
    gradient.addColorStop(1, '#000');
  } else {
    gradient.addColorStop(0, '#fff');
    gradient.addColorStop(0.5, '#eee');
    gradient.addColorStop(1, '#ccc');
  }
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // 边缘
  ctx.strokeStyle = color === 1 ? '#000' : '#aaa';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function drawAnswerMark(r, c) {
  const cellSize = getCellSize();
  const x = PADDING + c * cellSize;
  const y = PADDING + r * cellSize;
  const radius = cellSize * 0.3;

  // 半透明标记
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(220, 38, 38, 0.4)';
  ctx.fill();
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 圈标记
  ctx.beginPath();
  ctx.arc(x, y, radius * 0.5, 0, Math.PI * 2);
  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ==================== 交互 ====================
canvas.addEventListener('click', function(e) {
  if (solved || !currentProblem) return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = BOARD_PX / rect.width;
  const scaleY = BOARD_PX / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  const cellSize = getCellSize();
  const col = Math.round((mx - PADDING) / cellSize);
  const row = Math.round((my - PADDING) / cellSize);

  if (row < 0 || row >= currentProblem.boardSize || col < 0 || col >= currentProblem.boardSize) return;
  if (currentBoard[row][col] !== 0) return;

  totalAttempts++;

  // 落子
  currentBoard[row][col] = currentProblem.turn;
  playerMoves.push([row, col]);

  // 判断
  const [ar, ac] = currentProblem.answer;
  if (row === ar && col === ac) {
    solved = true;
    correctAttempts++;
    document.getElementById('status-msg').textContent = '✅ 正确！';
    document.getElementById('status-msg').className = 'tsumego-status correct';
    document.getElementById('answer-box').textContent = '📖 ' + currentProblem.explanation;
    document.getElementById('answer-box').classList.remove('hidden');
    drawBoard();
    drawAnswerMark(row, col);
    saveStats();
  } else {
    document.getElementById('status-msg').textContent = '❌ 不对，再想想！';
    document.getElementById('status-msg').className = 'tsumego-status wrong';
    drawBoard();
  }

  updateAccuracy();
});

// ==================== 统计 ====================
function updateAccuracy() {
  const acc = totalAttempts > 0 ? Math.round(correctAttempts / totalAttempts * 100) + '%' : '--';
  document.getElementById('stat-accuracy').textContent = acc;
}

function saveStats() {
  const today = new Date().toISOString().split('T')[0];
  const stats = JSON.parse(localStorage.getItem('tsumego_stats') || '{}');
  if (!stats[today]) stats[today] = { solved: false, attempts: 0 };
  stats[today].solved = true;
  stats[today].attempts = playerMoves.length;
  localStorage.setItem('tsumego_stats', JSON.stringify(stats));
  checkTodayStatus();
}

function checkTodayStatus() {
  const today = new Date().toISOString().split('T')[0];
  const stats = JSON.parse(localStorage.getItem('tsumego_stats') || '{}');
  const todayStats = stats[today];
  const el = document.getElementById('stat-today');
  if (todayStats && todayStats.solved) {
    el.textContent = '✅ 已完成';
  } else {
    el.textContent = '⏳ 未完成';
  }
}

// ==================== 初始化 ====================
function init() {
  const today = new Date();
  const dateStr = today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  document.getElementById('problem-date').textContent = dateStr;

  const dailyIdx = getDailyIndex();
  loadProblem(dailyIdx);
  checkTodayStatus();

  // 加载历史统计
  const stats = JSON.parse(localStorage.getItem('tsumego_stats') || '{}');
