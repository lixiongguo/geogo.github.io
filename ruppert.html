<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruppert 三角化 - Delaunay 细化</title>
  <script src="assets/js/wasm-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060b14;
      color: #c6d1f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #0a1020;
      border-bottom: 1px solid rgba(106,132,255,0.15);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar label { font-size: 13px; color: #8a9dd4; }
    .toolbar select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #0d1528;
      color: #eef2ff;
      font-size: 14px;
      cursor: pointer;
    }
    .toolbar button {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #111b31;
      color: #c6d1f4;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar button:hover:not(:disabled) {
      background: #1a2848;
      border-color: rgba(106,132,255,0.6);
    }
    .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .toolbar button.primary {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8f5e 100%);
      color: #fff;
      border: none;
      box-shadow: 0 3px 10px rgba(255,107,53,0.3);
    }
    .toolbar button.primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(255,107,53,0.5);
    }
    .toolbar .spacer { flex: 1; }
    .status {
      font-size: 12px;
      color: #5a6791;
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .main {
      flex: 1;
      min-height: 0;
    }
    .panel {
      position: relative;
      border: 1px solid rgba(106,132,255,0.1);
      overflow: hidden;
    }
    .panel canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .panel-label {
      position: absolute;
      top: 10px; left: 12px;
      font-size: 12px;
      color: rgba(138,157,212,0.7);
      pointer-events: none;
      z-index: 2;
    }
    .panel-info {
      position: absolute;
      bottom: 10px; left: 12px;
      font-size: 11px;
      color: rgba(255,180,70,0.8);
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <label>字母:</label>
    <select id="letter-select"></select>
    <label style="margin-left:4px;">最小角:</label>
    <select id="min-angle-select">
      <option value="20">20°</option>
      <option value="25" selected>25°</option>
      <option value="30">30°</option>
    </select>
    <button id="reset-btn">恢复原网格</button>
    <span class="spacer"></span>
    <button id="ruppert-btn" class="primary">Ruppert 三角化</button>
    <span class="status" id="status-text">选择字母开始</span>
  </div>
  <div class="main">
    <div class="panel" id="main-panel">
      <div class="panel-label">字母网格 — Ruppert Delaunay 细化（CDT / WASM）</div>
      <canvas id="main-canvas"></canvas>
      <div class="panel-info" id="panel-info"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const letterSelect = document.getElementById('letter-select');
  const minAngleSelect = document.getElementById('min-angle-select');
  const resetBtn = document.getElementById('reset-btn');
  const ruppertBtn = document.getElementById('ruppert-btn');
  const statusText = document.getElementById('status-text');
  const mainCanvas = document.getElementById('main-canvas');
  const panelInfo = document.getElementById('panel-info');

  const renderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x08101d);

  const camera = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, 0.1, 10);
  camera.position.set(0, 0, 5);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const d = new THREE.DirectionalLight(0xffffff, 0.8);
  d.position.set(2, 3, 4); scene.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.3);
  d2.position.set(-2, -1, -2); scene.add(d2);

  let currentMeshData = null;
  let originalMeshData = null;
  let currentModelGroup = null;
  let currentLabel = '';

  function setStatus(msg, color) {
    statusText.textContent = msg;
    statusText.style.color = color || '#5a6791';
  }

  function extractMeshData(geometry) {
    let positions, faces;
    if (geometry.attributes && geometry.attributes.position) {
      const posAttr = geometry.attributes.position;
      const idx = geometry.index;
      positions = [];
      for (let i = 0; i < posAttr.count; i++) {
        positions.push([posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i)]);
      }
      if (idx) {
        faces = [];
        const arr = idx.array;
        for (let i = 0; i < arr.length; i += 3) {
          faces.push([arr[i], arr[i+1], arr[i+2]]);
        }
      } else {
        faces = [];
        for (let i = 0; i < posAttr.count; i += 3) {
          faces.push([i, i+1, i+2]);
        }
      }
    } else if (geometry.vertices && geometry.faces) {
      positions = geometry.vertices.map(v => [v.x, v.y, v.z]);
      faces = geometry.faces.map(f => [f.a, f.b, f.c]);
    } else {
      throw new Error('无法解析几何体数据');
    }
    return { positions, faces };
  }

  function buildModelVisual(positions, faces) {
    const group = new THREE.Group();
    const geom = new THREE.BufferGeometry();
    const flatPos = new Float32Array(positions.length * 3);
    for (let i = 0; i < positions.length; i++) {
      flatPos[i*3] = positions[i][0];
      flatPos[i*3+1] = positions[i][1];
      flatPos[i*3+2] = positions[i][2];
    }
    geom.setAttribute('position', new THREE.Float32BufferAttribute(flatPos, 3));
    const flatIdx = new Uint32Array(faces.length * 3);
    for (let i = 0; i < faces.length; i++) {
      flatIdx[i*3] = faces[i][0];
      flatIdx[i*3+1] = faces[i][1];
      flatIdx[i*3+2] = faces[i][2];
    }
    geom.setIndex(new THREE.BufferAttribute(flatIdx, 1));
    geom.computeVertexNormals();
    group.add(new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
      color: 0x7fa7ff, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide
    })));

    const wireGeom = new THREE.BufferGeometry();
    const edgeSet = new Set();
    const segments = [];
    function addEdge(a, b) {
      const key = a < b ? a + '_' + b : b + '_' + a;
      if (edgeSet.has(key)) return;
      edgeSet.add(key);
      segments.push(positions[a][0], positions[a][1], positions[a][2]);
      segments.push(positions[b][0], positions[b][1], positions[b][2]);
    }
    for (let i = 0; i < faces.length; i++) {
      addEdge(faces[i][0], faces[i][1]);
      addEdge(faces[i][1], faces[i][2]);
      addEdge(faces[i][2], faces[i][0]);
    }
    wireGeom.setAttribute('position', new THREE.Float32BufferAttribute(segments, 3));
    group.add(new THREE.LineSegments(wireGeom,
      new THREE.LineBasicMaterial({ color: 0x1f2f55, transparent: true, opacity: 0.6 })));
    return group;
  }

  function clearGroup(scene, obj) {
    if (obj && obj.parent) obj.parent.remove(obj);
  }

  function showMesh(meshData, infoText) {
    clearGroup(scene, currentModelGroup);
    currentModelGroup = buildModelVisual(meshData.positions, meshData.faces);
    scene.add(currentModelGroup);
    panelInfo.textContent = infoText;
  }

  function fitCamera(positions) {
    const box = new THREE.Box3();
    for (const p of positions) box.expandByPoint(new THREE.Vector3(p[0], p[1], p[2]));
    const maxDim = Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, 0.5) * 0.65;
    camera.left = -maxDim;
    camera.right = maxDim;
    camera.top = maxDim;
    camera.bottom = -maxDim;
    camera.updateProjectionMatrix();
    camera.position.set(0, 0, 5);
    camera.lookAt(0, 0, 0);
  }

  // ==================== WASM (CDT + Ruppert) ====================

  let ruppertInst = null;

  async function initRuppertWasm() {
    if (ruppertInst) return ruppertInst;
    try {
      ruppertInst = await WasmLoader.loadWasmModule('ruppert', 'RuppertModule');
      return ruppertInst;
    } catch (e) {
      console.warn('Ruppert WASM 加载失败，将使用 JS 回退', e);
      return null;
    }
  }

  function extractBoundaryPSLG(V, F) {
    const key = (a, b) => a < b ? a + '_' + b : b + '_' + a;
    const cnt = new Map();
    for (const f of F) {
      for (const [a, b] of [[f[0], f[1]], [f[1], f[2]], [f[2], f[0]]]) {
        const k = key(a, b);
        cnt.set(k, (cnt.get(k) || 0) + 1);
      }
    }
    const bset = new Set(), segs = [];
    for (const f of F) {
      for (const [a, b] of [[f[0], f[1]], [f[1], f[2]], [f[2], f[0]]]) {
        if (cnt.get(key(a, b)) === 1) { segs.push([a, b]); bset.add(a); bset.add(b); }
      }
    }
    const remap = new Map(), ptsFlat = [];
    for (const vi of bset) {
      remap.set(vi, ptsFlat.length / 2);
      ptsFlat.push(V[vi][0], V[vi][1]);
    }
    const segIdx = [];
    for (const [a, b] of segs) segIdx.push(remap.get(a), remap.get(b));
    return { ptsFlat, segIdx, count: ptsFlat.length / 2 };
  }

  function callRuppertWasm(inst, ptsArr, segArr, minAngle) {
    const ptsPtr = inst._malloc(ptsArr.length * 8);
    inst.HEAPF64.set(ptsArr, ptsPtr / 8);
    const segPtr = inst._malloc(segArr.length * 4);
    inst.HEAP32.set(segArr, segPtr / 4);
    let result = null;
    try {
      const ret = inst.ccall('ruppert_run', 'number',
        ['number', 'number', 'number', 'number', 'number', 'number', 'number'],
        [ptsPtr, ptsArr.length, segPtr, segArr.length, minAngle, 0, 0]);
      if (ret === 0) {
        const pSize = inst.ccall('get_points_size', 'number', [], []);
        const pPtr  = inst.ccall('get_points', 'number', [], []);
        const tSize = inst.ccall('get_triangles_size', 'number', [], []);
        const tPtr  = inst.ccall('get_triangles', 'number', [], []);
        const positions = [];
        for (let i = 0; i < pSize; i += 2) {
          positions.push([inst.HEAPF64[pPtr / 8 + i], inst.HEAPF64[pPtr / 8 + i + 1], 0]);
        }
        const faces = [];
        for (let i = 0; i < tSize; i += 3) {
          faces.push([inst.HEAP32[tPtr / 4 + i], inst.HEAP32[tPtr / 4 + i + 1], inst.HEAP32[tPtr / 4 + i + 2]]);
        }
        const ms = inst.ccall('get_last_time_ms', 'number', [], []);
        result = { positions, faces, ms };
      }
    } finally {
      inst._free(ptsPtr);
      inst._free(segPtr);
      inst.ccall('dispose', 'void', [], []);
    }
    return result;
  }

  async function ruppertWasm(V, F, minAngle) {
    const inst = await initRuppertWasm();
    if (!inst) return null;
    const { ptsFlat, segIdx, count } = extractBoundaryPSLG(V, F);
    if (count < 3 || segIdx.length < 6) return null;
    return callRuppertWasm(inst, new Float64Array(ptsFlat), new Int32Array(segIdx), minAngle);
  }

  // ==================== Ruppert 三角化 (JS 回退) ====================

  function circumcenter2D(a, b, c) {
    const ax = a[0], ay = a[1], bx = b[0], by = b[1], cx = c[0], cy = c[1];
    const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    if (Math.abs(D) < 1e-12) return null;
    const ax2 = ax * ax + ay * ay;
    const by2 = bx * bx + by * by;
    const cx2 = cx * cx + cy * cy;
    const ux = (ax2 * (by - cy) + by2 * (cy - ay) + cx2 * (ay - by)) / D;
    const uy = (ax2 * (cx - bx) + by2 * (ax - cx) + cx2 * (bx - ax)) / D;
    return [ux, uy, 0];
  }

  function circumradius2D(a, b, c) {
    const ax = a[0], ay = a[1], bx = b[0], by = b[1], cx = c[0], cy = c[1];
    const ab = Math.hypot(bx - ax, by - ay);
    const bc = Math.hypot(cx - bx, cy - by);
    const ca = Math.hypot(ax - cx, cy - ay);
    const s = (ab + bc + ca) / 2;
    const area = Math.sqrt(Math.max(0, s * (s - ab) * (s - bc) * (s - ca)));
    if (area < 1e-12) return Infinity;
    return (ab * bc * ca) / (4 * area);
  }

  function shortestEdge2D(a, b, c) {
    const dx1 = b[0] - a[0], dy1 = b[1] - a[1];
    const dx2 = c[0] - b[0], dy2 = c[1] - b[1];
    const dx3 = a[0] - c[0], dy3 = a[1] - c[1];
    return Math.min(
      Math.sqrt(dx1 * dx1 + dy1 * dy1),
      Math.sqrt(dx2 * dx2 + dy2 * dy2),
      Math.sqrt(dx3 * dx3 + dy3 * dy3)
    );
  }

  function minAngle2D(a, b, c) {
    const ab = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const bc = Math.hypot(c[0] - b[0], c[1] - b[1]);
    const ca = Math.hypot(a[0] - c[0], a[1] - c[1]);
    const cosA = (ab * ab + ca * ca - bc * bc) / (2 * ab * ca + 1e-12);
    const cosB = (ab * ab + bc * bc - ca * ca) / (2 * ab * bc + 1e-12);
    const cosC = (bc * bc + ca * ca - ab * ab) / (2 * bc * ca + 1e-12);
    const clamp = v => Math.max(-1, Math.min(1, v));
    const angleA = Math.acos(clamp(cosA));
    const angleB = Math.acos(clamp(cosB));
    const angleC = Math.acos(clamp(cosC));
    return Math.min(angleA, angleB, angleC);
  }

  function edgeKey(a, b) { return a < b ? a + '_' + b : b + '_' + a; }

  function extractBoundaryEdges(faces) {
    const ecount = new Map();
    for (let fi = 0; fi < faces.length; fi++) {
      const [a, b, c] = faces[fi];
      for (const [u, v] of [[a,b],[b,c],[c,a]]) {
        const k = edgeKey(u, v);
        ecount.set(k, (ecount.get(k) || 0) + 1);
      }
    }
    const boundary = new Set();
    for (const [k, cnt] of ecount) {
      if (cnt === 1) boundary.add(k);
    }
    return boundary;
  }

  function encroachesEdge(p, u, v, positions) {
    const pu = positions[u], pv = positions[v];
    const mx = (pu[0] + pv[0]) / 2, my = (pu[1] + pv[1]) / 2;
    const dx = p[0] - mx, dy = p[1] - my;
    const halfLen = Math.hypot(pv[0] - pu[0], pv[1] - pu[1]) / 2;
    return (dx * dx + dy * dy) < halfLen * halfLen * 1.001;
  }

  function incircle2D(ax, ay, bx, by, cx, cy, dx, dy) {
    const adx = ax - dx, ady = ay - dy;
    const bdx = bx - dx, bdy = by - dy;
    const cdx = cx - dx, cdy = cy - dy;
    const al = adx*adx + ady*ady;
    const bl = bdx*bdx + bdy*bdy;
    const cl = cdx*cdx + cdy*cdy;
    return al*(bdx*cdy - bdy*cdx)
         - bl*(adx*cdy - ady*cdx)
         + cl*(adx*bdy - ady*bdx);
  }

  function orient2D(ax, ay, bx, by, cx, cy) {
    return (bx - ax)*(cy - ay) - (by - ay)*(cx - ax);
  }

  function buildEdgeFaceMap(triangles) {
    const map = new Map();
    for (let fi = 0; fi < triangles.length; fi++) {
      const [a, b, c] = triangles[fi];
      for (const [u, v] of [[a,b],[b,c],[c,a]]) {
        const k = edgeKey(u, v);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(fi);
      }
    }
    return map;
  }

  function findFaceWithEdge(tri, u, v) {
    for (let fi = 0; fi < tri.length; fi++) {
      const [a, b, c] = tri[fi];
      const hasU = (a===u||b===u||c===u);
      const hasV = (a===v||b===v||c===v);
      if (hasU && hasV) return fi;
    }
    return -1;
  }

  function ruppertRefine(positions, faces, minAngleDeg, maxIter) {
    const targetMinAngle = minAngleDeg * Math.PI / 180;
    const B = 1.0 / Math.sin(targetMinAngle * 0.5);

    let pos = positions.map(p => [p[0], p[1], 0]);
    let tri = faces.map(f => [f[0], f[1], f[2]]);
    const boundaryEdges = extractBoundaryEdges(tri);

    for (let fi = 0; fi < tri.length; fi++) {
      const [a, b, c] = tri[fi];
      if (orient2D(pos[a][0], pos[a][1], pos[b][0], pos[b][1], pos[c][0], pos[c][1]) < 0) {
        tri[fi] = [a, c, b];
      }
    }

    for (let iter = 0; iter < maxIter; iter++) {
      let worstIdx = -1, worstAng = Infinity;
      for (let fi = 0; fi < tri.length; fi++) {
        const [a, b, c] = tri[fi];
        const pa=pos[a], pb=pos[b], pc=pos[c];
        const minAng = minAngle2D(pa, pb, pc);
        if (minAng < worstAng) { worstAng = minAng; worstIdx = fi; }
      }

      if (worstIdx < 0 || worstAng >= targetMinAngle) break;

      const [a, b, c] = tri[worstIdx];
      const pa=pos[a], pb=pos[b], pc=pos[c];
      const R = circumradius2D(pa, pb, pc);
      const l = shortestEdge2D(pa, pb, pc);
      if (R / l < B && worstAng >= targetMinAngle * 0.6) break;

      const cc = circumcenter2D(pa, pb, pc);
      if (!cc) continue;

      let encroached = false;
      for (const ek of boundaryEdges) {
        const [u, v] = ek.split('_').map(Number);
        if (encroachesEdge(cc, u, v, pos)) {
          encroached = true;
          const pu = pos[u], pv = pos[v];
          const mid = [(pu[0]+pv[0])/2, (pu[1]+pv[1])/2, 0];
          const newIdx = pos.length;
          pos.push(mid);
          boundaryEdges.delete(ek);
          boundaryEdges.add(edgeKey(u, newIdx));
          boundaryEdges.add(edgeKey(v, newIdx));
          const faceIdx = findFaceWithEdge(tri, u, v);
          if (faceIdx >= 0) {
            const [fv0, fv1, fv2] = tri[faceIdx];
            const other = [fv0,fv1,fv2].find(x => x !== u && x !== v);
            tri[faceIdx] = [u, other, newIdx];
            tri.push([v, newIdx, other]);
          }
          break;
        }
      }
      if (encroached) continue;

      const newIdx = pos.length;
      pos.push(cc);
      tri[worstIdx] = [a, b, newIdx];
      tri.push([b, c, newIdx]);
      tri.push([c, a, newIdx]);

      let flipped = true;
      while (flipped) {
        flipped = false;
        const efm = buildEdgeFaceMap(tri);
        for (const [k, fiArr] of efm) {
          if (fiArr.length !== 2) continue;
          const [u, v] = k.split('_').map(Number);
          const f0 = tri[fiArr[0]], f1 = tri[fiArr[1]];
          const others = [];
          for (const x of f0) if (x !== u && x !== v) others.push(x);
          for (const x of f1) if (x !== u && x !== v) others.push(x);
          if (others.length !== 2) continue;
          const [p, q] = others;
          const ic = incircle2D(
            pos[u][0],pos[u][1], pos[v][0],pos[v][1],
            pos[p][0],pos[p][1], pos[q][0],pos[q][1]
          );
          if (ic > 1e-10) {
            tri[fiArr[0]] = [u, p, q];
            tri[fiArr[1]] = [v, q, p];
            flipped = true;
          }
        }
      }
    }

    return { positions: pos, faces: tri };
  }

  resetBtn.addEventListener('click', () => {
    if (!originalMeshData) {
      setStatus('请先加载网格', '#ffd38a');
      return;
    }
    currentMeshData = {
      positions: originalMeshData.positions.map(p => [p[0], p[1], p[2]]),
      faces: originalMeshData.faces.map(f => [f[0], f[1], f[2]])
    };
    const md = currentMeshData;
    showMesh(md, currentLabel + ' | ' + md.positions.length + ' 顶点 | ' + md.faces.length + ' 面');
    setStatus('已恢复原始网格', '#8cc4ff');
  });

  ruppertBtn.addEventListener('click', () => {
    if (!originalMeshData) {
      setStatus('请先选择字母或模型', '#ffd38a');
      return;
    }

    const minAngle = parseInt(minAngleSelect.value, 10);
    setStatus('Ruppert 三角化中...', '#ffb446');

    (async () => {
      try {
        const src = originalMeshData;
        let refined = null;
        let viaWasm = false;
        try {
          refined = await ruppertWasm(src.positions, src.faces, minAngle);
          viaWasm = !!(refined && refined.faces.length);
        } catch (e) {
          console.error('WASM Ruppert 失败', e);
        }
        if (!viaWasm) {
          refined = ruppertRefine(src.positions, src.faces, minAngle, 200);
          refined.positions = refined.positions.map(p => [p[0], p[1], p[2] != null ? p[2] : 0]);
        }
        currentMeshData = refined;

        const info = 'Ruppert' + (viaWasm ? ' (CDT/WASM)' : ' (JS)')
          + ': ' + refined.positions.length + ' 顶点 | ' + refined.faces.length
          + ' 面 (最小角 ≥ ' + minAngle + '°)'
          + (refined.ms ? ' | ' + refined.ms.toFixed(1) + ' ms' : '');
        showMesh(refined, info);
        setStatus('Ruppert 三角化完成', '#89f0b6');
      } catch (err) {
        console.error(err);
        setStatus('三角化失败: ' + err.message, '#ff9d9d');
      }
    })();
  });

  async function loadMesh(path, label) {
    setStatus('加载中...', '#ffd38a');
    try {
      const obj = await new Promise((resolve, reject) => {
        const loader = new THREE.OBJLoader();
        loader.load(path, resolve, undefined, () => reject(new Error('加载失败')));
      });

      const allPos = [];
      const allFaces = [];
      let vertOffset = 0;
      obj.traverse(function(child) {
        if (!child.isMesh || !child.geometry) return;
        const data = extractMeshData(child.geometry);
        for (const p of data.positions) allPos.push([p[0], p[1], p[2]]);
        for (const f of data.faces) allFaces.push([f[0]+vertOffset, f[1]+vertOffset, f[2]+vertOffset]);
        vertOffset += data.positions.length;
      });

      if (allPos.length === 0) throw new Error('模型无数据');
      const meshData = { positions: allPos, faces: allFaces };

      originalMeshData = {
        positions: meshData.positions.map(p => [p[0], p[1], p[2]]),
        faces: meshData.faces.map(f => [f[0], f[1], f[2]])
      };
      currentMeshData = {
        positions: meshData.positions.map(p => [p[0], p[1], p[2]]),
        faces: meshData.faces.map(f => [f[0], f[1], f[2]])
      };
      currentLabel = label;

      showMesh(currentMeshData, label + ' | ' + meshData.positions.length + ' 顶点 | ' + meshData.faces.length + ' 面');
      fitCamera(meshData.positions);
      setStatus('已加载 ' + label + '，点击 Ruppert 三角化', '#89f0b6');
    } catch (err) {
      console.error(err);
      setStatus('加载失败: ' + err.message, '#ff9d9d');
    }
  }

  for (let i = 65; i <= 90; i++) {
    const letter = String.fromCharCode(i);
    const opt = document.createElement('option');
    opt.value = letter;
    opt.textContent = letter;
    letterSelect.appendChild(opt);
  }
  letterSelect.addEventListener('change', () => {
    const letter = letterSelect.value;
    loadMesh('assets/charaters/' + letter + '_2d.obj', '字母 ' + letter);
  });

  function resize() {
    const rect = document.getElementById('main-panel').getBoundingClientRect();
    renderer.setSize(rect.width, rect.height, false);
    const a = rect.width / Math.max(rect.height, 1);
    const curHalf = (camera.right - camera.left) / 2;
    camera.left = -curHalf * a;
    camera.right = curHalf * a;
    camera.top = curHalf;
    camera.bottom = -curHalf;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  resize();
  initRuppertWasm();
  letterSelect.value = 'A';
  loadMesh('assets/charaters/A_2d.obj', '字母 A');
  animate();
})();
</script>
</body>
</html>
