<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流体模拟 — Batty 3D 自由液面</title>
  <script src="assets/js/wasm-loader.js"></script>
  <script src="assets/wasm/fluid3d.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #060b14;
      color: #d8def7;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 18px;
      background: rgba(9, 15, 28, 0.96);
      border-bottom: 1px solid rgba(106, 132, 255, 0.18);
    }
    .toolbar h1 { margin: 0; font-size: 16px; font-weight: 600; color: #eef2ff; }
    .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c6d1f4; }
    select, button, a.btn {
      border: 1px solid rgba(106, 132, 255, 0.25);
      background: #121b31; color: #eef2ff;
      border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer;
      text-decoration: none;
    }
    button:hover, a.btn:hover { background: #172546; }
    button.active {
      background: linear-gradient(135deg, #3d6bff, #6a84ff);
      border-color: transparent; color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-left: auto; font-size: 13px; color: #8cc4ff; min-width: 200px; text-align: right; }
    .canvas-wrap { position: relative; flex: 1; min-height: 0; }
    #canvas-container { width: 100%; height: 100%; }
    .hud {
      position: absolute; left: 14px; bottom: 14px;
      padding: 10px 12px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 12px; color: #a8b4d8; line-height: 1.6;
      pointer-events: none; max-width: 360px;
    }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 11, 20, 0.85); font-size: 14px; color: #8cc4ff; z-index: 2;
    }
    .loading.hidden { display: none; }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <h1>流体模拟</h1>
    <button type="button" id="btn-pause" class="active">暂停</button>
    <button type="button" id="btn-reset">重置</button>
    <label>分辨率
      <select id="res-select">
        <option value="24">24³</option>
        <option value="28">28³</option>
        <option value="32" selected>32³</option>
      </select>
    </label>
    <a class="btn" href="/fluid-sim-notes/" target="_blank" rel="noopener">算法笔记</a>
    <span class="status" id="status">加载中…</span>
  </div>
  <div class="canvas-wrap">
    <div id="canvas-container"></div>
    <div class="hud">
      Batty 3D 无粘自由液面：MAC 网格 + 标记粒子 + 变分压力投影（WASM）<br>
      拖拽旋转 · 滚轮缩放 · 球壳内液滴受重力下落
    </div>
    <div class="loading" id="loading">正在加载 WASM 求解器…</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DT = 0.01;
const statusEl = document.getElementById('status');
const loadingEl = document.getElementById('loading');
const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const resSelect = document.getElementById('res-select');

let module = null;
let paused = false;
let points = null;
let positionsAttr = null;
let maxParticles = 0;
let lastMs = 0;

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060b14);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 20);
camera.position.set(1.35, 1.1, 1.55);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 0.5, 0.5);
controls.enableDamping = true;
controls.update();

scene.add(new THREE.AmbientLight(0x8899cc, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.85);
key.position.set(1.2, 2.0, 1.0);
scene.add(key);

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const boxEdges = new THREE.EdgesGeometry(boxGeo);
const box = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({ color: 0x3a4a78 }));
box.position.set(0.5, 0.5, 0.5);
scene.add(box);

const shell = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 48, 32),
  new THREE.MeshBasicMaterial({
    color: 0x6a84ff,
    transparent: true,
    opacity: 0.12,
    wireframe: true,
  })
);
shell.position.set(0.5, 0.5, 0.5);
scene.add(shell);

function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
resize();

function ensurePoints(count) {
  if (points && maxParticles >= count) return;
  if (points) scene.remove(points);
  maxParticles = Math.max(count, 1024);
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(maxParticles * 3);
  positionsAttr = new THREE.BufferAttribute(arr, 3);
  positionsAttr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', positionsAttr);
  geo.setDrawRange(0, count);
  const mat = new THREE.PointsMaterial({
    color: 0x5ec8ff,
    size: 0.018,
    sizeAttenuation: true,
  });
  points = new THREE.Points(geo, mat);
  scene.add(points);
}

function syncParticles() {
  if (!module) return;
  const count = module.ccall('fluid3d_particle_count', 'number', [], []);
  const ptr = module.ccall('fluid3d_particles_ptr', 'number', [], []);
  const radius = module.ccall('fluid3d_particle_radius', 'number', [], []);
  if (!ptr || count <= 0) {
    if (points) points.geometry.setDrawRange(0, 0);
    return;
  }
  ensurePoints(count);
  if (points.material.size !== Math.max(radius * 1.6, 0.012)) {
    points.material.size = Math.max(radius * 1.6, 0.012);
  }
  const heap = module.HEAPF32;
  const start = ptr >> 2;
  const dst = positionsAttr.array;
  for (let i = 0; i < count * 3; ++i) dst[i] = heap[start + i];
  positionsAttr.needsUpdate = true;
  points.geometry.setDrawRange(0, count);
  return count;
}

function setStatus(extra) {
  const count = module ? module.ccall('fluid3d_particle_count', 'number', [], []) : 0;
  const res = module ? module.ccall('fluid3d_resolution', 'number', [], []) : 0;
  statusEl.textContent = `${res}³ · ${count} 粒子 · ${lastMs.toFixed(1)} ms` + (extra ? ` · ${extra}` : '');
}

async function initSim(res) {
  loadingEl.classList.remove('hidden');
  loadingEl.textContent = `初始化 ${res}³ 网格…`;
  btnReset.disabled = true;
  resSelect.disabled = true;
  await new Promise((r) => setTimeout(r, 30));
  const t0 = performance.now();
  module.ccall('fluid3d_init', 'number', ['number'], [res]);
  lastMs = performance.now() - t0;
  syncParticles();
  setStatus('就绪');
  loadingEl.classList.add('hidden');
  btnReset.disabled = false;
  resSelect.disabled = false;
}

btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? '继续' : '暂停';
  btnPause.classList.toggle('active', !paused);
});

btnReset.addEventListener('click', async () => {
  if (!module) return;
  const t0 = performance.now();
  module.ccall('fluid3d_reset', 'number', [], []);
  lastMs = performance.now() - t0;
  syncParticles();
  setStatus('已重置');
});

resSelect.addEventListener('change', async () => {
  const res = parseInt(resSelect.value, 10);
  await initSim(res);
});

function frame() {
  requestAnimationFrame(frame);
  if (module && !paused) {
    const t0 = performance.now();
    module.ccall('fluid3d_advance', null, ['number'], [DT]);
    lastMs = performance.now() - t0;
    syncParticles();
    setStatus(paused ? '暂停' : '');
  }
  controls.update();
  renderer.render(scene, camera);
}

async function boot() {
  try {
    if (typeof Fluid3DSolver !== 'function') {
      throw new Error('Fluid3DSolver 未加载，请先编译 assets/wasm/fluid3d.js');
    }
    module = await Fluid3DSolver({
      locateFile: (p) => 'assets/wasm/' + p,
    });
    await initSim(parseInt(resSelect.value, 10));
    frame();
  } catch (err) {
    console.error(err);
    loadingEl.textContent = '加载失败：' + (err && err.message ? err.message : String(err));
    statusEl.textContent = '错误';
  }
}

boot();
</script>
</body>
</html>
