<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <style>@import url(/public/css/syntax/{{ site.highlighter-theme }}.css);</style>
  <title>{{ site.title }}</title>
  <!-- <link href="/public/css/bootstrap.min.css" rel="stylesheet"> -->

  <link href="/public/css/style.css" rel="stylesheet">
  <body>
  	{% unless page.date %}
  	<canvas id="particle-canvas"></canvas>
  	{% endunless %}
  	<div class="container"> 
		<div class="sidebar">
			{% include sidebar.html %}
		</div>
		<div class="content">
      <!-- <canvas id="particle-canvas"></canvas> -->
			{{ content }}
		</div>
	</div>
	<script>
		MathJax = {
			tex: {
				inlineMath: [['$', '$'], ['\\(', '\\)']], // 同时支持 $ 和 \( \)
				displayMath: [['$$', '$$'], ['\\[', '\\]']]
			  }
		};
  function typeWriterLoop(text, elementId, speed, holdMs) {
    let i = 0;
    let deleting = false;
    const placeholder = "&nbsp;";
    const element = document.getElementById(elementId);
    if (!element) return;
    element.innerHTML = placeholder;

    function tick() {
      if (!deleting) {
        if (i < text.length) {
          i++;
          element.innerHTML = text.slice(0, i);
          setTimeout(tick, speed);
        } else {
          deleting = true;
          setTimeout(tick, holdMs);
        }
      } else {
        if (i > 0) {
          i--;
          element.innerHTML = i === 0 ? placeholder : text.slice(0, i);
          setTimeout(tick, Math.max(40, speed / 2));
        } else {
          deleting = false;
          setTimeout(tick, Math.max(120, speed));
        }
      }
    }

    tick();
  }
  
  // 页面加载完成后执行打字机效果
  window.addEventListener('load', function() {
    typeWriterLoop("学中有乐玩中有学", "typewriter", 180, 1300);
  });
	  </script>
    {% unless page.date %}
    <script src="/assets/js/particles.js"></script>
    {% endunless %}
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
	  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

</html>
