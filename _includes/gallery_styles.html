<style>
  * { -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 13px/140% Arial, sans-serif;
    background: #0a0c12;
    color: #d5daf0;
    overflow: hidden;
  }
  a { color: #7ec8e3; cursor: pointer; }
  img.texture { display: none; }

  .container { display: flex; height: 100vh; }
  .canvas-panel { flex: 1; position: relative; overflow: hidden; min-width: 0; }

  /* 拖拽分隔条 */
  .resize-handle {
    width: 6px;
    cursor: col-resize;
    background: transparent;
    position: relative;
    flex-shrink: 0;
    z-index: 10;
    transition: background 0.15s;
  }
  .resize-handle {
    background: rgba(0,0,0,0.15);
  }
  .resize-handle::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 40px;
    border-radius: 1px;
    background: rgba(0,0,0,0.2);
    transition: background 0.15s, height 0.15s;
  }
  .resize-handle:hover::after,
  .resize-handle.dragging::after {
    background: rgba(0,120,200,0.5);
    height: 56px;
  }

  .help-panel {
    width: 380px;
    flex-shrink: 0;
    background: #fdfdfd;
    border-left: 1px solid #e0e0e0;
    overflow-y: auto;
    padding: 28px 24px;
    color: #2c3e50;
    font-size: 14px;
    line-height: 1.75;
    font-family: 'Gelasio', 'Nanum Myeongjo', 'Noto Serif SC', 'Source Han Serif SC', serif;
  }
  .help-panel h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin: 0 0 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
  .help-panel h2 { font-size: 18px; font-weight: 600; color: #1a1a2e; margin: 24px 0 10px; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0; }
  .help-panel h2:first-child, .help-panel h1:first-child { margin-top: 0; }
  .help-panel h3 { font-size: 15px; color: #333; margin: 16px 0 8px; font-weight: 600; }
  .help-panel h4 { font-size: 14px; color: #555; margin: 12px 0 6px; }
  .help-panel p { margin: 10px 0; }
  .help-panel img { max-width: 100%; display: block; margin: 12px 0; border-radius: 4px; border: 1px solid #eee; }
  .help-panel blockquote {
    margin: 12px 0; padding: 10px 16px;
    border-left: 3px solid #007bff;
    background: #f0f4f8;
    color: #4a5568;
    font-style: italic;
  }
  .help-panel ul, .help-panel ol { margin: 8px 0; padding-left: 22px; }
  .help-panel li { margin: 4px 0; }
  .help-panel a { color: #007bff; }
  .help-panel pre {
    background: #1e1e2e; padding: 14px 16px; border-radius: 6px;
    overflow-x: auto; font-size: 13px; line-height: 1.55; margin: 12px 0;
    border: 1px solid #e8e8e8;
  }
  .help-panel code { color: #d63384; font-size: 0.9em; background: #f8f8f8; padding: 1px 4px; border-radius: 3px; }
  .help-panel pre code { color: #cdd6f4; background: transparent; padding: 0; }
  .help-panel small { color: #888; font-size: 12px; display: block; margin: 8px 0; }
  .help-panel table {
    width: 100%; border-collapse: collapse; margin: 12px 0;
    font-size: 13px;
  }
  .help-panel th, .help-panel td {
    padding: 8px 12px; text-align: left;
    border: 1px solid #e0e0e0;
  }
  .help-panel th { background: #f5f5f5; color: #333; font-weight: 600; }
  .help-panel tr:nth-child(even) { background: #fafafa; }
  .help-panel hr { border: none; border-top: 1px solid #e8e8e8; margin: 20px 0; }
  .help-panel strong { color: #1a1a2e; }
  .help-panel em { color: #555; }

  .help-panel .MathJax { color: #2c3e50; }

  @media (max-width: 768px) {
    .container { flex-direction: column; }
    .canvas-panel { flex: none; height: 55vh; }
    .resize-handle { display: none; }
    .help-panel { width: 100% !important; flex: 1; }
  }

  /* Not Ready 占位页面 */
  .gallery-not-ready {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 40px 24px;
  }
  .gallery-not-ready-icon {
    font-size: 64px;
    margin-bottom: 20px;
    opacity: 0.6;
  }
  .gallery-not-ready-title {
    font-size: 28px;
    font-weight: 700;
    color: #d5daf0;
    margin: 0 0 12px;
  }
  .gallery-not-ready-desc {
    font-size: 15px;
    color: #8b949e;
    max-width: 480px;
    line-height: 1.6;
    margin: 6px 0;
  }
  .gallery-not-ready-back {
    display: inline-block;
    margin-top: 28px;
    padding: 10px 24px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #8b949e;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s;
  }
  .gallery-not-ready-back:hover {
    border-color: #58a6ff;
    color: #58a6ff;
    background: rgba(88,166,255,0.06);
  }
</style>
