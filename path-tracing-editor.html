<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% include algo_demo_models_dir.html id="path-tracing-editor" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路径追踪场景编辑器</title>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #060b14;
      color: #c6d1f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
      padding: 8px 12px; flex-shrink: 0;
      background: #0a1020;
      border-bottom: 1px solid rgba(106,132,255,0.15);
    }
    .toolbar h1 {
      font-size: 15px; font-weight: 600; margin: 0 6px 0 0;
      background: linear-gradient(90deg, #8b9cff, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .toolbar label { font-size: 12px; color: #8a9dd4; display: inline-flex; align-items: center; gap: 6px; }
    .toolbar select, .toolbar input[type="number"], .toolbar input[type="text"], .toolbar input[type="color"] {
      padding: 5px 8px; border-radius: 7px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #0d1528; color: #eef2ff; font-size: 12px;
    }
    .toolbar input[type="color"] { width: 34px; height: 28px; padding: 2px; }
    .toolbar button, .side button {
      padding: 6px 12px; border-radius: 7px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #111b31; color: #c6d1f4;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .toolbar button:hover, .side button:hover { background: #1a2848; border-color: rgba(106,132,255,0.55); }
    .toolbar button.active { border-color: #ff8f5e; color: #ffd7c2; background: #1a2848; }
    .toolbar button.primary {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8f5e 100%);
      color: #fff; border: none;
    }
    .toolbar .sep { width: 1px; height: 22px; background: rgba(106,132,255,0.2); margin: 0 2px; }
    .toolbar .spacer { flex: 1; }
    .toolbar .hint { font-size: 11px; color: #5a6791; }
    .main { flex: 1; min-height: 0; display: flex; }
    .side {
      width: 230px; flex-shrink: 0;
      background: #080e1a;
      border-right: 1px solid rgba(106,132,255,0.12);
      display: flex; flex-direction: column; min-height: 0;
    }
    .side.right { border-right: none; border-left: 1px solid rgba(106,132,255,0.12); width: 280px; }
    .side-hd {
      padding: 10px 12px; font-size: 12px; font-weight: 700; color: #9eb4ff;
      border-bottom: 1px solid rgba(106,132,255,0.1); letter-spacing: 0.02em;
    }
    .obj-list { flex: 1; overflow-y: auto; padding: 6px; }
    .obj-item {
      padding: 8px 10px; margin-bottom: 4px; border-radius: 8px;
      background: #0d1528; border: 1px solid transparent;
      cursor: pointer; font-size: 12px;
    }
    .obj-item:hover { border-color: rgba(106,132,255,0.35); }
    .obj-item.selected { border-color: #6a84ff; background: #152040; }
    .obj-item .kind { color: #7a83a8; font-size: 10px; margin-right: 6px; }
    .viewport { flex: 1; min-width: 0; position: relative; background: #050910; }
    #c3d { display: block; width: 100%; height: 100%; }
    .props { flex: 1; overflow-y: auto; padding: 10px 12px 16px; }
    .props .group { margin-bottom: 14px; }
    .props .group h3 {
      font-size: 11px; color: #8a9dd4; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
    .row label { font-size: 12px; color: #8a9dd4; min-width: 52px; }
    .row input, .row select {
      flex: 1; min-width: 0;
      padding: 5px 8px; border-radius: 6px;
      border: 1px solid rgba(106,132,255,0.28);
      background: #0d1528; color: #eef2ff; font-size: 12px;
    }
    .row input[type="color"] { flex: 0; width: 36px; height: 28px; padding: 2px; }
    .row input[type="checkbox"] { flex: 0; width: auto; }
    .row .triplet { display: flex; gap: 4px; flex: 1; }
    .row .triplet input { width: 0; flex: 1; }
    .muted { font-size: 11px; color: #5a6791; line-height: 1.45; }
    .status-bar {
      padding: 4px 12px; font-size: 11px; color: #7a83a8;
      border-top: 1px solid rgba(106,132,255,0.1); background: #080e1a;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <h1>路径追踪场景编辑</h1>
    <button type="button" id="btn-new">新建</button>
    <button type="button" id="btn-open">打开 JSON</button>
    <input type="file" id="file-json" accept="application/json,.json" class="hidden">
    <label>预设
      <select id="preset-sel"><option value="">加载中…</option></select>
    </label>
    <button type="button" id="btn-export">导出 JSON</button>
    <button type="button" id="btn-render" class="primary">送去渲染</button>
    <div class="sep"></div>
    <button type="button" id="btn-add-sphere">+ 球体</button>
    <label>OBJ
      <select id="obj-sel"></select>
    </label>
    <button type="button" id="btn-add-obj">+ 添加 OBJ</button>
    <div class="sep"></div>
    <button type="button" id="mode-t" class="active" data-mode="translate">移动 W</button>
    <button type="button" id="mode-r" data-mode="rotate">旋转 E</button>
    <button type="button" id="mode-s" data-mode="scale">缩放 R</button>
    <button type="button" id="btn-del">删除</button>
    <div class="spacer"></div>
    <a class="hint" href="/cpu-path-tracing.html" target="_blank" rel="noopener">打开路径追踪 →</a>
  </div>
  <div class="main">
    <aside class="side">
      <div class="side-hd">物体列表</div>
      <div class="obj-list" id="obj-list"></div>
    </aside>
    <div class="viewport">
      <canvas id="c3d"></canvas>
    </div>
    <aside class="side right">
      <div class="side-hd">属性</div>
      <div class="props" id="props">
        <div class="group" id="prop-object">
          <h3>选中物体</h3>
          <p class="muted" id="prop-empty">未选中。点击视口或左侧列表。</p>
          <div id="prop-body" class="hidden">
            <div class="row"><label>名称</label><input type="text" id="p-name"></div>
            <div class="row" id="row-radius"><label>半径</label><input type="number" id="p-radius" min="0.01" step="0.05"></div>
            <div class="row" id="row-trimax" class="hidden"><label>triMax</label><input type="number" id="p-trimax" min="100" step="1000"></div>
            <div class="row"><label>材质</label>
              <select id="p-mat">
                <option value="diffuse">diffuse</option>
                <option value="specular">specular</option>
                <option value="dielectric">dielectric</option>
                <option value="conductor">conductor</option>
                <option value="emissive">emissive</option>
              </select>
            </div>
            <div class="row"><label>albedo</label><input type="color" id="p-albedo-color" value="#cccccc">
              <div class="triplet">
                <input type="number" id="p-ar" step="0.05" title="R">
                <input type="number" id="p-ag" step="0.05" title="G">
                <input type="number" id="p-ab" step="0.05" title="B">
              </div>
            </div>
            <div class="row"><label>rough</label><input type="number" id="p-rough" min="0" max="1" step="0.01"></div>
            <div class="row"><label>eta</label><input type="number" id="p-eta" min="1" step="0.05"></div>
          </div>
        </div>
        <div class="group">
          <h3>相机（路径追踪）</h3>
          <div class="row"><label>FOV°</label><input type="number" id="cam-fov" min="10" max="120" step="1"></div>
          <button type="button" id="btn-capture-cam" style="width:100%;margin-bottom:6px">从当前视角捕获</button>
          <p class="muted">捕获当前 Orbit 相机的 eye / target / fov，供路径追踪使用。</p>
        </div>
        <div class="group">
          <h3>地面 Floor</h3>
          <div class="row"><label>启用</label><input type="checkbox" id="fl-enabled"></div>
          <div class="row"><label>Y</label><input type="number" id="fl-y" step="0.1"></div>
          <div class="row"><label>棋盘</label><input type="checkbox" id="fl-checker"></div>
          <div class="row"><label>scale</label><input type="number" id="fl-scale" min="0.01" step="0.1"></div>
          <div class="row"><label>c0</label><input type="color" id="fl-c0"></div>
          <div class="row"><label>c1</label><input type="color" id="fl-c1"></div>
        </div>
        <div class="group">
          <h3>天空 Sky</h3>
          <div class="row"><label>bottom</label><input type="color" id="sk-bottom"></div>
          <div class="row"><label>top</label><input type="color" id="sk-top"></div>
          <div class="row"><label>sunDir</label>
            <div class="triplet">
              <input type="number" id="sk-sx" step="0.05">
              <input type="number" id="sk-sy" step="0.05">
              <input type="number" id="sk-sz" step="0.05">
            </div>
          </div>
          <div class="row"><label>sunPow</label><input type="number" id="sk-pow" step="0.5"></div>
          <div class="row"><label>sunExp</label><input type="number" id="sk-exp" step="1"></div>
          <div class="row"><label>gain</label><input type="number" id="sk-gain" step="0.05"></div>
        </div>
      </div>
    </aside>
  </div>
  <div class="status-bar" id="status">就绪</div>
</div>

<script>
(function () {
  'use strict';

  const MODELS_DIR = (window.ALGO_MODELS_DIR || 'assets/Models2').replace(/^\/+|\/+$/g, '');
  const LS_KEY = 'pt_editor_scene';
  const MODEL_FILES = {
    kitten: { label: 'Kitten', file: 'kitten_F18894.obj' },
    bunny: { label: 'Bunny', file: 'bunny_F28576.obj' },
    elephant: { label: 'Elephant', file: 'elephant.obj' },
    torus: { label: 'Torus', file: 'torus_F7680.obj' },
    'double-torus': { label: 'Double Torus', file: 'double-torus_F6144.obj' },
    '3holes': { label: '3 Holes', file: '3holes_F7200.obj' },
    'rocker-arm': { label: 'Rocker Arm', file: 'rocker-arm_F20088.obj' },
    costa: { label: 'Costa', file: 'costa.obj' },
    soccerball: { label: 'Soccerball', file: 'soccerball_F57600.obj' }
  };

  const canvas = document.getElementById('c3d');
  const statusEl = document.getElementById('status');
  const objListEl = document.getElementById('obj-list');
  const objSel = document.getElementById('obj-sel');
  const presetSel = document.getElementById('preset-sel');

  let uid = 1;
  function nextId(prefix) { return prefix + '-' + (uid++); }

  function assetUrl(p) {
    if (!p) return p;
    const s = String(p);
    if (/^(https?:)?\/\//i.test(s) || s.startsWith('data:') || s.startsWith('blob:')) return s;
    return s.replace(/^\//, '');
  }

  function rgbToHex(rgb) {
    const c = function (x) {
      const v = Math.max(0, Math.min(255, Math.round((+x || 0) * 255)));
      return v.toString(16).padStart(2, '0');
    };
    return '#' + c(rgb[0]) + c(rgb[1]) + c(rgb[2]);
  }

  function hexToRgb01(hex) {
    const h = (hex || '#ffffff').replace('#', '');
    return [
      parseInt(h.slice(0, 2), 16) / 255,
      parseInt(h.slice(2, 4), 16) / 255,
      parseInt(h.slice(4, 6), 16) / 255
    ];
  }

  function defaultMaterial(type) {
    const t = type || 'diffuse';
    if (t === 'emissive') return { type: 'emissive', albedo: [4, 4, 3.5], rough: 0, eta: 1 };
    if (t === 'dielectric') return { type: 'dielectric', albedo: [0.98, 0.98, 0.95], rough: 0.05, eta: 1.5 };
    if (t === 'specular') return { type: 'specular', albedo: [0.95, 0.95, 0.95], rough: 0.02, eta: 1.5 };
    if (t === 'conductor') return { type: 'conductor', albedo: [0.92, 0.78, 0.45], rough: 0.2, eta: 1 };
    return { type: 'diffuse', albedo: [0.75, 0.75, 0.78], rough: 1, eta: 1 };
  }

  function cloneMat(m) {
    return {
      type: m.type || 'diffuse',
      albedo: (m.albedo || [0.8, 0.8, 0.8]).slice(0, 3),
      rough: m.rough != null ? +m.rough : 0.05,
      eta: m.eta != null ? +m.eta : 1.5
    };
  }

  // ——— Three.js setup ———
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x0a1020, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 500);
  camera.position.set(4, 3, 7);

  const orbit = new THREE.OrbitControls(camera, canvas);
  orbit.enableDamping = true;
  orbit.target.set(0, 1, 0);

  const hemi = new THREE.HemisphereLight(0xb0c4ff, 0x223344, 0.85);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.65);
  dir.position.set(4, 8, 3);
  scene.add(dir);

  const grid = new THREE.GridHelper(20, 20, 0x3a4a7a, 0x1a2438);
  grid.position.y = 0.001;
  scene.add(grid);

  const floorMesh = new THREE.Mesh(
    new THREE.PlaneBufferGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.05, metalness: 0.05, side: THREE.DoubleSide })
  );
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.receiveShadow = true;
  floorMesh.userData.isFloor = true;
  scene.add(floorMesh);

  // Path-tracing camera gizmo
  const ptCamGroup = new THREE.Group();
  const ptEyeHelper = new THREE.Mesh(
    new THREE.ConeBufferGeometry(0.12, 0.28, 12),
    new THREE.MeshBasicMaterial({ color: 0xff8f5e })
  );
  ptEyeHelper.rotation.x = Math.PI / 2;
  const ptTargetHelper = new THREE.Mesh(
    new THREE.SphereBufferGeometry(0.08, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0x6a84ff })
  );
  const ptCamLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xffb08a })
  );
  ptCamGroup.add(ptEyeHelper);
  ptCamGroup.add(ptTargetHelper);
  ptCamGroup.add(ptCamLine);
  scene.add(ptCamGroup);

  const transform = new THREE.TransformControls(camera, canvas);
  transform.setSize(0.85);
  scene.add(transform);
  transform.addEventListener('dragging-changed', function (e) {
    orbit.enabled = !e.value;
  });
  transform.addEventListener('objectChange', function () {
    syncSelectedFromObject();
    refreshListLabels();
  });

  const objLoader = new THREE.OBJLoader();
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  // ——— Scene model ———
  const state = {
    camera: { eye: [4, 3, 7], target: [0, 1, 0], fovDeg: 45 },
    sky: {
      bottom: [0.06, 0.07, 0.12],
      top: [0.45, 0.62, 0.95],
      sunDir: [0.35, 0.85, 0.35],
      sunPow: 8,
      sunExp: 120,
      gain: 1.1
    },
    floor: {
      enabled: true, y: 0, checker: true, scale: 0.5,
      c0: [0.28, 0.28, 0.30], c1: [0.42, 0.42, 0.44]
    },
    items: []
  };
  let selectedId = null;
  let suppressUI = false;

  function setStatus(msg) { statusEl.textContent = msg; }

  function makePreviewMaterial(mat) {
    const m = cloneMat(mat);
    const col = new THREE.Color(
      Math.min(1, m.albedo[0]),
      Math.min(1, m.albedo[1]),
      Math.min(1, m.albedo[2])
    );
    if (m.type === 'emissive') {
      const intensity = Math.max(m.albedo[0], m.albedo[1], m.albedo[2], 1);
      return new THREE.MeshStandardMaterial({
        color: 0x222222,
        emissive: col,
        emissiveIntensity: Math.min(8, intensity),
        roughness: 1,
        metalness: 0
      });
    }
    if (m.type === 'specular') {
      return new THREE.MeshStandardMaterial({ color: col, metalness: 0.95, roughness: Math.max(0.02, m.rough) });
    }
    if (m.type === 'conductor') {
      return new THREE.MeshStandardMaterial({ color: col, metalness: 1.0, roughness: Math.max(0.05, m.rough) });
    }
    if (m.type === 'dielectric') {
      return new THREE.MeshStandardMaterial({
        color: col, metalness: 0, roughness: Math.max(0.02, m.rough),
        transparent: true, opacity: 0.45
      });
    }
    return new THREE.MeshStandardMaterial({ color: col, metalness: 0.05, roughness: Math.max(0.35, m.rough) });
  }

  function applyMatToObject(obj, mat) {
    const preview = makePreviewMaterial(mat);
    obj.traverse(function (ch) {
      if (ch.isMesh) {
        if (ch.material && ch.material.dispose) ch.material.dispose();
        ch.material = preview.clone ? preview.clone() : preview;
      }
    });
    if (preview.dispose) preview.dispose();
  }

  function updateFloorVisual() {
    const f = state.floor;
    floorMesh.visible = !!f.enabled;
    floorMesh.position.y = f.y;
    grid.position.y = f.y + 0.001;
    const tex = makeCheckerTexture(f.c0, f.c1, f.checker, f.scale);
    if (floorMesh.material.map) floorMesh.material.map.dispose();
    floorMesh.material.map = tex;
    floorMesh.material.color.set(0xffffff);
    floorMesh.material.needsUpdate = true;
  }

  function makeCheckerTexture(c0, c1, checker, scale) {
    const size = 256;
    const cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    const ctx = cv.getContext('2d');
    if (!checker) {
      ctx.fillStyle = rgbToHex(c0);
      ctx.fillRect(0, 0, size, size);
    } else {
      const cells = Math.max(2, Math.min(32, Math.round(8 * (scale || 1))));
      const cell = size / cells;
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          ctx.fillStyle = rgbToHex(((x + y) & 1) ? c1 : c0);
          ctx.fillRect(x * cell, y * cell, cell + 1, cell + 1);
        }
      }
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4, 4);
    return tex;
  }

  function updateSkyVisual() {
    const sk = state.sky;
    const top = new THREE.Color(sk.top[0], sk.top[1], sk.top[2]);
    const bottom = new THREE.Color(sk.bottom[0], sk.bottom[1], sk.bottom[2]);
    renderer.setClearColor(top, 1);
    hemi.color.copy(top);
    hemi.groundColor.copy(bottom);
    dir.position.set(sk.sunDir[0], sk.sunDir[1], sk.sunDir[2]).normalize().multiplyScalar(10);
  }

  function updatePtCamGizmo() {
    const eye = state.camera.eye;
    const target = state.camera.target;
    ptEyeHelper.position.set(eye[0], eye[1], eye[2]);
    ptTargetHelper.position.set(target[0], target[1], target[2]);
    const dirv = new THREE.Vector3(target[0] - eye[0], target[1] - eye[1], target[2] - eye[2]).normalize();
    ptEyeHelper.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirv);
    const pos = ptCamLine.geometry.attributes.position;
    pos.setXYZ(0, eye[0], eye[1], eye[2]);
    pos.setXYZ(1, target[0], target[1], target[2]);
    pos.needsUpdate = true;
  }

  function findItem(id) {
    for (let i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) return state.items[i];
    }
    return null;
  }

  function selectItem(id) {
    selectedId = id;
    const item = findItem(id);
    if (item && item.object) {
      transform.attach(item.object);
    } else {
      transform.detach();
    }
    refreshList();
    fillObjectProps();
  }

  function refreshListLabels() {
    const nodes = objListEl.querySelectorAll('.obj-item');
    for (let i = 0; i < nodes.length; i++) {
      const id = nodes[i].dataset.id;
      const item = findItem(id);
      if (!item) continue;
      const nameEl = nodes[i].querySelector('.name');
      if (nameEl) nameEl.textContent = item.name;
    }
  }

  function refreshList() {
    objListEl.innerHTML = '';
    for (let i = 0; i < state.items.length; i++) {
      const it = state.items[i];
      const div = document.createElement('div');
      div.className = 'obj-item' + (it.id === selectedId ? ' selected' : '');
      div.dataset.id = it.id;
      div.innerHTML = '<span class="kind">' + (it.kind === 'sphere' ? '●' : '▲') + '</span><span class="name"></span>';
      div.querySelector('.name').textContent = it.name;
      div.addEventListener('click', function () { selectItem(it.id); });
      objListEl.appendChild(div);
    }
  }

  function syncSelectedFromObject() {
    const item = findItem(selectedId);
    if (!item || !item.object) return;
    if (item.kind === 'sphere') {
      const s = item.object.scale;
      const avg = (Math.abs(s.x) + Math.abs(s.y) + Math.abs(s.z)) / 3;
      item.radius = Math.max(0.01, (item.baseRadius || 1) * avg);
    }
  }

  function fillObjectProps() {
    const item = findItem(selectedId);
    const empty = document.getElementById('prop-empty');
    const body = document.getElementById('prop-body');
    if (!item) {
      empty.classList.remove('hidden');
      body.classList.add('hidden');
      return;
    }
    empty.classList.add('hidden');
    body.classList.remove('hidden');
    suppressUI = true;
    document.getElementById('p-name').value = item.name;
    document.getElementById('row-radius').classList.toggle('hidden', item.kind !== 'sphere');
    document.getElementById('row-trimax').classList.toggle('hidden', item.kind !== 'mesh');
    if (item.kind === 'sphere') document.getElementById('p-radius').value = item.radius;
    if (item.kind === 'mesh') document.getElementById('p-trimax').value = item.triMax || 20000;
    const m = item.material;
    document.getElementById('p-mat').value = m.type;
    document.getElementById('p-ar').value = m.albedo[0];
    document.getElementById('p-ag').value = m.albedo[1];
    document.getElementById('p-ab').value = m.albedo[2];
    document.getElementById('p-albedo-color').value = rgbToHex([
      Math.min(1, m.albedo[0]), Math.min(1, m.albedo[1]), Math.min(1, m.albedo[2])
    ]);
    document.getElementById('p-rough').value = m.rough;
    document.getElementById('p-eta').value = m.eta;
    suppressUI = false;
  }

  function readObjectPropsToItem() {
    if (suppressUI) return;
    const item = findItem(selectedId);
    if (!item) return;
    item.name = document.getElementById('p-name').value || item.name;
    item.material.type = document.getElementById('p-mat').value;
    item.material.albedo = [
      +document.getElementById('p-ar').value,
      +document.getElementById('p-ag').value,
      +document.getElementById('p-ab').value
    ];
    item.material.rough = +document.getElementById('p-rough').value;
    item.material.eta = +document.getElementById('p-eta').value;
    if (item.kind === 'sphere') {
      const r = Math.max(0.01, +document.getElementById('p-radius').value || 0.5);
      item.radius = r;
      item.baseRadius = 1;
      item.object.scale.set(r, r, r);
    }
    if (item.kind === 'mesh') {
      item.triMax = Math.max(100, +document.getElementById('p-trimax').value || 20000);
    }
    applyMatToObject(item.object, item.material);
    refreshListLabels();
  }

  function fillSceneProps() {
    suppressUI = true;
    document.getElementById('cam-fov').value = state.camera.fovDeg;
    const f = state.floor;
    document.getElementById('fl-enabled').checked = !!f.enabled;
    document.getElementById('fl-y').value = f.y;
    document.getElementById('fl-checker').checked = !!f.checker;
    document.getElementById('fl-scale').value = f.scale;
    document.getElementById('fl-c0').value = rgbToHex(f.c0);
    document.getElementById('fl-c1').value = rgbToHex(f.c1);
    const sk = state.sky;
    document.getElementById('sk-bottom').value = rgbToHex(sk.bottom);
    document.getElementById('sk-top').value = rgbToHex(sk.top);
    document.getElementById('sk-sx').value = sk.sunDir[0];
    document.getElementById('sk-sy').value = sk.sunDir[1];
    document.getElementById('sk-sz').value = sk.sunDir[2];
    document.getElementById('sk-pow').value = sk.sunPow;
    document.getElementById('sk-exp').value = sk.sunExp;
    document.getElementById('sk-gain').value = sk.gain;
    suppressUI = false;
  }

  function readSceneProps() {
    if (suppressUI) return;
    state.camera.fovDeg = +document.getElementById('cam-fov').value || 45;
    state.floor.enabled = document.getElementById('fl-enabled').checked;
    state.floor.y = +document.getElementById('fl-y').value;
    state.floor.checker = document.getElementById('fl-checker').checked;
    state.floor.scale = +document.getElementById('fl-scale').value || 1;
    state.floor.c0 = hexToRgb01(document.getElementById('fl-c0').value);
    state.floor.c1 = hexToRgb01(document.getElementById('fl-c1').value);
    state.sky.bottom = hexToRgb01(document.getElementById('sk-bottom').value);
    state.sky.top = hexToRgb01(document.getElementById('sk-top').value);
    state.sky.sunDir = [
      +document.getElementById('sk-sx').value,
      +document.getElementById('sk-sy').value,
      +document.getElementById('sk-sz').value
    ];
    state.sky.sunPow = +document.getElementById('sk-pow').value;
    state.sky.sunExp = +document.getElementById('sk-exp').value;
    state.sky.gain = +document.getElementById('sk-gain').value;
    updateFloorVisual();
    updateSkyVisual();
    updatePtCamGizmo();
  }

  function clearItems() {
    transform.detach();
    selectedId = null;
    for (let i = 0; i < state.items.length; i++) {
      const o = state.items[i].object;
      if (o) {
        scene.remove(o);
        o.traverse(function (ch) {
          if (ch.geometry) ch.geometry.dispose();
          if (ch.material) {
            if (Array.isArray(ch.material)) ch.material.forEach(function (m) { m.dispose && m.dispose(); });
            else if (ch.material.dispose) ch.material.dispose();
          }
        });
      }
    }
    state.items = [];
    refreshList();
    fillObjectProps();
  }

  function addSphereItem(opts) {
    opts = opts || {};
    const mat = cloneMat(opts.material || defaultMaterial('diffuse'));
    const radius = opts.radius != null ? +opts.radius : 0.6;
    const center = opts.center || [0, radius, 0];
    const mesh = new THREE.Mesh(
      new THREE.SphereBufferGeometry(1, 32, 24),
      makePreviewMaterial(mat)
    );
    mesh.position.set(center[0], center[1], center[2]);
    mesh.scale.set(radius, radius, radius);
    mesh.userData.selectable = true;
    scene.add(mesh);
    const item = {
      id: nextId('sphere'),
      kind: 'sphere',
      name: opts.name || ('Sphere ' + state.items.filter(function (x) { return x.kind === 'sphere'; }).length),
      material: mat,
      radius: radius,
      baseRadius: 1,
      object: mesh
    };
    mesh.userData.itemId = item.id;
    state.items.push(item);
    refreshList();
    selectItem(item.id);
    setStatus('已添加球体');
    return item;
  }

  function addMeshItem(opts, geometryRoot) {
    opts = opts || {};
    const mat = cloneMat(opts.material || defaultMaterial('diffuse'));
    const root = geometryRoot || new THREE.Group();
    applyMatToObject(root, mat);
    const tf = opts.transform || {};
    const t = tf.translate || [0, 0, 0];
    const s = tf.scale || [1, 1, 1];
    const r = tf.rotateDeg || [0, 0, 0];
    root.position.set(t[0], t[1], t[2]);
    root.scale.set(s[0], s[1], s[2]);
    root.rotation.set(r[0] * Math.PI / 180, r[1] * Math.PI / 180, r[2] * Math.PI / 180);
    root.userData.selectable = true;
    scene.add(root);
    const path = opts.path || '';
    const base = path.split('/').pop() || 'mesh';
    const item = {
      id: nextId('mesh'),
      kind: 'mesh',
      name: opts.name || base,
      material: mat,
      path: path,
      triMax: opts.triMax != null ? +opts.triMax : 20000,
      object: root
    };
    root.userData.itemId = item.id;
    root.traverse(function (ch) {
      if (ch.isMesh) ch.userData.itemId = item.id;
    });
    state.items.push(item);
    refreshList();
    selectItem(item.id);
    setStatus('已添加网格 ' + item.name);
    return item;
  }

  function loadObjAsGroup(path) {
    return new Promise(function (resolve, reject) {
      objLoader.load(
        assetUrl(path),
        function (obj) {
          // Normalize: center XZ, put bottom on y=0 of local space approximately
          const box = new THREE.Box3().setFromObject(obj);
          const size = new THREE.Vector3();
          box.getSize(size);
          const center = new THREE.Vector3();
          box.getCenter(center);
          obj.position.x -= center.x;
          obj.position.z -= center.z;
          obj.position.y -= box.min.y;
          const wrap = new THREE.Group();
          wrap.add(obj);
          resolve(wrap);
        },
        undefined,
        function (err) { reject(err); }
      );
    });
  }

  async function addObjFromCatalog() {
    const key = objSel.value;
    const meta = MODEL_FILES[key];
    if (!meta) { setStatus('请选择 OBJ'); return; }
    const path = '/' + MODELS_DIR + '/' + meta.file;
    setStatus('加载 ' + meta.file + ' …');
    try {
      const group = await loadObjAsGroup(path);
      addMeshItem({
        name: meta.label,
        path: path,
        triMax: 20000,
        material: defaultMaterial('diffuse'),
        transform: { translate: [0, 0, 0], scale: [1, 1, 1], rotateDeg: [0, 0, 0] }
      }, group);
    } catch (e) {
      console.error(e);
      setStatus('OBJ 加载失败: ' + e);
    }
  }

  function deleteSelected() {
    const item = findItem(selectedId);
    if (!item) return;
    transform.detach();
    if (item.object) {
      scene.remove(item.object);
      item.object.traverse(function (ch) {
        if (ch.geometry) ch.geometry.dispose();
      });
    }
    state.items = state.items.filter(function (x) { return x.id !== item.id; });
    selectedId = null;
    refreshList();
    fillObjectProps();
    setStatus('已删除');
  }

  function captureCamera() {
    state.camera.eye = [camera.position.x, camera.position.y, camera.position.z];
    state.camera.target = [orbit.target.x, orbit.target.y, orbit.target.z];
    state.camera.fovDeg = camera.fov;
    document.getElementById('cam-fov').value = camera.fov;
    updatePtCamGizmo();
    setStatus('已捕获相机 eye/target/fov');
  }

  function radToDeg3(euler) {
    return [
      euler.x * 180 / Math.PI,
      euler.y * 180 / Math.PI,
      euler.z * 180 / Math.PI
    ];
  }

  function exportSceneJson() {
    const spheres = [];
    const meshes = [];
    for (let i = 0; i < state.items.length; i++) {
      const it = state.items[i];
      const o = it.object;
      if (it.kind === 'sphere') {
        const s = o.scale;
        const avg = (Math.abs(s.x) + Math.abs(s.y) + Math.abs(s.z)) / 3;
        const radius = Math.max(0.01, (it.baseRadius || 1) * avg);
        spheres.push({
          center: [o.position.x, o.position.y, o.position.z],
          radius: radius,
          material: cloneMat(it.material)
        });
      } else if (it.kind === 'mesh') {
        meshes.push({
          type: 'obj',
          path: it.path,
          triMax: it.triMax || 20000,
          material: cloneMat(it.material),
          transform: {
            scale: [o.scale.x, o.scale.y, o.scale.z],
            rotateDeg: radToDeg3(o.rotation),
            translate: [o.position.x, o.position.y, o.position.z]
          }
        });
      }
    }
    return {
      meta: { source: 'path-tracing-editor', note: 'Edited in browser Three.js scene editor' },
      camera: {
        eye: state.camera.eye.slice(),
        target: state.camera.target.slice(),
        fovDeg: +state.camera.fovDeg
      },
      sky: {
        bottom: state.sky.bottom.slice(),
        top: state.sky.top.slice(),
        sunDir: state.sky.sunDir.slice(),
        sunPow: +state.sky.sunPow,
        sunExp: +state.sky.sunExp,
        gain: +state.sky.gain
      },
      floor: {
        enabled: !!state.floor.enabled,
        y: +state.floor.y,
        checker: !!state.floor.checker,
        scale: +state.floor.scale,
        c0: state.floor.c0.slice(),
        c1: state.floor.c1.slice()
      },
      spheres: spheres,
      meshes: meshes
    };
  }

  function downloadJson(obj, filename) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename || 'scene.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function importSceneJson(cfg) {
    clearItems();
    if (cfg.camera) {
      state.camera.eye = (cfg.camera.eye || state.camera.eye).slice();
      state.camera.target = (cfg.camera.target || state.camera.target).slice();
      state.camera.fovDeg = cfg.camera.fovDeg != null ? +cfg.camera.fovDeg : 45;
      camera.position.set(state.camera.eye[0], state.camera.eye[1], state.camera.eye[2]);
      orbit.target.set(state.camera.target[0], state.camera.target[1], state.camera.target[2]);
      camera.fov = state.camera.fovDeg;
      camera.updateProjectionMatrix();
      orbit.update();
    }
    if (cfg.sky) {
      state.sky.bottom = (cfg.sky.bottom || state.sky.bottom).slice();
      state.sky.top = (cfg.sky.top || state.sky.top).slice();
      state.sky.sunDir = (cfg.sky.sunDir || state.sky.sunDir).slice();
      if (cfg.sky.sunPow != null) state.sky.sunPow = +cfg.sky.sunPow;
      if (cfg.sky.sunExp != null) state.sky.sunExp = +cfg.sky.sunExp;
      if (cfg.sky.gain != null) state.sky.gain = +cfg.sky.gain;
    }
    if (cfg.floor) {
      state.floor.enabled = cfg.floor.enabled !== false;
      if (cfg.floor.y != null) state.floor.y = +cfg.floor.y;
      state.floor.checker = !!cfg.floor.checker;
      if (cfg.floor.scale != null) state.floor.scale = +cfg.floor.scale;
      if (cfg.floor.c0) state.floor.c0 = cfg.floor.c0.slice();
      if (cfg.floor.c1) state.floor.c1 = cfg.floor.c1.slice();
    }
    updateFloorVisual();
    updateSkyVisual();
    updatePtCamGizmo();
    fillSceneProps();

    const spheres = cfg.spheres || [];
    for (let i = 0; i < spheres.length; i++) {
      const s = spheres[i];
      addSphereItem({
        name: 'Sphere ' + i,
        center: s.center,
        radius: s.radius,
        material: s.material
      });
    }

    const meshes = cfg.meshes || [];
    for (let i = 0; i < meshes.length; i++) {
      const m = meshes[i];
      if (String(m.type || '').toLowerCase() !== 'obj') continue;
      setStatus('加载网格 ' + (m.path || '') + ' …');
      try {
        // Import with exact JSON transforms (no auto-recenter).
        const raw = await new Promise(function (resolve, reject) {
          objLoader.load(assetUrl(m.path), resolve, undefined, reject);
        });
        const wrap = new THREE.Group();
        wrap.add(raw);
        addMeshItem({
          name: (m.path || 'mesh').split('/').pop(),
          path: m.path,
          triMax: m.triMax,
          material: m.material,
          transform: m.transform
        }, wrap);
      } catch (e) {
        console.error(e);
        setStatus('网格加载失败: ' + m.path);
      }
    }

    selectItem(state.items[0] ? state.items[0].id : null);
    setStatus('场景已导入（球体 ' + spheres.length + ' · 网格 ' + meshes.length + '）');
  }

  function newDefaultScene() {
    clearItems();
    state.camera = { eye: [4, 3, 7], target: [0, 1, 0], fovDeg: 45 };
    state.sky = {
      bottom: [0.06, 0.07, 0.12], top: [0.45, 0.62, 0.95],
      sunDir: [0.35, 0.85, 0.35], sunPow: 8, sunExp: 120, gain: 1.1
    };
    state.floor = {
      enabled: true, y: 0, checker: true, scale: 0.5,
      c0: [0.28, 0.28, 0.30], c1: [0.42, 0.42, 0.44]
    };
    camera.position.set(4, 3, 7);
    orbit.target.set(0, 1, 0);
    camera.fov = 45;
    camera.updateProjectionMatrix();
    orbit.update();
    updateFloorVisual();
    updateSkyVisual();
    updatePtCamGizmo();
    fillSceneProps();
    addSphereItem({
      name: 'Diffuse',
      center: [-1.2, 0.7, 0],
      radius: 0.7,
      material: defaultMaterial('diffuse')
    });
    addSphereItem({
      name: 'Glass',
      center: [1.2, 0.7, 0],
      radius: 0.7,
      material: defaultMaterial('dielectric')
    });
    addSphereItem({
      name: 'Light',
      center: [0, 3.2, 1.5],
      radius: 0.35,
      material: defaultMaterial('emissive')
    });
    setStatus('已新建默认场景');
  }

  function sendToRenderer() {
    const json = exportSceneJson();
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(json));
    } catch (e) {
      setStatus('localStorage 写入失败: ' + e);
      return;
    }
    window.open('/cpu-path-tracing.html?fromEditor=1', '_blank');
    setStatus('已写入场景并打开路径追踪');
  }

  // ——— UI bindings ———
  function setTransformMode(mode) {
    transform.setMode(mode);
    document.getElementById('mode-t').classList.toggle('active', mode === 'translate');
    document.getElementById('mode-r').classList.toggle('active', mode === 'rotate');
    document.getElementById('mode-s').classList.toggle('active', mode === 'scale');
  }

  document.getElementById('btn-new').addEventListener('click', newDefaultScene);
  document.getElementById('btn-export').addEventListener('click', function () {
    downloadJson(exportSceneJson(), 'pt-scene.json');
    setStatus('已导出 JSON');
  });
  document.getElementById('btn-render').addEventListener('click', sendToRenderer);
  document.getElementById('btn-add-sphere').addEventListener('click', function () {
    addSphereItem({ center: [0, 0.6, 0], radius: 0.6 });
  });
  document.getElementById('btn-add-obj').addEventListener('click', addObjFromCatalog);
  document.getElementById('btn-del').addEventListener('click', deleteSelected);
  document.getElementById('btn-capture-cam').addEventListener('click', captureCamera);
  document.getElementById('mode-t').addEventListener('click', function () { setTransformMode('translate'); });
  document.getElementById('mode-r').addEventListener('click', function () { setTransformMode('rotate'); });
  document.getElementById('mode-s').addEventListener('click', function () { setTransformMode('scale'); });

  document.getElementById('btn-open').addEventListener('click', function () {
    document.getElementById('file-json').click();
  });
  document.getElementById('file-json').addEventListener('change', function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const cfg = JSON.parse(reader.result);
        importSceneJson(cfg);
      } catch (err) {
        setStatus('JSON 解析失败');
        console.error(err);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  presetSel.addEventListener('change', async function () {
    const file = presetSel.value;
    if (!file) return;
    setStatus('加载预设…');
    try {
      const resp = await fetch(assetUrl(file));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      await importSceneJson(await resp.json());
    } catch (e) {
      console.error(e);
      setStatus('预设加载失败');
    }
  });

  ['p-name', 'p-radius', 'p-trimax', 'p-mat', 'p-ar', 'p-ag', 'p-ab', 'p-rough', 'p-eta'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', readObjectPropsToItem);
    document.getElementById(id).addEventListener('input', readObjectPropsToItem);
  });
  document.getElementById('p-albedo-color').addEventListener('input', function () {
    if (suppressUI) return;
    const rgb = hexToRgb01(this.value);
    // Keep HDR scale for emissive: if any channel > 1, scale color
    const item = findItem(selectedId);
    let scale = 1;
    if (item && item.material.type === 'emissive') {
      scale = Math.max(item.material.albedo[0], item.material.albedo[1], item.material.albedo[2], 1);
    }
    document.getElementById('p-ar').value = +(rgb[0] * scale).toFixed(3);
    document.getElementById('p-ag').value = +(rgb[1] * scale).toFixed(3);
    document.getElementById('p-ab').value = +(rgb[2] * scale).toFixed(3);
    readObjectPropsToItem();
  });

  ['cam-fov', 'fl-enabled', 'fl-y', 'fl-checker', 'fl-scale', 'fl-c0', 'fl-c1',
    'sk-bottom', 'sk-top', 'sk-sx', 'sk-sy', 'sk-sz', 'sk-pow', 'sk-exp', 'sk-gain'].forEach(function (id) {
    const el = document.getElementById(id);
    el.addEventListener('change', readSceneProps);
    el.addEventListener('input', readSceneProps);
  });

  window.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'w' || e.key === 'W') setTransformMode('translate');
    if (e.key === 'e' || e.key === 'E') setTransformMode('rotate');
    if (e.key === 'r' || e.key === 'R') setTransformMode('scale');
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      deleteSelected();
    }
  });

  canvas.addEventListener('pointerdown', function (e) {
    if (transform.dragging) return;
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const pickables = [];
    for (let i = 0; i < state.items.length; i++) {
      const o = state.items[i].object;
      if (o) pickables.push(o);
    }
    const hits = raycaster.intersectObjects(pickables, true);
    if (hits.length) {
      let obj = hits[0].object;
      while (obj && !obj.userData.itemId && obj.parent) obj = obj.parent;
      if (obj && obj.userData.itemId) selectItem(obj.userData.itemId);
    }
  });

  function resize() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w < 1 || h < 1) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    orbit.update();
    renderer.render(scene, camera);
  }

  // ——— Init catalogs ———
  function populateObjSelect() {
    objSel.innerHTML = '';
    const keys = Object.keys(MODEL_FILES);
    for (let i = 0; i < keys.length; i++) {
      const o = document.createElement('option');
      o.value = keys[i];
      o.textContent = MODEL_FILES[keys[i]].label;
      objSel.appendChild(o);
    }
  }

  async function populatePresets() {
    presetSel.innerHTML = '<option value="">— 选择预设场景 —</option>';
    try {
      const resp = await fetch(assetUrl('assets/renderer/Scenes/scenes.json'));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const cfg = await resp.json();
      const scenes = cfg.scenes || [];
      for (let i = 0; i < scenes.length; i++) {
        const o = document.createElement('option');
        o.value = scenes[i].file;
        o.textContent = scenes[i].name;
        presetSel.appendChild(o);
      }
    } catch (e) {
      console.warn(e);
      const o = document.createElement('option');
      o.value = '';
      o.textContent = '无法加载预设列表';
      presetSel.appendChild(o);
    }
  }

  populateObjSelect();
  populatePresets();
  resize();
  newDefaultScene();
  animate();
  setStatus('就绪 · W/E/R 切换变换 · Delete 删除');
})();
</script>
</body>
</html>
