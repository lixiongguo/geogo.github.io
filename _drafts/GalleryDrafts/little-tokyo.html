<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08081a;
      color: #c0c0e0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .tabs {
      display: flex;
      background: #12122a;
      border-bottom: 1px solid rgba(100, 140, 255, 0.15);
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 14px 28px;
      background: transparent;
      border: none;
      color: #707090;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab-btn:hover {
      color: #c0c0e0;
      background: rgba(99, 102, 241, 0.1);
    }

    .tab-btn.active {
      color: #a78bfa;
      border-bottom-color: #6366f1;
      background: rgba(99, 102, 241, 0.1);
    }

    .tab-content {
      flex: 1;
      position: relative;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(10, 10, 30, 0.95);
      border-bottom: 1px solid rgba(100, 140, 255, 0.15);
    }

    .panel-header h2 {
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .panel-header .meta {
      font-size: 12px;
      color: #707090;
    }

    .canvas-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .canvas-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08081a;
      z-index: 10;
      transition: opacity 0.6s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      color: #a0a0d0;
      font-size: 14px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .welcome-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
    }

    .welcome-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-desc {
      font-size: 14px;
      color: #707090;
      max-width: 400px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="tokyo">技术美术</button>
    <button class="tab-btn" data-tab="info">关于</button>
  </div>

  <!-- Tab 1: 技术美术模型展示 -->
  <div class="tab-content active" id="tab-tokyo">
    <div class="panel-header">
      <h2>Littlest Tokyo</h2>
      <span class="meta" id="fps-tokyo">FPS: --</span>
    </div>
    <div class="canvas-wrapper" id="tokyo-wrapper">
      <canvas id="canvas-tokyo"></canvas>
      <div class="loading-overlay" id="loader-tokyo">
        <div style="text-align:center">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 2: 关于 -->
  <div class="tab-content" id="tab-info">
    <div class="welcome-content">
      <div class="welcome-icon">🎨</div>
      <div class="welcome-title">技术美术</div>
      <div class="welcome-desc">
        一个基于 Three.js 和 GLSL 的实时渲染演示。<br><br>
        使用 Draco 压缩的 GLTF 模型渲染，<br>
        支持鼠标交互和实时阴影。
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ============================================================
//  Tab Navigation
// ============================================================
const tabBtns = document.querySelectorAll('.tab-btn');
const tabContents = document.querySelectorAll('.tab-content');

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const tabId = btn.dataset.tab;

    tabBtns.forEach(b => b.classList.remove('active'));
    tabContents.forEach(c => c.classList.remove('active'));

    btn.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');

    // Resize canvas on tab switch
    setTimeout(() => {
      window.dispatchEvent(new Event('resize'));
    }, 10);
  });
});

// ============================================================
//  Littlest Tokyo Panel
// ============================================================
(function () {
  const canvas = document.getElementById('canvas-tokyo');
  const wrapper = document.getElementById('tokyo-wrapper');
  const fpsEl = document.getElementById('fps-tokyo');

  function sizeCanvas() {
    const r = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    return { w: canvas.width, h: canvas.height };
  }

  let { w: width, h: height } = sizeCanvas();

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
  camera.position.set(6, 5, 8);

  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.minDistance = 3;
  controls.maxDistance = 20;
  controls.update();

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 50;
  dirLight.shadow.camera.left = -10;
  dirLight.shadow.camera.right = 10;
  dirLight.shadow.camera.top = 10;
  dirLight.shadow.camera.bottom = -10;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
  fillLight.position.set(-5, 3, -5);
  scene.add(fillLight);

  const groundGeo = new THREE.PlaneGeometry(50, 50);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 15, 30);

  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/libs/draco/gltf/');

  const loader = new GLTFLoader();
  loader.setDRACOLoader(dracoLoader);

  loader.load('/assets/LittlestTokyo.glb', function (gltf) {
    const model = gltf.scene;

    model.traverse(function (child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 8 / maxDim;
    model.scale.setScalar(scale);
    box.setFromObject(model);
    box.getCenter(center);
    model.position.sub(center);
    model.position.y += (box.getSize(new THREE.Vector3()).y) / 2;

    scene.add(model);
    document.getElementById('loader-tokyo').classList.add('hidden');
  }, undefined, function (err) {
    console.error('Failed to load GLB:', err);
    document.getElementById('loader-tokyo').querySelector('.loading-text').textContent = 'Failed to load';
  });

  let frameCount = 0, lastFpsTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = 'FPS: ' + frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
  }
  animate();

  window.addEventListener('resize', function () {
    const s = sizeCanvas();
    width = s.w;
    height = s.h;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
})();
</script>

</body>
</html>
