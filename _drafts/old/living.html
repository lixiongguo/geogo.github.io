---
layout: article
title: living
info: 本专栏存放的是关于我的生活的记录
---

{% for blog in site.posts %}
    {% if blog.category == "living" %}
        <li>
            <h2><a class="blog" href="{{ blog.url }}">{{ blog.title }}</a></h2>
            <p class="info">{{ blog.date | date: "%Y-%m-%d" }}</p>
            {{ blog.excerpt }}
        </li>
    {% endif %}
{% endfor %}
