<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晓梦</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08081a;
      color: #c0c0e0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      height: 100vh;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 2px;
      background: #12122a;
    }

    .demo-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #0a0a1a;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(10, 10, 30, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(100, 140, 255, 0.15);
      z-index: 5;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .panel-header .meta {
      font-size: 12px;
      color: #707090;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .canvas-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08081a;
      z-index: 10;
      transition: opacity 0.6s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      color: #a0a0d0;
      font-size: 14px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="gallery">

  <!-- Panel 1: Littlest Tokyo -->
  <div class="demo-panel" id="panel-tokyo">
    <div class="panel-header">
      <h2>Littlest Tokyo</h2>
      <span class="meta" id="fps-tokyo">FPS: --</span>
    </div>
    <div class="canvas-wrapper" id="tokyo-wrapper">
      <canvas id="canvas-tokyo"></canvas>
      <div class="loading-overlay" id="loader-tokyo">
        <div style="text-align:center">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel 2: 天玺 -->
  <div class="demo-panel" id="panel-tianxi">
    <div class="panel-header">
      <h2>天玺</h2>
      <span class="meta" id="fps-tianxi">FPS: --</span>
    </div>
    <div class="canvas-wrapper" id="tianxi-wrapper">
      <canvas id="canvas-tianxi"></canvas>
      <div class="loading-overlay hidden" id="loader-tianxi">
        <div style="text-align:center">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading...</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/build/three.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/controls/OrbitControls.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/loaders/DRACOLoader.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/libs/draco/gltf/draco_decoder.js"></script>

<script>
// ============================================================
//  Littlest Tokyo Panel
// ============================================================
(function () {
  const canvas = document.getElementById('canvas-tokyo');
  const wrapper = document.getElementById('tokyo-wrapper');
  const fpsEl = document.getElementById('fps-tokyo');

  function sizeCanvas() {
    const r = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    return { w: canvas.width, h: canvas.height };
  }

  let { w: width, h: height } = sizeCanvas();

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
  camera.position.set(6, 5, 8);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.minDistance = 3;
  controls.maxDistance = 20;
  controls.update();

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 50;
  dirLight.shadow.camera.left = -10;
  dirLight.shadow.camera.right = 10;
  dirLight.shadow.camera.top = 10;
  dirLight.shadow.camera.bottom = -10;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
  fillLight.position.set(-5, 3, -5);
  scene.add(fillLight);

  const groundGeo = new THREE.PlaneGeometry(50, 50);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 15, 30);

  const dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/libs/draco/gltf/');

  const loader = new THREE.GLTFLoader();
  loader.setDRACOLoader(dracoLoader);

  loader.load('/assets/LittlestTokyo.glb', function (gltf) {
    const model = gltf.scene;

    model.traverse(function (child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 4 / maxDim;
    model.scale.setScalar(scale);
    box.setFromObject(model);
    box.getCenter(center);
    model.position.sub(center);
    model.position.y += (box.getSize(new THREE.Vector3()).y) / 2;

    scene.add(model);
    document.getElementById('loader-tokyo').classList.add('hidden');
  }, undefined, function (err) {
    console.error('Failed to load GLB:', err);
    document.getElementById('loader-tokyo').querySelector('.loading-text').textContent = 'Failed to load';
  });

  let frameCount = 0, lastFpsTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = 'FPS: ' + frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
  }
  animate();

  window.addEventListener('resize', function () {
    const s = sizeCanvas();
    width = s.w;
    height = s.h;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
})();

// ============================================================
//  Tianxi Panel
// ============================================================
(function () {
  const canvas = document.getElementById('canvas-tianxi');
  const wrapper = document.getElementById('tianxi-wrapper');
  const fpsEl = document.getElementById('fps-tianxi');

  function sizeCanvas() {
    const r = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    return { w: canvas.width, h: canvas.height };
  }

  let { w: width, h: height } = sizeCanvas();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a18);

  const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
  camera.position.set(0, 0, 5);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.update();

  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: false,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);

  // Particles
  const particleCount = 2000;
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 20;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

    const colorChoice = Math.random();
    if (colorChoice < 0.33) {
      colors[i * 3] = 0.4 + Math.random() * 0.2;
      colors[i * 3 + 1] = 0.4 + Math.random() * 0.3;
      colors[i * 3 + 2] = 0.9 + Math.random() * 0.1;
    } else if (colorChoice < 0.66) {
      colors[i * 3] = 0.9 + Math.random() * 0.1;
      colors[i * 3 + 1] = 0.4 + Math.random() * 0.3;
      colors[i * 3 + 2] = 0.6 + Math.random() * 0.2;
    } else {
      colors[i * 3] = 0.6 + Math.random() * 0.2;
      colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
      colors[i * 3 + 2] = 1.0;
    }

    sizes[i] = Math.random() * 3 + 1;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const material = new THREE.PointsMaterial({
    size: 0.08,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });

  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  // Ambient light
  const ambient = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambient);

  let frameCount = 0, lastFpsTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);

    particles.rotation.x += 0.0003;
    particles.rotation.y += 0.0005;

    controls.update();
    renderer.render(scene, camera);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = 'FPS: ' + frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
  }
  animate();

  window.addEventListener('resize', function () {
    const s = sizeCanvas();
    width = s.w;
    height = s.h;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
})();
</script>

</body>
</html>
