<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晓梦 - Littlest Tokyo</title>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/build/three.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/controls/OrbitControls.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/loaders/GLTFLoader.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/loaders/DRACOLoader.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/libs/draco/gltf/draco_decoder.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08081a; overflow: hidden; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; }
    .loading-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #08081a; z-index: 10;
      transition: opacity 0.6s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-text {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      color: #a0a0d0; font-size: 14px;
    }
    .loading-spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .panel-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10, 10, 30, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(100, 140, 255, 0.15);
      z-index: 5;
    }
    .panel-header h2 {
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
    .panel-header .meta {
      font-size: 12px;
      color: #707090;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
  </style>
</head>
<body>

<div class="panel-header">
  <h2>Littlest Tokyo</h2>
  <span class="meta" id="fps-counter">FPS: --</span>
</div>

<div class="loading-overlay" id="loader">
  <div style="text-align:center">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Littlest Tokyo...</div>
  </div>
</div>

<script>
(function () {
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(6, 5, 8);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.minDistance = 3;
  controls.maxDistance = 20;
  controls.update();

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 50;
  dirLight.shadow.camera.left = -10;
  dirLight.shadow.camera.right = 10;
  dirLight.shadow.camera.top = 10;
  dirLight.shadow.camera.bottom = -10;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
  fillLight.position.set(-5, 3, -5);
  scene.add(fillLight);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(50, 50);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Background
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 15, 30);

  // Load GLB
  const dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/libs/draco/gltf/');

  const loader = new THREE.GLTFLoader();
  loader.setDRACOLoader(dracoLoader);

  loader.load('/assets/LittlestTokyo.glb', function (gltf) {
    const model = gltf.scene;

    model.traverse(function (child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // Auto-center and scale
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 4 / maxDim;
    model.scale.setScalar(scale);
    box.setFromObject(model);
    box.getCenter(center);
    model.position.sub(center);
    model.position.y += (box.getSize(new THREE.Vector3()).y) / 2;

    scene.add(model);

    // Hide loader
    document.getElementById('loader').classList.add('hidden');
  }, undefined, function (err) {
    console.error('Failed to load GLB:', err);
    document.querySelector('.loading-text').textContent = 'Failed to load model';
  });

  // FPS counter
  let frameCount = 0, lastFpsTime = performance.now();
  const fpsEl = document.getElementById('fps-counter');

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = 'FPS: ' + frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
  }
  animate();

  // Resize
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>

</body>
</html>
