<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最优传输图像插值 — Optimal Transport Image Morphing</title>
<script src="assets/js/wasm-loader.js"></script>
<script src="assets/wasm/omt_solver.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: #0a0f1a;
  color: #d0d8f0;
  min-height: 100vh;
  overflow-x: hidden;
}
.header {
  background: linear-gradient(135deg, #111b30, #1a2540);
  border-bottom: 2px solid rgba(120,150,255,0.2);
  padding: 22px 30px;
  text-align: center;
}
.header h1 { font-size: 28px; font-weight: 300; letter-spacing: 2px; color: #c8d8ff; }
.header h1 span { font-weight: 700; color: #ffaa44; }
.header .sub { margin-top: 6px; font-size: 13px; color: #6e84b8; letter-spacing: 1px; }
.header .nav-select { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.header .nav-select label { font-size: 13px; color: #ffaa44; font-weight: 700; letter-spacing: 1px; }
.header .nav-select select { 
  padding: 8px 18px; 
  border: 2px solid rgba(255,170,68,0.5); 
  border-radius: 10px; 
  background: linear-gradient(135deg, #1a1a3a, #2a2040); 
  color: #ffcc66; 
  font-size: 15px; 
  font-weight: 600; 
  cursor: pointer;
  box-shadow: 0 0 12px rgba(255,170,68,0.2);
  transition: all .3s;
}
.header .nav-select select:hover { border-color: rgba(255,170,68,0.9); box-shadow: 0 0 20px rgba(255,170,68,0.35); }
.header .nav-select select:focus { outline: none; border-color: #ffaa44; box-shadow: 0 0 24px rgba(255,170,68,0.5); }

.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 20px;
}

/* Controls */
.controls {
  background: #11192c;
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}
.controls button {
  padding: 10px 24px;
  border: 1px solid rgba(120,150,255,0.3);
  border-radius: 10px;
  background: linear-gradient(135deg, #1e3358, #2a4578);
  color: #e0e8ff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s;
  letter-spacing: 1px;
}
.controls button:hover:not(:disabled) {
  background: linear-gradient(135deg, #2e4778, #3a5e9a);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(100,140,255,0.25);
}
.controls button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.controls button.compute {
  background: linear-gradient(135deg, #c06020, #e07830);
  border-color: rgba(255,160,60,0.4);
}
.controls select {
  padding: 9px 14px;
  border: 2px solid rgba(106,200,255,0.45);
  border-radius: 10px;
  background: linear-gradient(135deg, #132040, #1a3058);
  color: #e8f0ff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .3s;
  letter-spacing: 0.5px;
}
.controls select:hover { border-color: rgba(106,200,255,0.85); box-shadow: 0 0 12px rgba(106,180,255,0.3); }
.controls label {
  font-size: 13px;
  color: #8a9eca;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.pair-bar {
  background: #11192c;
  border: 1px solid rgba(255,170,68,0.35);
  border-radius: 16px;
  padding: 14px 20px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: center;
}
.pair-bar label {
  font-size: 14px;
  color: #ffaa44;
  font-weight: 700;
  letter-spacing: 1px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.pair-bar select {
  padding: 9px 16px;
  border: 2px solid rgba(255,170,68,0.55);
  border-radius: 10px;
  background: linear-gradient(135deg, #1a1a3a, #2a2040);
  color: #ffcc66;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(255,170,68,0.2);
}
.pair-bar select:hover {
  border-color: rgba(255,170,68,0.9);
  box-shadow: 0 0 20px rgba(255,170,68,0.35);
}
.pair-bar .hint {
  font-size: 12px;
  color: #6e84b8;
}

/* Display area */
.display {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  gap: 20px;
  align-items: center;
  margin-bottom: 28px;
}
.image-box {
  background: #0e1526;
  border-radius: 16px;
  padding: 12px;
  text-align: center;
  border: 1px solid rgba(120,140,200,0.15);
}
.image-box canvas {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  image-rendering: pixelated;
  display: block;
  margin: 0 auto;
}
.image-box .label {
  margin-top: 8px;
  font-size: 12px;
  color: #5a74a8;
  letter-spacing: 1px;
}

/* Slider */
.slider-section {
  background: #11192c;
  border-radius: 16px;
  padding: 20px 28px;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.slider-section input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(90deg, #1e3a6e, #4a78d4);
  outline: none;
}
.slider-section input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffaa44;
  cursor: pointer;
  border: 3px solid #0a0f1a;
  box-shadow: 0 0 12px rgba(255,170,68,0.4);
}
.slider-section .t-val {
  min-width: 50px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #ffaa44;
  font-family: Consolas, monospace;
}

/* Frames grid */
.frames-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #8aa4d8;
  margin-bottom: 14px;
}
.frames-grid {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
}
.frame-item {
  flex-shrink: 0;
  background: #0e1526;
  border-radius: 12px;
  padding: 8px;
  text-align: center;
  border: 2px solid rgba(120,140,200,0.1);
  transition: border-color .2s;
}
.frame-item.active {
  border-color: #ffaa44;
  box-shadow: 0 0 14px rgba(255,170,68,0.2);
}
.frame-item canvas {
  border-radius: 6px;
  image-rendering: pixelated;
}
.frame-item .fn { font-size: 11px; color: #5a74a8; margin-top: 4px; }

/* Status */
.status-bar {
  margin-top: 18px;
  padding: 14px 20px;
  background: #0e1526;
  border-radius: 12px;
  font-size: 13px;
  text-align: center;
  color: #6e84b8;
}
.status-bar.success { color: #52d681; }
.status-bar.error { color: #ff6b6b; }
.status-bar.loading { color: #ffaa44; }

@media (max-width: 800px) {
  .display { grid-template-columns: 1fr 1fr; }
  .image-box:nth-child(2) { grid-column: span 2; }
}
</style>
</head>
<body>

<div class="header">
  <h1>最优传输 <span>图像插值</span></h1>
  <div class="sub">Optimal Mass Transport &mdash; Monge-Kantorovich Image Morphing</div>
  <div class="nav-select">
    <label>实验：</label>
    <select id="page-switch">
      <option value="semi-discrete-ot.html">半离散最优传输 — Power 图</option>
      <option value="ot-interpolation.html" selected>OT 图像插值</option>
    </select>
  </div>
</div>
<script>document.getElementById('page-switch').addEventListener('change',function(){location.href=this.value})</script>

<div class="main">
  <div class="pair-bar">
    <label>图像对
      <select id="pair-select">
        <option value="flame" selected>flame_1 → flame_2（176×176）</option>
        <option value="cloud">cloud_1 → cloud_2（486×324）</option>
      </select>
    </label>
    <span class="hint">切换后会重新加载源/目标图</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="compute-btn" class="compute" disabled>⚡ 计算最优传输</button>
    <label>帧数
      <select id="frames-select">
        <option value="6">6</option>
        <option value="8" selected>8</option>
        <option value="12">12</option>
        <option value="16">16</option>
      </select>
    </label>
    <label>块大小
      <select id="block-select">
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="8">8</option>
      </select>
    </label>
    <label>均衡化
      <select id="eq-select">
        <option value="0" selected>总质量比</option>
        <option value="1">直方图均衡</option>
      </select>
    </label>
  </div>

  <!-- Image Display -->
  <div class="display">
    <div class="image-box">
      <canvas id="canvas-img0"></canvas>
      <div class="label" id="label-src">SOURCE — flame_1</div>
    </div>
    <div class="image-box">
      <canvas id="canvas-interp"></canvas>
      <div class="label">INTERPOLATED — t = <span id="label-t">0.50</span></div>
    </div>
    <div class="image-box">
      <canvas id="canvas-img1"></canvas>
      <div class="label" id="label-tgt">TARGET — flame_2</div>
    </div>
  </div>

  <!-- Slider -->
  <div class="slider-section">
    <span style="font-size:13px;color:#8aa4d8;">t=0</span>
    <input type="range" id="t-slider" min="0" max="100" value="50" step="1">
    <span class="t-val" id="t-display">0.50</span>
    <span style="font-size:13px;color:#8aa4d8;">t=1</span>
  </div>

  <!-- All Frames -->
  <div class="frames-title" id="frames-label">插值序列（点击计算后生成）</div>
  <div class="frames-grid" id="frames-grid"></div>

  <!-- Status -->
  <div class="status-bar" id="status-bar">等待加载图像...</div>
</div>

<script>
(function() {
  // ============ State ============
  let omtInstance = null, omtReady = false, omtFailed = false;
  let image0Data = null, image1Data = null;  // { data: Uint8ClampedArray, w, h }
  let frameData = null;                       // { frames: [Uint8ClampedArray], w, h }
  let currentT = 0.5;

  const canvasImg0 = document.getElementById('canvas-img0');
  const canvasImg1 = document.getElementById('canvas-img1');
  const canvasInterp = document.getElementById('canvas-interp');
  const statusBar = document.getElementById('status-bar');
  const computeBtn = document.getElementById('compute-btn');
  const tSlider = document.getElementById('t-slider');
  const tDisplay = document.getElementById('t-display');
  const labelT = document.getElementById('label-t');
  const framesGrid = document.getElementById('frames-grid');
  const framesLabel = document.getElementById('frames-label');

  function setStatus(msg, cls) {
    statusBar.textContent = msg;
    statusBar.className = 'status-bar ' + (cls || '');
  }

  // ============ WASM Init ============
  const WASM_BASE = (typeof WasmLoader !== 'undefined' && WasmLoader.BASE)
    ? WasmLoader.BASE
    : 'assets/wasm/';

  function loadScriptOnce(url) {
    return new Promise(function(resolve, reject) {
      const existing = document.querySelector('script[src="' + url + '"]');
      if (existing && typeof OmTSolver === 'function') { resolve(); return; }
      const s = document.createElement('script');
      s.src = url;
      s.onload = function() { resolve(); };
      s.onerror = function() { reject(new Error('Failed to load ' + url)); };
      document.head.appendChild(s);
    });
  }

  async function ensureOmTFactory() {
    if (typeof OmTSolver === 'function') return;
    const candidates = [
      WASM_BASE + 'omt_solver.js',
      './assets/wasm/omt_solver.js',
      '/assets/wasm/omt_solver.js'
    ];
    let lastErr = null;
    for (let i = 0; i < candidates.length; i++) {
      try {
        await loadScriptOnce(candidates[i]);
        if (typeof OmTSolver === 'function') return;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('omt_solver.js 未加载（请确认 assets/wasm/omt_solver.js 已部署）');
  }

  async function initOmT() {
    if (omtReady) return true;
    if (omtFailed) return false;
    try {
      setStatus('WASM 模块加载中...', 'loading');
      await ensureOmTFactory();
      // 显式 locateFile：避免 document.currentScript 为空时去根路径找 .wasm
      omtInstance = await OmTSolver({
        locateFile: function(path) {
          if (path.endsWith('.wasm') || path.endsWith('.js')) {
            return WASM_BASE + path.replace(/^.*\//, '');
          }
          return WASM_BASE + path;
        }
      });
      omtReady = true;
      setStatus('WASM 就绪，正在加载图像...', 'loading');
      return true;
    } catch (e) {
      omtFailed = true;
      const msg = (e && e.message) ? e.message : String(e);
      setStatus('WASM 加载失败: ' + msg + '（检查 ' + WASM_BASE + 'omt_solver.wasm）', 'error');
      console.error(e);
      return false;
    }
  }

  // ============ Image Loading ============
  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, img.width, img.height);
        resolve({ data: imageData.data, w: img.width, h: img.height });
      };
      img.onerror = function() { reject(new Error('图片加载失败: ' + url)); };
      img.src = url;
    });
  }

  function drawImageToCanvas(canvas, imageData) {
    if (!imageData) return;
    canvas.width = imageData.w;
    canvas.height = imageData.h;
    const ctx = canvas.getContext('2d');
    const imgData = new ImageData(imageData.data.slice(), imageData.w, imageData.h);
    ctx.putImageData(imgData, 0, 0);
  }

  function drawFrameToCanvas(canvas, frame, w, h) {
    if (!frame || !w || !h) {
      canvas.width = 1; canvas.height = 1;
      return;
    }
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.putImageData(new ImageData(frame.slice(), w, h), 0, 0);
  }

  // ============ Image pairs ============
  const IMAGE_PAIRS = {
    flame: { id: 'flame', src: 'flame_1.bmp', tgt: 'flame_2.bmp', labelSrc: 'flame_1', labelTgt: 'flame_2' },
    cloud: { id: 'cloud', src: 'cloud_1.bmp', tgt: 'cloud_2.bmp', labelSrc: 'cloud_1', labelTgt: 'cloud_2' }
  };

  async function loadImageWithFallback(fileName) {
    const candidates = [
      'assets/ot_data/' + fileName,
      './assets/ot_data/' + fileName
    ];
    let lastErr = null;
    for (let i = 0; i < candidates.length; i++) {
      try {
        return await loadImage(candidates[i]);
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('无法加载 ' + fileName);
  }

  // ============ Load Images ============
  async function loadImages(pairKey) {
    const key = pairKey || document.getElementById('pair-select').value;
    const pair = IMAGE_PAIRS[key] || IMAGE_PAIRS.flame;

    computeBtn.disabled = true;
    frameData = null;
    framesGrid.innerHTML = '';
    framesLabel.textContent = '插值序列（点击计算后生成）';
    drawFrameToCanvas(canvasInterp, null, 0, 0);

    try {
      setStatus('加载 ' + pair.src + ' ...', 'loading');
      image0Data = await loadImageWithFallback(pair.src);

      setStatus('加载 ' + pair.tgt + ' ...', 'loading');
      image1Data = await loadImageWithFallback(pair.tgt);

      if (image0Data.w !== image1Data.w || image0Data.h !== image1Data.h) {
        throw new Error('图像尺寸不一致: ' + image0Data.w + 'x' + image0Data.h +
          ' vs ' + image1Data.w + 'x' + image1Data.h);
      }

      document.getElementById('label-src').textContent = 'SOURCE — ' + pair.labelSrc;
      document.getElementById('label-tgt').textContent = 'TARGET — ' + pair.labelTgt;

      drawImageToCanvas(canvasImg0, image0Data);
      drawImageToCanvas(canvasImg1, image1Data);

      computeBtn.disabled = false;
      setStatus('就绪 — ' + pair.labelSrc + ' → ' + pair.labelTgt + '（' +
        image0Data.w + '×' + image0Data.h + '），点击"计算最优传输"', 'success');
    } catch (e) {
      setStatus('图像加载失败: ' + e.message, 'error');
      console.error(e);
    }
  }

  // ============ Compute OT ============
  async function computeOT() {
    if (!omtReady || !image0Data || !image1Data) return;

    const numFrames = parseInt(document.getElementById('frames-select').value);
    const squareEdgeLen = parseInt(document.getElementById('block-select').value);
    const eqMethod = parseInt(document.getElementById('eq-select').value);

    computeBtn.disabled = true;
    tSlider.disabled = true;
    setStatus('最优传输计算中... 这可能需要几秒钟', 'loading');
    framesLabel.textContent = '计算中...';

    try {
      const w = image0Data.w, h = image0Data.h;
      // Convert RGBA to flat array for WASM (4 channels)
      const channels = 4;
      const len0 = w * h * channels;
      const len1 = w * h * channels;

      // Copy data to new arrays for WASM transfer
      const data0 = new Uint8Array(image0Data.data);
      const data1 = new Uint8Array(image1Data.data);

      const ptr0 = omtInstance._malloc(len0);
      const ptr1 = omtInstance._malloc(len1);

      // Write pixel data to WASM heap
      for (let i = 0; i < len0; i++) {
        omtInstance.setValue(ptr0 + i, data0[i], 'i8');
        omtInstance.setValue(ptr1 + i, data1[i], 'i8');
      }

      const ret = omtInstance.ccall('solve_omt_series', 'number',
        ['number', 'number', 'number', 'number',
         'number', 'number', 'number', 'number',
         'number', 'number', 'number', 'number'],
        [ptr0, len0, w, h,
         ptr1, len1, w, h,
         channels, squareEdgeLen, numFrames, eqMethod]
      );

      omtInstance._free(ptr0);
      omtInstance._free(ptr1);

      if (ret !== 0) {
        throw new Error('OT 计算失败 (错误码: ' + ret + ')');
      }

      const outW = omtInstance.ccall('get_omt_frame_width', 'number', [], []);
      const outH = omtInstance.ccall('get_omt_frame_height', 'number', [], []);
      const outCount = omtInstance.ccall('get_omt_frame_count', 'number', [], []);
      const outSize = omtInstance.ccall('get_omt_result_size', 'number', [], []);
      const outPtr = omtInstance.ccall('get_omt_result_data', 'number', [], []);
      const timeMs = omtInstance.ccall('get_omt_last_time_ms', 'number', [], []);

      // Read frames from WASM (getValue('i8') returns signed, use & 0xFF)
      const frameSize = outW * outH * 4;
      const rawSize = outSize;
      frameData = { frames: [], w: outW, h: outH, count: outCount };

      for (let f = 0; f < outCount; f++) {
        const frame = new Uint8ClampedArray(frameSize);
        const offset = f * frameSize;
        for (let i = 0; i < frameSize; i++) {
          frame[i] = omtInstance.getValue(outPtr + offset + i, 'i8') & 0xFF;
        }
        frameData.frames.push(frame);
      }

      // Cleanup
      omtInstance.ccall('omt_dispose', 'void', [], []);

      // Update UI
      tSlider.disabled = false;
      tSlider.value = Math.floor(outCount / 2) * (100 / outCount);
      updateSlider();
      renderFrames();

      setStatus('计算完成 — ' + outW + '×' + outH + ' × ' + outCount + ' 帧，耗时 ' + timeMs.toFixed(0) + ' ms', 'success');
      framesLabel.textContent = '插值序列（' + outCount + ' 帧）';
    } catch (e) {
      setStatus('计算失败: ' + e.message, 'error');
      console.error(e);
      omtInstance.ccall('omt_dispose', 'void', [], []);
    } finally {
      computeBtn.disabled = false;
    }
  }

  // ============ Slider ============
  function updateSlider() {
    const val = parseInt(tSlider.value) / 100;
    currentT = val;
    tDisplay.textContent = val.toFixed(2);
    labelT.textContent = val.toFixed(2);

    // Draw interpolated frame
    if (frameData && frameData.frames.length > 0) {
      const nFrames = frameData.frames.length;
      const idx = Math.min(Math.floor(val * nFrames), nFrames - 1);
      drawFrameToCanvas(canvasInterp, frameData.frames[idx], frameData.w, frameData.h);

      // Highlight active frame
      document.querySelectorAll('.frame-item').forEach(function(el) {
        el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
      });
    }
  }

  // ============ Frames Grid ============
  function renderFrames() {
    framesGrid.innerHTML = '';
    if (!frameData) return;

    const nFrames = frameData.frames.length;
    const maxH = 80;
    const scale = maxH / Math.max(frameData.h, 1);
    const thumbW = Math.round(frameData.w * scale);
    const thumbH = maxH;

    for (let i = 0; i < nFrames; i++) {
      const div = document.createElement('div');
      div.className = 'frame-item';
      div.dataset.idx = i;

      const canvas = document.createElement('canvas');
      canvas.width = thumbW;
      canvas.height = thumbH;

      // Scale down the frame
      const srcData = frameData.frames[i];
      const srcW = frameData.w, srcH = frameData.h;
      const ctx = canvas.getContext('2d');

      // Use offscreen canvas for full-res then scale
      const offCanvas = document.createElement('canvas');
      offCanvas.width = srcW;
      offCanvas.height = srcH;
      const offCtx = offCanvas.getContext('2d');
      offCtx.putImageData(new ImageData(srcData.slice(), srcW, srcH), 0, 0);

      ctx.drawImage(offCanvas, 0, 0, thumbW, thumbH);

      const fn = document.createElement('div');
      fn.className = 'fn';
      fn.textContent = '#' + (i + 1);

      div.appendChild(canvas);
      div.appendChild(fn);
      div.addEventListener('click', function() {
        tSlider.value = Math.round(i / (nFrames - 1) * 100);
        updateSlider();
      });

      framesGrid.appendChild(div);
    }
  }

  // ============ Init ============
  tSlider.addEventListener('input', updateSlider);

  computeBtn.addEventListener('click', computeOT);

  document.getElementById('pair-select').addEventListener('change', function() {
    if (!omtReady) return;
    loadImages(this.value);
  });

  // Start: init WASM then load images
  (async function start() {
    setStatus('加载 WASM 模块...', 'loading');
    const wasmOk = await initOmT();
    if (wasmOk) {
      await loadImages();
    }
  })();
})();
</script>
</body>
</html>
