destination: docs
markdown: kramdown
kramdown:
  math_engine: mathjax
  entity_output: as_char  # 保留原始符号
excerpt_separator: <!--more-->
# highlighter-theme:autumn
highlighter-theme : emacs
# highlighter-theme : rouge
category_dir: category
# 保留 WASM 文件，不被 Jekyll 清理
keep_files:
  - assets/wasm/*.wasm
  - assets/wasm/*.js
plugins:
  - jekyll-feed
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 15
  permalink: "/page/:num/"
  sort_reverse: true
github_username: David Lee