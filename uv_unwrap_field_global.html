<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV Unwrap — Field-based Global Parameterization</title>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>

  <script src="assets/js/wasm-loader.js"></script>
  <script src="assets/wasm/uv_unwrap_field.js"></script>
  <script src="assets/wasm/uv_unwrap_simple.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{overflow:hidden;background:#070b14;color:#d8def7;font-family:"Segoe UI",Arial,sans-serif}
  .app{display:flex;flex-direction:column;height:100vh}
  .timing-display{display:none;padding:10px 18px;background:linear-gradient(90deg,rgba(16,30,61,0.95),rgba(26,46,91,0.95));border-bottom:2px solid rgba(106,132,255,0.35);text-align:center}
  .timing-display.visible{display:block}
  .timing-row{display:flex;align-items:center;justify-content:center;gap:24px}
  .timing-block{display:flex;flex-direction:column;align-items:center}
  .timing-sep{width:1px;height:40px;background:rgba(106,132,255,.25)}
  .timing-display .timing-label{font-size:11px;color:#8a9dd4;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
  .timing-display .timing-value{font-size:28px;font-weight:700;color:#ffd700;text-shadow:0 0 16px rgba(255,215,0,.45),0 0 32px rgba(255,215,0,.2);font-family:Consolas,monospace}
  .timing-display .timing-details{font-size:11px;color:#6a7db5;margin-top:6px}
  #flip-value{color:#52d681;text-shadow:0 0 16px rgba(82,214,129,.4)}
  #flip-value.has-flip{color:#ff5252;text-shadow:0 0 18px rgba(255,82,82,.55);animation:flipPulse 1.2s ease-in-out infinite}
  @keyframes flipPulse{0%,100%{opacity:1}50%{opacity:.7}}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;background:rgba(9,15,28,.96);border-bottom:1px solid rgba(106,132,255,.18)}
  .toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  select,button{border:1px solid rgba(106,132,255,.25);background:#121b31;color:#eef2ff;border-radius:10px;padding:9px 12px;font-size:14px}
  button{cursor:pointer;transition:background .2s ease}
  button:hover{background:#172546}
  .status{min-width:240px;color:#8cc4ff;font-size:13px;text-align:right}
  .main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#11192b;min-height:0}
  .panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0b1220}
  .panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(106,132,255,.16);color:#c6d1f4;font-size:14px}
  .panel-header span:last-child{color:#8292bd;font-size:12px}
  .canvas-wrap{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%}
  .footer-note{padding:10px 16px;border-top:1px solid rgba(106,132,255,.16);color:#7e8db5;font-size:12px}
  @media(max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  #reload-btn{padding:9px 22px;background:linear-gradient(135deg,#ff6b35 0%,#ff8f5e 100%);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 3px 10px rgba(255,107,53,.4);letter-spacing:1px}
  #reload-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  #reload-btn:not(:disabled):hover{transform:translateY(-2px) scale(1.04);box-shadow:0 6px 18px rgba(255,107,53,.6)}
  #cone-btn{padding:9px 14px;background:#2a1a3e;border:1px solid rgba(200,120,220,.35);color:#d4a0f0;font-size:13px}
  #cone-btn.active{background:#4a2060;border-color:#c060e0;box-shadow:0 0 12px rgba(180,80,220,.4)}
  #auto-cone-btn{padding:9px 12px;background:#1b263d;border:1px solid rgba(140,170,255,.35);color:#c8d6ff;font-size:13px}
  #cone-info{display:none;font-size:11px;color:#c9a0e0;margin-left:6px}
  .cone-angle{width:50px;padding:2px 4px;border-radius:4px;text-align:center;font-size:11px;border:1px solid rgba(200,120,220,.3);background:#0d1528;color:#e0c0ff}
  .tree-btn{padding:9px 14px;background:#1a2e1a;border:1px solid rgba(100,220,120,.35);color:#a0f0b0;font-size:13px}
  .tree-btn.active{background:#206030;border-color:#60e060;box-shadow:0 0 12px rgba(80,220,80,.4)}
  #tc-info{display:none;font-size:11px;color:#a0e0c0;margin-left:6px}
</style>
</head>
<body>
<div class="app">
  <div class="timing-display" id="timing-display">
    <div class="timing-row">
      <div class="timing-block"><div class="timing-label">计算耗时</div><div class="timing-value"><span id="timing-ms">0</span>ms</div></div>
      <div class="timing-sep"></div>
      <div class="timing-block"><div class="timing-label">翻转三角面</div><div class="timing-value" id="flip-value"><span id="flip-count">0</span></div></div>
    </div>
    <div class="timing-details" id="timing-details"></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-right">
      <select id="model-select" title="Models2" style="width:170px;font-size:15px;padding:10px 14px;"></select>

      <fieldset style="border:1px solid rgba(106,132,255,0.22);border-radius:10px;padding:8px 12px;margin:0;">
        <legend style="color:#8a9dd4;font-size:11px;padding:0 6px;">向量场引导参数化</legend>
        <div style="display:flex;flex-wrap:wrap;gap:6px 14px;">
          <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap" title="Mixed-Integer Quadrangulation"><input type="radio" name="method" value="miq" checked> MIQ</label>
          <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap" title="Periodic Global Parameterization"><input type="radio" name="method" value="pgp"> PGP</label>
          <label style="color:#d8def7;font-size:13px;cursor:pointer;white-space:nowrap" title="QuadCover"><input type="radio" name="method" value="quadcover"> QuadCover</label>
        </div>
      </fieldset>

      <button id="reload-btn">展开!</button>

      <fieldset id="texture-radios" style="border:1px solid rgba(106,132,255,0.22);border-radius:10px;padding:6px 10px;margin:0;display:flex;gap:12px;align-items:center;">
        <legend style="color:#8a9dd4;font-size:11px;padding:0 4px;">纹理显示</legend>
        <label style="color:#d8def7;font-size:13px;cursor:pointer;">
          <input type="radio" name="texture-display" value="checkerboard" id="radio-checkerboard" disabled> 棋盘格
        </label>
        <label style="color:#d8def7;font-size:13px;cursor:pointer;">
          <input type="radio" name="texture-display" value="dots" id="radio-dots" disabled> 圆点贴图
        </label>
        <label style="color:#d8def7;font-size:13px;cursor:pointer;">
          <input type="radio" name="texture-display" value="distortion" id="radio-distortion" disabled> 共形扭曲
        </label>
      </fieldset>

      <div class="status" id="status-text">正在加载模型...</div>
    </div>
  </div>

  <div class="main">
    <section class="panel">
      <div class="panel-header"><span>3D 模型</span><span>拖拽旋转 / 滚轮缩放</span></div>
      <div class="canvas-wrap"><canvas id="model-canvas"></canvas></div>
      <div class="footer-note">左: 3D 模型。本页收录基于向量场 / 交叉场的全局参数化：MIQ、PGP、QuadCover。</div>
    </section>
    <section class="panel">
      <div class="panel-header"><span id="uv-panel-label">UV 网格</span><span>边界归一化到 0..1</span></div>
      <div class="canvas-wrap"><canvas id="uv-canvas"></canvas></div>
      <div class="footer-note">右侧展示展开后的线框 UV 结果。</div>
    </section>
  </div>
</div>

<script>
(function(){

  // ============ Models ============
  const MODELS = {
    doubletorus:{ label: "Double Torus (6.1K)",file: "double-torus_F6144.obj" },
    holes3:     { label: "3 Holes (7.2K)",     file: "3holes_F7200.obj" },
    torus:      { label: "Torus (7.7K)",       file: "torus_F7680.obj" },
    kitten:     { label: "Kitten (18.9K)",     file: "kitten_F18894.obj" },
    rocker:     { label: "Rocker Arm (20.1K)", file: "rocker-arm_F20088.obj" },
    bunny:      { label: "Bunny (28.6K)",      file: "bunny_F28576.obj" },
    soccerball: { label: "Soccer Ball (57.6K)",file: "soccerball_F57600.obj" },
  };

  // ============ Three.js 初始化 ============
  const modelCanvas=document.getElementById("model-canvas");
  const uvCanvas=document.getElementById("uv-canvas");
  const modelSel=document.getElementById("model-select");
  const reloadBtn=document.getElementById("reload-btn");
  const radioCheckerboard=document.getElementById("radio-checkerboard");
  const radioDots=document.getElementById("radio-dots");
  const radioDistortion=document.getElementById("radio-distortion");
  const statusText=document.getElementById("status-text");
  const objLoader=new THREE.OBJLoader();

  const modelR=new THREE.WebGLRenderer({canvas:modelCanvas,antialias:true,alpha:true});
  const uvR=new THREE.WebGLRenderer({canvas:uvCanvas,antialias:true,alpha:true});
  modelR.setPixelRatio(Math.min(devicePixelRatio,2));uvR.setPixelRatio(Math.min(devicePixelRatio,2));

  const modelScene=new THREE.Scene();const uvScene=new THREE.Scene();
  modelScene.background=new THREE.Color(0x08101d);uvScene.background=new THREE.Color(0x091120);

  const modelCam=new THREE.PerspectiveCamera(45,1,.01,100);modelCam.position.set(1.8,1.5,1.8);
  const uvCam=new THREE.OrthographicCamera(-1.15,1.15,1.15,-1.15,.1,10);uvCam.position.set(0,0,2);
  const controls=new THREE.OrbitControls(modelCam,modelCanvas);
  controls.enableDamping=true;controls.dampingFactor=.08;

  modelScene.add(new THREE.AmbientLight(0xffffff,.8));
  const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(2,3,4);modelScene.add(dl);

  // ============ 状态 ============
  let currentModelGroup=null,currentUvLines=null,currentUvPins=null,currentPickMesh=null,busy=false;
  let currentMeshData=null,currentUnwrapUv=null;
  let textureEnabled=false,currentTexturedMesh=null,checkerTexture=null,dotTexture=null,currentTextureMode="checkerboard";
  let distortionEnabled=false,currentDistortionMesh=null,taInst=null,taReady=false,taFailed=false;
  let currentRawObjText=null;

  function showTiming(ms,details,flipped){
    document.getElementById("timing-display").classList.add("visible");
    document.getElementById("timing-ms").textContent=ms.toFixed(1);
    document.getElementById("timing-details").textContent=details||"";
    const fv=document.getElementById("flip-value"),fc=document.getElementById("flip-count");
    fc.textContent=typeof flipped==='number'?flipped:0;
    fv.classList.toggle("has-flip",flipped>0);
  }

  function setBusy(v){
    busy=v;reloadBtn.disabled=v;modelSel.disabled=v;
  }

  // ============ 模型加载 ============
  function populateSelect(){
    const keys=Object.keys(MODELS);
    modelSel.innerHTML="";
    for(let i=0;i<keys.length;i++){
      const o=document.createElement("option");
      o.value=keys[i];o.textContent=MODELS[keys[i]].label;
      modelSel.appendChild(o);
    }
    if(keys.length)modelSel.value=keys[0];
  }

  function loadOBJ(url){
    return new Promise((resolve,reject)=>{objLoader.load(url,resolve,undefined,reject)});
  }

  function parseObjMeshData(txt){
    const positions=[],faces=[],lines=txt.split(/\r?\n/);
    function objIndex(token){
      const raw=parseInt(token.split('/')[0],10);
      if(isNaN(raw))return -1;
      return raw>0?raw-1:positions.length+raw;
    }
    for(let i=0;i<lines.length;i++){
      const line=lines[i].trim();
      if(line.startsWith('v ')||line.startsWith('v\t')){
        const p=line.slice(1).trim().split(/\s+/).map(Number);
        if(p.length>=3&&p.every(Number.isFinite))positions.push([p[0],p[1],p[2]]);
      }else if(line.startsWith('f ')||line.startsWith('f\t')){
        const idx=line.slice(1).trim().split(/\s+/).map(objIndex).filter(x=>x>=0);
        for(let k=1;k+1<idx.length;k++)faces.push([idx[0],idx[k],idx[k+1]]);
      }
    }
    return positions.length&&faces.length?{positions,faces}:null;
  }

  async function fetchObjText(url){try{const r=await fetch(url);return r.ok?r.text():null}catch(e){return null}}

  function normalizeMeshData(meshData){
    let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
    for(const p of meshData.positions){
      if(p[0]<minX)minX=p[0];if(p[0]>maxX)maxX=p[0];
      if(p[1]<minY)minY=p[1];if(p[1]>maxY)maxY=p[1];
      if(p[2]<minZ)minZ=p[2];if(p[2]>maxZ)maxZ=p[2];
    }
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2,cz=(minZ+maxZ)/2;
    const s=Math.max(maxX-minX,maxY-minY,maxZ-minZ)||1;
    for(const p of meshData.positions){p[0]=(p[0]-cx)/s;p[1]=(p[1]-cy)/s;p[2]=(p[2]-cz)/s}
    return meshData;
  }

  function collectMeshData(root){
    root.updateMatrixWorld(true);
    const pos=[],faces=[],vm=new Map(),t=new THREE.Vector3();
    function gi(x,y,z){const k=Math.round(x*1e5)+"_"+Math.round(y*1e5)+"_"+Math.round(z*1e5);if(!vm.has(k)){vm.set(k,pos.length);pos.push([x,y,z])}return vm.get(k)}
    root.traverse(function(c){
      if(!c.isMesh||!c.geometry||!c.geometry.attributes.position)return;
      const g=c.geometry.clone(),pa=g.attributes.position,lg=new Array(pa.count);
      for(let i=0;i<pa.count;i++){t.fromBufferAttribute(pa,i).applyMatrix4(c.matrixWorld);lg[i]=gi(t.x,t.y,t.z)}
      if(g.index){const ix=g.index.array;for(let i=0;i<ix.length;i+=3)faces.push([lg[ix[i]],lg[ix[i+1]],lg[ix[i+2]]])}
      else for(let i=0;i<pa.count;i+=3)faces.push([lg[i],lg[i+1],lg[i+2]]);
    });
    return{positions:pos,faces};
  }

  function chooseAnchorPair(v){
    let ba=0,bb=1,bd=-1;
    for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++){
      const d=(v[i][0]-v[j][0])**2+(v[i][1]-v[j][1])**2+(v[i][2]-v[j][2])**2;
      if(d>bd){bd=d;ba=i;bb=j}
    }
    return[ba,bb];
  }

  // ============ 渲染 ============
  function normalizeObject(root){
    const b=new THREE.Box3().setFromObject(root),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());
    const m=Math.max(s.x,s.y,s.z)||1;root.position.sub(c);root.scale.setScalar(1/m);root.updateMatrixWorld(true)
  }

  function buildModelGroup(root,anchors,pos){
    const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0x7fa7ff,roughness:.55,metalness:.05,flatShading:false,side:THREE.DoubleSide});
    root.traverse(function(c){
      if(!c.isMesh||!c.geometry)return;
      const m=new THREE.Mesh(c.geometry,mat);m.matrixAutoUpdate=false;m.matrix.copy(c.matrixWorld);g.add(m);
      const w=new THREE.LineSegments(new THREE.WireframeGeometry(c.geometry),new THREE.LineBasicMaterial({color:0x1f2f55,transparent:true,opacity:.65}));
      w.matrixAutoUpdate=false;w.matrix.copy(c.matrixWorld);g.add(w);
    });
    return g;
  }

  function clearPickMesh(){
    if(!currentPickMesh)return;
    if(currentPickMesh.geometry)currentPickMesh.geometry.dispose();
    if(currentPickMesh.material)currentPickMesh.material.dispose();
    currentPickMesh=null;
  }

  function buildPickMesh(meshData){
    const pos=new Float32Array(meshData.positions.length*3),idx=[];
    for(let i=0;i<meshData.positions.length;i++){pos[i*3]=meshData.positions[i][0];pos[i*3+1]=meshData.positions[i][1];pos[i*3+2]=meshData.positions[i][2]}
    for(let i=0;i<meshData.faces.length;i++)idx.push(meshData.faces[i][0],meshData.faces[i][1],meshData.faces[i][2]);
    const geom=new THREE.BufferGeometry();
    geom.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    geom.setIndex(idx);
    geom.computeBoundingSphere();
    return new THREE.Mesh(geom,new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));
  }

  function buildUvMesh(uv,faces,anchors){
    const es=new Set(),sg=[];
    function tp(p){return[(p[0]-.5)*1.8,(p[1]-.5)*1.8,0]}
    function ae(a,b){const k=a<b?a+"_"+b:b+"_"+a;if(es.has(k))return;es.add(k);const pa=tp(uv[a]),pb=tp(uv[b]);sg.push(pa[0],pa[1],pa[2],pb[0],pb[1],pb[2])}
    for(let i=0;i<faces.length;i++){ae(faces[i][0],faces[i][1]);ae(faces[i][1],faces[i][2]);ae(faces[i][2],faces[i][0])}
    const lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.Float32BufferAttribute(sg,3));
    const lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x86b2ff,transparent:true,opacity:.95}));
    return{lines,pins:null};
  }

  function countFlippedFaces(uv,faces){
    let count=0;const eps=1e-12;
    for(let i=0;i<faces.length;i++){
      const t=faces[i],a=uv[t[0]],b=uv[t[1]],p=uv[t[2]];
      if((b[0]-a[0])*(p[1]-a[1])-(p[0]-a[0])*(b[1]-a[1])<-eps)count++;
    }
    return count;
  }

  // ============ 棋盘格 / 共形扭曲显示 ============
  async function initTextureAtlasSolver(){
    if(taReady)return true;if(taFailed)return false;
    try{
      if(typeof UvUnwrapSimpleSolver!=='function')throw new Error('UvUnwrapSimpleSolver 未加载');
      taInst=await UvUnwrapSimpleSolver({locateFile:(p)=>WasmLoader.BASE+p});
      taReady=true;return true
    }
    catch(e){taFailed=true;console.error(e);return false}
  }

  function createCheckerTexture(){
    const texSize=512,cells=16,cellSize=texSize/cells,canvas=document.createElement("canvas");
    canvas.width=texSize;canvas.height=texSize;
    const ctx=canvas.getContext("2d");
    for(let y=0;y<cells;y++)for(let x=0;x<cells;x++){const dark=((x+y)&1)===0;ctx.fillStyle=dark?"#1f2f54":"#e9f0ff";ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize)}
    ctx.strokeStyle="rgba(120,150,210,0.4)";
    for(let i=0;i<=cells;i++){const p=i*cellSize;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,texSize);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(texSize,p);ctx.stroke()}
    const texture=new THREE.CanvasTexture(canvas);
    texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(1,1);texture.needsUpdate=true;
    return texture;
  }

  function createDotTexture(){
    const texSize=512,cells=16,cellSize=texSize/cells,canvas=document.createElement("canvas");
    canvas.width=texSize;canvas.height=texSize;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#f4f8ff";ctx.fillRect(0,0,texSize,texSize);
    for(let y=0;y<cells;y++)for(let x=0;x<cells;x++){const cx=(x+.5)*cellSize,cy=(y+.5)*cellSize,r=cellSize*.27;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle="#3f7cff";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="rgba(17,39,84,0.45)";ctx.stroke()}
    const texture=new THREE.CanvasTexture(canvas);
    texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(1,1);texture.needsUpdate=true;
    return texture;
  }

  function getUvTexture(textureMode){
    if(textureMode==="dots"){if(!dotTexture)dotTexture=createDotTexture();return dotTexture}
    if(!checkerTexture)checkerTexture=createCheckerTexture();
    return checkerTexture;
  }

  function buildTexturedMesh(meshData,uv,textureMode){
    const pos=[],idx=[],uvFlat=[];
    for(let i=0;i<meshData.positions.length;i++)pos.push(meshData.positions[i][0],meshData.positions[i][1],meshData.positions[i][2]);
    for(let i=0;i<meshData.faces.length;i++)idx.push(meshData.faces[i][0],meshData.faces[i][1],meshData.faces[i][2]);
    for(let i=0;i<uv.length;i++)uvFlat.push(uv[i][0],uv[i][1]);
    const geom=new THREE.BufferGeometry();
    geom.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
    geom.setAttribute("uv",new THREE.Float32BufferAttribute(uvFlat,2));
    geom.setIndex(idx);geom.computeVertexNormals();
    return new THREE.Mesh(geom,new THREE.MeshStandardMaterial({map:getUvTexture(textureMode),metalness:.05,roughness:.75,side:THREE.DoubleSide}));
  }

  function clearTexturedMesh(){
    if(currentTexturedMesh&&currentTexturedMesh.parent)currentTexturedMesh.parent.remove(currentTexturedMesh);
    if(currentTexturedMesh&&currentTexturedMesh.geometry)currentTexturedMesh.geometry.dispose();
    if(currentTexturedMesh&&currentTexturedMesh.material)currentTexturedMesh.material.dispose();
    currentTexturedMesh=null;
  }

  function clearDistortionMesh(){
    if(currentDistortionMesh&&currentDistortionMesh.parent)currentDistortionMesh.parent.remove(currentDistortionMesh);
    if(currentDistortionMesh&&currentDistortionMesh.geometry)currentDistortionMesh.geometry.dispose();
    if(currentDistortionMesh&&currentDistortionMesh.material)currentDistortionMesh.material.dispose();
    currentDistortionMesh=null;
  }

  function resetTextureRadios(){
    textureEnabled=false;distortionEnabled=false;
    clearTexturedMesh();clearDistortionMesh();
    if(radioCheckerboard){radioCheckerboard.checked=false;radioCheckerboard.disabled=true}
    if(radioDots){radioDots.checked=false;radioDots.disabled=true}
    if(radioDistortion){radioDistortion.checked=false;radioDistortion.disabled=true}
    if(currentModelGroup)currentModelGroup.visible=true;
  }

  function setTextureDisplayEnabled(enabled,textureMode){
    if(enabled&&(!currentMeshData||!currentUnwrapUv)){
      setStatus('请先点击"展开!"生成 UV，再开启纹理贴图', '#ffd38a');
      if(radioCheckerboard)radioCheckerboard.checked=false;
      if(radioDots)radioDots.checked=false;
      return;
    }
    textureEnabled=enabled;
    if(textureEnabled){
      currentTextureMode=textureMode||currentTextureMode||"checkerboard";
      clearTexturedMesh();
      currentTexturedMesh=buildTexturedMesh(currentMeshData,currentUnwrapUv,currentTextureMode);
      modelScene.add(currentTexturedMesh);
      if(currentModelGroup)currentModelGroup.visible=false;
      if(currentDistortionMesh)currentDistortionMesh.visible=false;
      distortionEnabled=false;
      setStatus("已开启"+(currentTextureMode==="dots"?"圆点贴图":"棋盘格贴图"), "#89f0b6");
    }else{
      clearTexturedMesh();
      if(currentModelGroup)currentModelGroup.visible=true;
    }
  }

  async function setDistortionEnabled(enabled){
    if(!enabled){
      distortionEnabled=false;clearDistortionMesh();
      if(currentModelGroup)currentModelGroup.visible=true;
      if(currentTexturedMesh&&textureEnabled)currentTexturedMesh.visible=true;
      return;
    }
    if(!currentMeshData||!currentUnwrapUv){
      setStatus('请先点击"展开!"生成 UV', '#ffd38a');
      if(radioDistortion)radioDistortion.checked=false;
      if(radioCheckerboard){radioCheckerboard.checked=true;setTextureDisplayEnabled(true,"checkerboard")}
      return;
    }
    if(!taReady&& !taFailed){setStatus('正在加载共形扭曲引擎...', '#ffd38a');await initTextureAtlasSolver()}
    if(!taReady){
      setStatus('共形扭曲引擎加载失败', '#ff9d9d');
      if(radioDistortion)radioDistortion.checked=false;
      if(radioCheckerboard){radioCheckerboard.checked=true;setTextureDisplayEnabled(true,"checkerboard")}
      return;
    }
    setStatus('共形扭曲计算中...', '#ffd38a');
    let pp=0,fpt=0,uvp=0;
    try{
      const fp=new Float64Array(currentMeshData.positions.length*3);
      for(let i=0;i<currentMeshData.positions.length;i++){fp[i*3]=currentMeshData.positions[i][0];fp[i*3+1]=currentMeshData.positions[i][1];fp[i*3+2]=currentMeshData.positions[i][2]}
      const ff=new Int32Array(currentMeshData.faces.length*3);
      for(let i=0;i<currentMeshData.faces.length;i++){ff[i*3]=currentMeshData.faces[i][0];ff[i*3+1]=currentMeshData.faces[i][1];ff[i*3+2]=currentMeshData.faces[i][2]}
      const fu=new Float64Array(currentUnwrapUv.length*2);
      for(let i=0;i<currentUnwrapUv.length;i++){fu[i*2]=currentUnwrapUv[i][0];fu[i*2+1]=currentUnwrapUv[i][1]}
      pp=taInst._malloc(fp.length*8);fpt=taInst._malloc(ff.length*4);uvp=taInst._malloc(fu.length*8);
      for(let i=0;i<fp.length;i++)taInst.setValue(pp+i*8,fp[i],'double');
      for(let i=0;i<ff.length;i++)taInst.setValue(fpt+i*4,ff[i],'i32');
      for(let i=0;i<fu.length;i++)taInst.setValue(uvp+i*8,fu[i],'double');
      const lr=taInst.ccall('load_mesh_with_uv','number',['number','number','number','number','number','number'],[pp,fp.length,fpt,ff.length,uvp,fu.length]);
      if(lr!==0)throw new Error('load_mesh_with_uv failed: '+lr);
      const nFaces=taInst.ccall('compute_qc_error','number',[],[]);
      if(nFaces<=0)throw new Error('compute_qc_error returned '+nFaces);
      const errSize=taInst.ccall('get_qc_errors_size','number',[],[]),errPtr=taInst.ccall('get_qc_errors','number',[],[]);
      const colSize=taInst.ccall('get_qc_colors_size','number',[],[]),colPtr=taInst.ccall('get_qc_colors','number',[],[]);
      const errors=[],colors=[];
      for(let i=0;i<errSize;i++)errors.push(taInst.getValue(errPtr+i*8,'double'));
      for(let i=0;i<colSize;i++)colors.push(taInst.getValue(colPtr+i*8,'double'));
      taInst.ccall('dispose','void',[],[]);
      let avgErr=0,maxErr=0;
      for(let i=0;i<errors.length;i++){avgErr+=errors[i];if(errors[i]>maxErr)maxErr=errors[i]}
      avgErr/=Math.max(errors.length,1);
      const nV=currentMeshData.positions.length,vCol=new Float32Array(nV*3),vCount=new Float32Array(nV);
      for(let i=0;i<currentMeshData.faces.length;i++){
        const f=currentMeshData.faces[i],r=colors[i*3]||.5,g=colors[i*3+1]||.5,b=colors[i*3+2]||.5;
        for(let k=0;k<3;k++){const vi=f[k];vCol[vi*3]+=r;vCol[vi*3+1]+=g;vCol[vi*3+2]+=b;vCount[vi]++}
      }
      for(let i=0;i<nV;i++){if(vCount[i]>0){vCol[i*3]/=vCount[i];vCol[i*3+1]/=vCount[i];vCol[i*3+2]/=vCount[i]}else{vCol[i*3]=vCol[i*3+1]=vCol[i*3+2]=.5}}
      const pos=[],idx=[];
      for(let i=0;i<currentMeshData.positions.length;i++)pos.push(currentMeshData.positions[i][0],currentMeshData.positions[i][1],currentMeshData.positions[i][2]);
      for(let i=0;i<currentMeshData.faces.length;i++)idx.push(currentMeshData.faces[i][0],currentMeshData.faces[i][1],currentMeshData.faces[i][2]);
      clearDistortionMesh();
      const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geom.setAttribute('color',new THREE.Float32BufferAttribute(vCol,3));geom.setIndex(idx);geom.computeVertexNormals();
      currentDistortionMesh=new THREE.Mesh(geom,new THREE.MeshPhongMaterial({vertexColors:true,side:THREE.DoubleSide,flatShading:false,specular:0x111111,shininess:10}));
      modelScene.add(currentDistortionMesh);
      if(currentModelGroup)currentModelGroup.visible=false;
      if(currentTexturedMesh)currentTexturedMesh.visible=false;
      distortionEnabled=true;textureEnabled=false;
      setStatus('共形扭曲: avg='+avgErr.toFixed(4)+'  max='+maxErr.toFixed(4)+'  (绿=1.0无扭曲, 红>1.5)', '#89f0b6');
    }catch(e){
      console.error(e);setStatus('扭曲计算失败: '+e.message, '#ff9d9d');
      if(radioDistortion)radioDistortion.checked=false;
      if(radioCheckerboard){radioCheckerboard.checked=true;setTextureDisplayEnabled(true,"checkerboard")}
    }finally{
      if(pp)taInst._free(pp);if(fpt)taInst._free(fpt);if(uvp)taInst._free(uvp);
    }
  }

  // ============ uv_unwrap_field WASM（分步流程）============
  let fieldInst=null,fieldReady=false,fieldFailed=false,fieldPromise=null;
  async function initFieldSolver(){
    if(fieldReady)return true;if(fieldFailed)return false;
    try{
      if(typeof UvUnwrapFieldSolver!=='function')throw new Error('UvUnwrapFieldSolver 未加载');
      if(!fieldPromise)fieldPromise=UvUnwrapFieldSolver({locateFile:(p)=>WasmLoader.BASE+p});
      fieldInst=await fieldPromise;
      fieldReady=true;return true;
    }catch(e){fieldFailed=true;console.error(e);return false;}
  }

  // ============ WASM 求解器 ============
  // uv_unwrap_field.wasm: MIQ / QuadCover；PGP 仍为占位。

  function getMethod(){const c=document.querySelector('input[name="method"]:checked');return c?c.value:'miq'}

  function updateButtonState(){
    const m=getMethod();
    if(fieldFailed){reloadBtn.textContent='引擎加载失败';reloadBtn.disabled=true}
    else if(!fieldReady){reloadBtn.textContent='引擎加载中...';reloadBtn.disabled=true}
    else{reloadBtn.textContent='展开!';reloadBtn.disabled=false}
  }

  function wasmWritePosInst(inst,flat){
    const p=inst._malloc(flat.length*8);
    for(let i=0;i<flat.length;i++)inst.setValue(p+i*8,flat[i],'double');
    return p;
  }
  function wasmWriteFacesInst(inst,flat){
    const p=inst._malloc(flat.length*4);
    for(let i=0;i<flat.length;i++)inst.setValue(p+i*4,flat[i],'i32');
    return p;
  }
  function wasmReadUV(inst,getSizeFn,getPtrFn){
    const sz=inst.ccall(getSizeFn,'number',[],[]);
    const ptr=inst.ccall(getPtrFn,'number',[],[]);
    const uvs=[];for(let i=0;i<sz;i++)uvs.push(inst.getValue(ptr+i*8,'double'));
    return uvs;
  }

  // ============ 求解器调用（分 3 步） ============
  async function solveQuadCover(meshData){
    const ok=await initFieldSolver();if(!ok)throw new Error("uv_unwrap_field WASM 初始化失败");
    const v=meshData.positions,f=meshData.faces;
    const fp=new Float64Array(v.length*3);for(let i=0;i<v.length;i++){fp[i*3]=v[i][0];fp[i*3+1]=v[i][1];fp[i*3+2]=v[i][2]}
    const ff=new Int32Array(f.length*3);for(let i=0;i<f.length;i++){ff[i*3]=f[i][0];ff[i*3+1]=f[i][1];ff[i*3+2]=f[i][2]}
    const pp=wasmWritePosInst(fieldInst,fp),fpt=wasmWriteFacesInst(fieldInst,ff);
    try{
      let rc=fieldInst.ccall('load_mesh','number',['number','number','number','number'],[pp,fp.length,fpt,ff.length]);
      if(rc!==0)throw new Error("load_mesh 错误:"+rc);
      rc=fieldInst.ccall('step1_compute_principal_field','number',[],[]);
      if(rc!==0)throw new Error("step1_compute_principal_field 错误:"+rc);
      rc=fieldInst.ccall('step2_smooth_and_matching','number',['number'],[3]);
      if(rc!==0)throw new Error("step2_smooth_and_matching 错误:"+rc);
      rc=fieldInst.ccall('step3_solve_quadcover','number',['number'],[1]);
      if(rc!==0)throw new Error("step3_solve_quadcover 错误:"+rc);
      const us=wasmReadUV(fieldInst,'get_uv_result_size','get_uv_result');
      const t=fieldInst.ccall('get_last_time_ms','number',[],[]);
      fieldInst.ccall('dispose','void',[],[]);
      const n=v.length,uv=new Array(n);for(let i=0;i<n;i++)uv[i]=[us[i*2],us[i*2+1]];
      return{uv,timeMs:t,method:'quadcover'};
    }finally{fieldInst._free(pp);fieldInst._free(fpt)}
  }

  async function solveMIQ(meshData,crossIters,jumpRefinePasses){
    const ok=await initFieldSolver();if(!ok)throw new Error("uv_unwrap_field WASM 初始化失败");
    const v=meshData.positions,f=meshData.faces;
    const fp=new Float64Array(v.length*3);for(let i=0;i<v.length;i++){fp[i*3]=v[i][0];fp[i*3+1]=v[i][1];fp[i*3+2]=v[i][2]}
    const ff=new Int32Array(f.length*3);for(let i=0;i<f.length;i++){ff[i*3]=f[i][0];ff[i*3+1]=f[i][1];ff[i*3+2]=f[i][2]}
    const pp=wasmWritePosInst(fieldInst,fp),fpt=wasmWriteFacesInst(fieldInst,ff);
    try{
      let rc=fieldInst.ccall('load_mesh','number',['number','number','number','number'],[pp,fp.length,fpt,ff.length]);
      if(rc!==0)throw new Error("load_mesh 错误:"+rc);
      rc=fieldInst.ccall('solve_miq','number',['number','number'],[crossIters||12,jumpRefinePasses||2]);
      if(rc!==0)throw new Error("solve_miq 错误:"+rc);
      const us=wasmReadUV(fieldInst,'get_uv_result_size','get_uv_result');
      const t=fieldInst.ccall('get_last_time_ms','number',[],[]);
      const e=fieldInst.ccall('get_miq_energy','number',[],[]);
      fieldInst.ccall('dispose','void',[],[]);
      const n=v.length,uv=new Array(n);for(let i=0;i<n;i++)uv[i]=[us[i*2],us[i*2+1]];
      return{uv,timeMs:t,method:'miq',details:'cross-field E='+e.toExponential(3)};
    }finally{fieldInst._free(pp);fieldInst._free(fpt)}
  }

  // ============ 加载 & 展开 ============
  async function loadModel(){
    if(busy)return;setBusy(true);
    const key=modelSel.value,m=MODELS[key];
    setStatus("加载 "+m.label+" ...");
    try{
      const urls=["assets/Models2/"+m.file,"./assets/Models2/"+m.file,"../assets/Models2/"+m.file];
      let root=null,rawText=null;
      for(const u of urls){try{root=await loadOBJ(u);rawText=await fetchObjText(u);break}catch(e){}}
      if(!root)throw new Error("模型加载失败");
      normalizeObject(root);
      currentRawObjText=rawText;
      if(currentModelGroup){modelScene.remove(currentModelGroup)}if(currentUvLines){uvScene.remove(currentUvLines)}if(currentUvPins){uvScene.remove(currentUvPins)}
      resetTextureRadios();
      clearPickMesh();
      currentUvLines=null;currentUvPins=null;currentUnwrapUv=null;
      let meshData=rawText?parseObjMeshData(rawText):null;
      meshData=meshData?normalizeMeshData(meshData):collectMeshData(root);
      const anchors=chooseAnchorPair(meshData.positions);
      currentModelGroup=buildModelGroup(root,anchors,meshData.positions);modelScene.add(currentModelGroup);
      currentPickMesh=buildPickMesh(meshData);
      controls.target.set(0,0,0);controls.update();currentMeshData=meshData;
      setStatus("就绪: "+m.label+" / "+meshData.positions.length+" 顶点 / "+meshData.faces.length+" 三角面","#89f0b6");
    }catch(e){console.error(e);setStatus("加载失败: "+e.message,"#ff9d9d")}
    finally{setBusy(false)}
  }

  async function doUnwrap(){
    if(busy||!currentMeshData)return;
    const method=getMethod(),mNames={miq:'MIQ 向量场引导',pgp:'PGP 周期全局参数化',quadcover:'QuadCover'};
    const label=mNames[method]||method;
    setBusy(true);setStatus(label+" 求解中...");
    const t0=performance.now();
    try{
      let r;
      if(method==='miq'){
        setStatus("MIQ: 交替 MIQP + 整数跳跃精化 + Poisson UV ...");
        r=await solveMIQ(currentMeshData,12,2);
      }else if(method==='pgp'){
        setStatus("PGP 暂未实现，请选择其他方法","#ffd38a");setBusy(false);return;
      }else{
        setStatus("QuadCover: step1主曲率 -> step2平滑/匹配 -> step3参数化 ...");
        r=await solveQuadCover(currentMeshData);
      }
      const ms=r.timeMs>0?r.timeMs:(performance.now()-t0);
      currentUnwrapUv=r.uv;
      clearDistortionMesh();distortionEnabled=false;
      if(radioCheckerboard&&radioDots&&radioDistortion){
        radioCheckerboard.disabled=false;radioDots.disabled=false;radioDistortion.disabled=false;
        radioCheckerboard.checked=true;radioDots.checked=false;radioDistortion.checked=false;
        setTextureDisplayEnabled(true,"checkerboard");
      }
      document.getElementById('uv-panel-label').textContent=label+' UV 网格';
      if(currentUvLines)uvScene.remove(currentUvLines);if(currentUvPins)uvScene.remove(currentUvPins);
      const anchors=chooseAnchorPair(currentMeshData.positions);
      const uvV=buildUvMesh(r.uv,currentMeshData.faces,anchors);
      currentUvLines=uvV.lines;currentUvPins=uvV.pins;uvScene.add(currentUvLines);if(currentUvPins)uvScene.add(currentUvPins);
      const fc=countFlippedFaces(r.uv,currentMeshData.faces);
      showTiming(ms,(r.details?r.details+' / ':'')+label+' / '+MODELS[modelSel.value].label+' / '+currentMeshData.positions.length+' 顶点 / '+currentMeshData.faces.length+' 三角面',fc);
      setStatus(label+" 完成，翻转面 "+fc+" 个",fc===0?"#89f0b6":"#ffd38a");
    }catch(e){console.error(e);setStatus("失败: "+e.message,"#ff9d9d")}
    finally{setBusy(false)}
  }

  function resize(){
    const mr=modelCanvas.parentElement.getBoundingClientRect(),ur=uvCanvas.parentElement.getBoundingClientRect();
    modelR.setSize(mr.width,mr.height,false);uvR.setSize(ur.width,ur.height,false);
    modelCam.aspect=mr.width/Math.max(mr.height,1);modelCam.updateProjectionMatrix();
    const a=ur.width/Math.max(ur.height,1),s=1.15;uvCam.left=-s*a;uvCam.right=s*a;uvCam.top=s;uvCam.bottom=-s;uvCam.updateProjectionMatrix();
  }

  function setStatus(msg,color){statusText.textContent=msg;if(color)statusText.style.color=color}
  function animate(){requestAnimationFrame(animate);controls.update();modelR.render(modelScene,modelCam);uvR.render(uvScene,uvCam)}

  // 初始化 UV 网格
  const grid=new THREE.LineBasicMaterial({color:0x1a2947,transparent:true,opacity:.85});
  const gc=[];for(let i=-10;i<=10;i++){const t=i/10;gc.push(-1,t,0,1,t,0,t,-1,0,t,1,0)}
  const gg=new THREE.BufferGeometry();gg.setAttribute("position",new THREE.Float32BufferAttribute(gc,3));uvScene.add(new THREE.LineSegments(gg,grid));

  populateSelect();resize();setStatus("就绪 — 选择模型后点击展开","#8cc4ff");
  window.addEventListener("resize",resize);
  modelSel.addEventListener("change",loadModel);
  reloadBtn.addEventListener("click",doUnwrap);
  document.querySelectorAll('input[name="method"]').forEach(function(r){
    r.addEventListener("change", function(){ updateButtonState(); });
  });
  if(radioCheckerboard)radioCheckerboard.addEventListener("change",function(){if(radioCheckerboard.checked){setTextureDisplayEnabled(true,"checkerboard");if(radioDots)radioDots.checked=false}});
  if(radioDots)radioDots.addEventListener("change",function(){if(radioDots.checked){setTextureDisplayEnabled(true,"dots");if(radioCheckerboard)radioCheckerboard.checked=false;if(radioDistortion)radioDistortion.checked=false}});
  if(radioDistortion)radioDistortion.addEventListener("change",function(){if(radioDistortion.checked){setTextureDisplayEnabled(false);setDistortionEnabled(true)}});
  updateButtonState();

  // 预加载 WASM
  initFieldSolver().then(()=>{updateButtonState();loadModel()});
  animate();
})();
</script>
