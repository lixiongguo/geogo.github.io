// ==================== Force-Directed Graph Engine ====================
class ForceGraph {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.nodes = [];
    this.edges = [];
    this.simulation = null;
    this.hoveredNode = null;
    this.selectedNode = null;
    this.dragging = false;
    this.dragNode = null;
    this.dragOffset = { x: 0, y: 0 };
    this.time = 0;
    this.cameraZoom = 1;
    this.cameraPan = { x: 0, y: 0 };
    this.tooltipEl = document.getElementById('tooltip');

    this.bindEvents();
  }

  buildFromData(data) {
    this.nodes = [];
    this.edges = [];

    function addNode(obj, parent) {
      const node = {
        id: obj.id,
        name: obj.name,
        type: obj.type || 'node',
        color: obj.color || '#888',
        desc: obj.desc || '',
        url: obj.url || '',
        articles: obj.articles || [],
        links: obj.links || [],
        x: 0, y: 0, vx: 0, vy: 0,
        fx: 0, fy: 0,
        radius: 0,
        parent: parent ? parent.id : null,
        children: [],
        expanded: true,
      };
      this.nodes.push(node);
      if (parent) parent.children.push(node);

      if (obj.children) obj.children.forEach(c => addNode(c, node));
      if (obj.articles) obj.articles.forEach(a => addNode({
        ...a, id: (obj.id || '') + '_' + a.t.replace(/\s+/g, '_'), type: 'article', color: obj.color || '#888',
        parent: node.id
      }, node));

      return node;
    }

    const root = addNode(data);

    // Create edges: parent -> child
    function linkChildren(parent) {
      parent.children.forEach(child => {
        this.edges.push({ source: parent.id, target: child.id });
        linkChildren(child);
      });
      if (parent.articles) {
        parent.articles.forEach(a => {
          this.edges.push({ source: parent.id, target: a.id });
        });
      }
    }
    linkChildren(root);

    // Calculate radius based on hierarchy depth
    this.nodes.forEach(n => {
      switch (n.type) {
        case 'root': n.radius = 28; break;
        case 'category': n.radius = 22; break;
        case 'subcat': n.radius = 16; break;
        case 'article': n.radius = 7; break;
        case 'link': n.radius = 10; break;
        default: n.radius = 8;
      }
    });
  }

  start() {
    if (this.simulation) cancelAnimationFrame(this.simulation);
    this.initializePositions();
    this.time = 0;
    this.run();
  }

  initializePositions() {
    const W = this.canvas.width, H = this.canvas.height;

    this.nodes.forEach(n => {
      n.x = W / 2 + (Math.random() - 0.5) * 200;
      n.y = H / 2 + (Math.random() - 0.5) * 150;
      n.vx = 0; n.vy = 0;
    });

    // Place root at center
    const root = this.nodes.find(n => n.type === 'root');
    root.x = W / 2;
    root.y = H / 2;
  }

  run() {
    const loop = () => {
      this.update();
      this.render();
      this.simulation = requestAnimationFrame(loop);
    };
    this.simulation = requestAnimationFrame(loop);
  }

  update() {
    const dt = 1;
    this.time += dt;
    const W = this.canvas.width, H = this.canvas.height;

    // Force parameters
    const REPULSION = 8000;
    const ATTRACTION = 0.02;
    const CENTER_PULL = 0.003;
    const LINK_DISTANCE = 120;
    const DAMPING = 0.88;

    for (const node of this.nodes) {
      if (this.dragNode === node) continue;
      let fx = 0, fy = 0;

      // Repulsion between all nodes
      for (const other of this.nodes) {
        if (other === node) continue;
        let dx = node.x - other.x, dy = node.y - other.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < 1) dist = 1;
        const force = REPULSION / (dist * dist);
        fx += dx / dist * force;
        fy += dy / dist * force;
      }

      // Attraction to center
      fx += (W / 2 - node.x) * CENTER_PULL;
      fy += (H / 2 - node.y) * CENTER_PULL;

      // Link attraction (spring-like)
      for (const edge of this.edges) {
        let src = this.nodes.find(n => n.id === edge.source);
        let tgt = this.nodes.find(n => n.id === edge.target);
        if (!src || !tgt) continue;
        let dx = tgt.x - src.x, dy = tgt.y - src.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const targetDist = LINK_DISTANCE;
        if (dist > targetDist * 1.5 && !this.isAncestorExpanded(src, tgt)) {
          // Don't pull if target is collapsed
          continue;
        }
        const force = ATRACTION * (dist - targetDist);
        fx += dx / dist * force;
        fy += dy / dist * force;
      }

      // Parent attraction (tree structure)
      if (node.parent) {
        const parent = this.nodes.find(n => n.id === node.parent);
        if (parent && this.isAncestorExpanded(parent, node)) {
          let dx = parent.x - node.x, dy = parent.y - node.y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = 0.01 * dist;
          fx += dx / dist * force;
          fy += dy / dist * force;
        }
      }

      node.vx = (node.vx + fx * dt) * DAMPING;
      node.vy = (node.vy + fy * dt) * DAMPING;
      node.fx += node.vx * dt;
      node.fy += node.vy * dt;
    }

    // Update positions
    for (const node of this.nodes) {
      if (this.dragNode !== node) {
        node.x += node.fx;
        node.y += node.fy;
      }
    }
  }

  isAncestorExpanded(ancestor, node) {
    let current = node;
    while (current) {
      if (current.id === ancestor.id) return current.expanded;
      current = this.nodes.find(n => n.id === current.parent);
    }
    return true;
  }

  isAncestorExpanded(ancestor, node) {
    let current = node;
    while (current && current.id !== ancestor.id) {
      if (!current.expanded) return false;
      current = this.nodes.find(n => n.id === current.parent);
    }
    return true;
  }

  render() {
    const ctx = this.ctx;
    const W = this.canvas.width, H = this.canvas.height;
    ctx.fillStyle = '#08081a';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2 + this.cameraPan.x, H / 2 + this.cameraPan.y);
    ctx.scale(this.cameraZoom, this.cameraZoom);

    // Draw edges first
    ctx.lineWidth = 1.5;
    for (const edge of this.edges) {
      const src = this.nodes.find(n => n.id === edge.source);
      const tgt = this.nodes.find(n => n => n.id === edge.target);
      if (!src || !tgt) continue;
      // Hide edges to collapsed nodes
      if (!this.isAncestorExpanded(src, tgt)) continue;
      if (src.type === 'article') continue; // Articles don't have child edges shown

      const isVisibleSrc = this.isNodeVisible(src);
      const isVisibleTgt = this.isNodeVisible(tgt);

      if (!isVisibleSrc || !isVisibleTgt) continue;

      ctx.beginPath();
      ctx.moveTo(src.x, src.y);
      ctx.lineTo(tgt.x, tgt.y);
      ctx.strokeStyle = `rgba(130, 150, 220, ${isVisibleSrc && isVisibleTgt ? 0.25 : 0.06})`;
      ctx.stroke();
    }

    // Draw nodes
    for (const node of this.nodes) {
      if (!this.isNodeVisible(node)) continue;

      const isHovered = (this.hoveredNode === node);
      const isSelected = (this.selectedNode === node);
      const cat = CATEGORY_COLORS[node.type] || CATEGORY_COLORS.article;

      ctx.save();
      ctx.translate(node.x, node.y);

      // Glow effect for hovered
      if (isHovered) {
        ctx.shadowColor = node.color;
        ctx.shadowBlur = 20;
      }

      // Node circle
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(1, node.radius), 0, Math.PI * 2);
      ctx.fillStyle = cat.bg;
      ctx.fill();

      ctx.strokeStyle = isSelected ? '#fff' : (isHovered ? node.color : cat.border);
      ctx.lineWidth = isSelected ? 2.5 : (isHovered ? 2 : 1);
      ctx.stroke();

      // Label
      const fontSize = node.type === 'root' ? 14 : node.type === 'category' ? 12 : node.type === 'link' ? 10 : 9;
      ctx.font = `${isHovered ? 'bold ' : ''} ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.fillStyle = isHovered ? '#fff' : cat.text;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let label = node.name;
      if (node.type === 'subcat' && node.articles.length > 0) {
        label += ` (${node.articles.length})`;
      } else if (node.type === 'category' && node.desc) {
        label += ` — ${node.desc}`;
      }

      const maxWidth = node.radius * 1.8;
      ctx.fillText(label, 0, 1, maxWidth);

      // Article count badge
      if ((node.type === 'subcat' || node.type === 'category') && node.articles && node.articles.length > 0) {
        const badgeR = node.radius * 0.72;
        ctx.beginPath(); ctx.arc(badgeR, badgeR, 4, 0, Math.PI * 2);
        ctx.fillStyle = node.color; ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = `bold 8px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline='middle';
        ctx.fillText(Math.min(node.articles.length, 99), badgeR, badgeR);
      }

      ctx.restore();
    }

    ctx.restore();
  }

  isNodeVisible(node) {
    if (node.type === 'root') return true;
    let current = node;
    while (current) {
      if (current.expanded) return true;
      current = this.nodes.find(n => n.id === current.parent);
    }
    return false;
  }

  getNodeAt(x, y) {
    const transformedX = (x - this.canvas.width / 2 - this.cameraPan.x) / this.cameraZoom;
    const transformedY = (y - this.canvas.height / 2 - this.cameraPan.y) / this.cameraZoom;
    for (let i = this.nodes.length - 1; i >= 0; i--) {
      const n = this.nodes[i];
      const dx = transformedX - n.x, dy = transformedY - n.y;
      if (dx * dx + dy * dy < n.radius * n.radius * 4) return n;
    }
    return null;
  }

  expandAll() { this.nodes.forEach(n => { if (n.children.length > 0 || n.articles.length > 0) n.expanded = true; }); }
  contractAll() { this.nodes.forEach(n => { if (n.type !== 'root') n.expanded = false; }); }
  resetView() { this.cameraZoom = 1; this.cameraPan = { x: 0, y: 0 }; }

  bindEvents() {
    const canvas = this.canvas;

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (this.dragging && this.dragNode) {
        this.dragNode.x = (mx - this.dragOffset.x - this.canvas.width / 2 - this.cameraPan.x) / this.cameraZoom;
        this.dragNode.y = (my - this.dragOffset.y - this.canvas.height / 2 - this.cameraPan.y) / this.cameraZoom;
        this.dragNode.vx = 0; this.dragNode.vy = 0;
        return;
      }

      const node = this.getNodeAt(mx, my);
      if (node) {
        this.hoveredNode = node;
        canvas.style.cursor = 'pointer';
        this.showTooltip(node, e.clientX, e.clientY);
      } else {
        this.hoveredNode = null;
        canvas.style.cursor = 'default';
        this.hideTooltip();
      }
    }, { passive: true });

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const node = this.getNodeAt(mx, my);
      if (node && node.type !== 'root') {
        if (node.children.length > 0 || node.articles.length > 0) {
          node.expanded = !node.expanded;
        } else if (node.url) {
          window.open(node.url, '_blank');
        }
        this.dragNode = node;
        this.dragging = true;
        const tx = (mx - this.canvas.width / 2 - this.cameraPan.x) / this.cameraZoom;
        const ty = (my - this.canvas.height / 2 - this.cameraPan.y) / this.cameraZoom;
        this.dragOffset = { x: tx - node.x, y: ty - node.y };
        canvas.style.cursor = 'grabbing';
      }
    });

    canvas.addEventListener('mouseup', () => {
      this.dragging = false;
      this.dragNode = null;
      canvas.style.cursor = 'default';
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 0.92 : 1.085;
      this.cameraZoom = Math.max(0.15, Math.min(6, this.cameraZoom * zoomFactor));
    }, { passive: false });

    document.getElementById('btn-reset').addEventListener('click', () => { this.resetView(); this.start(); });
    document.getElementById('btn-expand-all').addEventListener('click', () => { this.expandAll(); });
    document.getElementById('btn-contract-all').addEventListener('click', () => { this.contractAll(); });
  }

  showTooltip(node, cx, cy) {
    const el = this.tooltipEl;
    const titleEl = el.querySelector('.tt-title');
    const descEl = el.querySelector('.tt-desc');
    const countEl = el.querySelector('.tt-count');

    titleEl.textContent = node.name;
    descEl.textContent = node.desc || '';
    countEl.textContent = '';
    if (node.articles && node.articles.length > 0) {
      countEl.textContent = `${node.articles.length} 篇文章`;
    } else if (node.links && node.links.length > 0) {
      countEl.textContent = `${node.links.length} 个链接`;
    } else if (node.type === 'root') {
      countEl.textContent = `${this.nodes.length} 节点`;
    }

    el.style.display = 'block';
    const elRect = el.getBoundingClientRect();
    const containerRect = this.canvas.parentElement.getBoundingClientRect();
    let left = cx + 15, top = cy + 15;
    if (left + 280 > containerRect.width) left = cx - 295;
    if (top + 120 > containerRect.height) top = cy - 110;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }

  hideTooltip() {
    this.tooltipEl.style.display = 'none';
  }
}

// ==================== Stats & Legend ====================
function updateStats(fg) {
  const totalNodes = fg.nodes.length;
  const totalEdges = fg.edges.length;
  const categories = fg.nodes.filter(n => n.type === 'category').length;
  const subcats = fg.nodes.filter(n => n.type === 'subcat').length;
  const articles = fg.nodes.filter(n => n.type === 'article').length;
  const links = fg.nodes.filter(n => n.type === 'link').length;

  const bar = document.getElementById('stats-bar');
  bar.innerHTML =
    `<div class="stat-row"><span class="stat-label">节点总数</span><span class="stat-val">${totalNodes}</span></div>` +
    `<div class="stat-row"><span class="stat-label">连接数</span><span class="stat-val">${totalEdges}</span></div>` +
    `<div class="stat-row"><span class="stat-label">主分类</span><span class="stat-val">${categories}</span></div>` +
    `<div class="stat-row"><span class="stat-label">子分类</span><span class="stat-val">${subcats}</span></div>` +
    `<div class="stat-row"><span class="stat-label">文章</span><span class="stat-val">${articles}</span></div>` +
    `<div class="stat-row"><span class="stat-label">链接</span><span class="stat-val">${links}</span></div>`;
}

function buildLegend(fg) {
  const bar = document.getElementById('legend-bar');
  const types = [
    { dot: '#6366f1', label: '主分类', bg: 'rgba(99,102,241,0.15)' },
    { dot: '#818cf8', label: '子分类', bg: 'rgba(129,140,250,0.1)' },
    { dot: '#22c55e', label: '文章', bg: 'rgba(34,197,94,0.08)' },
    { dot: '#10b981', label: '链接', bg: 'rgba(16,185,129,0.12)' },
  ];
  bar.innerHTML = types.map(t =>
    `<div class="legend-item"><div class="legend-dot" style="background:${t.dot};${t.bg?'border-color:'+t.dot:''}"></div><span class="legend-label">${t.label}</span></div>`
  ).join('');
}

// ==================== Init ====================
const canvas = document.getElementById('graph-canvas');
function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const fg = new ForceGraph(canvas);
fg.buildFromData(GRAPH_DATA);
updateStats(fg);
buildLegend(fg);
fg.start();

// Auto-expand categories after a short delay
setTimeout(() => { fg.expandAll(); }, 600);

</script>
</body>
