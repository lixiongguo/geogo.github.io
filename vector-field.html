<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>向量场生成 - 主曲率场可视化</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08081a;
      color: #c0c0e0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10, 10, 30, 0.95);
      border-bottom: 1px solid rgba(100, 140, 255, 0.15);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 12px;
      color: #8888aa;
    }

    select, button {
      background: #1a1a3a;
      color: #c0c0e0;
      border: 1px solid rgba(100, 140, 255, 0.3);
      padding: 6px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:hover, button:hover {
      background: #2a2a4a;
      border-color: rgba(100, 140, 255, 0.5);
    }

    button.active {
      background: #4a4a8a;
      border-color: #6366f1;
    }

    input[type="range"] {
      width: 100px;
      accent-color: #6366f1;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .canvas-area {
      flex: 1;
      position: relative;
      background: #0a0a1a;
    }

    .canvas-area canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08081a;
      z-index: 10;
      transition: opacity 0.6s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      color: #a0a0d0;
      font-size: 14px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .info-panel {
      width: 280px;
      background: rgba(10, 10, 30, 0.95);
      border-left: 1px solid rgba(100, 140, 255, 0.15);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .info-section {
      margin-bottom: 20px;
    }

    .info-section h3 {
      font-size: 13px;
      color: #6366f1;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-item {
      margin-bottom: 12px;
    }

    .info-item .label {
      font-size: 11px;
      color: #707090;
      margin-bottom: 4px;
    }

    .info-item .value {
      font-size: 13px;
      color: #c0c0e0;
    }

    .color-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }

    .fps-display {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(10, 10, 30, 0.8);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      color: #8888aa;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      background: #12122a;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-box .number {
      font-size: 18px;
      font-weight: 600;
      color: #6366f1;
    }

    .stat-box .desc {
      font-size: 10px;
      color: #707090;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>向量场生成 - 主曲率场可视化</h1>
    <div class="controls">
      <div class="control-group">
        <label>模型:</label>
        <select id="model-select">
          <option value="sphere">球面</option>
          <option value="torus">环面</option>
          <option value="torusKnot">环面结</option>
          <option value="bunny">Stanford Bunny</option>
        </select>
      </div>
      <div class="control-group">
        <label>显示:</label>
        <select id="field-select">
          <option value="principal">主曲率方向</option>
          <option value="asymptotic">渐近方向</option>
          <option value="both">两者都显示</option>
        </select>
      </div>
      <div class="control-group">
        <button id="btn-arrows" class="active">箭头</button>
        <button id="btn-streamlines">流线</button>
        <button id="btn-both">混合</button>
      </div>
      <div class="control-group">
        <label>密度:</label>
        <input type="range" id="density-slider" min="1" max="5" value="2">
      </div>
      <div class="control-group">
        <button id="btn-animate">动画</button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="canvas-area">
      <canvas id="main-canvas"></canvas>
      <div class="loading-overlay" id="loader">
        <div style="text-align:center">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading...</div>
        </div>
      </div>
      <div class="fps-display" id="fps">FPS: --</div>
    </div>

    <div class="info-panel">
      <div class="info-section">
        <h3>模型信息</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="number" id="vert-count">-</div>
            <div class="desc">顶点数</div>
          </div>
          <div class="stat-box">
            <div class="number" id="face-count">-</div>
            <div class="desc">面数</div>
          </div>
          <div class="stat-box">
            <div class="number" id="field-count">-</div>
            <div class="desc">向量数</div>
          </div>
          <div class="stat-box">
            <div class="number" id="curvature">-</div>
            <div class="desc">平均曲率</div>
          </div>
        </div>
      </div>

      <div class="info-section">
        <h3>图例</h3>
        <div class="color-legend">
          <div class="legend-item">
            <div class="legend-color" style="background: #ff4444;"></div>
            <span>主曲率 k₁ (最大)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #4444ff;"></div>
            <span>主曲率 k₂ (最小)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #44ff44;"></div>
            <span>渐近方向 (k=0)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background: #ffffff;"></div>
            <span>高斯曲率 K</span>
          </div>
        </div>
      </div>

      <div class="info-section">
        <h3>说明</h3>
        <div class="info-item">
          <div class="value" style="font-size: 11px; line-height: 1.6;">
            主曲率场展示了曲面上每一点的主曲率方向。
            k₁ 和 k₂ 是两个正交的主曲率方向。<br><br>
            渐近方向是曲率与表面正交的方向，在双曲点处存在。<br><br>
            使用鼠标拖拽旋转，滚轮缩放。
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ============================================================
// Curvature Field Visualization
// ============================================================
(function() {
  const canvas = document.getElementById('main-canvas');
  const loader = document.getElementById('loader');
  const fpsEl = document.getElementById('fps');

  // State
  let currentModel = 'sphere';
  let displayMode = 'principal';
  let arrowMode = 'arrows';
  let density = 2;
  let isAnimating = false;
  let animationPhase = 0;

  // Three.js setup
  function sizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    return { w: canvas.width, h: canvas.height };
  }

  let { w: width, h: height } = sizeCanvas();

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
  renderer.setClearColor(0x0a0a1a);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);

  const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
  camera.position.set(0, 2, 5);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.update();

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
  fillLight.position.set(-5, 0, -5);
  scene.add(fillLight);

  // Scene objects
  let mesh = null;
  let arrowGroups = { k1: null, k2: null, asymp: null };
  let streamlineGroup = null;
  let meshGroup = new THREE.Group();
  scene.add(meshGroup);

  // Arrow helper pool for animation
  let animatedArrows = [];

  // Create arrow helper
  function createArrow(pos, dir, color, length = 0.1) {
    const arrow = new THREE.ArrowHelper(
      dir.clone().normalize(),
      pos,
      length,
      color,
      length * 0.3,
      length * 0.2
    );
    return arrow;
  }

  // Get surface properties at a point (approximate)
  function getSurfaceProperties(geometry, point) {
    const positions = geometry.attributes.position;
    const normals = geometry.attributes.normal;
    const posAttr = positions.array;
    const normAttr = normals.array;

    let minDist = Infinity;
    let closestIdx = 0;

    for (let i = 0; i < positions.count; i++) {
      const dx = posAttr[i * 3] - point.x;
      const dy = posAttr[i * 3 + 1] - point.y;
      const dz = posAttr[i * 3 + 2] - point.z;
      const dist = dx * dx + dy * dy + dz * dz;
      if (dist < minDist) {
        minDist = dist;
        closestIdx = i;
      }
    }

    const normal = new THREE.Vector3(
      normAttr[closestIdx * 3],
      normAttr[closestIdx * 3 + 1],
      normAttr[closestIdx * 3 + 2]
    ).normalize();

    // Estimate curvature based on position (simplified)
    const curvature = estimateCurvature(geometry, point);

    return { normal, ...curvature };
  }

  // Estimate curvature from position (simplified analytical approach)
  function estimateCurvature(geometry, point) {
    // For different primitives, use analytical formulas
    if (currentModel === 'sphere') {
      // Sphere: both principal curvatures are equal = 1/R
      const R = 1.0;
      return { k1: 1/R, k2: 1/R, kMean: 1/R, kGauss: 1/(R*R) };
    } else if (currentModel === 'torus') {
      // Torus: R = major radius, r = minor radius
      const R = 2.0, r = 0.6;
      const d = Math.sqrt(point.x * point.x + point.z * point.z);
      const k1 = 1/r;
      const k2 = Math.cos(Math.atan2(point.y, d - R)) / (d - R * Math.cos(Math.atan2(point.y, d - R)));
      return { k1: Math.abs(k1), k2: Math.abs(k2), kMean: (k1 + k2) / 2, kGauss: k1 * k2 };
    } else if (currentModel === 'torusKnot') {
      // Simplified curvature estimation
      return { k1: 0.5, k2: 0.3, kMean: 0.4, kGauss: 0.15 };
    } else {
      // Default: small positive curvature
      return { k1: 0.3, k2: 0.2, kMean: 0.25, kGauss: 0.06 };
    }
  }

  // Get principal directions (simplified)
  function getPrincipalDirections(normal, point) {
    // Project tangent plane axes
    const tangent = new THREE.Vector3(1, 0, 0);
    if (Math.abs(normal.dot(tangent)) > 0.9) tangent.set(0, 1, 0);

    const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();
    tangent.crossVectors(bitangent, normal).normalize();

    return { tangent, bitangent };
  }

  // Generate arrows on surface
  function generateArrows(geometry) {
    // Clear existing
    Object.keys(arrowGroups).forEach(key => {
      if (arrowGroups[key]) {
        scene.remove(arrowGroups[key]);
        arrowGroups[key].traverse(c => {
          if (c.geometry) c.geometry.dispose();
          if (c.material) c.material.dispose();
        });
      }
    });

    const positions = geometry.attributes.position;
    const groupK1 = new THREE.Group();
    const groupK2 = new THREE.Group();
    const groupAsymp = new THREE.Group();

    // Sample points based on density
    const step = Math.max(1, Math.floor(positions.count / (50 * density)));
    const samples = [];

    for (let i = 0; i < positions.count; i += step) {
      samples.push(i);
    }

    // Get positions and normals
    const posAttr = geometry.attributes.position;
    const normAttr = geometry.attributes.normal;

    samples.forEach(i => {
      const pos = new THREE.Vector3(
        posAttr.array[i * 3],
        posAttr.array[i * 3 + 1],
        posAttr.array[i * 3 + 2]
      );
      const normal = new THREE.Vector3(
        normAttr.array[i * 3],
        normAttr.array[i * 3 + 1],
        normAttr.array[i * 3 + 2]
      ).normalize();

      const curvatures = estimateCurvature(pos);
      const { tangent, bitangent } = getPrincipalDirections(normal, pos);

      // Scale arrow length by curvature
      const len = 0.08 * Math.min(2, Math.abs(curvatures.k1) * 3 + 0.5);

      // k1 direction (red)
      if (displayMode === 'principal' || displayMode === 'both') {
        const dir1 = tangent.clone().normalize();
        groupK1.add(createArrow(pos, dir1, 0xff4444, len));
      }

      // k2 direction (blue)
      if (displayMode === 'principal' || displayMode === 'both') {
        const dir2 = bitangent.clone().normalize();
        groupK2.add(createArrow(pos, dir2, 0x4444ff, len * 0.8));
      }

      // Asymptotic directions (green) - only where Gaussian curvature is negative
      if ((displayMode === 'asymptotic' || displayMode === 'both') && curvatures.kGauss < 0) {
        const theta = Math.atan2(Math.sqrt(-curvatures.kGauss), curvatures.k1);
        const dirAsym1 = tangent.clone().multiplyScalar(Math.cos(theta))
          .add(bitangent.clone().multiplyScalar(Math.sin(theta))).normalize();
        const dirAsym2 = tangent.clone().multiplyScalar(Math.cos(theta))
          .add(bitangent.clone().multiplyScalar(-Math.sin(theta))).normalize();

        groupAsymp.add(createArrow(pos, dirAsym1, 0x44ff44, len * 0.6));
        groupAsymp.add(createArrow(pos, dirAsym2, 0x44ff44, len * 0.6));
      }
    });

    // Add wireframe for reference
    const wireGeo = new THREE.WireframeGeometry(geometry, 15);
    const wireMat = new THREE.LineBasicMaterial({ color: 0x333355, transparent: true, opacity: 0.3 });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    meshGroup.add(wireframe);

    arrowGroups.k1 = groupK1;
    arrowGroups.k2 = groupK2;
    arrowGroups.asymp = groupAsymp;

    scene.add(groupK1);
    scene.add(groupK2);
    scene.add(groupAsymp);

    // Update stats
    document.getElementById('field-count').textContent = samples.length * (displayMode === 'both' ? 4 : 2);
  }

  // Generate streamlines
  function generateStreamlines(geometry) {
    if (streamlineGroup) {
      scene.remove(streamlineGroup);
      streamlineGroup.traverse(c => {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
    }

    streamlineGroup = new THREE.Group();

    const positions = geometry.attributes.position;
    const normals = geometry.attributes.normal;
    const posAttr = positions.array;
    const normAttr = normals.array;

    const step = Math.max(1, Math.floor(positions.count / (30 * density)));
    const curves = [];

    // Generate streamlines using RK4 integration
    for (let i = 0; i < positions.count; i += step * 3) {
      if (curves.length > 30) break;

      const startPos = new THREE.Vector3(
        posAttr[i * 3],
        posAttr[i * 3 + 1],
        posAttr[i * 3 + 2]
      );
      const normal = new THREE.Vector3(
        normAttr[i * 3],
        normAttr[i * 3 + 1],
        normAttr[i * 3 + 2]
      ).normalize();

      const { tangent, bitangent } = getPrincipalDirections(normal, startPos);

      // Follow tangent direction
      const points = [startPos.clone()];
      let current = startPos.clone();
      const dt = 0.05;
      const maxSteps = 40;

      for (let s = 0; s < maxSteps; s++) {
        // Move along tangent (simplified - doesn't track actual surface)
        current = current.clone().add(tangent.clone().multiplyScalar(dt));
        points.push(current.clone());

        // Check bounds
        if (current.length() > 3) break;
      }

      if (points.length > 5) {
        const curve = new THREE.CatmullRomCurve3(points);
        const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.005, 4, false);
        const tubeMat = new THREE.MeshBasicMaterial({
          color: 0xff4444,
          transparent: true,
          opacity: 0.6
        });
        streamlineGroup.add(new THREE.Mesh(tubeGeo, tubeMat));
        curves.push({ curve, points });
      }

      // Bitangent direction (blue)
      const points2 = [startPos.clone()];
      let current2 = startPos.clone();

      for (let s = 0; s < maxSteps; s++) {
        current2 = current2.clone().add(bitangent.clone().multiplyScalar(dt));
        points2.push(current2.clone());
        if (current2.length() > 3) break;
      }

      if (points2.length > 5) {
        const curve2 = new THREE.CatmullRomCurve3(points2);
        const tubeGeo2 = new THREE.TubeGeometry(curve2, 20, 0.005, 4, false);
        const tubeMat2 = new THREE.MeshBasicMaterial({
          color: 0x4444ff,
          transparent: true,
          opacity: 0.6
        });
        streamlineGroup.add(new THREE.Mesh(tubeGeo2, tubeMat2));
        curves.push({ curve: curve2, points: points2 });
      }
    }

    scene.add(streamlineGroup);
  }

  // Create model
  function createModel(type) {
    // Clear existing
    meshGroup.clear();
    Object.values(arrowGroups).forEach(g => { if (g) scene.remove(g); });
    if (streamlineGroup) scene.remove(streamlineGroup);

    let geometry;
    let vertCount = 0, faceCount = 0;

    switch (type) {
      case 'sphere':
        geometry = new THREE.SphereGeometry(1, 64, 64);
        break;
      case 'torus':
        geometry = new THREE.TorusGeometry(2, 0.6, 32, 64);
        break;
      case 'torusKnot':
        geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
        break;
      case 'bunny':
        // Will load externally
        loadGLTFModel();
        return;
      default:
        geometry = new THREE.SphereGeometry(1, 32, 32);
    }

    setupMesh(geometry, vertCount, faceCount);
  }

  // Setup mesh with geometry
  function setupMesh(geometry, vertCount, faceCount) {
    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      color: 0x4444aa,
      metalness: 0.2,
      roughness: 0.6,
      side: THREE.DoubleSide
    });

    mesh = new THREE.Mesh(geometry, material);
    meshGroup.add(mesh);

    // Update stats
    vertCount = geometry.attributes.position.count;
    faceCount = geometry.index ? geometry.index.count / 3 : vertCount / 3;

    document.getElementById('vert-count').textContent = vertCount.toLocaleString();
    document.getElementById('face-count').textContent = Math.round(faceCount).toLocaleString();

    const curvatures = estimateCurvature(new THREE.Vector3(1, 0, 0));
    document.getElementById('curvature').textContent = curvatures.kMean.toFixed(3);

    // Generate visualization based on mode
    updateVisualization();

    loader.classList.add('hidden');
  }

  // Load GLTF model
  function loadGLTFModel() {
    const loaderGLTF = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@v0.157.0/examples/js/libs/draco/gltf/');
    loaderGLTF.setDRACOLoader(dracoLoader);

    loaderGLTF.load('/assets/Models2/fandisk.obj',
      function(gltf) {
        const model = gltf.scene;

        // Find first mesh
        let foundMesh = null;
        model.traverse(c => {
          if (c.isMesh && !foundMesh) foundMesh = c;
        });

        if (foundMesh) {
          // Center and scale
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter();
          const size = box.getSize();
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 3 / maxDim;

          model.scale.setScalar(scale);
          box.setFromObject(model);
          box.getCenter(center);
          model.position.sub(center);

          // Get geometry
          const geometry = foundMesh.geometry.clone();
          geometry.computeVertexNormals();

          setupMesh(geometry, geometry.attributes.position.count,
            geometry.index ? geometry.index.count / 3 : 0);
        }

        meshGroup.add(model);
      },
      undefined,
      function(err) {
        console.error('Failed to load model:', err);
        // Fallback to sphere
        setupMesh(new THREE.SphereGeometry(1, 64, 64), 4225, 4096);
      }
    );
  }

  // Update visualization based on current mode
  function updateVisualization() {
    if (!mesh) return;

    const geometry = mesh.geometry;

    // Remove old wireframe
    meshGroup.children = meshGroup.children.filter(c => !(c instanceof THREE.LineSegments));

    // Add wireframe
    const wireGeo = new THREE.WireframeGeometry(geometry, 15);
    const wireMat = new THREE.LineBasicMaterial({ color: 0x333355, transparent: true, opacity: 0.3 });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    meshGroup.add(wireframe);

    if (arrowMode === 'arrows' || arrowMode === 'both') {
      generateArrows(geometry);
    } else {
      Object.values(arrowGroups).forEach(g => { if (g) scene.remove(g); });
    }

    if (arrowMode === 'streamlines' || arrowMode === 'both') {
      generateStreamlines(geometry);
    } else {
      if (streamlineGroup) scene.remove(streamlineGroup);
    }
  }

  // Event listeners
  document.getElementById('model-select').addEventListener('change', (e) => {
    currentModel = e.target.value;
    loader.classList.remove('hidden');
    createModel(currentModel);
  });

  document.getElementById('field-select').addEventListener('change', (e) => {
    displayMode = e.target.value;
    updateVisualization();
  });

  document.getElementById('btn-arrows').addEventListener('click', (e) => {
    arrowMode = 'arrows';
    document.querySelectorAll('#btn-arrows, #btn-streamlines, #btn-both').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    updateVisualization();
  });

  document.getElementById('btn-streamlines').addEventListener('click', (e) => {
    arrowMode = 'streamlines';
    document.querySelectorAll('#btn-arrows, #btn-streamlines, #btn-both').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    updateVisualization();
  });

  document.getElementById('btn-both').addEventListener('click', (e) => {
    arrowMode = 'both';
    document.querySelectorAll('#btn-arrows, #btn-streamlines, #btn-both').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    updateVisualization();
  });

  document.getElementById('density-slider').addEventListener('input', (e) => {
    density = parseInt(e.target.value);
    updateVisualization();
  });

  document.getElementById('btn-animate').addEventListener('click', (e) => {
    isAnimating = !isAnimating;
    e.target.textContent = isAnimating ? '停止' : '动画';
    e.target.classList.toggle('active', isAnimating);
  });

  // Resize handler
  window.addEventListener('resize', () => {
    const s = sizeCanvas();
    width = s.w;
    height = s.h;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });

  // Animation loop
  let frameCount = 0;
  let lastFpsTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);

    if (isAnimating && mesh) {
      animationPhase += 0.02;
      mesh.rotation.y = animationPhase;

      // Rotate arrows
      if (arrowGroups.k1) {
        arrowGroups.k1.rotation.y = animationPhase;
      }
      if (arrowGroups.k2) {
        arrowGroups.k2.rotation.y = animationPhase;
      }
    }

    controls.update();
    renderer.render(scene, camera);

    // FPS counter
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = 'FPS: ' + frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }
  }

  // Initialize
  createModel('sphere');
  animate();
})();
</script>

</body>
</html>
