<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D网格变形 — 固定点约束 + 拖动变形</title>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060b14;
      color: #c6d1f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #0a1020;
      border-bottom: 1px solid rgba(106,132,255,0.15);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar label { font-size: 13px; color: #8a9dd4; }
    .toolbar select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #0d1528;
      color: #eef2ff;
      font-size: 14px;
      cursor: pointer;
    }
    .toolbar button {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #111b31;
      color: #c6d1f4;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar button:hover:not(:disabled) {
      background: #1a2848;
      border-color: rgba(106,132,255,0.6);
    }
    .toolbar button.active {
      background: #1a2848;
      border-color: #ff6b35;
    }
    .toolbar button.primary {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8f5e 100%);
      color: #fff;
      border: none;
      box-shadow: 0 3px 10px rgba(255,107,53,0.3);
    }
    .toolbar button.primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(255,107,53,0.5);
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .hint {
      font-size: 12px;
      color: #5a6791;
      max-width: 400px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .main { flex: 1; min-height: 0; }
    .panel {
      position: relative;
      border: 1px solid rgba(106,132,255,0.1);
      height: 100%;
      overflow: hidden;
    }
    .panel canvas { display: block; width: 100%; height: 100%; }
    .panel-label {
      position: absolute;
      top: 10px; left: 12px;
      font-size: 11px;
      color: rgba(138,157,212,0.6);
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <label>模型:</label>
    <select id="model-select"></select>

    <button id="pin-btn">选固定点</button>
    <button id="clear-pin-btn">清除固定点</button>
    <span style="font-size:13px;color:#8a9dd4;" id="pin-count">0 个固定点</span>

    <span class="spacer"></span>

    <button id="reset-btn">重置变形</button>
    <span class="hint" id="hint-text">点击"选固定点"后在网格上点击放置固定顶点，再拖动网格</span>
  </div>
  <div class="main">
    <div class="panel" id="main-panel">
      <div class="panel-label">固定点自动保存，换模型后自动恢复</div>
      <canvas id="main-canvas"></canvas>
    </div>
  </div>
</div>

<script>
(function() {
  // ==================== DOM ====================
  const modelSelect = document.getElementById('model-select');
  const pinBtn      = document.getElementById('pin-btn');
  const clearPinBtn = document.getElementById('clear-pin-btn');
  const pinCountEl  = document.getElementById('pin-count');
  const resetBtn    = document.getElementById('reset-btn');
  const hintText    = document.getElementById('hint-text');
  const mainCanvas  = document.getElementById('main-canvas');

  // ==================== Three.js 场景 ====================
  const renderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x08101d);

  const camera = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, 0.1, 10);
  camera.position.set(0, 0, 5);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8);
  dl.position.set(2, 3, 4); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dl2.position.set(-2, -1, -2); scene.add(dl2);

  // ==================== 状态 ====================
  let currentMeshData  = null;       // { positions, faces }
  let modelGroup       = null;       // 场景中的模型组
  let restPositions    = null;       // 原始位置（固定点坐标来源）
  let deformedPositions = null;     // 变形后的位置（null 表示未变形）
  let fixedVertices    = new Set();  // 固定顶点索引

  let pinMode          = false;      // 固定点选择模式
  let isMeshDragging   = false;      // 正在拖动网格
  let meshDragLast     = null;       // 上次鼠标世界坐标（用于计算 delta）
  let draggedPinIdx    = null;       // 正在拖动的固定点索引
  let pinDragStart     = null;       // { x, y } 屏幕坐标
  let pinDragMoved     = false;      // 固定点是否实际移动过
  let pinClickBlock    = false;      // 阻止 click 处理已由 mouseup 处理的固定点

  let currentModelFile = '';

  const PIN_STORAGE_KEY = 'mesh-deformation-pins-v1';
  const PIN_MATCH_EPS = 1e-3;

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // ==================== 工具函数 ====================
  function setHint(msg, color) {
    hintText.textContent = msg;
    hintText.style.color = color || '#5a6791';
  }

  function persistPins() {
    if (!currentModelFile || !restPositions) return;
    let store = {};
    try { store = JSON.parse(localStorage.getItem(PIN_STORAGE_KEY) || '{}'); } catch(e) {}
    if (fixedVertices.size === 0) {
      delete store[currentModelFile];
    } else {
      const indices = Array.from(fixedVertices);
      store[currentModelFile] = {
        vertexCount: restPositions.length,
        indices,
        points: indices.map(i => [restPositions[i][0], restPositions[i][1], restPositions[i][2]])
      };
    }
    localStorage.setItem(PIN_STORAGE_KEY, JSON.stringify(store));
  }

  function loadPins(modelFile, positions) {
    let store = {};
    try { store = JSON.parse(localStorage.getItem(PIN_STORAGE_KEY) || '{}'); } catch(e) { return new Set(); }
    const entry = store[modelFile];
    if (!entry || !entry.points || entry.points.length === 0) return new Set();
    const eps2 = PIN_MATCH_EPS * PIN_MATCH_EPS;
    const out = new Set();
    if (entry.vertexCount === positions.length && Array.isArray(entry.indices)) {
      let ok = true;
      for (let k = 0; k < entry.indices.length; k++) {
        const i = entry.indices[k], pt = entry.points[k];
        if (i < 0 || i >= positions.length || !pt) { ok = false; break; }
        const p = positions[i];
        if ((p[0]-pt[0])**2 + (p[1]-pt[1])**2 + (p[2]-pt[2])**2 > eps2) { ok = false; break; }
      }
      if (ok) { for (const i of entry.indices) out.add(i); return out; }
    }
    for (const pt of entry.points) {
      const vi = findNearestVertex({ x: pt[0], y: pt[1], z: pt[2] }, positions);
      if (vi >= 0) out.add(vi);
    }
    return out;
  }

  function findNearestVertex(point, positions) {
    let best = -1, bestD = Infinity;
    for (let i = 0; i < positions.length; i++) {
      const d = (positions[i][0]-point.x)**2 + (positions[i][1]-point.y)**2 + (positions[i][2]-point.z)**2;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function getCanvasCoords(canvas, e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
      y: -((e.clientY - rect.top) / rect.height) * 2 + 1
    };
  }

  function worldFromScreen(e) {
    const c = getCanvasCoords(mainCanvas, e);
    mouse.set(c.x, c.y);
    raycaster.setFromCamera(mouse, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1).negate(), 0);
    const pt = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(plane, pt)) {
      return { x: pt.x, y: pt.y };
    }
    return null;
  }

  // ==================== OBJ 模型加载 ====================
  function extractMeshData(geometry) {
    let positions, faces;
    if (geometry.attributes && geometry.attributes.position) {
      const pos = geometry.attributes.position;
      const idx = geometry.index;
      positions = [];
      for (let i = 0; i < pos.count; i++) positions.push([pos.getX(i), pos.getY(i), pos.getZ(i)]);
      if (idx) {
        faces = [];
        for (let i = 0; i < idx.array.length; i += 3) faces.push([idx.array[i], idx.array[i+1], idx.array[i+2]]);
      } else {
        faces = [];
        for (let i = 0; i < pos.count; i += 3) faces.push([i, i+1, i+2]);
      }
    } else if (geometry.vertices && geometry.faces) {
      positions = geometry.vertices.map(v => [v.x, v.y, v.z]);
      faces = geometry.faces.map(f => [f.a, f.b, f.c]);
    } else {
      throw new Error('无法解析几何体数据');
    }
    return { positions, faces };
  }

  // ==================== 可视化重建 ====================
  function getMeshObjects() {
    const arr = [];
    if (modelGroup) {
      modelGroup.children.forEach(c => {
        if (c.isMesh && !c.userData.isFixedMarker) arr.push(c);
      });
    }
    return arr;
  }

  function rebuildModel() {
    if (!currentMeshData) return;
    const pos = deformedPositions || currentMeshData.positions;
    const faces = currentMeshData.faces;

    if (modelGroup && modelGroup.parent) modelGroup.parent.remove(modelGroup);
    const group = new THREE.Group();

    // 实心面 + 线框
    const geom = new THREE.BufferGeometry();
    const flat = new Float32Array(pos.length * 3);
    for (let i = 0; i < pos.length; i++) { flat[i*3]=pos[i][0]; flat[i*3+1]=pos[i][1]; flat[i*3+2]=pos[i][2]; }
    geom.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
    const idx = new Uint32Array(faces.length * 3);
    for (let i = 0; i < faces.length; i++) { idx[i*3]=faces[i][0]; idx[i*3+1]=faces[i][1]; idx[i*3+2]=faces[i][2]; }
    geom.setIndex(new THREE.BufferAttribute(idx, 1));
    geom.computeVertexNormals();
    group.add(new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
      color: 0x7fa7ff, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide
    })));

    // 线框
    const edgeSet = new Set(), segs = [];
    for (let i = 0; i < faces.length; i++) {
      for (const [u,v] of [[faces[i][0],faces[i][1]],[faces[i][1],faces[i][2]],[faces[i][2],faces[i][0]]]) {
        const k = u<v ? u+'_'+v : v+'_'+u;
        if (edgeSet.has(k)) continue; edgeSet.add(k);
        segs.push(pos[u][0],pos[u][1],pos[u][2], pos[v][0],pos[v][1],pos[v][2]);
      }
    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
    group.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color:0x1f2f55, transparent:true, opacity:0.6 })));

    // 固定点标记（绿色球 / 拖动中为红色）
    const box = new THREE.Box3();
    for (const p of pos) box.expandByPoint(new THREE.Vector3(p[0],p[1],p[2]));
    const s = box.getSize(new THREE.Vector3());
    const r = Math.max(s.x, s.y, 0.5) * 0.006;
    const pinGeom = new THREE.SphereGeometry(r, 8, 8);
    const pinMatGreen = new THREE.MeshBasicMaterial({ color: 0x44e8a0 });
    const pinMatRed   = new THREE.MeshBasicMaterial({ color: 0xff4444 });
    for (const vi of fixedVertices) {
      const p = restPositions[vi];
      const m = new THREE.Mesh(pinGeom, (draggedPinIdx === vi) ? pinMatRed : pinMatGreen);
      m.position.set(p[0], p[1], p[2]);
      m.userData = { isFixedMarker: true, vertexIndex: vi };
      group.add(m);
    }

    modelGroup = group;
    scene.add(group);
    pinCountEl.textContent = fixedVertices.size + ' 个固定点';
  }

  // ==================== 模型加载 ====================
  async function loadMesh(path, label, modelFile) {
    currentModelFile = modelFile || path.split('/').pop();
    setHint('加载中...', '#ffd38a');
    try {
      const obj = await new Promise((resolve, reject) => {
        new THREE.OBJLoader().load(path, resolve, undefined, () => reject(new Error('加载失败')));
      });

      const allPos = [], allFaces = [];
      let off = 0;
      obj.traverse(child => {
        if (!child.isMesh || !child.geometry) return;
        const d = extractMeshData(child.geometry);
        d.positions.forEach(p => allPos.push([p[0],p[1],p[2]]));
        d.faces.forEach(f => allFaces.push([f[0]+off, f[1]+off, f[2]+off]));
        off += d.positions.length;
      });
      if (allPos.length === 0) throw new Error('模型无数据');

      currentMeshData = { positions: allPos, faces: allFaces };
      restPositions = allPos.map(p => [p[0],p[1],p[2]]);
      deformedPositions = null;
      fixedVertices = loadPins(currentModelFile, restPositions);

      // 重置交互状态
      pinMode = false;
      isMeshDragging = false;
      meshDragLast = null;
      draggedPinIdx = null;
      pinDragStart = null;
      pinDragMoved = false;
      pinClickBlock = false;
      pinBtn.textContent = '选固定点';
      pinBtn.classList.remove('active');

      rebuildModel();

      // 调整相机
      const box = new THREE.Box3();
      allPos.forEach(p => box.expandByPoint(new THREE.Vector3(p[0],p[1],p[2])));
      const max = Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, 0.5) * 0.65;
      camera.left = -max; camera.right = max; camera.top = max; camera.bottom = -max;
      camera.updateProjectionMatrix();
      camera.position.set(0, 0, 5); camera.lookAt(0, 0, 0);

      const n = fixedVertices.size;
      setHint('已加载 ' + label + (n > 0 ? '，已恢复 ' + n + ' 个固定点' : ' — 点"选固定点"开始'), '#89f0b6');
    } catch (e) {
      console.error(e);
      setHint('加载失败: ' + e.message, '#ff9d9d');
    }
  }

  // ==================== 鼠标交互 ====================
  mainCanvas.addEventListener('click', (e) => {
    if (pinClickBlock) return;
    if (!currentMeshData || isMeshDragging) return;
    if (!pinMode) return;

    const coords = getCanvasCoords(mainCanvas, e);
    mouse.set(coords.x, coords.y);
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(getMeshObjects(), false);
    if (hits.length === 0) return;

    const hit = hits[0];
    const pos = deformedPositions || currentMeshData.positions;
    const vi = findNearestVertex(hit.point, pos);
    if (vi < 0) return;

    // 距离阈值：只有靠近顶点才吸附
    const box = new THREE.Box3();
    pos.forEach(p => box.expandByPoint(new THREE.Vector3(p[0],p[1],p[2])));
    const s = box.getSize(new THREE.Vector3());
    const th = Math.max(s.x, s.y, 0.5) * 0.025;
    const v = pos[vi];
    if ((hit.point.x-v[0])**2 + (hit.point.y-v[1])**2 + (hit.point.z-v[2])**2 > th*th) return;

    if (fixedVertices.has(vi)) {
      fixedVertices.delete(vi);
    } else {
      fixedVertices.add(vi);
    }
    rebuildModel();
    persistPins();
    setHint('已选 ' + fixedVertices.size + ' 个固定点（已自动保存）', '#89f0b6');
  });

  mainCanvas.addEventListener('mousedown', (e) => {
    if (!currentMeshData) return;

    // ── 点击固定点标记 → 可能拖动 ──
    {
      const coords = getCanvasCoords(mainCanvas, e);
      mouse.set(coords.x, coords.y);
      raycaster.setFromCamera(mouse, camera);
      const markers = [];
      if (modelGroup) modelGroup.children.forEach(c => { if (c.userData && c.userData.isFixedMarker) markers.push(c); });
      const hits = raycaster.intersectObjects(markers, false);
      if (hits.length > 0) {
        const vi = hits[0].object.userData.vertexIndex;
        if (vi !== undefined && fixedVertices.has(vi)) {
          draggedPinIdx = vi;
          pinDragMoved = false;
          pinDragStart = { x: e.clientX, y: e.clientY };
          rebuildModel();  // 变红
          return;
        }
      }
    }

    // ── 拖动网格（固定点作为约束） ──
    if (pinMode) return;  // pinMode 下不触发网格拖动

    const coords = getCanvasCoords(mainCanvas, e);
    mouse.set(coords.x, coords.y);
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(getMeshObjects(), false);
    if (hits.length > 0) {
      isMeshDragging = true;
      meshDragLast = worldFromScreen(e);
      if (!deformedPositions) {
        deformedPositions = restPositions.map(p => [p[0],p[1],p[2]]);
      }
      setHint('拖动中… 固定点保持原位', '#ff8888');
    }
  });

  mainCanvas.addEventListener('mousemove', (e) => {
    if (!currentMeshData) return;

    // ── 拖动固定点 ──
    if (draggedPinIdx !== null) {
      const dx = e.clientX - pinDragStart.x, dy = e.clientY - pinDragStart.y;
      if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      pinDragMoved = true;

      const w = worldFromScreen(e);
      if (w) {
        restPositions[draggedPinIdx][0] = w.x;
        restPositions[draggedPinIdx][1] = w.y;
        if (deformedPositions) {
          deformedPositions[draggedPinIdx][0] = w.x;
          deformedPositions[draggedPinIdx][1] = w.y;
        }
        rebuildModel();
      }
      return;
    }

    // ── 拖动网格 ──
    if (!isMeshDragging) return;
    const w = worldFromScreen(e);
    if (!w || !meshDragLast) return;

    const dx = w.x - meshDragLast.x;
    const dy = w.y - meshDragLast.y;
    meshDragLast = w;

    // 所有非固定顶点跟着移动
    for (let i = 0; i < deformedPositions.length; i++) {
      if (fixedVertices.has(i)) continue;
      deformedPositions[i][0] += dx;
      deformedPositions[i][1] += dy;
    }
    // 固定点回位
    for (const vi of fixedVertices) {
      deformedPositions[vi][0] = restPositions[vi][0];
      deformedPositions[vi][1] = restPositions[vi][1];
    }
    rebuildModel();
  });

  window.addEventListener('mouseup', () => {
    // ── 释放固定点 ──
    if (draggedPinIdx !== null) {
      if (pinDragMoved) {
        // 拖动了：保存
        draggedPinIdx = null;
        pinDragStart = null;
        pinDragMoved = false;
        persistPins();
        rebuildModel();
        setHint('固定点已移动到新位置（已保存）', '#89f0b6');
      } else {
        // 单击：删除
        fixedVertices.delete(draggedPinIdx);
        draggedPinIdx = null;
        pinDragStart = null;
        pinDragMoved = false;
        pinClickBlock = true;
        setTimeout(() => { pinClickBlock = false; }, 0);
        persistPins();
        rebuildModel();
        setHint('已删除固定点，剩余 ' + fixedVertices.size + ' 个', '#89f0b6');
      }
      return;
    }

    // ── 释放网格拖动 ──
    if (isMeshDragging) {
      isMeshDragging = false;
      meshDragLast = null;
      rebuildModel();
      setHint('拖动结束 — 点"重置变形"恢复原始形状', '#8cc4ff');
    }
  });

  // ==================== 按钮事件 ====================
  pinBtn.addEventListener('click', () => {
    pinMode = !pinMode;
    if (pinMode) {
      pinBtn.textContent = '✓ 选择中';
      pinBtn.classList.add('active');
      setHint('点击网格顶点添加/移除固定点，也可拖动已有固定点', '#89f0b6');
    } else {
      pinBtn.textContent = '选固定点';
      pinBtn.classList.remove('active');
      setHint('已退出固定点模式，可直接拖动网格', '#5a6791');
    }
  });

  clearPinBtn.addEventListener('click', () => {
    fixedVertices.clear();
    draggedPinIdx = null;
    pinDragStart = null;
    pinDragMoved = false;
    pinClickBlock = false;
    persistPins();
    rebuildModel();
    setHint('固定点已清除', '#5a6791');
  });

  resetBtn.addEventListener('click', () => {
    if (!restPositions) return;
    deformedPositions = null;
    rebuildModel();
    setHint('已恢复到原始形状', '#8cc4ff');
  });

  // ==================== 模型列表 ====================
  const d2Models = [
    { file: 'alligator.obj', label: 'alligator' },
    { file: 'woody.obj', label: 'woody' }
  ];
  for (const m of d2Models) {
    const opt = document.createElement('option');
    opt.value = m.file;
    opt.textContent = m.label;
    modelSelect.appendChild(opt);
  }
  modelSelect.addEventListener('change', () => {
    if (!modelSelect.value) return;
    loadMesh('assets/2dmodels/' + modelSelect.value,
             modelSelect.options[modelSelect.selectedIndex].textContent,
             modelSelect.value);
  });

  // ==================== 响应式 ====================
  function resize() {
    const rect = document.getElementById('main-panel').getBoundingClientRect();
    renderer.setSize(rect.width, rect.height, false);
    const a = rect.width / Math.max(rect.height, 1);
    const curHalf = (camera.right - camera.left) / 2;
    camera.left  = -curHalf * a;
    camera.right =  curHalf * a;
    camera.top   =  curHalf;
    camera.bottom = -curHalf;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ==================== 渲染循环 ====================
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  // ==================== 启动 ====================
  resize();
