<script>
(function() {
  // ==================== DOM ====================
  const modelSelect = document.getElementById('model-select');
  const pinBtn      = document.getElementById('pin-btn');
  const clearPinBtn = document.getElementById('clear-pin-btn');
  const pinCountEl  = document.getElementById('pin-count');
  const resetBtn    = document.getElementById('reset-btn');
  const hintText    = document.getElementById('hint-text');
  const mainCanvas  = document.getElementById('main-canvas');
  const pinLabel    = document.getElementById('pin-label');
  const mlsModeSel      = document.getElementById('deform-mode');
  const showDistortion   = document.getElementById('show-distortion');
  const dragWholeChk     = document.getElementById('drag-whole');
  const showMagnifierChk = document.getElementById('show-magnifier');
  const magnifierEl      = document.getElementById('magnifier');
  const magCanvas        = document.getElementById('mag-canvas');

  // 放大镜专用渲染器 + 相机
  const magRenderer = new THREE.WebGLRenderer({ canvas: magCanvas, antialias: true, alpha: true });
  magRenderer.setPixelRatio(window.devicePixelRatio);
  magRenderer.setSize(160, 160, false);
  magRenderer.setClearColor(0x08101d, 1);
  const magCamera = new THREE.OrthographicCamera(-0.06, 0.06, 0.06, -0.06, 0.1, 10);

  // ==================== Three.js 场景 ====================
  const renderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x08101d);

  const camera = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, 0.1, 10);
  camera.position.set(0, 0, 5);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8);
  dl.position.set(2, 3, 4); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dl2.position.set(-2, -1, -2); scene.add(dl2);

  // ==================== 状态 ====================
  let currentMeshData  = null;       // { positions, faces }
  let modelGroup       = null;       // 场景中的模型组
  let restPositions    = null;       // 原始位置（固定点坐标来源）
  let deformedPositions = null;     // 变形后的位置（null 表示未变形）
  let fixedVertices    = new Set();  // 固定顶点索引

  let magCenter        = null;       // 放大镜世界坐标中心 { x, y }
  let pinMode          = false;      // 固定点选择模式
  let isMeshDragging   = false;      // 正在拖动网格
  let meshDragLast     = null;       // 上次鼠标世界坐标（用于计算 delta）
  let hoveredPinIdx    = null;       // 鼠标悬停的固定点索引
  let selectedPinIdx   = null;       // 被选中（红色）的固定点索引
  let draggedPinIdx    = null;       // 正在拖动的固定点索引
  let pinDragStart     = null;       // { x, y } 屏幕坐标
  let pinDragMoved     = false;      // 固定点是否实际移动过
  let pinClickBlock    = false;      // 阻止 click 事件重复处理

  // ARAP 预计算数据
  let arapLU = null;              // { L, P } 分解后的系统（主元置换 + 三角矩阵）
  let arapCotWeights = null;      // 每边的 cotangent 权重 { i, j, w }
  let arapFaceList = null;        // 面索引 → 顶点索引（快速查找）

  let currentModelFile = '';

  const PIN_STORAGE_KEY = 'mesh-deformation-pins-v1';
  const PIN_MATCH_EPS = 1e-3;

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // ==================== 工具函数 ====================
  function setHint(msg, color) {
    hintText.textContent = msg;
    hintText.style.color = color || '#5a6791';
  }

  function persistPins() {
    if (!currentModelFile || !restPositions) return;
    let store = {};
    try { store = JSON.parse(localStorage.getItem(PIN_STORAGE_KEY) || '{}'); } catch(e) {}
    if (fixedVertices.size === 0) {
      delete store[currentModelFile];
    } else {
      const indices = Array.from(fixedVertices);
      store[currentModelFile] = {
        vertexCount: restPositions.length,
        indices,
        points: indices.map(i => [restPositions[i][0], restPositions[i][1], restPositions[i][2]])
      };
    }
    localStorage.setItem(PIN_STORAGE_KEY, JSON.stringify(store));
  }

  function loadPins(modelFile, positions) {
    let store = {};
    try { store = JSON.parse(localStorage.getItem(PIN_STORAGE_KEY) || '{}'); } catch(e) { return new Set(); }
    const entry = store[modelFile];
    if (!entry || !entry.points || entry.points.length === 0) return new Set();
    const eps2 = PIN_MATCH_EPS * PIN_MATCH_EPS;
    const out = new Set();
    if (entry.vertexCount === positions.length && Array.isArray(entry.indices)) {
      let ok = true;
      for (let k = 0; k < entry.indices.length; k++) {
        const i = entry.indices[k], pt = entry.points[k];
        if (i < 0 || i >= positions.length || !pt) { ok = false; break; }
        const p = positions[i];
        if ((p[0]-pt[0])**2 + (p[1]-pt[1])**2 + (p[2]-pt[2])**2 > eps2) { ok = false; break; }
      }
      if (ok) { for (const i of entry.indices) out.add(i); return out; }
    }
    for (const pt of entry.points) {
      const vi = findNearestVertex({ x: pt[0], y: pt[1], z: pt[2] }, positions);
      if (vi >= 0) out.add(vi);
    }
    return out;
  }

  function findNearestVertex(point, positions) {
    let best = -1, bestD = Infinity;
    for (let i = 0; i < positions.length; i++) {
      const d = (positions[i][0]-point.x)**2 + (positions[i][1]-point.y)**2 + (positions[i][2]-point.z)**2;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  /** Moving Least Squares (MLS) — Schafer et al. 2006
   *  mode: 'similarity' | 'affine' | 'rigid'
   *  original = 所有顶点原始位置 [[x,y,z],...]
   *  controlIndices = 固定点（控制点）的索引 Set<number>
   *  controlCurrent = 控制点当前世界位置（index → [x,y]）
   *  alpha = 距离衰减指数，越大变形越局部 */
  function applyMLS(original, controlIndices, controlCurrent, alpha, mode) {
    const n = original.length;
    const result = original.map(p => [p[0], p[1], p[2]]);
    const cpIndices = Array.from(controlIndices);
    const cpCount = cpIndices.length;
    if (cpCount === 0) return result;

    const cpOrig = cpIndices.map(i => [original[i][0], original[i][1]]);

    for (let vi = 0; vi < n; vi++) {
      if (controlIndices.has(vi)) {
        const cur = controlCurrent[vi];
        result[vi][0] = cur[0];
        result[vi][1] = cur[1];
        continue;
      }

      const vx = original[vi][0];
      const vy = original[vi][1];

      // 1. 权重 w_i = 1 / dist^(2α)
      const weights = new Array(cpCount);
      let sumW = 0;
      for (let ci = 0; ci < cpCount; ci++) {
        const px = cpOrig[ci][0], py = cpOrig[ci][1];
        const d2 = (vx - px) * (vx - px) + (vy - py) * (vy - py);
        const w = 1.0 / Math.pow(d2 + 1e-10, alpha);
        weights[ci] = w;
        sumW += w;
      }
      if (sumW < 1e-12) continue;

      // 2. 加权重心 p*, q*
      let psx = 0, psy = 0, qsx = 0, qsy = 0;
      for (let ci = 0; ci < cpCount; ci++) {
        const w = weights[ci];
        psx += w * cpOrig[ci][0]; psy += w * cpOrig[ci][1];
        const cur = controlCurrent[cpIndices[ci]];
        qsx += w * cur[0]; qsy += w * cur[1];
      }
      psx /= sumW; psy /= sumW;
      qsx /= sumW; qsy /= sumW;

      const vpx = vx - psx;
      const vpy = vy - psy;

      if (mode === 'similarity') {
        // ─── 相似变换 [a,-b; b,a] ───
        let mu = 0, aNum = 0, bNum = 0;
        for (let ci = 0; ci < cpCount; ci++) {
          const w = weights[ci];
          const phx = cpOrig[ci][0] - psx;
          const phy = cpOrig[ci][1] - psy;
          const cur = controlCurrent[cpIndices[ci]];
          const qhx = cur[0] - qsx;
          const qhy = cur[1] - qsy;
          mu    += w * (phx * phx + phy * phy);
          aNum  += w * (phx * qhx + phy * qhy);
          bNum  += w * (phx * qhy - phy * qhx);
        }
        if (mu < 1e-10) continue;
        const a = aNum / mu;
        const b = bNum / mu;
        result[vi][0] = a * vpx - b * vpy + qsx;
        result[vi][1] = b * vpx + a * vpy + qsy;

      } else if (mode === 'affine') {
        // ─── 仿射变换 M = (Σ w·q̂·p̂^T) (Σ w·p̂·p̂^T)^(-1) ───
        let A = 0, B = 0, C = 0;   // Σ w·p̂·p̂^T = [[A,B],[B,C]]
        let D = 0, E = 0, F = 0, G = 0;  // Σ w·q̂·p̂^T = [[D,E],[F,G]]
        for (let ci = 0; ci < cpCount; ci++) {
          const w = weights[ci];
          const phx = cpOrig[ci][0] - psx;
          const phy = cpOrig[ci][1] - psy;
          const cur = controlCurrent[cpIndices[ci]];
          const qhx = cur[0] - qsx;
          const qhy = cur[1] - qsy;
          A += w * phx * phx;  B += w * phx * phy;  C += w * phy * phy;
          D += w * qhx * phx;  E += w * qhx * phy;
          F += w * qhy * phx;  G += w * qhy * phy;
        }
        const det = A * C - B * B;
        if (Math.abs(det) < 1e-10) continue;
        const invDet = 1.0 / det;
        const m00 = (D * C - E * B) * invDet;
        const m01 = (-D * B + E * A) * invDet;
        const m10 = (F * C - G * B) * invDet;
        const m11 = (-F * B + G * A) * invDet;
        result[vi][0] = m00 * vpx + m01 * vpy + qsx;
        result[vi][1] = m10 * vpx + m11 * vpy + qsy;

      } else {  // 'rigid'
        // ─── 刚性变换：相似矩阵归一化（|a|<1） ───
        let mu = 0, aNum = 0, bNum = 0;
        for (let ci = 0; ci < cpCount; ci++) {
          const w = weights[ci];
          const phx = cpOrig[ci][0] - psx;
          const phy = cpOrig[ci][1] - psy;
          const cur = controlCurrent[cpIndices[ci]];
          const qhx = cur[0] - qsx;
          const qhy = cur[1] - qsy;
          mu    += w * (phx * phx + phy * phy);
          aNum  += w * (phx * qhx + phy * qhy);
          bNum  += w * (phx * qhy - phy * qhx);
        }
        if (mu < 1e-10) continue;
        const scale = Math.sqrt(aNum * aNum + bNum * bNum) / mu;
        const a = scale > 1e-10 ? aNum / (mu * scale) : 1;
        const b = scale > 1e-10 ? bNum / (mu * scale) : 0;
        result[vi][0] = a * vpx - b * vpy + qsx;
        result[vi][1] = b * vpx + a * vpy + qsy;
      }
    }
    return result;
  }

  // ==================== ARAP 变形 ====================

  /** 2×2 矩阵闭式 SVD，返回旋转矩阵 R = U V^T */
  function svdRotation2x2(a, b, c, d) {
    const E = (a + d) * 0.5, F = (a - d) * 0.5, G = (c + b) * 0.5, H = (c - b) * 0.5;
    const Q = Math.sqrt(E * E + H * H), R2 = Math.sqrt(F * F + G * G);
    const s1 = Q + R2, s2 = Math.abs(Q - R2); // 奇异值
    const vx = (s1 > 1e-10) ? G : 0, vy = (s1 > 1e-10) ? (s1 - F) : 1, vn = Math.sqrt(vx * vx + vy * vy) || 1;
    const ux = (s2 > 1e-10) ? H : 0, uy = (s2 > 1e-10) ? (s2 - E) : 1, un = Math.sqrt(ux * ux + uy * uy) || 1;
    const cos1 = s1 > 1e-10 ? (a * vx / vn + b * vy / vn) / s1 : 0;
    const sin1 = s1 > 1e-10 ? (c * vx / vn + d * vy / vn) / s1 : 0;
    return { r: [[cos1, -sin1], [sin1, cos1]] };
  }

  /** 预构建 cotangent Laplacian 并 LU 分解 */
  function buildARAPSystem(positions, faces) {
    const n = positions.length;

    // 1. 计算每条边的 cot 权重
    const edgeWeights = new Map(); // key = 'i_j' → { w: total cot weight }
    const faceInfo = faces.map(f => {
      const [i, j, k] = f;
      const pi = positions[i], pj = positions[j], pk = positions[k];
      // 面积 × 2
      const area2 = Math.abs((pj[0]-pi[0])*(pk[1]-pi[1]) - (pk[0]-pi[0])*(pj[1]-pi[1]));
      const eps = 1e-10;
      // 对每条边计算 cot(对角)
      const edges = [
        { a: i, b: j, opp: k },
        { a: j, b: k, opp: i },
        { a: k, b: i, opp: j }
      ];
      const weights = [];
      for (const { a, b, opp } of edges) {
        const pa = positions[a], pb = positions[b], po = positions[opp];
        const d1x = pa[0] - po[0], d1y = pa[1] - po[1];
        const d2x = pb[0] - po[0], d2y = pb[1] - po[1];
        const cot = (d1x * d2x + d1y * d2y) / Math.max(area2, eps);
        weights.push(cot);
        const ka = a < b ? a + '_' + b : b + '_' + a;
        const prev = edgeWeights.get(ka) || 0;
        edgeWeights.set(ka, prev + cot);
      }
      return { i, j, k, w: weights }; // w[0]=cot@k, w[1]=cot@i, w[2]=cot@j
    });

    // 2. 构建 Laplacian 矩阵 L (dense)
    const L = new Array(n);
    for (let i = 0; i < n; i++) {
      L[i] = new Float64Array(n);
    }

    for (const [key, w] of edgeWeights) {
      const [si, sj] = key.split('_');
      const i = +si, j = +sj;
      L[i][j] = -w;
      L[j][i] = -w;
    }
    for (let i = 0; i < n; i++) {
      let diag = 0;
      for (let j = 0; j < n; j++) diag += L[i][j];
      L[i][i] = -diag + 1e-6; // 小对角线正则化
    }

    // 3. LU 分解 (就地)
    const P = new Int32Array(n);
    for (let i = 0; i < n; i++) P[i] = i;
    for (let col = 0; col < n; col++) {
      // 选主元
      let maxVal = Math.abs(L[col][col]), maxRow = col;
      for (let row = col + 1; row < n; row++) {
        if (Math.abs(L[row][col]) > maxVal) {
          maxVal = Math.abs(L[row][col]); maxRow = row;
        }
      }
      if (col !== maxRow) {
        [L[col], L[maxRow]] = [L[maxRow], L[col]];
        [P[col], P[maxRow]] = [P[maxRow], P[col]];
      }
      // 消元
      for (let row = col + 1; row < n; row++) {
        L[row][col] /= L[col][col];
        for (let k = col + 1; k < n; k++) {
          L[row][k] -= L[row][col] * L[col][k];
        }
      }
    }

    arapLU = { L, P };
    arapCotWeights = edgeWeights;
    arapFaceList = faceInfo;
  }

  /** ARAP 单步迭代：local(旋转) → global(求解) → 固定控制点 */
  function arapDeform(original, faces, controlIndices, controlCurrent) {
    const n = original.length;
    if (!arapLU) return original.map(p => [p[0], p[1], p[2]]);

    const curPos = original.map(p => [p[0], p[1], p[2]]);

    // ─── Local 步：每个三角形求最优旋转 ───
    const rotations = new Array(faces.length);
    for (let fi = 0; fi < faces.length; fi++) {
      const { i, j, k } = arapFaceList[fi];
      const pi = original[i], pj = original[j], pk = original[k];
      const ci = curPos[i], cj = curPos[j], ck = curPos[k];
      // 重心
      const cmx = (ci[0] + cj[0] + ck[0]) / 3, cmy = (ci[1] + cj[1] + ck[1]) / 3;
      const pmx = (pi[0] + pj[0] + pk[0]) / 3, pmy = (pi[1] + pj[1] + pk[1]) / 3;
      // P_cov = Σ (c_s - cm)(p_s - pm)^T
      let a = 0, b = 0, c = 0, d = 0;
      const s1 = [ci[0]-cmx, ci[1]-cmy], s2 = [cj[0]-cmx, cj[1]-cmy], s3 = [ck[0]-cmx, ck[1]-cmy];
      const r1 = [pi[0]-pmx, pi[1]-pmy], r2 = [pj[0]-pmx, pj[1]-pmy], r3 = [pk[0]-pmx, pk[1]-pmy];
      a += s1[0]*r1[0] + s2[0]*r2[0] + s3[0]*r3[0];
      b += s1[0]*r1[1] + s2[0]*r2[1] + s3[0]*r3[1];
      c += s1[1]*r1[0] + s2[1]*r2[0] + s3[1]*r3[0];
      d += s1[1]*r1[1] + s2[1]*r2[1] + s3[1]*r3[1];
      // SVD → 最优旋转
      const { r: R } = svdRotation2x2(a, b, c, d);
      rotations[fi] = R;
    }

    // ─── Global 步：组装 RHS b，求解 L x = b ───
    const bx = new Float64Array(n), by = new Float64Array(n);
    for (let fi = 0; fi < faces.length; fi++) {
      const { i, j, k, w } = arapFaceList[fi];
      const R = rotations[fi];
      const pi = original[i], pj = original[j], pk = original[k];
      const edges = [
        { a: i, b: j, pa: pi, pb: pj, cot: w[0] },
        { a: j, b: k, pa: pj, pb: pk, cot: w[1] },
        { a: k, b: i, pa: pk, pb: pi, cot: w[2] }
      ];
      for (const { a: va, b: vb, pa, pb, cot } of edges) {
        const vx = pa[0] - pb[0], vy = pa[1] - pb[1];
        const rx = R[0][0] * vx + R[0][1] * vy;
        const ry = R[1][0] * vx + R[1][1] * vy;
        const cx = cot * rx, cy = cot * ry;
        bx[va] += cx; bx[vb] -= cx;
        by[va] += cy; by[vb] -= cy;
      }
    }

    // 前代 + 回代
    const { L, P } = arapLU;
    const permute = (vec) => { const t = new Float64Array(n); for (let i=0;i<n;i++) t[i]=vec[P[i]]; vec.set(t); };
    const forward = (vec) => {
      permute(vec);
      for (let i=0; i<n; i++) {
        for (let j=0; j<i; j++) vec[i] -= L[i][j] * vec[j];
      }
    };
    const backward = (vec) => {
      for (let i=n-1; i>=0; i--) {
        for (let j=i+1; j<n; j++) vec[i] -= L[i][j] * vec[j];
        vec[i] /= L[i][i];
      }
    };
    forward(bx); backward(bx);
    forward(by); backward(by);

    // 更新当前位置，固定控制点覆盖
    for (let i = 0; i < n; i++) {
      curPos[i][0] = bx[i]; curPos[i][1] = by[i];
    }
    for (const ci of controlIndices) {
      const tgt = controlCurrent[ci];
      curPos[ci][0] = tgt[0]; curPos[ci][1] = tgt[1];
    }

    return curPos;
  }

  function getCanvasCoords(canvas, e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
      y: -((e.clientY - rect.top) / rect.height) * 2 + 1
    };
  }

  function worldFromScreen(e) {
    const c = getCanvasCoords(mainCanvas, e);
    mouse.set(c.x, c.y);
    raycaster.setFromCamera(mouse, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1).negate(), 0);
    const pt = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(plane, pt)) {
      return { x: pt.x, y: pt.y };
    }
    return null;
  }

  // ==================== OBJ 模型加载 ====================
  function extractMeshData(geometry) {
    let positions, faces;
    if (geometry.attributes && geometry.attributes.position) {
      const pos = geometry.attributes.position;
      const idx = geometry.index;
      positions = [];
      for (let i = 0; i < pos.count; i++) positions.push([pos.getX(i), pos.getY(i), pos.getZ(i)]);
      if (idx) {
        faces = [];
        for (let i = 0; i < idx.array.length; i += 3) faces.push([idx.array[i], idx.array[i+1], idx.array[i+2]]);
      } else {
        faces = [];
        for (let i = 0; i < pos.count; i += 3) faces.push([i, i+1, i+2]);
      }
    } else if (geometry.vertices && geometry.faces) {
      positions = geometry.vertices.map(v => [v.x, v.y, v.z]);
      faces = geometry.faces.map(f => [f.a, f.b, f.c]);
    } else {
      throw new Error('无法解析几何体数据');
    }
    return { positions, faces };
  }

  // ==================== 可视化重建 ====================
  function getMeshObjects() {
    const arr = [];
    if (modelGroup) {
      modelGroup.children.forEach(c => {
        if (c.isMesh && !c.userData.isFixedMarker) arr.push(c);
      });
    }
    return arr;
  }

  function rebuildModel() {
    if (!currentMeshData) return;
    const pos = deformedPositions || currentMeshData.positions;
    const faces = currentMeshData.faces;

    if (modelGroup && modelGroup.parent) modelGroup.parent.remove(modelGroup);
    const group = new THREE.Group();

    // 实心面（支持共形扭曲着色）
    const geom = new THREE.BufferGeometry();
    const flat = new Float32Array(pos.length * 3);
    for (let i = 0; i < pos.length; i++) { flat[i*3]=pos[i][0]; flat[i*3+1]=pos[i][1]; flat[i*3+2]=pos[i][2]; }
    geom.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
    const idx = new Uint32Array(faces.length * 3);
    for (let i = 0; i < faces.length; i++) { idx[i*3]=faces[i][0]; idx[i*3+1]=faces[i][1]; idx[i*3+2]=faces[i][2]; }
    geom.setIndex(new THREE.BufferAttribute(idx, 1));
    geom.computeVertexNormals();

    let faceMat;
    const showDist = showDistortion.checked && deformedPositions;
    if (showDist) {
      // 计算每三角形共形扭曲 σ1/σ2 → 顶点颜色
      const colors = new Float32Array(pos.length * 3);
      const triCounts = new Int32Array(pos.length);
      const restP = currentMeshData.positions;

      for (let fi = 0; fi < faces.length; fi++) {
        const [i, j, k] = faces[fi];
        const pi = restP[i], pj = restP[j], pk = restP[k];
        const qi = pos[i], qj = pos[j], qk = pos[k];
        // 边向量
        const e1x = pj[0]-pi[0], e1y = pj[1]-pi[1];
        const e2x = pk[0]-pi[0], e2y = pk[1]-pi[1];
        const f1x = qj[0]-qi[0], f1y = qj[1]-qi[1];
        const f2x = qk[0]-qi[0], f2y = qk[1]-qi[1];
        // J = [f1 f2] * [e1 e2]^(-1)
        const detE = e1x*e2y - e1y*e2x;
        if (Math.abs(detE) < 1e-10) continue;
        const invDet = 1/detE;
        const a = (f1x*e2y - f2x*e1y) * invDet;
        const b = (f2x*e1x - f1x*e2x) * invDet;
        const c = (f1y*e2y - f2y*e1y) * invDet;
        const d = (f2y*e1x - f1y*e2x) * invDet;
        // SVD → σ1/σ2
        const tr = a*a+b*b+c*c+d*d, det = a*d-b*c;
        const disc = Math.sqrt(Math.max(tr*tr - 4*det*det, 0));
        const s1 = Math.sqrt((tr + disc)/2), s2 = Math.sqrt(Math.max((tr - disc)/2, 1e-10));
        const ratio = Math.max(s1/s2, s2/s1); // ≥1, 1=共形
        // 颜色映射：1=蓝 → 1.5=青 → 3=绿 → 6=黄 → 10+=红
        const t = Math.min((ratio - 1) / 9, 1);
        const r = Math.min(t * 2, 1);
        const g = 1 - Math.abs(t - 0.5) * 2;
        const bCol = 1 - t;
        for (const vi of [i, j, k]) {
          colors[vi*3]   += r;
          colors[vi*3+1] += g;
          colors[vi*3+2] += bCol;
          triCounts[vi]++;
        }
      }
      for (let vi = 0; vi < pos.length; vi++) {
        const n = triCounts[vi] || 1;
        colors[vi*3] /= n; colors[vi*3+1] /= n; colors[vi*3+2] /= n;
      }
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      faceMat = new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide
      });
    } else {
      faceMat = new THREE.MeshStandardMaterial({
        color: 0x7fa7ff, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide
      });
    }
    group.add(new THREE.Mesh(geom, faceMat));

    // 线框
    const edgeSet = new Set(), segs = [];
    for (let i = 0; i < faces.length; i++) {
      for (const [u,v] of [[faces[i][0],faces[i][1]],[faces[i][1],faces[i][2]],[faces[i][2],faces[i][0]]]) {
        const k = u<v ? u+'_'+v : v+'_'+u;
        if (edgeSet.has(k)) continue; edgeSet.add(k);
        segs.push(pos[u][0],pos[u][1],pos[u][2], pos[v][0],pos[v][1],pos[v][2]);
      }
    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
    group.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color:0x1f2f55, transparent:true, opacity:0.6 })));

    // 固定点标记 — 三态：正常=绿、hover=黄、选中/拖拽=红
    const box = new THREE.Box3();
    for (const p of pos) box.expandByPoint(new THREE.Vector3(p[0],p[1],p[2]));
    const s = box.getSize(new THREE.Vector3());
    const r = Math.max(s.x, s.y, 0.5) * 0.006;
    const pinGeom = new THREE.SphereGeometry(r, 8, 8);
    const matGreen  = new THREE.MeshBasicMaterial({ color: 0x44e8a0 });
    const matYellow = new THREE.MeshBasicMaterial({ color: 0xffd740 });
    const matRed    = new THREE.MeshBasicMaterial({ color: 0xff4444 });
    for (const vi of fixedVertices) {
      const p = restPositions[vi];
      let mat = matGreen;
      if (draggedPinIdx === vi || selectedPinIdx === vi) {
        mat = matRed;
      } else if (hoveredPinIdx === vi) {
        mat = matYellow;
      }
      const m = new THREE.Mesh(pinGeom, mat);
      m.position.set(p[0], p[1], p[2]);
      m.userData = { isFixedMarker: true, vertexIndex: vi };
      group.add(m);
    }

    modelGroup = group;
    scene.add(group);
    pinCountEl.textContent = fixedVertices.size + ' 个固定点';
  }

  // ==================== 模型加载 ====================
  async function loadMesh(path, label, modelFile) {
    currentModelFile = modelFile || path.split('/').pop();
    setHint('加载中...', '#ffd38a');
    try {
      const obj = await new Promise((resolve, reject) => {
        new THREE.OBJLoader().load(path, resolve, undefined, () => reject(new Error('加载失败')));
      });

      const allPos = [], allFaces = [];
      let off = 0;
      obj.traverse(child => {
        if (!child.isMesh || !child.geometry) return;
        const d = extractMeshData(child.geometry);
        d.positions.forEach(p => allPos.push([p[0],p[1],p[2]]));
        d.faces.forEach(f => allFaces.push([f[0]+off, f[1]+off, f[2]+off]));
        off += d.positions.length;
      });
      if (allPos.length === 0) throw new Error('模型无数据');

      currentMeshData = { positions: allPos, faces: allFaces };
      restPositions = allPos.map(p => [p[0],p[1],p[2]]);
      deformedPositions = null;
      fixedVertices = loadPins(currentModelFile, restPositions);
      // ARAP 系统标记为脏，需要时再构建
      arapLU = null;

      // 重置交互状态
      pinMode = false;
      isMeshDragging = false;
      meshDragLast = null;
      hoveredPinIdx = null;
      selectedPinIdx = null;
      draggedPinIdx = null;
      pinDragStart = null;
      pinDragMoved = false;
      pinClickBlock = false;
      mainCanvas.style.cursor = '';
      pinBtn.textContent = '选固定点';
      pinBtn.classList.remove('active');

      rebuildModel();

      // 调整相机
      const box = new THREE.Box3();
      allPos.forEach(p => box.expandByPoint(new THREE.Vector3(p[0],p[1],p[2])));
      const max = Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, 0.5) * 0.65;
      camera.left = -max; camera.right = max; camera.top = max; camera.bottom = -max;
      camera.updateProjectionMatrix();
      camera.position.set(0, 0, 5); camera.lookAt(0, 0, 0);

      const n = fixedVertices.size;
      setHint('已加载 ' + label + (n > 0 ? '，已恢复 ' + n + ' 个固定点' : ' — 点"选固定点"开始'), '#89f0b6');
    } catch (e) {
      console.error(e);
      setHint('加载失败: ' + e.message, '#ff9d9d');
    }
  }

  // ==================== 鼠标交互 ====================
  // ── 双击固定点标记 → 删除 ──
  mainCanvas.addEventListener('dblclick', (e) => {
    if (!currentMeshData) return;
    const coords = getCanvasCoords(mainCanvas, e);
    mouse.set(coords.x, coords.y);
    raycaster.setFromCamera(mouse, camera);
    const markers = [];
    if (modelGroup) modelGroup.children.forEach(c => { if (c.userData && c.userData.isFixedMarker) markers.push(c); });
    const hits = raycaster.intersectObjects(markers, false);
    if (hits.length > 0) {
      const vi = hits[0].object.userData.vertexIndex;
      fixedVertices.delete(vi);
      if (selectedPinIdx === vi) selectedPinIdx = null;
      if (hoveredPinIdx === vi) hoveredPinIdx = null;
      persistPins();
      rebuildModel();
      setHint('已删除固定点，剩余 ' + fixedVertices.size + ' 个', '#89f0b6');
    }
  });

  mainCanvas.addEventListener('click', (e) => {
    if (pinClickBlock) return;
    if (!currentMeshData || isMeshDragging) return;

    // ── 点击空白处 → 取消选中 ──
    if (selectedPinIdx !== null && !pinMode) {
      // 检查是否点击在固定点标记上
      const coords = getCanvasCoords(mainCanvas, e);
      mouse.set(coords.x, coords.y);
      raycaster.setFromCamera(mouse, camera);
      const markers = [];
      if (modelGroup) modelGroup.children.forEach(c => { if (c.userData && c.userData.isFixedMarker) markers.push(c); });
      const mhits = raycaster.intersectObjects(markers, false);
      if (mhits.length === 0) {
        selectedPinIdx = null;
        rebuildModel();
        setHint('已取消选中', '#5a6791');
        return;
      }
    }

    if (!pinMode) return;

    const coords = getCanvasCoords(mainCanvas, e);
    mouse.set(coords.x, coords.y);
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(getMeshObjects(), false);
    if (hits.length === 0) return;

    const hit = hits[0];
    const pos = deformedPositions || currentMeshData.positions;
    const vi = findNearestVertex(hit.point, pos);
    if (vi < 0) return;

    // 距离阈值：只有靠近顶点才吸附
    const box = new THREE.Box3();
    pos.forEach(p => box.expandByPoint(new THREE.Vector3(p[0],p[1],p[2])));
    const s = box.getSize(new THREE.Vector3());
    const th = Math.max(s.x, s.y, 0.5) * 0.025;
    const v = pos[vi];
    if ((hit.point.x-v[0])**2 + (hit.point.y-v[1])**2 + (hit.point.z-v[2])**2 > th*th) return;

    if (fixedVertices.has(vi)) {
      fixedVertices.delete(vi);
      if (selectedPinIdx === vi) selectedPinIdx = null;
    } else {
      fixedVertices.add(vi);
    }
    rebuildModel();
    persistPins();
    setHint('已选 ' + fixedVertices.size + ' 个固定点（已自动保存）', '#89f0b6');
  });

  mainCanvas.addEventListener('mousedown', (e) => {
    if (!currentMeshData) return;

    // ── 点击固定点标记 → 选中（变红），可拖拽 ──
    {
      const coords = getCanvasCoords(mainCanvas, e);
      mouse.set(coords.x, coords.y);
      raycaster.setFromCamera(mouse, camera);
      const markers = [];
      if (modelGroup) modelGroup.children.forEach(c => { if (c.userData && c.userData.isFixedMarker) markers.push(c); });
      const hits = raycaster.intersectObjects(markers, false);
      if (hits.length > 0) {
        const vi = hits[0].object.userData.vertexIndex;
        if (vi !== undefined && fixedVertices.has(vi)) {
          // 选中该固定点 → 变红，准备拖拽
          selectedPinIdx = vi;
          pinDragMoved = false;
          pinDragStart = { x: e.clientX, y: e.clientY };
          hoveredPinIdx = null;  // 清除 hover 状态
          rebuildModel();
          setHint('固定点已选中（红色），拖拽可移动 · 点空白处取消 · 双击删除', '#ff8888');
          return;
        }
      }
    }

    // ── 拖动网格（固定点作为约束） ──
    if (pinMode) return;  // pinMode 下不触发网格拖动
    if (!dragWholeChk.checked) return;  // 只有选中"拖动整体"才能拖网格

    const coords = getCanvasCoords(mainCanvas, e);
    mouse.set(coords.x, coords.y);
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(getMeshObjects(), false);
    if (hits.length > 0) {
      isMeshDragging = true;
      meshDragLast = worldFromScreen(e);
      if (!deformedPositions) {
        deformedPositions = restPositions.map(p => [p[0],p[1],p[2]]);
      }
      setHint('拖动中… 固定点保持原位', '#ff8888');
    }
  });

  mainCanvas.addEventListener('mousemove', (e) => {
    if (!currentMeshData) return;

    // ── 放大镜：更新位置和世界中心 ──
    if (showMagnifierChk.checked) {
      const rect = mainCanvas.getBoundingClientRect();
      magnifierEl.style.left = (e.clientX - rect.left - 80) + 'px';
      magnifierEl.style.top  = (e.clientY - rect.top - 80) + 'px';
      magnifierEl.style.display = 'block';
      const w = worldFromScreen(e);
      if (w) magCenter = w;
    } else {
      magnifierEl.style.display = 'none';
      magCenter = null;
    }

    // ── 检测固定点 hover（非拖动状态下） ──
    if (!draggedPinIdx && !isMeshDragging && !selectedPinIdx) {
      const coords = getCanvasCoords(mainCanvas, e);
      mouse.set(coords.x, coords.y);
      raycaster.setFromCamera(mouse, camera);
      const markers = [];
      if (modelGroup) modelGroup.children.forEach(c => { if (c.userData && c.userData.isFixedMarker) markers.push(c); });
      const hits = raycaster.intersectObjects(markers, false);
      const prevHover = hoveredPinIdx;
      if (hits.length > 0) {
        hoveredPinIdx = hits[0].object.userData.vertexIndex;
      } else {
        hoveredPinIdx = null;
      }
      if (hoveredPinIdx !== prevHover) {
        mainCanvas.style.cursor = hoveredPinIdx !== null ? 'pointer' : '';
        rebuildModel();
      }
      if (hoveredPinIdx !== null && !pinMode) return; // hover 但非 pinMode：只显示指针，不阻塞
    }

    // ── 拖动选中的固定点 ──
    if (selectedPinIdx !== null) {
      const dx = e.clientX - (pinDragStart ? pinDragStart.x : e.clientX);
      const dy = e.clientY - (pinDragStart ? pinDragStart.y : e.clientY);
      if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;

      // 首次移动：将 selectedPinIdx 转为 draggedPinIdx
      if (!draggedPinIdx) {
        draggedPinIdx = selectedPinIdx;
        pinDragStart = { x: e.clientX, y: e.clientY };
        setHint('拖动固定点 → 释放即固定', '#ff8888');
      }
      pinDragMoved = true;

      if (!deformedPositions && restPositions) {
        deformedPositions = restPositions.map(p => [p[0], p[1], p[2]]);
      }

      const w = worldFromScreen(e);
      if (w && pinDragStart) {
        // 更新被拖拽控制点的位置
        restPositions[draggedPinIdx][0] = w.x;
        restPositions[draggedPinIdx][1] = w.y;

        // —— 变形算法分发 ——
        const ctrlCurrent = {};
        for (const ci of fixedVertices) {
          ctrlCurrent[ci] = [restPositions[ci][0], restPositions[ci][1]];
        }

        const mode = mlsModeSel.value;
        let result;
        if (mode === 'arap') {
          // 首次使用 ARAP 时懒构建 Laplacian 系统
          if (!arapLU) {
            setHint('正在构建 ARAP 系统…', '#ffd38a');
            buildARAPSystem(currentMeshData.positions, currentMeshData.faces);
            setHint('ARAP 系统就绪', '#89f0b6');
          }
          result = arapDeform(currentMeshData.positions, currentMeshData.faces, fixedVertices, ctrlCurrent);
        } else {
          // MLS: similarity / affine / rigid
          result = applyMLS(currentMeshData.positions, fixedVertices, ctrlCurrent, 1.0, mode);
        }
        for (let i = 0; i < result.length; i++) {
          deformedPositions[i][0] = result[i][0];
          deformedPositions[i][1] = result[i][1];
        }

        rebuildModel();
      }
      return;
    }

    // ── 拖动网格 ──
    if (!isMeshDragging) return;
    const w = worldFromScreen(e);
    if (!w || !meshDragLast) return;

    const dx = w.x - meshDragLast.x;
    const dy = w.y - meshDragLast.y;
    meshDragLast = w;

    // 所有非固定顶点跟着移动
    for (let i = 0; i < deformedPositions.length; i++) {
      if (fixedVertices.has(i)) continue;
      deformedPositions[i][0] += dx;
      deformedPositions[i][1] += dy;
    }
    // 固定点回位
    for (const vi of fixedVertices) {
      deformedPositions[vi][0] = restPositions[vi][0];
      deformedPositions[vi][1] = restPositions[vi][1];
    }
    rebuildModel();
  });

  window.addEventListener('mouseup', () => {
    // ── 释放固定点 ──
    if (draggedPinIdx !== null) {
      // 拖动了：保存新位置，恢复绿色
      const vi = draggedPinIdx;
      draggedPinIdx = null;
      selectedPinIdx = null;
      pinDragStart = null;
      pinDragMoved = false;
      persistPins();
      rebuildModel();
      setHint('固定点已移动到新位置（已保存）', '#89f0b6');
      return;
    }

    // ── 释放网格拖动 ──
    if (isMeshDragging) {
      isMeshDragging = false;
      meshDragLast = null;
      rebuildModel();
      setHint('拖动结束 — 点"重置变形"恢复原始形状', '#8cc4ff');
    }
  });

  // ==================== 按钮事件 ====================
  pinBtn.addEventListener('click', () => {
    pinMode = !pinMode;
    if (pinMode) {
      pinBtn.textContent = '✓ 选择中';
      pinBtn.classList.add('active');
      setHint('点击网格顶点添加/移除固定点，也可拖动已有固定点', '#89f0b6');
    } else {
      pinBtn.textContent = '选固定点';
      pinBtn.classList.remove('active');
      setHint('已退出固定点模式，可直接拖动网格', '#5a6791');
    }
  });

  clearPinBtn.addEventListener('click', () => {
    fixedVertices.clear();
    hoveredPinIdx = null;
    selectedPinIdx = null;
    draggedPinIdx = null;
    pinDragStart = null;
    pinDragMoved = false;
    pinClickBlock = false;
    mainCanvas.style.cursor = '';
    persistPins();
    rebuildModel();
    setHint('固定点已清除', '#5a6791');
  });

  resetBtn.addEventListener('click', () => {
    if (!restPositions) return;
    deformedPositions = null;
    rebuildModel();
    setHint('已恢复到原始形状', '#8cc4ff');
  });

  showDistortion.addEventListener('change', () => {
    rebuildModel();
  });

  // ==================== 模型列表 ====================
  const MODELS_DIR = (window.ALGO_MODELS_DIR || "assets/2dmodels").replace(/^\/+|\/+$/g, "");
  const d2Models = [
    { file: 'alligator.obj', label: 'alligator' },
    { file: 'woody.obj', label: 'woody' }
  ];
  for (const m of d2Models) {
    const opt = document.createElement('option');
    opt.value = m.file;
    opt.textContent = m.label;
    modelSelect.appendChild(opt);
  }
  modelSelect.addEventListener('change', () => {
    if (!modelSelect.value) return;
    loadMesh(MODELS_DIR + '/' + modelSelect.value,
             modelSelect.options[modelSelect.selectedIndex].textContent,
             modelSelect.value);
  });

  // ==================== 响应式 ====================
  function resize() {
    const rect = document.getElementById('main-panel').getBoundingClientRect();
    renderer.setSize(rect.width, rect.height, false);
    const a = rect.width / Math.max(rect.height, 1);
    const curHalf = (camera.right - camera.left) / 2;
    camera.left  = -curHalf * a;
    camera.right =  curHalf * a;
    camera.top   =  curHalf;
    camera.bottom = -curHalf;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ── Esc 取消选中固定点 ──
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && selectedPinIdx !== null) {
      selectedPinIdx = null;
      rebuildModel();
      setHint('已取消选中', '#5a6791');
    }
  });

  // ==================== 渲染循环 ====================
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);

    // ── 放大镜渲染 ──
    if (showMagnifierChk.checked && magCenter) {
      magCamera.position.set(magCenter.x, magCenter.y, 5);
      magCamera.lookAt(magCenter.x, magCenter.y, 0);
      magCamera.updateProjectionMatrix();
      magRenderer.render(scene, magCamera);
    }

    // 选中固定点的 index 标签跟随
    if (selectedPinIdx !== null && restPositions) {
      const p = restPositions[selectedPinIdx];
      const v = new THREE.Vector3(p[0], p[1], p[2]);
      v.project(camera);
      const rect = mainCanvas.getBoundingClientRect();
      const sx = (v.x * 0.5 + 0.5) * rect.width;
      const sy = (-v.y * 0.5 + 0.5) * rect.height;
      pinLabel.style.left = sx + 'px';
      pinLabel.style.top  = sy + 'px';
      pinLabel.textContent = '#' + selectedPinIdx;
      pinLabel.style.display = 'block';
    } else {
      pinLabel.style.display = 'none';
    }
  }

  // ==================== 启动 ====================
  resize();
  modelSelect.value = d2Models[0].file;
  loadMesh(MODELS_DIR + '/' + d2Models[0].file, d2Models[0].label, d2Models[0].file);
  animate();
})();
</script>
</body>
</html>
