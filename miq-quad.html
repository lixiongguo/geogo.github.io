<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIQ 四边形网格化</title>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a1020;
      color: #d8def7;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(140, 170, 255, 0.24);
      background: rgba(10, 16, 30, 0.95);
    }
    .toolbar h1 {
      margin: 0 8px 0 0;
      font-size: 18px;
      color: #ecf2ff;
    }
    .toolbar label {
      font-size: 13px;
      color: #9fb2df;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select,
    button {
      border: 1px solid rgba(140, 170, 255, 0.35);
      border-radius: 8px;
      background: #152543;
      color: #edf2ff;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1c2f57; }
    .hidden-input { display: none; }
    .status {
      margin-left: auto;
      color: #90c6ff;
      font-size: 13px;
      min-width: 240px;
      text-align: right;
    }
    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: #101a34;
      min-height: 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #0b1328;
    }
    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(140, 170, 255, 0.2);
      color: #c7d3f1;
      font-size: 13px;
    }
    .canvas-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      font-size: 12px;
      color: rgba(176, 194, 230, 0.75);
      pointer-events: none;
    }
    .drop-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 12, 24, 0.8);
      border: 2px dashed rgba(150, 188, 255, 0.55);
      color: #dce7ff;
      font-size: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
      text-align: center;
    }
    .drop-overlay.active { opacity: 1; }
    .drop-overlay small {
      display: block;
      margin-top: 10px;
      color: #9eb4df;
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .status {
        text-align: left;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>MIQ 四边形网格化</h1>
    <label>输入三角网格</label>
    <select id="model-select"></select>
    <button id="upload-btn">上传OBJ</button>
    <label>参数化方式
      <select id="solver-select">
        <option value="lscm">LSCM</option>
        <option value="arap">ARAP</option>
      </select>
    </label>
    <input id="obj-upload" class="hidden-input" type="file" accept=".obj,model/obj,text/plain">
    <label>网格密度
      <input id="density" type="range" min="8" max="34" step="1" value="18">
    </label>
    <button id="solve-btn">输出四边形网格</button>
    <button id="show-quad-btn">显示四边形网格化效果</button>
    <div id="status" class="status">准备就绪</div>
  </div>

  <div class="content">
    <section class="panel">
      <div class="panel-header">输入：三角网格（OBJ）</div>
      <div class="canvas-wrap" id="model-wrap">
        <canvas id="model-canvas"></canvas>
        <div class="hint">左侧展示输入三角网格</div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-header">输出：四边形网格线（MIQ参数化提取）</div>
      <div class="canvas-wrap" id="quad-wrap">
        <canvas id="quad-canvas"></canvas>
        <div class="hint">右侧展示由 u/v 等值线形成的 quad 网格</div>
      </div>
    </section>
  </div>

  <div id="drop-overlay" class="drop-overlay">
    <div>
      拖拽 OBJ 文件到这里
      <small>将三角网格作为 MIQ 输入</small>
    </div>
  </div>

  <script>
    (function () {
      const MODELS = {
        balls: { label: "Balls", file: "Balls.obj" },
        nefertiti: { label: "Nefertiti Face", file: "Nefertiti_face.obj" },
        cathead: { label: "Cat Head", file: "cathead.obj" },
        bunnyhead: { label: "Bunny Head", file: "bunnyhead.obj" },
        camelhead: { label: "Camel Head", file: "camelhead.obj" },
        cow_head: { label: "Cow Head", file: "cow_head.obj" },
        spot_cowhead: { label: "Spot Cow Head", file: "spot_cowhead.obj" },
        beetle: { label: "Beetle", file: "beetle.obj" },
        hand: { label: "Hand (5K)", file: "hand_1_i_f5000.obj" },
        hencky: { label: "Hencky (20K)", file: "hencky_f20000.obj" }
      };
      const MODEL_BASE_PATHS = ["assets/Models", "../assets/Models", "./assets/Models"];

      const modelSelect = document.getElementById("model-select");
      const solverSelect = document.getElementById("solver-select");
      const uploadBtn = document.getElementById("upload-btn");
      const objUpload = document.getElementById("obj-upload");
      const densityInput = document.getElementById("density");
      const solveBtn = document.getElementById("solve-btn");
      const showQuadBtn = document.getElementById("show-quad-btn");
      const statusEl = document.getElementById("status");
      const dropOverlay = document.getElementById("drop-overlay");

      const modelCanvas = document.getElementById("model-canvas");
      const quadCanvas = document.getElementById("quad-canvas");
      const modelWrap = document.getElementById("model-wrap");
      const quadWrap = document.getElementById("quad-wrap");
      const quadCtx = quadCanvas.getContext("2d");

      const objLoader = new THREE.OBJLoader();
      const modelRenderer = new THREE.WebGLRenderer({ canvas: modelCanvas, antialias: true, alpha: true });
      modelRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      const modelScene = new THREE.Scene();
      modelScene.background = new THREE.Color(0x08101d);
      const modelCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
      modelCamera.position.set(1.8, 1.5, 1.8);
      const controls = new THREE.OrbitControls(modelCamera, modelCanvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      modelScene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(2, 3, 4);
      modelScene.add(dirLight);

      let currentModelGroup = null;
      let currentMeshData = null;
      let currentUv = null;
      let currentSourceLabel = "";
      let customModelFile = null;
      let busy = false;
      let dragDepth = 0;
      let quadVisible = false;

      function setStatus(text, color) {
        statusEl.textContent = text;
        statusEl.style.color = color || "#90c6ff";
      }

      function setBusy(nextBusy) {
        busy = nextBusy;
        modelSelect.disabled = nextBusy;
        solverSelect.disabled = nextBusy;
        uploadBtn.disabled = nextBusy;
        solveBtn.disabled = nextBusy;
        showQuadBtn.disabled = nextBusy;
      }

      function initModelOptions() {
        modelSelect.innerHTML = "";
        const keys = Object.keys(MODELS);
        for (let i = 0; i < keys.length; i++) {
          const key = keys[i];
          const option = document.createElement("option");
          option.value = key;
          option.textContent = MODELS[key].label;
          modelSelect.appendChild(option);
        }
        if (keys.length > 0) {
          modelSelect.value = keys[0];
        }
      }

      function resizeCanvases() {
        const modelRect = modelWrap.getBoundingClientRect();
        modelRenderer.setSize(modelRect.width, modelRect.height, false);
        modelCamera.aspect = modelRect.width / Math.max(modelRect.height, 1);
        modelCamera.updateProjectionMatrix();

        const quadRect = quadWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        quadCanvas.width = Math.floor(quadRect.width * dpr);
        quadCanvas.height = Math.floor(quadRect.height * dpr);
        quadCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function normalizeObject(root) {
        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        root.position.sub(center);
        root.scale.setScalar(1 / maxDim);
        root.updateMatrixWorld(true);
      }

      function loadOBJ(url) {
        return new Promise(function (resolve, reject) {
          objLoader.load(url, resolve, undefined, reject);
        });
      }

      function loadOBJFromFile(file) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onload = function () {
            try {
              const text = typeof reader.result === "string" ? reader.result : "";
              resolve(objLoader.parse(text));
            } catch (error) {
              reject(error);
            }
          };
          reader.onerror = function () {
            reject(new Error("读取本地 OBJ 文件失败"));
          };
          reader.readAsText(file);
        });
      }

      function getModelCandidateUrls(modelKey) {
        const model = MODELS[modelKey];
        if (!model) {
          return [];
        }
        const urls = [];
        const seen = new Set();
        for (let i = 0; i < MODEL_BASE_PATHS.length; i++) {
          const url = MODEL_BASE_PATHS[i] + "/" + model.file;
          if (!seen.has(url)) {
            seen.add(url);
            urls.push(url);
          }
        }
        return urls;
      }

      async function loadBuiltinModel(modelKey) {
        const urls = getModelCandidateUrls(modelKey);
        let lastError = null;
        for (let i = 0; i < urls.length; i++) {
          try {
            const root = await loadOBJ(urls[i]);
            return { root: root, sourceLabel: MODELS[modelKey].label };
          } catch (error) {
            lastError = error;
          }
        }
        const detail = lastError && lastError.message ? lastError.message : String(lastError || "unknown");
        throw new Error("模型加载失败，尝试路径: " + urls.join(" | ") + "；最后错误: " + detail);
      }

      function collectMeshData(root) {
        root.updateMatrixWorld(true);
        const positions = [];
        const faces = [];
        const vertexMap = new Map();
        const temp = new THREE.Vector3();

        function getVertexIndex(x, y, z) {
          const key = [
            Math.round(x * 100000),
            Math.round(y * 100000),
            Math.round(z * 100000)
          ].join("_");
          if (!vertexMap.has(key)) {
            vertexMap.set(key, positions.length);
            positions.push([x, y, z]);
          }
          return vertexMap.get(key);
        }

        root.traverse(function (child) {
          if (!child.isMesh || !child.geometry || !child.geometry.attributes.position) {
            return;
          }
          const geometry = child.geometry.clone();
          const positionAttr = geometry.attributes.position;
          const localToGlobal = new Array(positionAttr.count);
          for (let i = 0; i < positionAttr.count; i++) {
            temp.fromBufferAttribute(positionAttr, i).applyMatrix4(child.matrixWorld);
            localToGlobal[i] = getVertexIndex(temp.x, temp.y, temp.z);
          }
          if (geometry.index) {
            const index = geometry.index.array;
            for (let i = 0; i < index.length; i += 3) {
              faces.push([localToGlobal[index[i]], localToGlobal[index[i + 1]], localToGlobal[index[i + 2]]]);
            }
          } else {
            for (let i = 0; i < positionAttr.count; i += 3) {
              faces.push([localToGlobal[i], localToGlobal[i + 1], localToGlobal[i + 2]]);
            }
          }
        });

        return { positions: positions, faces: faces };
      }

      function chooseAnchorPair(vertices) {
        let bestA = 0;
        let bestB = 1;
        let bestDist2 = -1;
        for (let i = 0; i < vertices.length; i++) {
          for (let j = i + 1; j < vertices.length; j++) {
            const dx = vertices[i][0] - vertices[j][0];
            const dy = vertices[i][1] - vertices[j][1];
            const dz = vertices[i][2] - vertices[j][2];
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 > bestDist2) {
              bestDist2 = d2;
              bestA = i;
              bestB = j;
            }
          }
        }
        return [bestA, bestB];
      }

      function buildLocalTriangle(p0, p1, p2) {
        const a = new THREE.Vector3().fromArray(p0);
        const b = new THREE.Vector3().fromArray(p1);
        const c = new THREE.Vector3().fromArray(p2);
        const e1 = new THREE.Vector3().subVectors(b, a);
        const e2 = new THREE.Vector3().subVectors(c, a);
        const area2 = new THREE.Vector3().crossVectors(e1, e2).length();
        if (area2 < 1e-10) {
          return null;
        }
        const xAxis = e1.clone().normalize();
        const normal = new THREE.Vector3().crossVectors(e1, e2).normalize();
        const yAxis = new THREE.Vector3().crossVectors(normal, xAxis).normalize();
        const x0 = 0, y0 = 0;
        const x1 = e1.length(), y1 = 0;
        const x2 = e2.dot(xAxis), y2 = e2.dot(yAxis);
        const signedArea2 = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
        if (Math.abs(signedArea2) < 1e-10) {
          return null;
        }
        return {
          area: Math.abs(signedArea2) * 0.5,
          grad: [
            [(y1 - y2) / signedArea2, (x2 - x1) / signedArea2],
            [(y2 - y0) / signedArea2, (x0 - x2) / signedArea2],
            [(y0 - y1) / signedArea2, (x1 - x0) / signedArea2]
          ]
        };
      }

      function solveLinearSystem(matrix, vector) {
        const n = matrix.length;
        const a = new Array(n);
        const b = vector.slice();
        for (let i = 0; i < n; i++) {
          a[i] = matrix[i].slice();
        }
        for (let col = 0; col < n; col++) {
          let pivotRow = col;
          let pivotAbs = Math.abs(a[col][col]);
          for (let row = col + 1; row < n; row++) {
            const candidate = Math.abs(a[row][col]);
            if (candidate > pivotAbs) {
              pivotAbs = candidate;
              pivotRow = row;
            }
          }
          if (pivotAbs < 1e-12) {
            throw new Error("线性系统不可解");
          }
          if (pivotRow !== col) {
            const tmpRow = a[col];
            a[col] = a[pivotRow];
            a[pivotRow] = tmpRow;
            const tmpB = b[col];
            b[col] = b[pivotRow];
            b[pivotRow] = tmpB;
          }
          const pivot = a[col][col];
          for (let row = col + 1; row < n; row++) {
            const factor = a[row][col] / pivot;
            if (Math.abs(factor) < 1e-16) {
              continue;
            }
            a[row][col] = 0;
            for (let k = col + 1; k < n; k++) {
              a[row][k] -= factor * a[col][k];
            }
            b[row] -= factor * b[col];
          }
        }
        const x = new Array(n).fill(0);
        for (let row = n - 1; row >= 0; row--) {
          let sum = b[row];
          for (let col = row + 1; col < n; col++) {
            sum -= a[row][col] * x[col];
          }
          x[row] = sum / a[row][row];
        }
        return x;
      }

      function solveLSCM(meshData) {
        const vertices = meshData.positions;
        const faces = meshData.faces;
        if (vertices.length < 3 || faces.length < 1) {
          throw new Error("三角网格数据不足");
        }
        const anchors = chooseAnchorPair(vertices);
        const fixed = new Map();
        fixed.set(anchors[0], [0, 0]);
        fixed.set(anchors[1], [1, 0]);

        const freeMap = new Map();
        let freeCount = 0;
        for (let i = 0; i < vertices.length; i++) {
          if (!fixed.has(i)) {
            freeMap.set(i, freeCount++);
          }
        }
        const varCount = freeCount * 2;
        const ata = [];
        const atb = new Array(varCount).fill(0);
        for (let i = 0; i < varCount; i++) {
          ata.push(new Array(varCount).fill(0));
        }

        function addCoefficient(entries, vertexIndex, comp, value, known) {
          if (fixed.has(vertexIndex)) {
            const uv = fixed.get(vertexIndex);
            known.value += value * uv[comp];
            return;
          }
          const id = freeMap.get(vertexIndex) * 2 + comp;
          entries.push({ index: id, value: value });
        }

        function accumulate(entries, rhs) {
          for (let i = 0; i < entries.length; i++) {
            const a = entries[i];
            atb[a.index] += a.value * rhs;
            for (let j = 0; j < entries.length; j++) {
              const b = entries[j];
              ata[a.index][b.index] += a.value * b.value;
            }
          }
        }

        for (let f = 0; f < faces.length; f++) {
          const tri = faces[f];
          const local = buildLocalTriangle(vertices[tri[0]], vertices[tri[1]], vertices[tri[2]]);
          if (!local) {
            continue;
          }
          const weight = Math.sqrt(local.area);
          const row1 = [];
          const row2 = [];
          const known1 = { value: 0 };
          const known2 = { value: 0 };
          for (let c = 0; c < 3; c++) {
            const dx = local.grad[c][0] * weight;
            const dy = local.grad[c][1] * weight;
            const vid = tri[c];
            addCoefficient(row1, vid, 0, dx, known1);
            addCoefficient(row1, vid, 1, -dy, known1);
            addCoefficient(row2, vid, 0, dy, known2);
            addCoefficient(row2, vid, 1, dx, known2);
          }
          accumulate(row1, -known1.value);
          accumulate(row2, -known2.value);
        }
        for (let i = 0; i < varCount; i++) {
          ata[i][i] += 1e-8;
        }
        const solution = solveLinearSystem(ata, atb);
        const uv = new Array(vertices.length);
        for (let i = 0; i < vertices.length; i++) {
          if (fixed.has(i)) {
            uv[i] = fixed.get(i).slice();
          } else {
            const base = freeMap.get(i) * 2;
            uv[i] = [solution[base], solution[base + 1]];
          }
        }

        let minU = Infinity, minV = Infinity, maxU = -Infinity, maxV = -Infinity;
        for (let i = 0; i < uv.length; i++) {
          minU = Math.min(minU, uv[i][0]);
          minV = Math.min(minV, uv[i][1]);
          maxU = Math.max(maxU, uv[i][0]);
          maxV = Math.max(maxV, uv[i][1]);
        }
        const spanU = Math.max(maxU - minU, 1e-8);
        const spanV = Math.max(maxV - minV, 1e-8);
        const scale = 1 / Math.max(spanU, spanV);
        for (let i = 0; i < uv.length; i++) {
          uv[i][0] = (uv[i][0] - minU) * scale;
          uv[i][1] = (uv[i][1] - minV) * scale;
        }

        return uv;
      }

      function solveARAP(meshData) {
        const vertices = meshData.positions;
        const faces = meshData.faces;
        if (vertices.length < 3 || faces.length < 1) {
          throw new Error("三角网格数据不足");
        }

        const anchors = chooseAnchorPair(vertices);
        const fixed = new Map();
        fixed.set(anchors[0], [0, 0]);
        fixed.set(anchors[1], [1, 0]);

        let uv = solveLSCM(meshData);
        if (!uv || uv.length !== vertices.length) {
          throw new Error("ARAP 初始参数化失败");
        }

        const triangles = [];
        for (let f = 0; f < faces.length; f++) {
          const tri = faces[f];
          const p0 = new THREE.Vector3().fromArray(vertices[tri[0]]);
          const p1 = new THREE.Vector3().fromArray(vertices[tri[1]]);
          const p2 = new THREE.Vector3().fromArray(vertices[tri[2]]);
          const e1 = new THREE.Vector3().subVectors(p1, p0);
          const e2 = new THREE.Vector3().subVectors(p2, p0);
          const area2 = new THREE.Vector3().crossVectors(e1, e2).length();
          if (area2 < 1e-10) {
            continue;
          }
          const xAxis = e1.clone().normalize();
          const normal = new THREE.Vector3().crossVectors(e1, e2).normalize();
          const yAxis = new THREE.Vector3().crossVectors(normal, xAxis).normalize();
          const x1 = e1.length();
          const x2 = e2.dot(xAxis);
          const y2 = e2.dot(yAxis);
          triangles.push({
            ids: tri,
            area: Math.abs(x1 * y2) * 0.5,
            coords: [
              [0, 0],
              [x1, 0],
              [x2, y2]
            ]
          });
        }

        const freeMap = new Map();
        let freeCount = 0;
        for (let i = 0; i < vertices.length; i++) {
          if (!fixed.has(i)) {
            freeMap.set(i, freeCount++);
          }
        }

        const varCount = freeCount * 2;
        if (varCount < 2) {
          return uv;
        }

        for (let iter = 0; iter < 6; iter++) {
          const A = Array.from({ length: varCount }, () => new Array(varCount).fill(0));
          const bu = new Array(varCount).fill(0);
          const bv = new Array(varCount).fill(0);

          for (const tri of triangles) {
            const ids = tri.ids;
            const localCoords = tri.coords;
            const centroid = [
              (localCoords[0][0] + localCoords[1][0] + localCoords[2][0]) / 3,
              (localCoords[0][1] + localCoords[1][1] + localCoords[2][1]) / 3
            ];
            const uvs = ids.map((vid) => fixed.has(vid) ? fixed.get(vid) : uv[vid]);
            const uc = [
              (uvs[0][0] + uvs[1][0] + uvs[2][0]) / 3,
              (uvs[0][1] + uvs[1][1] + uvs[2][1]) / 3
            ];

            let s00 = 0, s01 = 0, s10 = 0, s11 = 0;
            for (let k = 0; k < 3; k++) {
              const dx = localCoords[k][0] - centroid[0];
              const dy = localCoords[k][1] - centroid[1];
              const ux = uvs[k][0] - uc[0];
              const uy = uvs[k][1] - uc[1];
              s00 += ux * dx;
              s01 += ux * dy;
              s10 += uy * dx;
              s11 += uy * dy;
            }

            const alpha = s00 + s11;
            const beta = s10 - s01;
            const denom = Math.hypot(alpha, beta);
            const r00 = denom > 1e-12 ? alpha / denom : 1;
            const r01 = denom > 1e-12 ? -beta / denom : 0;
            const r10 = denom > 1e-12 ? beta / denom : 0;
            const r11 = denom > 1e-12 ? alpha / denom : 1;
            const weight = tri.area;

            for (let i = 0; i < 3; i++) {
              const vidI = ids[i];
              if (!freeMap.has(vidI)) {
                continue;
              }
              const row = freeMap.get(vidI) * 2;
              const xi = localCoords[i][0] - centroid[0];
              const yi = localCoords[i][1] - centroid[1];
              const targetU = r00 * xi + r01 * yi;
              const targetV = r10 * xi + r11 * yi;
              let buValue = weight * targetU;
              let bvValue = weight * targetV;

              for (let j = 0; j < 3; j++) {
                const vidJ = ids[j];
                const coeff = (i === j ? 2 / 3 : -1 / 3) * weight;
                if (freeMap.has(vidJ)) {
                  const col = freeMap.get(vidJ) * 2;
                  A[row][col] += coeff;
                  A[row + 1][col + 1] += coeff;
                } else if (fixed.has(vidJ)) {
                  const uvFixed = fixed.get(vidJ);
                  buValue -= coeff * uvFixed[0];
                  bvValue -= coeff * uvFixed[1];
                }
              }

              bu[row] += buValue;
              bv[row] += bvValue;
            }
          }

          const solU = solveLinearSystem(A, bu);
          const solV = solveLinearSystem(A, bv);

          for (let i = 0; i < vertices.length; i++) {
            if (fixed.has(i)) {
              uv[i] = fixed.get(i).slice();
            } else {
              const base = freeMap.get(i) * 2;
              uv[i] = [solU[base], solV[base]];
            }
          }
        }

        let minU = Infinity, minV = Infinity, maxU = -Infinity, maxV = -Infinity;
        for (let i = 0; i < uv.length; i++) {
          minU = Math.min(minU, uv[i][0]);
          minV = Math.min(minV, uv[i][1]);
          maxU = Math.max(maxU, uv[i][0]);
          maxV = Math.max(maxV, uv[i][1]);
        }
        const spanU2 = Math.max(maxU - minU, 1e-8);
        const spanV2 = Math.max(maxV - minV, 1e-8);
        const scale2 = 1 / Math.max(spanU2, spanV2);
        for (let i = 0; i < uv.length; i++) {
          uv[i][0] = (uv[i][0] - minU) * scale2;
          uv[i][1] = (uv[i][1] - minV) * scale2;
        }

        return uv;
      }

      function clearGroup(scene, obj) {
        if (obj && obj.parent) {
          obj.parent.remove(obj);
        }
      }

      function buildModelGroup(root) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({
          color: 0x7fa7ff,
          roughness: 0.55,
          metalness: 0.05,
          side: THREE.DoubleSide
        });
        root.traverse(function (child) {
          if (!child.isMesh || !child.geometry) {
            return;
          }
          const mesh = new THREE.Mesh(child.geometry, mat);
          mesh.matrixAutoUpdate = false;
          mesh.matrix.copy(child.matrixWorld);
          group.add(mesh);

          const wire = new THREE.LineSegments(
            new THREE.WireframeGeometry(child.geometry),
            new THREE.LineBasicMaterial({ color: 0x1f315d, transparent: true, opacity: 0.7 })
          );
          wire.matrixAutoUpdate = false;
          wire.matrix.copy(child.matrixWorld);
          group.add(wire);
        });
        return group;
      }

      function drawQuadMesh2D(uv, faces, density) {
        const rect = quadWrap.getBoundingClientRect();
        quadCtx.clearRect(0, 0, rect.width, rect.height);
        quadCtx.fillStyle = "#091327";
        quadCtx.fillRect(0, 0, rect.width, rect.height);

        function toCanvas(p) {
          const pad = 18;
          return {
            x: pad + p[0] * (rect.width - pad * 2),
            y: rect.height - (pad + p[1] * (rect.height - pad * 2))
          };
        }

        quadCtx.strokeStyle = "rgba(89,117,180,0.35)";
        quadCtx.lineWidth = 1;
        for (let i = 0; i < faces.length; i++) {
          const a = toCanvas(uv[faces[i][0]]);
          const b = toCanvas(uv[faces[i][1]]);
          const c = toCanvas(uv[faces[i][2]]);
          quadCtx.beginPath();
          quadCtx.moveTo(a.x, a.y);
          quadCtx.lineTo(b.x, b.y);
          quadCtx.lineTo(c.x, c.y);
          quadCtx.closePath();
          quadCtx.stroke();
        }

        function drawIso(component, color, width) {
          quadCtx.strokeStyle = color;
          quadCtx.lineWidth = width;
          const step = 1 / density;
          for (let iso = 0; iso <= 1.00001; iso += step) {
            for (let i = 0; i < faces.length; i++) {
              const tri = faces[i];
              const vals = [uv[tri[0]][component] - iso, uv[tri[1]][component] - iso, uv[tri[2]][component] - iso];
              const pts = [uv[tri[0]], uv[tri[1]], uv[tri[2]]];
              const seg = [];

              function edge(a, b) {
                const va = vals[a], vb = vals[b];
                if ((va > 0 && vb < 0) || (va < 0 && vb > 0)) {
                  const t = Math.abs(va) / (Math.abs(va) + Math.abs(vb));
                  seg.push([
                    pts[a][0] + (pts[b][0] - pts[a][0]) * t,
                    pts[a][1] + (pts[b][1] - pts[a][1]) * t
                  ]);
                } else if (va === 0) {
                  seg.push([pts[a][0], pts[a][1]]);
                }
              }

              edge(0, 1);
              edge(1, 2);
              edge(2, 0);

              if (seg.length === 2) {
                const p0 = toCanvas(seg[0]);
                const p1 = toCanvas(seg[1]);
                quadCtx.beginPath();
                quadCtx.moveTo(p0.x, p0.y);
                quadCtx.lineTo(p1.x, p1.y);
                quadCtx.stroke();
              }
            }
          }
        }

        drawIso(0, "rgba(138,203,255,0.95)", 1.2);
        drawIso(1, "rgba(255,184,122,0.9)", 1.1);
      }

      function clearQuadOutput() {
        const rect = quadWrap.getBoundingClientRect();
        quadCtx.clearRect(0, 0, rect.width, rect.height);
        quadCtx.fillStyle = "#091327";
        quadCtx.fillRect(0, 0, rect.width, rect.height);
      }

      function toggleQuadOutput(forceShow) {
        const targetShow = typeof forceShow === "boolean" ? forceShow : !quadVisible;
        if (!currentUv || !currentMeshData) {
          setStatus("请先点击“输出四边形网格”完成计算", "#ffd38a");
          return;
        }
        quadVisible = targetShow;
        if (quadVisible) {
          drawQuadMesh2D(currentUv, currentMeshData.faces, parseInt(densityInput.value, 10));
          showQuadBtn.textContent = "隐藏四边形网格化效果";
          setStatus("已显示四边形网格化效果", "#8ce6b0");
        } else {
          clearQuadOutput();
          showQuadBtn.textContent = "显示四边形网格化效果";
          setStatus("已隐藏四边形网格化效果", "#90c6ff");
        }
      }

      function setDropOverlay(active) {
        dropOverlay.classList.toggle("active", active);
      }

      function getCurrentSourceLabel() {
        if (customModelFile) {
          return customModelFile.name;
        }
        const key = modelSelect.value;
        return MODELS[key] ? MODELS[key].label : "Unknown";
      }

      async function resolveSourceObject() {
        if (customModelFile) {
          const root = await loadOBJFromFile(customModelFile);
          return { root: root, sourceLabel: customModelFile.name };
        }
        return loadBuiltinModel(modelSelect.value);
      }

      async function loadPreview() {
        if (busy) {
          return;
        }
        setBusy(true);
        setStatus("正在加载输入三角网格: " + getCurrentSourceLabel() + " ...");
        try {
          const resolved = await resolveSourceObject();
          normalizeObject(resolved.root);
          clearGroup(modelScene, currentModelGroup);
          currentModelGroup = buildModelGroup(resolved.root);
          modelScene.add(currentModelGroup);
          currentMeshData = collectMeshData(resolved.root);
          currentUv = null;
          quadVisible = false;
          showQuadBtn.textContent = "显示四边形网格化效果";
          currentSourceLabel = resolved.sourceLabel;
          controls.target.set(0, 0, 0);
          controls.update();
          clearQuadOutput();
          setStatus("输入三角网格已就绪: " + currentSourceLabel + " / " + currentMeshData.positions.length + " 顶点 / " + currentMeshData.faces.length + " 三角形", "#8ce6b0");
        } catch (error) {
          console.error(error);
          setStatus("模型加载失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      async function solveMIQ() {
        if (!currentMeshData) {
          await loadPreview();
          if (!currentMeshData) {
            return;
          }
        }
        if (busy) {
          return;
        }
        setBusy(true);
        const solverType = solverSelect.value;
        setStatus(`正在执行 ${solverType === "arap" ? "ARAP" : "LSCM"} 参数化并提取四边形网格...`, "#9ecbff");
        try {
          const uv = solverType === "arap"
            ? solveARAP(currentMeshData)
            : solveLSCM(currentMeshData);
          currentUv = uv;
          quadVisible = false;
          showQuadBtn.textContent = "显示四边形网格化效果";
          clearQuadOutput();
          setStatus("计算完成：点击“显示四边形网格化效果”查看结果", "#8ce6b0");
        } catch (error) {
          console.error(error);
          setStatus("网格化失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      function applyCustomFile(file) {
        if (!file) {
          return;
        }
        if (!/\.obj$/i.test(file.name)) {
          setStatus("仅支持上传 .obj 文件", "#ff9d9d");
          return;
        }
        customModelFile = file;
        loadPreview();
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        modelRenderer.render(modelScene, modelCamera);
      }

      initModelOptions();
      resizeCanvases();
      clearQuadOutput();
      setStatus("准备就绪：请选择输入三角网格", "#90c6ff");

      window.addEventListener("resize", function () {
        resizeCanvases();
        if (quadVisible && currentUv && currentMeshData) {
          drawQuadMesh2D(currentUv, currentMeshData.faces, parseInt(densityInput.value, 10));
        } else {
          clearQuadOutput();
        }
      });

      modelSelect.addEventListener("change", function () {
        customModelFile = null;
        objUpload.value = "";
        loadPreview();
      });
      uploadBtn.addEventListener("click", function () {
        objUpload.click();
      });
      objUpload.addEventListener("change", function () {
        applyCustomFile(objUpload.files && objUpload.files[0]);
        objUpload.value = "";
      });
      densityInput.addEventListener("input", function () {
        if (quadVisible && currentUv && currentMeshData) {
          drawQuadMesh2D(currentUv, currentMeshData.faces, parseInt(densityInput.value, 10));
        }
      });
      solveBtn.addEventListener("click", solveMIQ);
      showQuadBtn.addEventListener("click", function () {
        toggleQuadOutput();
      });

      window.addEventListener("dragenter", function (e) {
        e.preventDefault();
        dragDepth += 1;
        setDropOverlay(true);
      });
      window.addEventListener("dragover", function (e) {
        e.preventDefault();
        if (e.dataTransfer) {
          e.dataTransfer.dropEffect = "copy";
        }
        setDropOverlay(true);
      });
      window.addEventListener("dragleave", function (e) {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) {
          setDropOverlay(false);
        }
      });
      window.addEventListener("drop", function (e) {
        e.preventDefault();
        dragDepth = 0;
        setDropOverlay(false);
        const files = e.dataTransfer && e.dataTransfer.files;
        if (!files || !files.length) {
          return;
        }
        applyCustomFile(files[0]);
      });

      loadPreview();
      animate();
    })();
  </script>
</body>
</html>
