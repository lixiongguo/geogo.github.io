---
layout: page
title: Gallery
permalink: /gallery/
---

<section class="gallery-index">
  <p class="gallery-intro">当前包含两个展示对象：Water Caustics 与 Suiboku Cellular Automata。点击缩略图进入对应展示窗口。</p>
  <div class="gallery-grid">
    {% for item in site.data.gallery %}
    <a class="gallery-index-card" href="{{ item.detail_url }}">
      <div class="gallery-thumb-wrap">
        <img class="gallery-thumb" src="{{ item.thumbnail }}" alt="{{ item.title }}">
      </div>
      <h3 class="gallery-index-card-title">{{ item.title }}</h3>
      <p class="gallery-index-card-desc">{{ item.description }}</p>
    </a>
    {% endfor %}
  </div>
</section>
