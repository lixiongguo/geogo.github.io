title: Neural Lagrangian OT

<style>

  .not-toolbar {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; flex-shrink:0;
    padding:10px 16px; background:rgba(8,13,24,.96); border-bottom:1px solid rgba(111,142,255,.22);
  }
  .not-brand { font-weight:800; letter-spacing:.3px; color:#f2f6ff; margin-right:4px; }
  .not-brand span { color:#7aa2ff; }
  .not-group { display:flex; align-items:center; gap:8px; }
  .not-group label { font-size:12px; color:#aebde8; }
  .not-toolbar button, .not-toolbar select {
    border:1px solid rgba(122,162,255,.28); background:#111a2d; color:#edf3ff;

  }
  .not-toolbar button { cursor:pointer; transition:.2s ease; background:linear-gradient(180deg,#17233d,#111a2d); }
  .not-toolbar button:hover { background:#1a2c52; }
  .not-primary { border:none; background:linear-gradient(135deg,#6d5cff,#20c7ff); font-weight:800; color:#fff; }
  .not-toolbar input[type=range] { width:108px; accent-color:#69a7ff; }

  .not-chk { display:flex; align-items:center; gap:6px; color:#c9d5f6; font-size:12px; cursor:pointer; }

<div class="not-wrap">
  <div class="not-toolbar">
    <div class="not-brand">Neural <span>Lagrangian OT</span></div>
    <button id="play" class="not-primary" type="button">暂停</button>
    <button id="reset" type="button">重新采样</button>
    <div class="not-group">
      <label>目标分布</label>
      <select id="target">
        <option value="mixture">三峰混合</option>
        <option value="ring">圆环</option>
        <option value="moon">双月形</option>
      </select>
    </div>
    <div class="not-group">
      <label>粒子数</label>
      <input id="count" type="range" min="300" max="2400" step="100" value="1200">
      <span id="countVal" class="not-val">1200</span>
    </div>
    <div class="not-group">
      <label>流动时间</label>
      <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1">
      <span id="speedVal" class="not-val">1.00</span>
    </div>
    <label class="not-chk"><input id="trail" type="checkbox" checked> 轨迹</label>
    <label class="not-chk"><input id="field" type="checkbox" checked> 速度场</label>
    <label class="not-chk"><input id="loss" type="checkbox" checked> Loss 曲线</label>
  </div>
  <div class="not-main">
    <canvas id="canvas"></canvas>
    <div class="not-panel not-stats">
      <h3>训练态势</h3>
      <div class="not-row"><span>flow time t</span><b id="timeStat">0.00</b></div>
      <div class="not-row"><span>kinetic energy</span><b id="kineticStat">0.000</b></div>
      <div class="not-row"><span>terminal match</span><b id="matchStat">0.000</b></div>
      <div class="not-row"><span>particles</span><b id="particleStat">1200</b></div>
    </div>
    <div class="not-panel not-legend">
      <div class="items">
        <span><i class="not-dot not-source"></i>源 ρ₀</span>
        <span><i class="not-dot not-mapped"></i>粒子 xₜ</span>
        <span><i class="not-dot not-target"></i>目标 ρ₁</span>
        <span><i class="not-dot not-field"></i>速度场 vθ</span>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const mainEl = canvas.parentElement;
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play');
const resetBtn = document.getElementById('reset');
const targetSel = document.getElementById('target');
const countRange = document.getElementById('count');
const speedRange = document.getElementById('speed');
const countVal = document.getElementById('countVal');
const speedVal = document.getElementById('speedVal');
const trailChk = document.getElementById('trail');
const fieldChk = document.getElementById('field');
const lossChk = document.getElementById('loss');
const timeStat = document.getElementById('timeStat');
const kineticStat = document.getElementById('kineticStat');
const matchStat = document.getElementById('matchStat');
const particleStat = document.getElementById('particleStat');

let W = 1, H = 1, DPR = 1;
let particles = [];
let targets = [];
let running = true;
let phase = 0;
let last = performance.now();

const rand = mulberry32(20260617);

function mulberry32(seed) {
  return function () {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function normal() {
  const u = Math.max(1e-6, rand());
  const v = Math.max(1e-6, rand());
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(t) { return t * t * (3 - 2 * t); }
function worldToScreen(p) {
  const s = Math.min(W, H) * 0.36;
  return [W * 0.5 + p.x * s, H * 0.54 - p.y * s];
}
function resize() {
  DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  W = mainEl.clientWidth;
  H = mainEl.clientHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function targetPoint(kind, i, n) {
  if (kind === 'mixture') {
    const centers = [{ x: -0.68, y: 0.48 }, { x: 0.68, y: 0.48 }, { x: 0.0, y: -0.55 }];
    const c = centers[i % centers.length];
    return { x: c.x + 0.12 * normal(), y: c.y + 0.12 * normal() };
  }
  if (kind === 'ring') {
    const a = 2 * Math.PI * (i / n + 0.08 * rand());
    const r = 0.68 + 0.08 * normal();
    return { x: r * Math.cos(a), y: r * Math.sin(a) };
  }
  const side = i % 2;
  const a = Math.PI * rand();
  const r = 0.62 + 0.05 * normal();
  const x = r * Math.cos(a) + (side ? 0.34 : -0.34);
  const y = side ? -r * Math.sin(a) + 0.18 : r * Math.sin(a) - 0.18;
  return { x, y };
}

function reset() {
  const n = Number(countRange.value);
  const kind = targetSel.value;
  particles = [];
  targets = [];
  for (let i = 0; i < n; i++) {
    const source = { x: -0.62 + 0.18 * normal(), y: -0.46 + 0.18 * normal() };
    const target = targetPoint(kind, i, n);
    const bend = {
      x: 0.18 * normal() + 0.12 * Math.sin(i * 12.989),
      y: 0.18 * normal() + 0.12 * Math.cos(i * 7.313),
    };
    const colorShift = rand();
    particles.push({ source, target, bend, colorShift });
    targets.push(target);
  }
  phase = 0;
  countVal.textContent = String(n);
  particleStat.textContent = String(n);
}

function position(p, t) {
  const s = smooth(t);
  const arc = Math.sin(Math.PI * t);
  return {
    x: p.source.x * (1 - s) + p.target.x * s + p.bend.x * arc,
    y: p.source.y * (1 - s) + p.target.y * s + p.bend.y * arc,
  };
}
function velocity(p, t) {
  const eps = 0.002;
  const a = position(p, clamp(t - eps, 0, 1));
  const b = position(p, clamp(t + eps, 0, 1));
  return { x: (b.x - a.x) / (2 * eps), y: (b.y - a.y) / (2 * eps) };
}

function clear() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#070b14');
  g.addColorStop(0.45, '#0b1430');
  g.addColorStop(1, '#07151a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function drawGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(122,162,255,.08)';
  ctx.lineWidth = 1;
  const step = Math.min(W, H) * 0.072;
  for (let x = W / 2 % step; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = H / 2 % step; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}
function drawDensityCloud(points, color, alpha, radius) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  for (const p of points) {
    const [x, y] = worldToScreen(p);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
function drawTrails(t) {
  if (!trailChk.checked) return;
  ctx.save();
  ctx.lineWidth = 0.65;
  for (let i = 0; i < particles.length; i += 3) {
    const p = particles[i];
    ctx.strokeStyle = `rgba(96,150,255,${0.055 + 0.08 * p.colorShift})`;
    ctx.beginPath();
    for (let k = 0; k <= 18; k++) {
      const q = position(p, t * k / 18);
      const [x, y] = worldToScreen(q);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawParticles(t) {
  ctx.save();
  for (const p of particles) {
    const q = position(p, t);
    const [x, y] = worldToScreen(q);
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 7);
    glow.addColorStop(0, 'rgba(126,174,255,.95)');
    glow.addColorStop(1, 'rgba(126,174,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(${90 + 80 * p.colorShift},${160 + 60 * p.colorShift},255,.9)`;
    ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawVectorField(t) {
  if (!fieldChk.checked) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,209,102,.36)';
  ctx.fillStyle = 'rgba(255,209,102,.56)';
  ctx.lineWidth = 1;
  const xs = [-0.9, -0.6, -0.3, 0, 0.3, 0.6, 0.9];
  const ys = [-0.75, -0.45, -0.15, 0.15, 0.45, 0.75];
  for (const x of xs) {
    for (const y of ys) {
      let nearest = particles[0], best = Infinity;
      for (let i = 0; i < particles.length; i += 25) {
        const q = position(particles[i], t);
        const d = (q.x - x) ** 2 + (q.y - y) ** 2;
        if (d < best) { best = d; nearest = particles[i]; }
      }
      const v = velocity(nearest, t);
      const len = Math.hypot(v.x, v.y) || 1;
      const scale = 0.065;
      const b = { x: x + v.x / len * scale, y: y + v.y / len * scale };
      const [x1, y1] = worldToScreen({ x, y });
      const [x2, y2] = worldToScreen(b);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - 5 * Math.cos(ang - 0.45), y2 - 5 * Math.sin(ang - 0.45));
      ctx.lineTo(x2 - 5 * Math.cos(ang + 0.45), y2 - 5 * Math.sin(ang + 0.45));
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}
function drawLoss(t) {
  if (!lossChk.checked) return;
  const w = Math.min(360, W * 0.42), h = 110;
  const x0 = W - w - 14, y0 = H - h - 90;
  ctx.save();
  ctx.fillStyle = 'rgba(8,13,24,.72)';
  ctx.strokeStyle = 'rgba(122,162,255,.2)';
  roundRect(x0, y0, w, h, 14, true, true);
  ctx.font = '12px Segoe UI, Arial';
  ctx.fillStyle = '#dce6ff';
  ctx.fillText('training loss (示意)', x0 + 14, y0 + 22);
  drawCurve(x0 + 18, y0 + 36, w - 34, h - 52, '#72a5ff', i => Math.exp(-4 * i) * (1 + 0.08 * Math.sin(34 * i)));
  drawCurve(x0 + 18, y0 + 36, w - 34, h - 52, '#ffd166', i => 0.35 * Math.exp(-2.2 * i) + 0.055);
  const px = x0 + 18 + (w - 34) * t;
  ctx.strokeStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.moveTo(px, y0 + 34); ctx.lineTo(px, y0 + h - 14); ctx.stroke();
  ctx.fillStyle = '#9fb4e8';
  ctx.fillText('match', x0 + w - 82, y0 + 48);
  ctx.fillStyle = '#ffd166';
  ctx.fillText('kinetic', x0 + w - 82, y0 + 66);
  ctx.restore();
}
function drawCurve(x, y, w, h, color, fn) {
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  for (let k = 0; k <= 100; k++) {
    const i = k / 100, v = fn(i);
    const px = x + w * i, py = y + h * (1 - clamp(v, 0, 1));
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}
function metrics(t) {
  let kinetic = 0, match = 0;
  for (let i = 0; i < particles.length; i += 8) {
    const p = particles[i];
    const v = velocity(p, t);
    const q = position(p, t);
    kinetic += 0.5 * (v.x * v.x + v.y * v.y);
    match += (q.x - p.target.x) ** 2 + (q.y - p.target.y) ** 2;
  }
  const m = Math.ceil(particles.length / 8);
  return { kinetic: kinetic / m, match: match / m };
}
function animate(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) phase = (phase + dt * Number(speedRange.value) * 0.18) % 1;
  const t = 0.5 - 0.5 * Math.cos(2 * Math.PI * phase);
  clear();
  drawGrid();
  drawDensityCloud(targets, '#ff6f91', 0.13, 2.4);
  drawVectorField(t);
  drawTrails(t);
  drawParticles(t);
  drawLoss(t);
  const mm = metrics(t);
  timeStat.textContent = t.toFixed(2);
  kineticStat.textContent = mm.kinetic.toFixed(3);
  matchStat.textContent = mm.match.toFixed(3);
  requestAnimationFrame(animate);
}

playBtn.onclick = () => {
  running = !running;
  playBtn.textContent = running ? '暂停' : '播放';
};
resetBtn.onclick = reset;
targetSel.onchange = reset;
countRange.oninput = () => { countVal.textContent = countRange.value; reset(); };
speedRange.oninput = () => { speedVal.textContent = Number(speedRange.value).toFixed(2); };
window.addEventListener('resize', resize);

resize();
reset();
requestAnimationFrame(animate);
</script>
