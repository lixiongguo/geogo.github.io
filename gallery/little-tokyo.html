---
layout: gallery_item
slug: little-tokyo
title: Draco 压缩 GLB 渲染
head_extra: |
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
  }
  </script>
---
<style>
  .tokyo-wrap {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #08081a;
  }
  .tokyo-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(10,10,30,0.95);
    border-bottom: 1px solid rgba(100,140,255,0.15);
    flex-shrink: 0;
  }
  .tokyo-header h2 {
    font-size: 15px; font-weight: 600;
    background: linear-gradient(90deg, #6366f1, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tokyo-meta { font-size: 12px; color: #707090; }
  .tokyo-canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  .tokyo-canvas-wrap canvas { display: block; width: 100%; height: 100%; }

  .tokyo-loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #08081a; z-index: 10;
    transition: opacity 0.6s;
  }
  .tokyo-loading.done { opacity: 0; pointer-events: none; }
  .tokyo-spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(99,102,241,0.2);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: tkSpin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes tkSpin { to { transform: rotate(360deg); } }
  .tokyo-loading-text { color: #9090c0; font-size: 13px; }
</style>

<div class="tokyo-wrap">
  <div class="tokyo-header">
    <h2>Littlest Tokyo</h2>
    <span class="tokyo-meta" id="fps-tokyo">FPS: --</span>
  </div>
  <div class="tokyo-canvas-wrap" id="tokyo-wrapper">
    <canvas id="canvas-tokyo"></canvas>
    <div class="tokyo-loading" id="loader-tokyo">
      <div class="tokyo-spinner"></div>
      <div class="tokyo-loading-text">加载 Draco GLB…</div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const canvas = document.getElementById('canvas-tokyo');
const wrapper = document.getElementById('tokyo-wrapper');
const fpsEl = document.getElementById('fps-tokyo');

function sizeCanvas() {
  const r = wrapper.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio, 2);
  canvas.width = Math.floor(r.width * dpr);
  canvas.height = Math.floor(r.height * dpr);
}

sizeCanvas();

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(canvas.width, canvas.height);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, canvas.width / canvas.height, 0.1, 100);
camera.position.set(6, 5, 8);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 50;
dirLight.shadow.camera.left = -10; dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 10; dirLight.shadow.camera.bottom = -10;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-5, 3, -5);
scene.add(fillLight);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.Fog(0x0a0a1a, 15, 30);

// Draco decoder
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/libs/draco/gltf/');

const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

gltfLoader.load('/assets/LittlestTokyo.glb', (gltf) => {
  const model = gltf.scene;
  model.traverse(child => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const scale = 8 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(scale);
  box.setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  model.position.y += box.getSize(new THREE.Vector3()).y / 2;

  scene.add(model);
  document.getElementById('loader-tokyo').classList.add('done');
}, undefined, (err) => {
  console.error('Failed to load GLB:', err);
  document.getElementById('loader-tokyo').querySelector('.tokyo-loading-text').textContent = '加载失败';
});

// FPS
let frameCount = 0, lastFpsTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsEl.textContent = 'FPS: ' + frameCount;
    frameCount = 0; lastFpsTime = now;
  }
}
animate();

window.addEventListener('resize', () => {
  sizeCanvas();
  camera.aspect = canvas.width / canvas.height;
  camera.updateProjectionMatrix();
  renderer.setSize(canvas.width, canvas.height);
});
</script>
