title: 3D Gaussian Splatting (PLY)
head_extra: |
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
  }
  </script>
---
<style>
  .gs-wrapper {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #000;
  }
  .gs-canvas-wrap {
    position: relative; flex: 1; overflow: hidden;
  }
  .gs-canvas-wrap canvas { display: block; width: 100%; height: 100%; }

  /* ── Loading UI ── */
  .gs-loading-overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,16,28,0.85), rgba(0,0,0,0.96));
    pointer-events: all;
    transition: opacity 0.6s ease;
    opacity: 1;
  }
  .gs-loading-overlay.done { opacity: 0; pointer-events: none; }
  .gs-loading-spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(126,184,255,0.15);
    border-top-color: #7eb8ff;
    border-radius: 50%;
    animation: gsSpin 0.9s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes gsSpin { to { transform: rotate(360deg); } }
  .gs-loading-text {
    font-size: 14px; color: #bcd; font-family: system-ui, sans-serif;
    margin-bottom: 14px;
  }
  .gs-progress-bar-track {
    width: 260px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .gs-progress-bar-fill {
    height: 100%; width: 0%; border-radius: 2px;
    background: linear-gradient(90deg, #7eb8ff, #a78bfa);
    transition: width 0.25s ease;
  }
  .gs-progress-pct {
    font-size: 12px; color: #889; margin-top: 8px;
  }

  /* ── Hint ── */
  .gs-hint {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 14px;
    pointer-events: none; z-index: 5;
  }
</style>

<div class="gs-wrapper">
  <div class="gs-canvas-wrap" id="gs-container">
    <div class="gs-loading-overlay" id="gs-loading">
      <div class="gs-loading-spinner"></div>
      <div class="gs-loading-text" id="gs-status">加载 3DGS PLY 场景…</div>
      <div class="gs-progress-bar-track">
        <div class="gs-progress-bar-fill" id="gs-progress-bar"></div>
      </div>
      <div class="gs-progress-pct" id="gs-progress-pct">0%</div>
    </div>
    <div class="gs-hint">🖱 拖拽旋转 · 滚轮缩放 · 右键平移 · 模型：中式居家住宅 · 源：OSS CDN</div>
  </div>
</div>

<script type="module">
  import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

  const container = document.getElementById('gs-container');
  const overlay = document.getElementById('gs-loading');
  const statusEl = document.getElementById('gs-status');
  const progressBar = document.getElementById('gs-progress-bar');
  const progressPct = document.getElementById('gs-progress-pct');

  // PLY file on Alibaba Cloud OSS CDN
  const plyUrl = 'https://lgximgs.oss-cn-beijing.aliyuncs.com/gaussian-splat/%E4%B8%AD%E5%BC%8F%E5%B1%85%E5%AE%B6%E4%BD%8F%E5%AE%85.ply';

  // ── Create Viewer ──
  const viewer = new GaussianSplats3D.Viewer({
    rootElement: container,
    cameraUp: [0, 1, 0],
    initialCameraPosition: [-1, 3.0, -1],
    initialCameraLookAt: [-5.8, -1.3, -5.8],
    controls: {
      minDistance: 0.3,
      maxDistance: 40,
      rotateSpeed: 0.8,
      zoomSpeed: 1.2,
      dampingFactor: 0.08,
    },
    sharedMemoryForWorkers: false,
    ignoreDevicePixelRatio: false,
    halfPrecisionCovariancesOnGPU: true,
    dynamicScene: false,
    sphericalHarmonicsLevel: 3,
    gpuAcceleratedSort: true,
    renderMode: GaussianSplats3D.RenderMode.On,
    antialiased: true,
  });

  // ── Init & Load ──
  async function initViewer() {
    await viewer.init();

    statusEl.textContent = '从 CDN 下载 PLY…（约 330MB）';

    await viewer.addSplatScene(plyUrl, {
      splatAlphaRemovalThreshold: 5,
      halfPrecisionCovariancesOnGPU: true,
      progressiveLoad: true,
      showLoadingUI: false,
      rotation: [0, 0, 0, 1],
      scale: [1.5, 1.5, 1.5],
      position: [0, -0.2, 0],
      onProgress: (pct, message) => {
        const p = Math.round(pct * 100);
        progressBar.style.width = p + '%';
        progressPct.textContent = p + '%';
        if (p < 100) {
          statusEl.textContent = message || '下载中…';
        } else {
          statusEl.textContent = '渲染就绪 ✓';
          setTimeout(() => overlay.classList.add('done'), 600);
        }
      },
    });

    viewer.start();
  }

  // ── Run ──
  initViewer().catch((err) => {
    statusEl.textContent = '加载失败';
    statusEl.style.color = '#ff6b6b';
    console.error('Gaussian Splat PLY load error:', err);
  });

  // ── Resize ──
  const resizeObserver = new ResizeObserver(() => {
    if (viewer && typeof viewer.resize === 'function') {
      viewer.resize();
    }
  });
  resizeObserver.observe(container);
</script>
