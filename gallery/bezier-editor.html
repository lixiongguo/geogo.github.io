title: Bézier 曲线编辑器
---
<style>
  .be-wrap { width:100%; height:100%; display:flex; flex-direction:column; background:#f0f0f0; }
  .be-bar {
    display:flex; align-items:center; gap:10px; padding:6px 14px;
    background:#fff; border-bottom:1px solid #d0d0d0; flex-shrink:0;
    font-size:12px; color:#555;
  }
  .be-bar button {
    padding:5px 14px; border:1px solid #ccc; border-radius:3px;
    background:#fff; cursor:pointer; font-size:12px; transition:all 0.15s;
  }
  .be-bar button:hover { background:#e8e8e8; }
  .be-bar button.act { background:#4a90d9; color:#fff; border-color:#4a90d9; }
  .be-bar .sep { width:1px; height:16px; background:#ddd; }
  .be-bar .hint { color:#999; margin-left:auto; }
  .be-bar select { padding:4px 8px; border:1px solid #ccc; border-radius:3px; font-size:12px; background:#fff; }
  .be-canvas { flex:1; cursor:crosshair; }
  canvas { display:block; }
</style>

<div class="be-wrap">
  <div class="be-bar">
    <select id="template">
      <option value="">临摹模板...</option>
      <option value="heart">❤ 心形</option>
      <option value="star">★ 五角星</option>
      <option value="circle">○ 圆形</option>
      <option value="wave">∿ 波浪</option>
      <option value="diamond">◇ 菱形</option>
      <option value="teardrop">💧 水滴</option>
    </select>
    <div class="sep"></div>
    <button id="btn-undo">↩ 撤销</button>
    <button id="btn-close">闭合</button>
    <button id="btn-smooth" class="act">平滑</button>
    <div class="sep"></div>
    <button id="btn-clear">清空</button>
    <span class="hint">🖱 单击=锚点 · 拖拽=曲线 · 右键锚点=删除 · Ctrl+锚点=移动 · Alt+手柄=断开平滑</span>
  </div>
  <div class="be-canvas" id="canvas-wrap">
    <canvas id="cv"></canvas>
  </div>
</div>

<script>
const wrap = document.getElementById('canvas-wrap');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = () => cv.width, H = () => cv.height;
function resize() { cv.width = wrap.clientWidth; cv.height = wrap.clientHeight; }
resize(); window.addEventListener('resize', resize);

// ── State ──
let points = [];            // [{x,y}] — anchor points
let ctrls = [];             // [{left:{x,y}, right:{x,y}}] — control handles per anchor
let smooth = true;
let dragging = null;        // {type:'anchor'|'left'|'right', index, startX, startY, origX, origY}
let hovered = null;
let template = '';

const HIT_R = 8;

// ── Templates (normalized to 0..1, will be scaled) ──
// Each: { paths: [[x1,y1, cx1,cy1, cx2,cy2, x2,y2], ...] } using cubic Beziers
const TEMPLATES = {
  heart: [
    [0.50,0.35, 0.30,0.05, 0.10,0.15, 0.50,0.55],
    [0.50,0.55, 0.90,0.15, 0.70,0.05, 0.50,0.35],
  ],
  star: [
    [0.50,0.05, 0.52,0.28, 0.62,0.30, 0.65,0.35],
    [0.65,0.35, 0.72,0.38, 0.78,0.55, 0.68,0.58],
    [0.68,0.58, 0.60,0.65, 0.50,0.52, 0.50,0.52],
    [0.50,0.52, 0.40,0.65, 0.32,0.58, 0.32,0.58],
    [0.32,0.58, 0.22,0.55, 0.28,0.38, 0.35,0.35],
    [0.35,0.35, 0.38,0.30, 0.48,0.28, 0.50,0.05],
  ],
  circle: [
    [0.50,0.05, 0.75,0.05, 0.95,0.25, 0.95,0.50],
    [0.95,0.50, 0.95,0.75, 0.75,0.95, 0.50,0.95],
    [0.50,0.95, 0.25,0.95, 0.05,0.75, 0.05,0.50],
    [0.05,0.50, 0.05,0.25, 0.25,0.05, 0.50,0.05],
  ],
  wave: [
    [0.05,0.50, 0.20,0.10, 0.30,0.10, 0.35,0.50],
    [0.35,0.50, 0.40,0.90, 0.55,0.90, 0.65,0.50],
    [0.65,0.50, 0.75,0.10, 0.85,0.10, 0.95,0.50],
    [0.95,0.50, 0.95,0.55, 0.05,0.55, 0.05,0.50],
  ],
  diamond: [
    [0.50,0.05, 0.50,0.05, 0.50,0.05, 0.90,0.50],
    [0.90,0.50, 0.90,0.50, 0.90,0.50, 0.50,0.95],
    [0.50,0.95, 0.50,0.95, 0.50,0.95, 0.10,0.50],
    [0.10,0.50, 0.10,0.50, 0.10,0.50, 0.50,0.05],
  ],
  teardrop: [
    [0.50,0.90, 0.30,0.90, 0.15,0.75, 0.15,0.55],
    [0.15,0.55, 0.15,0.35, 0.30,0.20, 0.50,0.05],
    [0.50,0.05, 0.70,0.20, 0.85,0.35, 0.85,0.55],
    [0.85,0.55, 0.85,0.75, 0.70,0.90, 0.50,0.90],
  ],
};

function drawTemplate(tmpl) {
  const pad = Math.min(W(), H()) * 0.12;
  const sx = pad, sy = pad, sw = W() - pad * 2, sh = H() - pad * 2;
  ctx.save();
  ctx.strokeStyle = 'rgba(180,200,230,0.6)';
  ctx.fillStyle = 'rgba(200,220,245,0.25)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  for (const seg of tmpl) {
    const [x0,y0, cx1,cy1, cx2,cy2, x1,y1] = seg;
    ctx.beginPath();
    ctx.moveTo(sx + x0 * sw, sy + y0 * sh);
    ctx.bezierCurveTo(
      sx + cx1 * sw, sy + cy1 * sh,
      sx + cx2 * sw, sy + cy2 * sh,
      sx + x1 * sw, sy + y1 * sh
    );
    ctx.stroke();
    ctx.fill();
  }
  ctx.restore();
}

// ── Drawing ──
function drawControlHandle(x, y, parent, color, filled) {
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(parent.x, parent.y); ctx.lineTo(x, y); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
  ctx.fillStyle = filled ? color : '#fff';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawAnchor(x, y, index, isFirst, isHovered) {
  const r = isHovered ? 8 : (isFirst ? 6 : 6);
  ctx.beginPath();
  ctx.rect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = isFirst ? '#4a90d9' : (isHovered ? '#ff6b35' : '#fff');
  ctx.fill();
  ctx.strokeStyle = isFirst ? '#4a90d9' : '#333';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function render() {
  ctx.clearRect(0, 0, W(), H());

  // Draw template background
  if (template && TEMPLATES[template]) {
    drawTemplate(TEMPLATES[template]);
  }

  if (points.length === 0) return;

  // Draw curves
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i], p3 = points[i + 1];
    const c1 = ctrls[i] ? ctrls[i].right : { x: p0.x + (p3.x - p0.x) / 3, y: p0.y + (p3.y - p0.y) / 3 };
    const c2 = ctrls[i + 1] ? ctrls[i + 1].left : { x: p3.x - (p3.x - p0.x) / 3, y: p3.y - (p3.y - p0.y) / 3 };

    // Control polygon
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(c1.x, c1.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(c2.x, c2.y); ctx.lineTo(p3.x, p3.y); ctx.stroke();
    ctx.setLineDash([]);

    // Curve
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, p3.x, p3.y);
    ctx.stroke();
  }

  // Close path line (if closed)
  if (points.length >= 3 && points[0] === points[points.length - 1]) {
    const last = points[points.length - 2];
    const first = points[0];
    const c1 = ctrls[points.length - 2] ? ctrls[points.length - 2].right : { x: last.x + (first.x - last.x) / 3, y: last.y + (first.y - last.y) / 3 };
    const c2 = ctrls[0] ? ctrls[0].left : { x: first.x - (first.x - last.x) / 3, y: first.y - (first.y - last.y) / 3 };
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(c1.x, c1.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(c2.x, c2.y); ctx.lineTo(first.x, first.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, first.x, first.y);
    ctx.stroke();
  }

  // Draw handles + anchors
  for (let i = 0; i < points.length; i++) {
    const isFirst = (i === 0);
    const c = ctrls[i];
    const isHoveredAnchor = hovered && hovered.type === 'anchor' && hovered.index === i;

    if (c) {
      if (c.left)  drawControlHandle(c.left.x, c.left.y, points[i], '#e74c3c',
        hovered && hovered.type === 'left' && hovered.index === i);
      if (c.right) drawControlHandle(c.right.x, c.right.y, points[i], '#e74c3c',
        hovered && hovered.type === 'right' && hovered.index === i);
    }
    drawAnchor(points[i].x, points[i].y, i, isFirst, isHoveredAnchor);
  }
}

// ── Hit testing ──
function hitTest(mx, my) {
  for (let i = 0; i < points.length; i++) {
    if (Math.hypot(mx - points[i].x, my - points[i].y) < HIT_R + 2)
      return { type: 'anchor', index: i };
  }
  for (let i = 0; i < ctrls.length; i++) {
    const c = ctrls[i];
    if (!c) continue;
    if (c.left  && Math.hypot(mx - c.left.x, my - c.left.y) < HIT_R)
      return { type: 'left', index: i };
    if (c.right && Math.hypot(mx - c.right.x, my - c.right.y) < HIT_R)
      return { type: 'right', index: i };
  }
  return null;
}

// ── Mouse ──
cv.addEventListener('mousedown', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;

  const hit = hitTest(mx, my);
  const ctrlKey = e.ctrlKey || e.metaKey;

  if (e.button === 2 || (hit && hit.type === 'anchor' && !ctrlKey)) {
    // Right-click or click anchor → delete
    e.preventDefault();
    if (hit && hit.type === 'anchor') {
      points.splice(hit.index, 1);
      ctrls.splice(hit.index, 1);
      render();
    }
    return;
  }

  if (hit && ctrlKey) {
    // Ctrl+click anchor → start dragging
    dragging = { ...hit, startX: mx, startY: my, origX: points[hit.index].x, origY: points[hit.index].y };
    return;
  }

  if (hit && (hit.type === 'left' || hit.type === 'right')) {
    // Drag control handle
    const c = ctrls[hit.index];
    const h = hit.type === 'left' ? c.left : c.right;
    dragging = { ...hit, startX: mx, startY: my, origX: h.x, origY: h.y };
    return;
  }

  // New point
  points.push({ x: mx, y: my });
  ctrls.push(null);
  render();

  // Start drag for control handles
  dragging = { type: 'anchor', index: points.length - 1, startX: mx, startY: my, origX: mx, origY: my, placing: true };
});

cv.addEventListener('mousemove', (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;

  if (dragging) {
    if (dragging.type === 'anchor') {
      const dx = mx - dragging.origX, dy = my - dragging.origY;
      points[dragging.index].x = mx;
      points[dragging.index].y = my;

      if (dragging.placing) {
        // Creating new point with drag → set symmetric handles
        ctrls[dragging.index] = {
          left:  { x: dragging.origX - dx, y: dragging.origY - dy },
          right: { x: dragging.origX + dx, y: dragging.origY + dy },
        };
      } else {
        // Moving existing anchor → shift handles
        if (ctrls[dragging.index]) {
          ctrls[dragging.index].left.x  += dx;
          ctrls[dragging.index].left.y  += dy;
          ctrls[dragging.index].right.x += dx;
          ctrls[dragging.index].right.y += dy;
        }
      }
    } else if (dragging.type === 'left') {
      const c = ctrls[dragging.index];
      c.left.x = mx; c.left.y = my;
      if (smooth && !e.altKey && c.right) {
        c.right.x = points[dragging.index].x * 2 - mx;
        c.right.y = points[dragging.index].y * 2 - my;
      }
    } else if (dragging.type === 'right') {
      const c = ctrls[dragging.index];
      c.right.x = mx; c.right.y = my;
      if (smooth && !e.altKey && c.left) {
        c.left.x = points[dragging.index].x * 2 - mx;
        c.left.y = points[dragging.index].y * 2 - my;
      }
    }
    render();
    return;
  }

  hovered = hitTest(mx, my);
  cv.style.cursor = hovered ? (hovered.type === 'anchor' ? 'move' : 'pointer') : 'crosshair';
  render();
});

cv.addEventListener('mouseup', () => {
  if (dragging && dragging.placing) delete dragging.placing;
  dragging = null;
});

cv.addEventListener('contextmenu', e => e.preventDefault());

// ── Buttons ──
document.getElementById('btn-undo').addEventListener('click', () => {
  points.pop();
  ctrls.pop();
  render();
});

document.getElementById('btn-close').addEventListener('click', () => {
  if (points.length > 2) {
    points.push({ x: points[0].x, y: points[0].y });
    ctrls.push(null);
    render();
  }
});

document.getElementById('btn-smooth').addEventListener('click', function() {
  smooth = !smooth;
  this.classList.toggle('act', smooth);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  points = []; ctrls = []; render();
});

document.getElementById('template').addEventListener('change', function() {
  template = this.value;
  render();
});

// ── Init ──
render();
</script>
