<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>变形实验室 — 三角化 · BDHM · MLS · ARAP 统一管线</title>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="assets/wasm/ruppert.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060b14;
      color: #c6d1f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      background: #0a1020;
      border-bottom: 1px solid rgba(106,132,255,0.15);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .group { display: flex; align-items: center; gap: 7px; }
    .group.sep { border-left: 1px solid rgba(106,132,255,0.12); padding-left: 14px; }
    .toolbar label { font-size: 13px; color: #8a9dd4; }
    .toolbar select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #0d1528;
      color: #eef2ff;
      font-size: 13px;
      cursor: pointer;
    }
    .toolbar button {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid rgba(106,132,255,0.3);
      background: #111b31;
      color: #c6d1f4;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar button:hover:not(:disabled) {
      background: #1a2848;
      border-color: rgba(106,132,255,0.6);
    }
    .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .toolbar button.active { background: #1a2848; border-color: #ff6b35; }
    .toolbar button.primary {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8f5e 100%);
      color: #fff;
      border: none;
      box-shadow: 0 3px 10px rgba(255,107,53,0.3);
    }
    .toolbar button.primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(255,107,53,0.5);
    }
    .btn-reset { background: linear-gradient(135deg,#6c3cff,#4a90d9); color:#fff; border:none; }
    .chk { display:flex; align-items:center; gap:5px; font-size:12px; cursor:pointer; color:#8a9dd4; }
    .chk input { accent-color:#ff6b35; }
    input[type=range] { width: 110px; accent-color: #6c8cff; }
    .val { color:#ffd700; font-weight:700; min-width:36px; display:inline-block; text-align:right; font-size:13px; }
    .spacer { flex: 1; }
    .hint {
      font-size: 12px;
      color: #5a6791;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .main { flex: 1; min-height: 0; }
    .panel {
      position: relative;
      border: 1px solid rgba(106,132,255,0.1);
      height: 100%;
      overflow: hidden;
    }
    .panel canvas { display: block; width: 100%; height: 100%; }
    .panel-label {
      position: absolute; top: 10px; left: 12px;
      font-size: 11px; color: rgba(138,157,212,0.6);
      pointer-events: none; z-index: 2;
    }
    .stats {
      position: absolute; top: 36px; left: 12px;
      background: rgba(11,18,34,.82);
      border: 1px solid rgba(106,132,255,.2);
      border-radius: 12px; padding: 10px 14px;
      font-size: 12px; line-height: 1.8; z-index: 3;
      display: none;
    }
    .stats .row span { color:#ffd700; font-weight:700; }
    .stats .ok { color:#7ef0a8; } .stats .bad { color:#ff7b7b; }
    .legend {
      position: absolute; bottom: 14px; left: 12px;
      background: rgba(11,18,34,.82);
      border: 1px solid rgba(106,132,255,.2);
      border-radius: 12px; padding: 9px 13px; font-size: 11px; z-index: 3;
      display: none;
    }
    .legend .bar { height:9px; width:170px; border-radius:5px; margin:5px 0; background:linear-gradient(90deg,#2bd66f,#ffd23f,#ff5a3c); }
    .legend .lr { display:flex; justify-content:space-between; color:#9fb0d8; }
    .magnifier {
      position: absolute; width: 160px; height: 160px; border-radius: 50%;
      border: 2px solid rgba(255,107,53,0.5);
      box-shadow: 0 0 16px rgba(255,107,53,0.3), inset 0 0 8px rgba(255,107,53,0.1);
      pointer-events: none; z-index: 20; display: none; overflow: hidden;
    }
    .magnifier canvas { width: 100%; height: 100%; display: block; }
    .pin-label {
      position: absolute;
      font: bold 14px/1 'SF Mono', Monaco, monospace;
      color: #ff6666;
      text-shadow: 0 0 8px rgba(255,68,68,0.8), 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none; z-index: 10; display: none;
      transform: translate(14px, -18px);
    }
    .status-msg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(11,18,34,.9); border: 1px solid rgba(106,132,255,.3);
      border-radius: 12px; padding: 14px 22px; font-size: 15px; color: #bcd0ff;
      display: none; z-index: 30;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="group">
      <label>模型</label>
      <select id="source-select"></select>
    </div>

    <div class="group sep">
      <label>三角化</label>
      <select id="min-angle-select" title="Ruppert 细化最小角">
        <option value="20">20°</option>
        <option value="25" selected>25°</option>
        <option value="30">30°</option>
      </select>
      <button id="triangulate-btn" class="primary">三角化 / 细化</button>
    </div>

    <div class="group sep">
      <label>算法</label>
      <select id="method-select">
        <option value="bdhm">BDHM 有界失真</option>
        <option value="mls-similarity">MLS 相似</option>
        <option value="mls-affine">MLS 仿射</option>
        <option value="mls-rigid">MLS 刚性</option>
        <option value="arap" selected>ARAP</option>
      </select>
    </div>

    <div class="group sep" id="bdhm-controls" style="display:none;">
      <label>失真上界 C</label>
      <input type="range" id="bound-range" min="1.05" max="6" step="0.05" value="2">
      <span class="val" id="bound-val">2.00</span>
      <select id="energy-select" title="BDHM 能量">
        <option value="shape">保形</option>
        <option value="conformal">共形</option>
      </select>
      <label class="chk"><input type="checkbox" id="bound-on" checked>有界</label>
    </div>

    <div class="group sep">
      <button id="pin-btn">选固定点</button>
      <button id="clear-pin-btn">清除</button>
      <span style="font-size:12px;color:#8a9dd4;" id="pin-count">0 个固定点</span>
    </div>

    <span class="spacer"></span>

    <div class="group">
      <label class="chk"><input type="checkbox" id="show-tex" checked>纹理</label>
      <label class="chk"><input type="checkbox" id="show-distortion">扭曲</label>
      <label class="chk"><input type="checkbox" id="show-ghost" checked>轮廓</label>
      <label class="chk"><input type="checkbox" id="show-magnifier">放大镜</label>
    </div>
    <div class="group">
      <button id="demo-btn">演示形变</button>
      <button id="reset-btn" class="btn-reset">复位</button>
    </div>
    <span class="hint" id="hint-text">选择模型开始</span>
  </div>

  <div class="main">
    <div class="panel" id="main-panel">
      <div class="panel-label">变形实验室 · 三角化 → BDHM / MLS / ARAP</div>
      <canvas id="main-canvas"></canvas>
      <div class="stats" id="stats">
        <div class="row">最大失真 K<sub>max</sub> = <span id="s-kmax">-</span></div>
        <div class="row">最小 Jacobian = <span id="s-jmin">-</span></div>
        <div class="row">翻转面数 = <span id="s-flip">-</span></div>
        <div class="row">迭代/帧 = <span id="s-iter">-</span></div>
      </div>
      <div class="legend" id="legend">
        <div>共形扭曲 K = σ₁/σ₂</div>
        <div class="bar"></div>
        <div class="lr"><span>1 (无扭曲)</span><span style="color:#ff5a3c">大 / 翻转</span></div>
      </div>
      <div class="pin-label" id="pin-label"></div>
      <div class="magnifier" id="magnifier"><canvas id="mag-canvas"></canvas></div>
      <div class="status-msg" id="status-msg"></div>
    </div>
  </div>
</div>

<script>
(function() {
"use strict";

/* ==================== DOM ==================== */
const sourceSelect   = document.getElementById('source-select');
const minAngleSelect = document.getElementById('min-angle-select');
const triangulateBtn = document.getElementById('triangulate-btn');
const methodSelect   = document.getElementById('method-select');
const bdhmControls   = document.getElementById('bdhm-controls');
const boundRange     = document.getElementById('bound-range');
const boundVal       = document.getElementById('bound-val');
const energySelect   = document.getElementById('energy-select');
const boundOn        = document.getElementById('bound-on');
const pinBtn         = document.getElementById('pin-btn');
const clearPinBtn    = document.getElementById('clear-pin-btn');
const pinCountEl     = document.getElementById('pin-count');
const showTex        = document.getElementById('show-tex');
const showDistortion = document.getElementById('show-distortion');
const showGhost      = document.getElementById('show-ghost');
const showMagnifier  = document.getElementById('show-magnifier');
const demoBtn        = document.getElementById('demo-btn');
const resetBtn       = document.getElementById('reset-btn');
const hintText       = document.getElementById('hint-text');
const mainCanvas     = document.getElementById('main-canvas');
const statsEl        = document.getElementById('stats');
const legendEl       = document.getElementById('legend');
const pinLabel       = document.getElementById('pin-label');
const magnifierEl    = document.getElementById('magnifier');
const magCanvas      = document.getElementById('mag-canvas');
const statusMsgEl    = document.getElementById('status-msg');

/* ==================== Three.js 场景 ==================== */
const renderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08101d);

const camera = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, 0.1, 10);
camera.position.set(0, 0, 5);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(2, 3, 4); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.3); dl2.position.set(-2, -1, -2); scene.add(dl2);

const magRenderer = new THREE.WebGLRenderer({ canvas: magCanvas, antialias: true, alpha: true });
magRenderer.setPixelRatio(window.devicePixelRatio);
magRenderer.setSize(160, 160, false);
magRenderer.setClearColor(0x08101d, 1);
const magCamera = new THREE.OrthographicCamera(-0.06, 0.06, 0.06, -0.06, 0.1, 10);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

/* ==================== 统一网格状态 ==================== */
let meshV = null;          // 静止顶点 [[x,y],...]
let meshF = null;          // 三角面 [[a,b,c],...]
let deformed = null;       // 当前位置 [[x,y],...]，null = 等于 meshV
let polygon = null;        // {outer, holes} 无网格多边形（待三角化）
let texture = null;        // THREE.Texture（仅 bdhm_models）
let texUVn = null;         // 归一化纹理坐标 Float64Array(2*nV)
let texBBox = null;        // 纹理映射使用的包围盒 [x0,y0,x1,y1]
let controlPts = new Set();      // 固定点 / 操控点 顶点索引
let controlTarget = {};          // {idx:[x,y]} 操控点目标位置
let demoTargets = {};            // {idx:[x,y]} 录制目标位姿
let pendingSrc = null, pendingDst = null; // 多边形加载后待三角化时应用
let sourceKind = '';       // 'polygon' | 'mesh'
let loadToken = 0;

let modelGroup = null;
let camHalf = 1.2, camCx = 0, camCy = 0;
let lastIters = 0;

/* 交互状态 */
let pinMode = false;
let hoveredPinIdx = null, selectedPinIdx = null, draggedPinIdx = null;
let pinDragStart = null, pinClickBlock = false;
let magCenter = null;

/* 演示 */
let demoActive = false, demoT = 0;

/* ==================== 工具函数 ==================== */
function setHint(msg, color) { hintText.textContent = msg; hintText.style.color = color || '#5a6791'; }
function setStatusMsg(msg) {
  if (msg) { statusMsgEl.textContent = msg; statusMsgEl.style.display = 'block'; }
  else statusMsgEl.style.display = 'none';
}
function nV() { return meshV ? meshV.length : 0; }
function curPositions() { return deformed || meshV; }

function nearestVertex(pt, V) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < V.length; i++) {
    const d = (V[i][0]-pt[0])**2 + (V[i][1]-pt[1])**2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function controlCurrentMap() {
  const m = {};
  for (const ci of controlPts) m[ci] = controlTarget[ci] || [meshV[ci][0], meshV[ci][1]];
  return m;
}

/* ============================================================
 *                       渲染 / 重建
 * ============================================================ */
function disposeGroup(g) {
  if (!g) return;
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

function distortionColors(pos, faces, restP) {
  const colors = new Float32Array(pos.length * 3);
  const counts = new Int32Array(pos.length);
  for (let fi = 0; fi < faces.length; fi++) {
    const [i, j, k] = faces[fi];
    const pi = restP[i], pj = restP[j], pk = restP[k];
    const qi = pos[i],   qj = pos[j],   qk = pos[k];
    const e1x = pj[0]-pi[0], e1y = pj[1]-pi[1];
    const e2x = pk[0]-pi[0], e2y = pk[1]-pi[1];
    const f1x = qj[0]-qi[0], f1y = qj[1]-qi[1];
    const f2x = qk[0]-qi[0], f2y = qk[1]-qi[1];
    const detE = e1x*e2y - e1y*e2x;
    if (Math.abs(detE) < 1e-12) continue;
    const invDet = 1/detE;
    const a = (f1x*e2y - f2x*e1y) * invDet;
    const b = (f2x*e1x - f1x*e2x) * invDet;
    const c = (f1y*e2y - f2y*e1y) * invDet;
    const d = (f2y*e1x - f1y*e2x) * invDet;
    const tr = a*a+b*b+c*c+d*d, det = a*d-b*c;
    const disc = Math.sqrt(Math.max(tr*tr - 4*det*det, 0));
    const s1 = Math.sqrt((tr + disc)/2), s2 = Math.sqrt(Math.max((tr - disc)/2, 1e-10));
    let ratio = Math.max(s1/s2, s2/s1);
    if (det <= 0) ratio = 12; // 翻转
    const t = Math.min((ratio - 1) / 9, 1);
    const r = Math.min(t * 2, 1);
    const g = 1 - Math.abs(t - 0.5) * 2;
    const bCol = 1 - t;
    for (const vi of [i, j, k]) {
      colors[vi*3] += r; colors[vi*3+1] += g; colors[vi*3+2] += bCol; counts[vi]++;
    }
  }
  for (let vi = 0; vi < pos.length; vi++) {
    const n = counts[vi] || 1;
    colors[vi*3] /= n; colors[vi*3+1] /= n; colors[vi*3+2] /= n;
  }
  return colors;
}

function buildPolygonOutline(group) {
  const segs = [];
  const rings = [polygon.outer].concat(polygon.holes || []);
  for (const ring of rings) {
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i+1) % ring.length];
      segs.push(a[0], a[1], 0, b[0], b[1], 0);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
  group.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x7fa7ff })));
}

function rebuildModel() {
  if (modelGroup && modelGroup.parent) modelGroup.parent.remove(modelGroup);
  disposeGroup(modelGroup);
  const group = new THREE.Group();

  // 无网格状态：仅画多边形轮廓
  if (!meshF) {
    if (polygon) buildPolygonOutline(group);
    modelGroup = group; scene.add(group);
    pinCountEl.textContent = controlPts.size + ' 个固定点';
    return;
  }

  const pos = curPositions();
  const faces = meshF;

  // 实心面几何
  const geom = new THREE.BufferGeometry();
  const flat = new Float32Array(pos.length * 3);
  for (let i = 0; i < pos.length; i++) { flat[i*3]=pos[i][0]; flat[i*3+1]=pos[i][1]; flat[i*3+2]=0; }
  geom.setAttribute('position', new THREE.Float32BufferAttribute(flat, 3));
  const idx = new Uint32Array(faces.length * 3);
  for (let i = 0; i < faces.length; i++) { idx[i*3]=faces[i][0]; idx[i*3+1]=faces[i][1]; idx[i*3+2]=faces[i][2]; }
  geom.setIndex(new THREE.BufferAttribute(idx, 1));
  geom.computeVertexNormals();

  let faceMat;
  const useTex = texture && texUVn && showTex.checked;
  const useDist = showDistortion.checked && deformed;
  if (useTex) {
    const uvArr = new Float32Array(pos.length * 2);
    for (let i = 0; i < pos.length; i++) { uvArr[i*2]=texUVn[2*i]; uvArr[i*2+1]=texUVn[2*i+1]; }
    geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvArr, 2));
    faceMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
  } else if (useDist) {
    geom.setAttribute('color', new THREE.Float32BufferAttribute(distortionColors(pos, faces, meshV), 3));
    faceMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide });
  } else {
    faceMat = new THREE.MeshStandardMaterial({ color: 0x7fa7ff, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide });
  }
  group.add(new THREE.Mesh(geom, faceMat));

  // 线框
  const edgeSet = new Set(), segs = [];
  for (let i = 0; i < faces.length; i++) {
    for (const [u,v] of [[faces[i][0],faces[i][1]],[faces[i][1],faces[i][2]],[faces[i][2],faces[i][0]]]) {
      const k = u<v ? u+'_'+v : v+'_'+u;
      if (edgeSet.has(k)) continue; edgeSet.add(k);
      segs.push(pos[u][0],pos[u][1],0, pos[v][0],pos[v][1],0);
    }
  }
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
  group.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0x1f2f55, transparent: true, opacity: 0.6 })));

  // 幽灵静止轮廓
  if (showGhost.checked && deformed) {
    const gSet = new Set(), gsegs = [];
    for (let i = 0; i < faces.length; i++) {
      for (const [u,v] of [[faces[i][0],faces[i][1]],[faces[i][1],faces[i][2]],[faces[i][2],faces[i][0]]]) {
        const k = u<v ? u+'_'+v : v+'_'+u;
        if (gSet.has(k)) continue; gSet.add(k);
        gsegs.push(meshV[u][0],meshV[u][1],0, meshV[v][0],meshV[v][1],0);
      }
    }
    const gg = new THREE.BufferGeometry();
    gg.setAttribute('position', new THREE.Float32BufferAttribute(gsegs, 3));
    group.add(new THREE.LineSegments(gg, new THREE.LineBasicMaterial({ color: 0x7888c8, transparent: true, opacity: 0.18 })));
  }

  // 操控点标记（绿/黄/红）
  if (controlPts.size > 0) {
    const box = new THREE.Box3();
    for (const p of pos) box.expandByPoint(new THREE.Vector3(p[0], p[1], 0));
    const s = box.getSize(new THREE.Vector3());
    const r = Math.max(s.x, s.y, 0.5) * 0.012;
    const pinGeom = new THREE.SphereGeometry(r, 10, 10);
    const matGreen  = new THREE.MeshBasicMaterial({ color: 0x44e8a0 });
    const matYellow = new THREE.MeshBasicMaterial({ color: 0xffd740 });
    const matRed    = new THREE.MeshBasicMaterial({ color: 0xff4444 });
    for (const vi of controlPts) {
      const p = pos[vi];
      let mat = matGreen;
      if (draggedPinIdx === vi || selectedPinIdx === vi) mat = matRed;
      else if (hoveredPinIdx === vi) mat = matYellow;
      const m = new THREE.Mesh(pinGeom, mat);
      m.position.set(p[0], p[1], 0.01);
      m.userData = { isPin: true, vertexIndex: vi };
      group.add(m);
    }
  }

  modelGroup = group;
  scene.add(group);
  pinCountEl.textContent = controlPts.size + ' 个固定点';
}

/* ============================================================
 *                    相机 / 视图
 * ============================================================ */
function bboxOf(pts) {
  let minX=1e18, maxX=-1e18, minY=1e18, maxY=-1e18;
  for (const p of pts) { minX=Math.min(minX,p[0]); maxX=Math.max(maxX,p[0]); minY=Math.min(minY,p[1]); maxY=Math.max(maxY,p[1]); }
  return [minX, minY, maxX, maxY];
}
function applyCam() {
  const rect = document.getElementById('main-panel').getBoundingClientRect();
  const a = rect.width / Math.max(rect.height, 1);
  camera.left = -camHalf * a; camera.right = camHalf * a;
  camera.top = camHalf; camera.bottom = -camHalf;
  camera.updateProjectionMatrix();
}
function fitView() {
  const pts = meshV || (polygon ? polygon.outer : null);
  if (!pts || !pts.length) return;
  const [minX, minY, maxX, maxY] = bboxOf(pts);
  const w = maxX-minX, h = maxY-minY;
  camHalf = Math.max(w, h, 0.5) * 0.62;
  camCx = (minX+maxX)/2; camCy = (minY+maxY)/2;
  camera.position.set(camCx, camCy, 5);
  camera.lookAt(camCx, camCy, 0);
  applyCam();
}
function resize() {
  const rect = document.getElementById('main-panel').getBoundingClientRect();
  renderer.setSize(rect.width, rect.height, false);

/* ============================================================

function extractMeshData(geometry) {
  let positions, faces;
  if (geometry.attributes && geometry.attributes.position) {
    const posAttr = geometry.attributes.position, ix = geometry.index;
    positions = [];
    for (let i = 0; i < posAttr.count; i++) positions.push([posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i)]);
    if (ix) { faces = []; const arr = ix.array; for (let i = 0; i < arr.length; i += 3) faces.push([arr[i], arr[i+1], arr[i+2]]); }
    else { faces = []; for (let i = 0; i < posAttr.count; i += 3) faces.push([i, i+1, i+2]); }
  } else if (geometry.vertices && geometry.faces) {
    positions = geometry.vertices.map(v => [v.x, v.y, v.z]);
    faces = geometry.faces.map(f => [f.a, f.b, f.c]);
  } else throw new Error('无法解析几何体数据');
  return { positions, faces };
}

async function loadObjMesh(path, label) {
  const token = ++loadToken;
  resetStateForLoad();
  sourceKind = 'mesh';
  setHint('加载中...', '#ffd38a');
  try {
    const obj = await new Promise((resolve, reject) => {
      new THREE.OBJLoader().load(path, resolve, undefined, () => reject(new Error('加载失败')));
    });
    if (token !== loadToken) return;
    const allPos = [], allFaces = []; let off = 0;

/* ============================================================
 *                  三角化
 * ============================================================ */
function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function makePolyMesh(outer, holes, maxAcross) {
  const [minX, minY, maxX, maxY] = bboxOf(outer);
  const w = maxX-minX, h = maxY-minY;
  const cell = Math.max(w, h) / maxAcross;
  const nx = Math.max(2, Math.round(w/cell)+1), ny = Math.max(2, Math.round(h/cell)+1);
  const X = i => minX + (i/(nx-1))*w, Y = j => minY + (j/(ny-1))*h;
  const ix = (i, j) => j*nx + i;
  const region = (x, y) => { if (!pointInPoly(x, y, outer)) return false; for (const hl of holes) if (pointInPoly(x, y, hl)) return false; return true; };
  const Vall = []; for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) Vall.push([X(i), Y(j)]);
  const Fall = [];
  for (let j = 0; j < ny-1; j++) for (let i = 0; i < nx-1; i++) {
    const a = ix(i,j), b = ix(i+1,j), c = ix(i,j+1), d = ix(i+1,j+1);
    for (const tri of [[a,b,d],[a,d,c]]) {
      const cx = (Vall[tri[0]][0]+Vall[tri[1]][0]+Vall[tri[2]][0])/3;
      const cy = (Vall[tri[0]][1]+Vall[tri[1]][1]+Vall[tri[2]][1])/3;
      if (region(cx, cy)) Fall.push(tri);
    }
  }
  const used = new Set(); Fall.forEach(f => f.forEach(v => used.add(v)));
  const remap = new Array(Vall.length).fill(-1); const V = []; let k = 0;
  for (let v = 0; v < Vall.length; v++) if (used.has(v)) { remap[v] = k++; V.push(Vall[v]); }
  const F = Fall.map(f => f.map(v => remap[v]));
  return { V, F, bbox: [minX, minY, maxX, maxY] };
}

// ===== Ruppert Delaunay 细化 =====
function circumcenter2D(a,b,c){const ax=a[0],ay=a[1],bx=b[0],by=b[1],cx=c[0],cy=c[1];const D=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));if(Math.abs(D)<1e-12)return null;const a2=ax*ax+ay*ay,b2=bx*bx+by*by,c2=cx*cx+cy*cy;const ux=(a2*(by-cy)+b2*(cy-ay)+c2*(ay-by))/D;const uy=(a2*(cx-bx)+b2*(ax-cx)+c2*(bx-ax))/D;return[ux,uy];}
function circumradius2D(a,b,c){const ab=Math.hypot(b[0]-a[0],b[1]-a[1]),bc=Math.hypot(c[0]-b[0],c[1]-b[1]),ca=Math.hypot(a[0]-c[0],a[1]-c[1]);const s=(ab+bc+ca)/2;const area=Math.sqrt(Math.max(0,s*(s-ab)*(s-bc)*(s-ca)));if(area<1e-12)return Infinity;return(ab*bc*ca)/(4*area);}
function shortestEdge2D(a,b,c){return Math.min(Math.hypot(b[0]-a[0],b[1]-a[1]),Math.hypot(c[0]-b[0],c[1]-b[1]),Math.hypot(a[0]-c[0],a[1]-c[1]));}
function minAngle2D(a,b,c){const ab=Math.hypot(b[0]-a[0],b[1]-a[1]),bc=Math.hypot(c[0]-b[0],c[1]-b[1]),ca=Math.hypot(a[0]-c[0],a[1]-c[1]);const clamp=v=>Math.max(-1,Math.min(1,v));const A=Math.acos(clamp((ab*ab+ca*ca-bc*bc)/(2*ab*ca+1e-12)));const B=Math.acos(clamp((ab*ab+bc*bc-ca*ca)/(2*ab*bc+1e-12)));const C=Math.acos(clamp((bc*bc+ca*ca-ab*ab)/(2*bc*ca+1e-12)));return Math.min(A,B,C);}
function edgeKey(a,b){return a<b?a+'_'+b:b+'_'+a;}
function extractBoundaryEdges(faces){const ec=new Map();for(const[a,b,c]of faces)for(const[u,v]of[[a,b],[b,c],[c,a]]){const k=edgeKey(u,v);ec.set(k,(ec.get(k)||0)+1);}const bd=new Set();for(const[k,cnt]of ec)if(cnt===1)bd.add(k);return bd;}
function encroachesEdge(p,u,v,P){const pu=P[u],pv=P[v];const mx=(pu[0]+pv[0])/2,my=(pu[1]+pv[1])/2;const dx=p[0]-mx,dy=p[1]-my;const hl=Math.hypot(pv[0]-pu[0],pv[1]-pu[1])/2;return(dx*dx+dy*dy)<hl*hl*1.001;}
function incircle2D(ax,ay,bx,by,cx,cy,dx,dy){const adx=ax-dx,ady=ay-dy,bdx=bx-dx,bdy=by-dy,cdx=cx-dx,cdy=cy-dy;const al=adx*adx+ady*ady,bl=bdx*bdx+bdy*bdy,cl=cdx*cdx+cdy*cdy;return al*(bdx*cdy-bdy*cdx)-bl*(adx*cdy-ady*cdx)+cl*(adx*bdy-ady*bdx);}
function orient2D(ax,ay,bx,by,cx,cy){return(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);}
function buildEdgeFaceMap(tris){const map=new Map();for(let fi=0;fi<tris.length;fi++){const[a,b,c]=tris[fi];for(const[u,v]of[[a,b],[b,c],[c,a]]){const k=edgeKey(u,v);if(!map.has(k))map.set(k,[]);map.get(k).push(fi);}}return map;}
function findFaceWithEdge(tri,u,v){for(let fi=0;fi<tri.length;fi++){const[a,b,c]=tri[fi];if((a===u||b===u||c===u)&&(a===v||b===v||c===v))return fi;}return -1;}
function ruppertRefine(positions, faces, minAngleDeg, maxIter) {
  const target = minAngleDeg * Math.PI / 180;
  const B = 1.0 / Math.sin(target * 0.5);
  let pos = positions.map(p => [p[0], p[1]]);
  let tri = faces.map(f => [f[0], f[1], f[2]]);
  const boundary = extractBoundaryEdges(tri);
  for (let fi = 0; fi < tri.length; fi++) {
    const [a,b,c] = tri[fi];
    if (orient2D(pos[a][0],pos[a][1],pos[b][0],pos[b][1],pos[c][0],pos[c][1]) < 0) tri[fi] = [a,c,b];
  }
  for (let iter = 0; iter < maxIter; iter++) {
    let worst = -1, worstAng = Infinity;
    for (let fi = 0; fi < tri.length; fi++) {
      const [a,b,c] = tri[fi];
      const ang = minAngle2D(pos[a], pos[b], pos[c]);
      if (ang < worstAng) { worstAng = ang; worst = fi; }
    }
    if (worst < 0 || worstAng >= target) break;
    const [a,b,c] = tri[worst];
    const R = circumradius2D(pos[a], pos[b], pos[c]);
    const l = shortestEdge2D(pos[a], pos[b], pos[c]);
    if (R/l < B && worstAng >= target * 0.6) break;
    const cc = circumcenter2D(pos[a], pos[b], pos[c]);
    if (!cc) continue;
    let encroached = false;
    for (const ek of boundary) {
      const [u,v] = ek.split('_').map(Number);
      if (encroachesEdge(cc, u, v, pos)) {
        encroached = true;
        const pu = pos[u], pv = pos[v];
        const mid = [(pu[0]+pv[0])/2, (pu[1]+pv[1])/2];
        const newIdx = pos.length; pos.push(mid);
        boundary.delete(ek); boundary.add(edgeKey(u,newIdx)); boundary.add(edgeKey(v,newIdx));
        const fIdx = findFaceWithEdge(tri, u, v);
        if (fIdx >= 0) {
          const [v0,v1,v2] = tri[fIdx];
          const other = [v0,v1,v2].find(x => x !== u && x !== v);
          tri[fIdx] = [u, other, newIdx];
          tri.push([v, newIdx, other]);
        }
        break;
      }
    }
    if (encroached) continue;
    const newIdx = pos.length; pos.push(cc);
    tri[worst] = [a, b, newIdx]; tri.push([b, c, newIdx]); tri.push([c, a, newIdx]);
    let flipped = true;
    while (flipped) {
      flipped = false;
      const efm = buildEdgeFaceMap(tri);
      for (const [k, arr] of efm) {
        if (arr.length !== 2) continue;
        const [u,v] = k.split('_').map(Number);
        const f0 = tri[arr[0]], f1 = tri[arr[1]];
        const others = [];
        for (const x of f0) if (x !== u && x !== v) others.push(x);
        for (const x of f1) if (x !== u && x !== v) others.push(x);
        if (others.length !== 2) continue;
        const [p, q] = others;
        const ic = incircle2D(pos[u][0],pos[u][1],pos[v][0],pos[v][1],pos[p][0],pos[p][1],pos[q][0],pos[q][1]);
        if (ic > 1e-10) { tri[arr[0]] = [u,p,q]; tri[arr[1]] = [v,q,p]; flipped = true; }
      }
    }
  }
  return { positions: pos, faces: tri };
}

function computeTexUV() {
  if (!texture || !texBBox) { texUVn = null; return; }
  const [x0, y0, x1, y1] = texBBox;
  const bw = (x1-x0) || 1, bh = (y1-y0) || 1;
  texUVn = new Float64Array(2 * meshV.length);
  for (let v = 0; v < meshV.length; v++) {
    texUVn[2*v]   = (meshV[v][0]-x0)/bw;
    texUVn[2*v+1] = (meshV[v][1]-y0)/bh;
  }
}

function applyPendingControls() {
  controlPts = new Set(); controlTarget = {}; demoTargets = {};
  if (!pendingSrc) return;
  for (let i = 0; i < pendingSrc.length; i++) {
    const s = pendingSrc[i];
    const vi = nearestVertex([s[0], s[1]], meshV);
    if (vi < 0 || controlPts.has(vi)) continue;
    controlPts.add(vi);
    controlTarget[vi] = [meshV[vi][0], meshV[vi][1]];
    if (pendingDst && pendingDst[i]) demoTargets[vi] = [pendingDst[i][0], pendingDst[i][1]];
  }
}

/* ============================================================
 *                  Ruppert (C++ / WASM)
 * ============================================================ */
let ruppertModPromise = null, ruppertInst = null;
function initRuppert() {
  if (ruppertInst) return Promise.resolve(ruppertInst);
  if (typeof RuppertModule === 'undefined') return Promise.resolve(null);
  if (!ruppertModPromise) {
    ruppertModPromise = RuppertModule({ locateFile: p => 'assets/wasm/' + p })
      .then(m => { ruppertInst = m; return m; })
      .catch(e => { console.error('Ruppert WASM 加载失败', e); return null; });
  }
  return ruppertModPromise;
}

// 从三角网格提取边界 PSLG (仅被一个面引用的边)
function extractBoundaryPSLG(V, F) {
  const key = (a, b) => a < b ? a + '_' + b : b + '_' + a;
  const cnt = new Map();
  for (const f of F) for (const [a, b] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]) {
    const k = key(a, b); cnt.set(k, (cnt.get(k) || 0) + 1);
  }
  const bset = new Set(), segs = [];
  for (const f of F) for (const [a, b] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]) {
    if (cnt.get(key(a, b)) === 1) { segs.push([a, b]); bset.add(a); bset.add(b); }
  }
  const remap = new Map(), ptsFlat = [];
  for (const vi of bset) { remap.set(vi, ptsFlat.length / 2); ptsFlat.push(V[vi][0], V[vi][1]); }
  const segIdx = [];
  for (const [a, b] of segs) segIdx.push(remap.get(a), remap.get(b));
  return { ptsFlat, segIdx, count: ptsFlat.length / 2 };
}

function callRuppert(inst, ptsArr, segArr, minAngle, maxArea, maxPoints) {
  const ptsPtr = inst._malloc(ptsArr.length * 8);
  inst.HEAPF64.set(ptsArr, ptsPtr / 8);
  const segPtr = inst._malloc(segArr.length * 4);
  inst.HEAP32.set(segArr, segPtr / 4);
  let result = null;
  try {
    const ret = inst.ccall('ruppert_run', 'number',
      ['number','number','number','number','number','number','number'],
      [ptsPtr, ptsArr.length, segPtr, segArr.length, minAngle, maxArea, maxPoints]);
    if (ret === 0) {
      const pSize = inst.ccall('get_points_size', 'number', [], []);
      const pPtr  = inst.ccall('get_points', 'number', [], []);
      const tSize = inst.ccall('get_triangles_size', 'number', [], []);
      const tPtr  = inst.ccall('get_triangles', 'number', [], []);
      const positions = [];
      for (let i = 0; i < pSize; i += 2) positions.push([inst.HEAPF64[pPtr/8 + i], inst.HEAPF64[pPtr/8 + i + 1]]);
      const faces = [];
      for (let i = 0; i < tSize; i += 3) faces.push([inst.HEAP32[tPtr/4 + i], inst.HEAP32[tPtr/4 + i + 1], inst.HEAP32[tPtr/4 + i + 2]]);
      result = { positions, faces };
    }
  } finally {
    inst._free(ptsPtr); inst._free(segPtr);
    inst.ccall('dispose', 'void', [], []);
  }
  return result;
}

async function ruppertWasm(V, F, minAngle) {
  const inst = await initRuppert();
  if (!inst) return null;
  const { ptsFlat, segIdx, count } = extractBoundaryPSLG(V, F);
  if (count < 3 || segIdx.length < 6) return null;
  return callRuppert(inst, new Float64Array(ptsFlat), new Int32Array(segIdx), minAngle, 0, 0);
}

function doTriangulate() {
  const minAngle = parseInt(minAngleSelect.value, 10);
  if (sourceKind === 'polygon' && polygon && !meshF) {
    setStatusMsg('网格化中…');
    setTimeout(() => {
      const m = makePolyMesh(polygon.outer, polygon.holes || [], 38);
      if (m.F.length < 2) { setStatusMsg(''); setHint('网格化失败', '#ff9d9d'); return; }
      meshV = m.V; meshF = m.F; deformed = null;
      texBBox = m.bbox; computeTexUV();
      applyPendingControls();
      arapLU = null; bdStaticReady = false;
      fitView(); rebuildModel(); setStatusMsg('');
      setHint('已生成网格: ' + meshV.length + ' 顶点 / ' + meshF.length + ' 面 — 拖动操控点变形', '#89f0b6');
    }, 10);
    return;
  }
  if (!meshF) { setHint('请先加载模型', '#ffd38a'); return; }
  // Ruppert 三角化: 优先 C++/WASM, 失败回退 JS
  setStatusMsg('Ruppert 三角化中…');
  (async () => {
    let refined = null, viaWasm = false;
    try { refined = await ruppertWasm(meshV, meshF, minAngle); viaWasm = !!(refined && refined.faces.length); }
    catch (e) { console.error('WASM Ruppert 失败, 回退 JS', e); }
    if (!viaWasm) {
      try { refined = ruppertRefine(meshV, meshF, minAngle, 200); }
      catch (e) { console.error(e); setStatusMsg(''); setHint('三角化失败: ' + e.message, '#ff9d9d'); return; }
    }
    if (!refined || !refined.faces.length) { setStatusMsg(''); setHint('三角化失败', '#ff9d9d'); return; }
    meshV = refined.positions.map(p => [p[0], p[1]]); meshF = refined.faces; deformed = null;
    computeTexUV();
    controlPts = new Set(); controlTarget = {}; demoTargets = {};
    selectedPinIdx = hoveredPinIdx = draggedPinIdx = null;
    arapLU = null; bdStaticReady = false;
    rebuildModel(); setStatusMsg('');
    setHint('Ruppert 完成' + (viaWasm ? ' (C++/WASM)' : ' (JS 回退)') + ': ' + meshV.length + ' 顶点 / ' + meshF.length + ' 面 (最小角 ≥ ' + minAngle + '°) — 固定点已重置', '#89f0b6');
  })();
}

/* ============================================================
 *                  MLS 变形
 * ============================================================ */
function applyMLS(original, controlIndices, controlCurrent, alpha, mode) {
  const n = original.length;
  const result = original.map(p => [p[0], p[1]]);
  const cpIndices = Array.from(controlIndices);
  const cpCount = cpIndices.length;
  if (cpCount === 0) return result;
  const cpOrig = cpIndices.map(i => [original[i][0], original[i][1]]);
  for (let vi = 0; vi < n; vi++) {
    if (controlIndices.has(vi)) { const cur = controlCurrent[vi]; result[vi][0] = cur[0]; result[vi][1] = cur[1]; continue; }
    const vx = original[vi][0], vy = original[vi][1];
    const weights = new Array(cpCount); let sumW = 0;
    for (let ci = 0; ci < cpCount; ci++) {
      const px = cpOrig[ci][0], py = cpOrig[ci][1];
      const d2 = (vx-px)*(vx-px) + (vy-py)*(vy-py);
      const w = 1.0 / Math.pow(d2 + 1e-10, alpha);
      weights[ci] = w; sumW += w;
    }
    if (sumW < 1e-12) continue;
    let psx = 0, psy = 0, qsx = 0, qsy = 0;
    for (let ci = 0; ci < cpCount; ci++) {
      const w = weights[ci];
      psx += w*cpOrig[ci][0]; psy += w*cpOrig[ci][1];
      const cur = controlCurrent[cpIndices[ci]];
      qsx += w*cur[0]; qsy += w*cur[1];
    }
    psx /= sumW; psy /= sumW; qsx /= sumW; qsy /= sumW;
    const vpx = vx-psx, vpy = vy-psy;
    if (mode === 'affine') {
      let A=0,B=0,C=0,D=0,E=0,F=0,G=0;
      for (let ci = 0; ci < cpCount; ci++) {
        const w = weights[ci];
        const phx = cpOrig[ci][0]-psx, phy = cpOrig[ci][1]-psy;
        const cur = controlCurrent[cpIndices[ci]];
        const qhx = cur[0]-qsx, qhy = cur[1]-qsy;
        A+=w*phx*phx; B+=w*phx*phy; C+=w*phy*phy;
        D+=w*qhx*phx; E+=w*qhx*phy; F+=w*qhy*phx; G+=w*qhy*phy;
      }

  if (!pinMode) return;
  const c = getCanvasCoords(e); mouse.set(c.x, c.y); raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(meshObjects(), false);
  if (hits.length === 0) return;
  const pos = curPositions();
  const vi = nearestVertex([hits[0].point.x, hits[0].point.y], pos);
  if (vi < 0) return;
  const [minX, minY, maxX, maxY] = bboxOf(pos);
  const th = Math.max(maxX-minX, maxY-minY, 0.5) * 0.03;
  const v = pos[vi];
  if ((hits[0].point.x-v[0])**2 + (hits[0].point.y-v[1])**2 > th*th) return;
  if (controlPts.has(vi)) { controlPts.delete(vi); delete controlTarget[vi]; if (selectedPinIdx === vi) selectedPinIdx = null; }
  else { controlPts.add(vi); controlTarget[vi] = [pos[vi][0], pos[vi][1]]; }
  rebuildModel();
  setHint('已选 ' + controlPts.size + ' 个固定点', '#89f0b6');
});

mainCanvas.addEventListener('mousedown', (e) => {
  if (!meshF) return;
  const c = getCanvasCoords(e); mouse.set(c.x, c.y); raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pinMarkers(), false);
  if (hits.length > 0) {
    const vi = hits[0].object.userData.vertexIndex;
    if (vi !== undefined && controlPts.has(vi)) {
      selectedPinIdx = vi; pinDragStart = { x: e.clientX, y: e.clientY }; hoveredPinIdx = null;
      rebuildModel();
      setHint('操控点已选中（红色），拖拽移动 · 点空白取消 · 双击删除', '#ff8888');
    }
  }
});

mainCanvas.addEventListener('mousemove', (e) => {
  if (!meshF) return;
  // 放大镜
  if (showMagnifier.checked) {
    const rect = mainCanvas.getBoundingClientRect();
    magnifierEl.style.left = (e.clientX - rect.left - 80) + 'px';
    magnifierEl.style.top = (e.clientY - rect.top - 80) + 'px';
    magnifierEl.style.display = 'block';
    const w = worldFromScreen(e); if (w) magCenter = w;
  } else { magnifierEl.style.display = 'none'; magCenter = null; }

  // hover 检测
  if (draggedPinIdx === null && selectedPinIdx === null) {
    const c = getCanvasCoords(e); mouse.set(c.x, c.y); raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(pinMarkers(), false);
    const prev = hoveredPinIdx;
    hoveredPinIdx = hits.length > 0 ? hits[0].object.userData.vertexIndex : null;
    if (hoveredPinIdx !== prev) { mainCanvas.style.cursor = hoveredPinIdx !== null ? 'pointer' : ''; rebuildModel(); }
    return;
  }

  // 拖动选中的操控点
  if (selectedPinIdx !== null) {
    const dx = e.clientX - (pinDragStart ? pinDragStart.x : e.clientX);
    const dy = e.clientY - (pinDragStart ? pinDragStart.y : e.clientY);
    if (draggedPinIdx === null && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
    if (draggedPinIdx === null) { draggedPinIdx = selectedPinIdx; pinClickBlock = true; demoActive = false; }
    const w = worldFromScreen(e);
    if (w) {
      controlTarget[draggedPinIdx] = [w.x, w.y];
      if (methodKind() === 'bdhm') { ensureBDHM(false); bdhmSettle = 90; }
      else recomputeDeform();
    }
  }
});

window.addEventListener('mouseup', () => {
  if (draggedPinIdx !== null) {
    draggedPinIdx = null; selectedPinIdx = null; pinDragStart = null;
    rebuildModel();
    setHint('操控点已释放', '#89f0b6');
  }
});

/* ============================================================
 *                  按钮 / UI
 * ============================================================ */
function setEnergy(mode) {
  if (mode === 'conformal') { opt.lscm_weight = 1.0; opt.smoothness_weight = 0.05; opt.reference_weight = 1e-4; }
  else { opt.lscm_weight = 0.0; opt.smoothness_weight = 0.35; opt.reference_weight = 2e-4; }
}
function updateMethodUI() {
  const isBd = methodKind() === 'bdhm';
  bdhmControls.style.display = isBd ? 'flex' : 'none';
  statsEl.style.display = isBd ? 'block' : 'none';
  legendEl.style.display = (showDistortion.checked || isBd) ? 'block' : 'none';
}
function setDefaultMethodFor(kind) {
  methodSelect.value = (kind === 'polygon') ? 'bdhm' : 'arap';
  updateMethodUI();
}

triangulateBtn.addEventListener('click', doTriangulate);

methodSelect.addEventListener('change', () => {
  updateMethodUI();
  if (!meshF) return;
  const kind = methodKind();
  if (kind === 'bdhm') { ensureBDHM(true); bdhmSettle = 90; }
  else if (controlPts.size > 0) recomputeDeform();
  else { deformed = null; rebuildModel(); }
});

boundRange.addEventListener('input', () => {
  opt.distortion_bound = parseFloat(boundRange.value);
  boundVal.textContent = opt.distortion_bound.toFixed(2);
  if (methodKind() === 'bdhm') bdhmSettle = 90;
});
energySelect.addEventListener('change', () => { setEnergy(energySelect.value); if (methodKind() === 'bdhm') bdhmSettle = 90; });
boundOn.addEventListener('change', () => { opt.bound_on = boundOn.checked; if (methodKind() === 'bdhm') bdhmSettle = 90; });

pinBtn.addEventListener('click', () => {
  pinMode = !pinMode;
  if (pinMode) { pinBtn.textContent = '✓ 选择中'; pinBtn.classList.add('active'); setHint('点击网格顶点添加/移除固定点', '#89f0b6'); }
  else { pinBtn.textContent = '选固定点'; pinBtn.classList.remove('active'); setHint('已退出固定点模式 — 拖动红色操控点变形', '#5a6791'); }
});
clearPinBtn.addEventListener('click', () => {
  controlPts.clear(); controlTarget = {};
  hoveredPinIdx = selectedPinIdx = draggedPinIdx = null;
  deformed = null;
  rebuildModel(); setHint('固定点已清除', '#5a6791');
});
resetBtn.addEventListener('click', () => {
  demoActive = false; deformed = null;
  for (const h of controlPts) controlTarget[h] = [meshV[h][0], meshV[h][1]];
  if (methodKind() === 'bdhm') ensureBDHM(true);
  rebuildModel(); setHint('已复位到原始形状', '#8cc4ff');
});
demoBtn.addEventListener('click', startDemo);

[showTex, showGhost].forEach(el => el.addEventListener('change', rebuildModel));
showDistortion.addEventListener('change', () => { updateMethodUI(); rebuildModel(); });
showMagnifier.addEventListener('change', () => { if (!showMagnifier.checked) { magnifierEl.style.display = 'none'; magCenter = null; } });

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && selectedPinIdx !== null) { selectedPinIdx = null; rebuildModel(); setHint('已取消选中', '#5a6791'); }
});

/* ============================================================
 *                  模型列表
 * ============================================================ */
function buildSourceList() {
  const polyModels = [
    ['annulus','圆环 Annulus (含洞)'],['horse','马 Horse'],['giraffe','长颈鹿 Giraffe'],['deer','鹿 Deer'],
    ['elephant','大象 Elephant'],['frog','青蛙 Frog'],['rex','霸王龙 Rex (含洞)'],['raptor','迅猛龙 Raptor'],
    ['dragon','龙 Dragon'],['monkey','猴 Monkey'],['racoon','浣熊 Racoon'],['Archery','弓箭手 Archery (含洞)']
  ];
  const g1 = document.createElement('optgroup'); g1.label = '多边形图形 (无网格 → 三角化)';
  for (const [v, t] of polyModels) { const o = document.createElement('option'); o.value = 'poly:'+v; o.textContent = t; g1.appendChild(o); }
  sourceSelect.appendChild(g1);

  const g2 = document.createElement('optgroup'); g2.label = '三角网格 — 2D 模型';
  for (const [f, t] of [['alligator.obj','alligator'],['woody.obj','woody']]) { const o = document.createElement('option'); o.value = 'mesh:2dmodels/'+f; o.textContent = t; g2.appendChild(o); }
  sourceSelect.appendChild(g2);

  const g3 = document.createElement('optgroup'); g3.label = '三角网格 — 字母';
  for (let i = 65; i <= 90; i++) { const L = String.fromCharCode(i); const o = document.createElement('option'); o.value = 'mesh:charaters/'+L+'_2d.obj'; o.textContent = '字母 '+L; g3.appendChild(o); }
  sourceSelect.appendChild(g3);
}
function loadSource(val) {
  demoActive = false;
  if (val.indexOf('poly:') === 0) loadPolygon(val.slice(5));
  else if (val.indexOf('mesh:') === 0) {
    const rel = val.slice(5);
    const label = sourceSelect.options[sourceSelect.selectedIndex].textContent;
    loadObjMesh('assets/' + rel, label);
  }
}
sourceSelect.addEventListener('change', () => loadSource(sourceSelect.value));

/* ============================================================
 *                  主循环
 * ============================================================ */
function loop() {
  requestAnimationFrame(loop);
  if (meshF) {
    const kind = methodKind();
    if (demoActive) { stepDemo(); if (kind !== 'bdhm') recomputeDeform(); }
    if (kind === 'bdhm') {
      const dragging = (draggedPinIdx !== null);
      if (dragging || demoActive || bdhmSettle > 0) {
        ensureBDHM(false);
        const big = bdNF > 700;
        lastIters = bdOptimizeStep((dragging || demoActive) ? (big ? 9 : 14) : (big ? 4 : 8));
        bdhmSyncDeformed();
        if (!dragging && !demoActive && bdhmSettle > 0) bdhmSettle--;
        rebuildModel();
      }
      updateStats();
    }
  }
  renderer.render(scene, camera);

  if (showMagnifier.checked && magCenter) {
    const mh = camHalf * 0.09;
    magCamera.left = -mh; magCamera.right = mh; magCamera.top = mh; magCamera.bottom = -mh;
    magCamera.position.set(magCenter.x, magCenter.y, 5); magCamera.lookAt(magCenter.x, magCenter.y, 0);
    magCamera.updateProjectionMatrix();
    magRenderer.render(scene, magCamera);
  }

  if (selectedPinIdx !== null && meshV) {
    const p = curPositions()[selectedPinIdx];
    const v = new THREE.Vector3(p[0], p[1], 0); v.project(camera);
    const rect = mainCanvas.getBoundingClientRect();
    pinLabel.style.left = ((v.x*0.5+0.5)*rect.width) + 'px';
    pinLabel.style.top = ((-v.y*0.5+0.5)*rect.height) + 'px';
    pinLabel.textContent = '#' + selectedPinIdx;
    pinLabel.style.display = 'block';
  } else pinLabel.style.display = 'none';
}

/* ============================================================
 *                  启动
 * ============================================================ */
buildSourceList();
setEnergy('shape');
updateMethodUI();
resize();
sourceSelect.value = 'mesh:2dmodels/alligator.obj';
loadSource(sourceSelect.value);
loop();

})();
</script>
